name = "Feec"
version = "0.1.0"
defaultTargets = ["Feec"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "6e2a148e19b0c1dbde6f99cdcfa73fe1f4094ed4"

[[lean_lib]]
name = "Feec"

# Gate checks, in Lean (scripts/FeecCheck): `lake exe feec-gate` runs them all.
[[lean_lib]]
name = "FeecCheck"
srcDir = "scripts"

[[lean_exe]]
name = "feec-gate"
srcDir = "scripts"
root = "FeecCheck.Exe.Gate"
supportInterpreter = true
needs = ["Feec", "FeecCheck"]

[[lean_exe]]
name = "feec-citations"
srcDir = "scripts"
root = "FeecCheck.Exe.Citations"
supportInterpreter = true

[[lean_exe]]
name = "feec-layering"
srcDir = "scripts"
root = "FeecCheck.Exe.Layering"
supportInterpreter = true

[[lean_exe]]
name = "feec-axioms"
srcDir = "scripts"
root = "FeecCheck.Exe.Axioms"
supportInterpreter = true
needs = ["Feec"]

[[lean_exe]]
name = "feec-naming"
srcDir = "scripts"
root = "FeecCheck.Exe.Naming"
supportInterpreter = true
needs = ["Feec"]

[[lean_exe]]
name = "feec-thesismap"
srcDir = "scripts"
root = "FeecCheck.Exe.ThesisMap"
supportInterpreter = true
needs = ["Feec"]

[[lean_exe]]
name = "feec-mapcheck"
srcDir = "scripts"
root = "FeecCheck.Exe.MapCheck"
supportInterpreter = true
needs = ["Feec"]

[[lean_exe]]
name = "feec-snapshot"
srcDir = "scripts"
root = "FeecCheck.Exe.Snapshot"
supportInterpreter = true
needs = ["Feec"]

[[lean_exe]]
name = "feec-docnames"
srcDir = "scripts"
root = "FeecCheck.Exe.DocNames"
supportInterpreter = true
needs = ["Feec", "FeecCheck"]

# Dependency analysis for the minimality pass (not a gate check): `lake exe feec-deps [OUT_DIR]`,
# `lake exe feec-deps --strip FILE OUT` (scripts/FeecCheck/Deps.lean).
[[lean_exe]]
name = "feec-deps"
srcDir = "scripts"
root = "FeecCheck.Exe.Deps"
supportInterpreter = true
needs = ["Feec"]
