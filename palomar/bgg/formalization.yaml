sources:
  - title: "Complexes from complexes"
    authors:
      - "Douglas N. Arnold"
      - "Kaibo Hu"
    id: "doi:10.1007/s10208-021-09498-9"
    type: "paper"
    location: "Found. Comput. Math. 21 (2021), §3 ((19)-(31), Theorems 6 and 7, Proposition 1, Corollary 1), §4.1-4.2 (the examples: the diagram (32) in three dimensions, (36) in n dimensions) and §5 ((58)-(59) the twisted complex, §5.1 the sum complex, §5.2 splitting off an exact subcomplex); locators checked against the arXiv preprint (arXiv:2005.12437), not against the published version"
    relationship: "adapts"
    note: >-
      §5 proves Theorem 6 in two steps: the twisted complex compared with the sum complex (§5.1)
      and its splitting into the output complex and an exact subcomplex (§5.2). The challenge
      states the second step as a zigzag of quasi-isomorphisms, the identification of the
      subquotient with the output complex (24)-(26), the cohomology isomorphism with the sum
      complex of Theorem 7 under (28) and the explicit cochain map (30) of Theorem 7 with
      Corollary 1 (FEEC.bggCohomology), the dimension bound and the equality criterion (27) of
      Theorem 6 (FEEC.bggFinrank), and the Hilbert-complex conclusions of Theorem 6 and of the
      paragraph after it, with the quotient norm, and the orthogonal form of (30) with the
      Moore-Penrose inverse (29) into the output complex (24)-(26), with Corollary 1
      (FEEC.bggHilbert). Adapted: the hypothesis (23) of the main clauses is weakened to S^i
      injective before J and onto modulo d from J on, the algebraic theorems hold over any ring,
      on Z and for arbitrary S, the output complex is the subquotient Gamma / Delta with the
      quotient norm (at J equivalent to, not equal to, the paper's norm), and the examples are
      diagrams of L^2 de Rham complexes of the same regularity on parallelepipeds (fidelity (1),
      (3), (6), (7), (11)). The equation and section numbers were checked against the arXiv
      preprint; their agreement with the published article is not verified.
    author_endorsement: "not-contacted"
  - title: "A New Approach to Finite Element Simulations of General Relativity"
    authors:
      - "Vincent Quenneville-Bélair"
    id: "http://hdl.handle.net/11299/175309"
    type: "other"
    location: "PhD thesis, University of Minnesota, 2015; Ch. 5 (the BGG diagram of the linearized Einstein-Bianchi system)"
    relationship: "background"
    note: >-
