fidelity:
  divergences: >-
    (1) Setting: Arnold-Hu work with bounded Hilbert complexes indexed 0..n and connecting maps
    id (x) s^i with s^i between finite-dimensional spaces; the challenge is purely algebraic,
    over any ring, on Z (finite complexes are complexes vanishing outside a window), with
    arbitrary connecting maps. The analytic conclusion of Theorem 6 (a bounded Hilbert complex
    with closed ranges) is not part of the statement.
    (2) The output complex: Arnold-Hu (24)-(26) use orthogonal complements V^i (x) R(s^(i-1))^perp
    and orthogonal projections; the challenge uses the subquotient Gamma / Delta of the twisted
    complex, whose spaces are V^i / R(S^(i-1)) for i < J, {(sigma, phi) | d sigma = S phi} modulo
    {(-S psi, d~ psi)} at J (V^J / R(S^(J-1)) when S^J is bijective) and N(S^i) for i > J;
    these identifications are proved in Feec but not compared.
    (3) The hypothesis is weaker than the J-injectivity/surjectivity condition (23), which asks
    s^i injective for 0 <= i <= J (so s^J bijective): here S^i is injective only for i < J.
    (4) The conclusion is the cohomology isomorphism with the twisted complex (the second step of
    the proof of Theorem 6, §5.2), stated as two quasi-isomorphisms and as Nonempty isomorphisms
    of the homology modules, plus the short exact sequence of rows, and the dimension bound of
    Theorem 6 over a field (FEEC.bggFinrank); the equality criterion (27) of Theorem 6 and the
    explicit isomorphism of Theorem 7 are not stated. Of the five fields of FEEC.BGG.Verdict,
    only quasiIso_ι and quasiIso_π carry content: homology follows from them, shortExact holds
    for every S and J, and acyclic follows from shortExact and homology.
    (5) The anticommutation d S = -S d~ is encoded as a morphism of cochain complexes
    V~ -> V[1], with Mathlib's sign convention for the shift (differential -d on V[1]).
    (6) The name BGG follows Arnold-Hu; the representation-theoretic BGG resolution
    [BernsteinGelfandGelfand1975] and the BGG sequences of Čap-Slovák-Souček are background only.

