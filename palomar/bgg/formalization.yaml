    div-div complexes of R^3 with no hypothesis (Feec.Domain.quasiIso_hessianSumMap,
    quasiIso_elasticitySumMap, quasiIso_divDivSumMap, with the Koszul null-homotopies
    Feec.Domain.koszul_isNullHomotopy).
