related_formalizations:
  - id: "doi:10.46298/afm.13609"
    relationship: "builds-on"
    note: >-
      J. Riou, Formalization of derived categories in Lean/mathlib (Annals of Formalized
      Mathematics, 2025): in Lean 4 Mathlib, the derived category of an abelian category,
      built on Mathlib's homology of short complexes, shifts of cochain complexes and homotopy
      categories. This entry states its theorems with those cochain complexes, shifts,
      homology and quasi-isomorphisms; it does not use derived categories. Its twisted complex
      is, up to a shift and the order of the factors, the mapping cone of S : V~ -> V[1]
      (Mathlib's CochainComplex.mappingCone, from the same work); the entry defines it
      directly (FEEC.BGG.twisted). A search of OpenAlex, arXiv, HAL, the Isabelle AFP and
      Mathlib on 2026-11-25 found no formalization of BGG complexes or of Hilbert complexes.
  - id: "doi:10.1007/s10817-007-9094-x"
    relationship: "other"
    note: >-
      J. Aransay, C. Ballarin, J. Rubio, A mechanized proof of the basic perturbation lemma
      (J. Automated Reasoning 40, 2008): in Isabelle/HOL, the basic perturbation lemma of
      homological algebra, which transfers a reduction of a chain complex to a perturbed
      differential. Loosely related: reductions of chain complexes, not the twisted or BGG
      complexes of this entry.

status:
  scope: >-
    Formalized and compared: FEEC.bggCohomology for every ring R, every pair of Z-indexed cochain
    complexes of R-modules, every morphism S : V~ -> V[1] and every index J (its clauses: the
    identification with the output complex and the short exact sequence of the rows for every S;
    the quasi-isomorphisms, exactness and the cohomology of the sum complex under the hypotheses;
    Proposition 1, the isomorphism with the sum complex for every null-homotopy K of S, and the
    explicit map (30) with Corollary 1 for every choice of right inverses t under (23));
    FEEC.bggFinrank, over a field, for every degree i where both rows have finite-dimensional
    cohomology; FEEC.bggHilbert for every pair of Z-indexed complexes of bounded operators on
    Hilbert spaces over R or C with bounded connecting maps and every J (its clauses: the quotient
    norm of Gamma / Delta, an isometry with the Hilbert space Gamma (-) Delta, bounded quotient
    differentials and closed range, with s bounded below before J and onto modulo d from J on;
    the orthogonal form of (30) with Corollary 1 for every linear null-homotopy K under (23) with
    closed ranges of s^i for i < J); FEEC.bggParallelepiped, the Hessian, elasticity and div-div
    diagrams of the L^2 de Rham complex of forms on every parallelepiped A (0, 1)^n + b with A
    invertible, the Hessian one for every n at J = 0, the elasticity one for n = 3 at J = 1 and
    the div-div one for every n >= 1 at J = n - 1 (the hypotheses of the main clause of
    FEEC.bggHilbert for the stacked diagrams of their domain complexes, s^J not onto (for the
    Hessian diagram if n >= 1), closed range of the BGG
    complexes in every degree, finite-dimensional cohomology of dimension n + 1, 6, n + 1 in
    degree 0 and 0 in the other degrees, and the degree-0 cohomology identified with the affine
    functions, the rigid motions and the fields a + c x); the cube (0, 1/2)^3 is the case n = 3,
    A = I/2, b = 0 (FEEC.cube_eq_parallelepiped, proved in the challenge), every open box the case
    of a diagonal A. The weak-symmetry theorem FEEC.bggWeakSymmetry is compared in
    palomar/einsteinbianchi. The corollary states the dimensions of the cohomology and identifies the degree-0 cohomology of the
    three BGG complexes with the affine functions P_1, the rigid motions RM and the fields a + c x
    (RT) as spaces of L^2 functions on the parallelepiped (a linear injection H^0 -> L^2 with that
    range, mapping the class of a cocycle [(sigma, phi)] to the function u of sigma = (u, du)); the
    BGG complexes themselves are not identified with the classical complexes of vector proxies
    (H^2(Omega) -> H(curl; Omega; S) -> H(div; Omega; T) -> L^2(Omega; R^3) for the Hessian;
    informal, in the docstring of FEEC.bggParallelepiped). Other domains (bounded Lipschitz or
    star-shaped domains, bi-Lipschitz images of the cube) are not reached: their regular
    decompositions are not proved in Feec. In Feec the same verdict, dimensions and H^0 hold for
    the BGG complexes of the domain complexes of the analytic BGG data of forms on every bounded
    open Omega whose HΛ(Omega) has the H^1-regular decompositions from J on and the cohomology of
    a point (Feec.FiniteElement.hessianFormData_bggVerdict, elasticityFormData_bggVerdict,
    divDivFormData_bggVerdict, through Feec.BGG.HilbertData.finrank_bgg_homology_eq_add:
    equality in (27) where in every degree the source or the target of S has no cohomology;
    hessianFormData_homologyIs_zero, elasticityFormData_homologyIs_zero,
    divDivFormData_homologyIs_zero, through Feec.BGG.HilbertData.homologyIs_lowest: in the lowest
    degree of the rows H^i of the BGG complex is the space of the u with d u = S v, v closed, and
    dim H^0(HΛ(Omega)) = 1 makes the closed 0-forms the constants), with the instances on the cube
    (Feec.Models.Cube.FormBGG.hessianBGG_Q, ..., hessianBGG_Q_homology_zero, ...) and on the
    parallelepipeds A (0, 1/2)^n + b (Feec.Models.Parallelepiped.FormBGG.hessianBGG_domain,
    elasticityBGG_domain, divDivBGG_domain and their homology_zero).
    Proved in Feec, not compared: the general elimination theorem on any complex shape with
    arbitrary eliminated index sets (Feec.BGG.Data.derivedHomologyIso) and the general
    subquotient of a complex of bounded operators as a Hilbert complex
    (Feec.HilbertComplex.Subquotient.complex, complexIso, cohomologyEquiv), of which the main
    clause of FEEC.bggHilbert is the instance Gamma / Delta; the connecting map of
    0 -> V -> T -> V~ -> 0 as the map induced by -S, delta[phi] = [-S phi]
    (Feec.BGG.Data.δ_twistShortComplex), from which the criterion (27) is proved; the explicit
    cochain retraction Pi : T -> Gamma of the inclusion ((67) in the subquotient model,
    Feec.BGG.Data.bggProj, Γι_bggProj, quasiIso_bggProj) and Theorem 7 and Corollary 1 for every
    complex shape and every elimination (Feec.BGG.Data.quasiIso_sumIso_comp,
    Feec.BGG.Data.derived_represents); the Moore-Penrose inverse of a bounded operator with closed
    range and the Penrose equations (Feec.ForMathlib.InnerProductSpace.MoorePenrose); the
    orthogonal (30) between domain complexes (fields injective_domainData_S and
    quasiIso_orthSumMap of Feec.BGG.HilbertData.BGGVerdict); non-vacuity instances with nonzero
    d, d~ and S = dK - Kd~ (Feec.BGG.Data.altShift, altShift_quasiIso_bggSumMap,
    altShift_bgg_represents, Feec.BGG.BoundedData.planeAltShift_quasiIso_orthSumMap, with nonzero
    output spaces R(S^(-1))^perp and N(S^1), S^(-1) not onto and S^1 not one-to-one). The
    challenge itself proves that S = 𝟙 : V[1] -> V[1] satisfies the hypotheses at every J
    (FEEC.BGG.hypotheses_id) and that s = id, d~ = -d satisfy those of the main clause of
    FEEC.bggHilbert (FEEC.BGG.hypotheses_bounded_id).
    Proved in Feec, not compared: the H^1-regular decompositions of [ArnoldHu2021], §2,
    Theorem 3, of the L^2 de Rham complexes HΛ(Omega) on the cube (0, 1/2)^n
    (Feec.Models.Cube.Sobolev.deRham_hasRegularDecomposition_Q, by Gaffney's identity on the
    torus), transported to every open parallelepiped and every open box by invertible affine
    maps (Feec.Models.Parallelepiped.deRham_hasRegularDecomposition_affine; FEEC.bggParallelepiped
    uses them through the diagrams of forms), and in three
    dimensions for the de Rham complexes with values in K^m over every RCLike K
    (Feec.Models.Parallelepiped.deRhamVec_hasRegularDecomposition_affine, from
    Feec.Models.Cube.Sobolev.deRhamVec_hasRegularDecomposition_Q), with their finite-dimensional
    cohomology (Feec.Models.Parallelepiped.finiteDimensional_cohomology_deRhamVec_affine); these
    give the
    onto-modulo-d hypothesis R(d) + R(S) = D(d) of the Hessian, elasticity and div-div diagrams
    of vector proxies between the L^2 domain complexes
    (Feec.Domain.hessianMaximalData_regularDecomposition,
    elasticityMaximalData_regularDecomposition, divDivMaximalData_regularDecomposition; on the
    cube Feec.Models.Cube.hessianMaximalData_regularDecomposition_Q and its siblings), while the
    surjectivity of (23) fails there: S^J is not onto between the L^2 domains on any nonempty open set
    (Feec.Domain.hessianMaximalData_not_surjective, elasticityMaximalData_not_surjective,
    divDivMaximalData_not_surjective, from the general
    Feec.Domain.ConstCoeffBGG.not_surjective_maximalData_domainS: rescaled test fields and the
    open mapping theorem; so no right inverses exist there,
    Feec.Domain.hessianMaximalData_not_injSurjWith and its siblings). This is the reason for the
    weakened hypothesis of the main clauses. For the diagrams of forms the failure of
    surjectivity is a clause of FEEC.bggParallelepiped; Feec proves it on every nonempty open set
    of R^n, n >= 1 (R^3 for the elasticity diagram)
    (Feec.FiniteElement.hessianFormData_exists_forall_S_ne,
    elasticityFormData_exists_forall_S_ne, divDivFormData_exists_forall_S_ne, from
    Feec.BGG.HilbertData.exists_forall_S_ne). The finite element (FEEC) theorems for these complexes on boxes and
    parallelepipeds (Feec.Models.Parallelepiped.hessianFEEC_affine, ...) are outside this entry:
