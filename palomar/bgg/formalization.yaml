    id: "doi:10.1017/S0962492906210018"
    type: "article"
    location: "Acta Numerica 15 (2006), §11"
    relationship: "background"
    note: "The elasticity complex derived from two de Rham complexes, an instance of the construction."
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized and compared: FEEC.bggCohomology, FEEC.bggIdentification and FEEC.bggSum for every
    ring R, every pair of Z-indexed cochain complexes of R-modules, every morphism S : V~ -> V[1]
    and every index J; FEEC.bggFinrank, over a field, for every degree i where both rows have
    finite-dimensional cohomology; FEEC.bggClosedRange for every pair of Z-indexed complexes of
    bounded operators on Hilbert spaces over R or C with bounded connecting maps, every J and
    every degree. Not compared (proved in Feec, outside the statement): the general elimination
    theorem on any complex shape with arbitrary eliminated index sets
    (Feec.BGG.Data.derivedHomologyIso); the connecting map of 0 -> V -> T -> V~ -> 0 as the map
    induced by -S, delta[phi] = [-S phi] (Feec.BGG.Data.δ_twistShortComplex), from which the
    criterion (27) is proved; the orthogonal model Gamma ⊖ Delta of the derived complex as a
    Hilbert complex with its cohomology isomorphism and dimension bound
    (Feec.BGG.BoundedData.derivedComplex, derivedComplexCohomologyEquiv,
    finrank_derivedComplex_cohomology_le); non-vacuity instances (connecting maps the identity,
    Feec.BGG.Data.injSurj_idShift and Feec.BGG.BoundedData.idShift_derivedComplex_closedRangeAt;
    the Hessian diagram on smooth fields, Feec.Domain.injSurj_hessianBGG). The challenge itself
    proves that S = 𝟙 : V[1] -> V[1] satisfies the hypotheses at every J (FEEC.BGG.hypotheses_id).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

