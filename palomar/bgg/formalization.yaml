    the BGG space lemmas of Feec.HilbertComplex.BGG.Derived,
    Feec.BGG.Data.finrank_twistComplex_homology_eq_iff, Feec.BGG.Data.bggProj,
    Feec.BGG.Data.quasiIso_of_Γι_comp, HomologicalComplex.Represents.map, the general
    subquotient of Feec.HilbertComplex.Quotient (Gamma / Delta on the l2 products as a
    Feec.HilbertComplex.Subquotient), Feec.BGG.BoundedData.isClosed_bgg_Δ,
    Feec.BGG.BoundedData.quasiIso_orthSumMap, isIso_toOrth and orth_represents.

fidelity:
  divergences: >-
    Presentation (same mathematics, another encoding). (1) The output complex: Arnold-Hu (24)-(26)
    realize V^i / R(S^(i-1)) as the orthogonal complement V^i (x) R(s^(i-1))^perp with the
    projected differential P_(R^perp) D; the challenge uses the subquotient Gamma / Delta of the
    twisted complex and proves it is the output complex (FEEC.bggIdentification: V / R(S) before
    J, N(S) after J, d~ (S^J)^(-1) d at J). (2) The anticommutation d S = -S d~ is a morphism of
    cochain complexes V~ -> V[1], with Mathlib's sign convention for the shift (differential -d on
    V[1]); for Hilbert rows it is built from the bounded maps (FEEC.BGG.ofBoundedHom). (3) Bounded
    Hilbert complex (Theorem 6): Arnold-Hu give the output complex the norm of the subspaces
    Upsilon^i (orthogonal complements); FEEC.bggHilbert gives Gamma^i / Delta^i the quotient norm
    of the l2 norm of V^i (+) V~^i (WithLp 2, the rows Gamma, Delta transported to it as
    FEEC.BGG.ΓL, FEEC.BGG.ΔL, the quotient FEEC.BGG.QuotL) and proves that y -> [y] is an
    isometry of Gamma^i ∩ (Delta^i)^perp onto it, so the quotient norm is a Hilbert norm; the
    bounded differentials are stated by existence, D^i [x] = [x'] whenever x' is the twisted
    differential of x, and closed range as IsClosed (range D^i) where both rows have
    finite-dimensional cohomology in degree i + 1 (the paper derives closed range from finite
    cohomology in the paragraph after Theorem 6). FEEC.bggOrthogonal identifies the BGG complex
    with the orthogonal output complex of the paper as complexes of modules. (4) Theorem 7's map (30) is built with the
    Moore-Penrose inverse t of s and the orthogonal projections P_(R^perp), P_N into the
    orthogonal output complex; FEEC.bggOrthogonal states exactly this form for Hilbert rows (the
    output complex as a complex Y with isomorphisms Y^i = Upsilon^i carrying its differential to
    (26), and Y isomorphic to the BGG complex; Arnold-Hu's Upsilon^i = V^i (x) R(s^(i-1))^perp is
    R(S^(i-1))^perp for S = id (x) s, and N(S^i) = V^(i+1) (x) N(s^i)), after J in degree i + 1 for
    i >= J so that t^(i+1) = (s^i)^dagger is indexed by the source of s^i. FEEC.bggExplicit states
    it in the subquotient model, for any right
    inverses t of S^i (i >= J), the Moore-Penrose inverse being one: BGG.sumMap gives a
    representative in Gamma^i of the image of (omega, mu); up to J its class is [omega + K mu] in
    V^i / R(S^(i-1)) (Arnold-Hu's P_(R^perp)(omega + K mu): P_(R^perp) is absorbed by the quotient),
    after J it is P(d~ t omega + (I + d~ t K) mu) with P = 1 - tS, which is P_N when t is the
    Moore-Penrose inverse ((29)). The compared conclusion: these representatives define a cochain
    map (existence of kappa with the stated components), kappa is a quasi-isomorphism, and it maps
    representatives to representatives. H^i of the sum complex V x V~ is not further identified
    with H^i(V) (+) H^i(V~) as a biproduct. (5) Of the five fields of FEEC.BGG.Verdict, only
    quasiIso_ι and quasiIso_π carry content: homology follows from
    them, shortExact holds for every S and J, and acyclic follows from shortExact and homology.
    Generality beyond the source (strengthenings, not gaps). (6) Arnold-Hu work with bounded
    Hilbert complexes indexed 0..n, spaces Z^i = V^i (x) E^i, Z~^i = V^(i+1) (x) E~^i ((20)) and connecting maps id (x) s^i with s^i
    between finite-dimensional spaces; the algebraic theorems hold over any ring, on Z (finite
    complexes vanish outside a window), for arbitrary S, and the Hilbert theorem for arbitrary
    bounded S. (7) The hypothesis is weaker than the J-injectivity/surjectivity condition (23),
    which asks s^i injective for i <= J and surjective for i >= J: S^i injective only for i < J and
    onto modulo d for i >= J; S^J bijective is assumed only where (25)-(26) need it
    (FEEC.bggIdentification); FEEC.bggExplicit assumes (23) itself (S^i injective for i <= J),
    with a choice of right inverses for i >= J. In the Hilbert setting, injectivity of S^i for i < J is replaced by
    boundedness below, which id (x) s^i with s^i injective between finite-dimensional spaces
    satisfies. (8) The equality criterion (27) is stated degreewise: dim H^i(BGG) = dim H^i(V) +
    dim H^i(V~) iff S^(i-1) and S^i induce zero on cohomology, which implies Arnold-Hu's
    all-degree form. Theorem 6's dimension bound is stated where both rows have finite-dimensional
    cohomology; Arnold-Hu's inequality is vacuous otherwise.
    Scope. (9) Every claim of (24)-(31), Theorems 6 and 7, Proposition 1 and Corollary 1 is
    stated, in the encodings (1)-(4): Theorem 6's bounded Hilbert complex by FEEC.bggHilbert,
    its dimension statements by FEEC.bggFinrank; (30) in the quotient model for modules
    (FEEC.bggExplicit) and in its orthogonal form with P_(R⊥) and the Moore-Penrose inverse for
    Hilbert rows (FEEC.bggOrthogonal); Corollary 1 in both models as: if
    N(d^i) = R(d^(i-1)) (+) H^i and N(d~^i) = R(d~^(i-1)) (+) H~^i (BGG.Represents), then
    N(D^i) = R(D^(i-1)) (+) kappa(H^i x H~^i) in the output complex, kappa(H x H~) being the image
    under (30) as in (31). Outside the submission: the applications of §4 (elasticity, Hessian
    and div div complexes) and the uniform representation of cohomology of §2
    (Costabel-McIntosh); the regular decompositions of the L^2 de Rham rows on boxes and
    parallelepipeds (Theorem 3 of §2 there) are proved in Feec but not stated in the challenge,
    which has no differential operators (see status.scope); no finite element discretization.
    (10) The name BGG follows Arnold-Hu; the representation-theoretic BGG resolution
    [BernsteinGelfandGelfand1975] and the BGG sequences of Čap-Slovák-Souček are background only.

