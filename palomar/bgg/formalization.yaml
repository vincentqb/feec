fidelity:
  divergences: >-
    Presentation (same mathematics, another encoding). (1) The output complex: Arnold-Hu (24)-(26)
    realize V^i / R(S^(i-1)) as the orthogonal complement V^i (x) R(s^(i-1))^perp with the
    projected differential P_(R^perp) D; the challenge uses the subquotient Gamma / Delta of the
    twisted complex and proves it is the output complex (FEEC.bggIdentification: V / R(S) before
    J, N(S) after J, d~ (S^J)^(-1) d at J). (2) The anticommutation d S = -S d~ is a morphism of
    cochain complexes V~ -> V[1], with Mathlib's sign convention for the shift (differential -d on
    V[1]); for Hilbert rows it is built from the bounded maps (FEEC.BGG.ofBoundedHom). (3) Bounded
    Hilbert complex (Theorem 6): the challenge states that Gamma^i and Delta^i are closed in the
    Hilbert space V^i x V~^i (so Gamma^i / Delta^i is a Hilbert space, the differentials, induced by
    the bounded twisted differential, bounded) and closed range as closedness of the preimage
    Delta^i + T(Gamma^(i-1)) of the range in V^i x V~^i; the quotient norm and the bounded quotient
    maps are not constructed as Lean objects. (4) Theorem 7 gives an explicit cochain map (30),
    built with the Moore-Penrose inverse of s, from the sum complex to the orthogonal output
    complex; the challenge states its content in its own model: the explicit cochain isomorphism
    (omega, mu) -> (omega + K mu, mu) of the sum complex (the twisted complex of S = 0) onto T,
    followed by the zigzag of FEEC.bggCohomology, as an isomorphism of cohomology. The compared
    conclusion asserts only that an isomorphism H^i(Gamma / Delta) = H^i(V x V~) exists; that it is
    induced by these explicit cochain maps follows from IsIso of the cochain map and from
    quasiIso_ι, quasiIso_π of FEEC.BGG.Verdict, and that the specific map (30) induces it is not
    stated. H^i of the sum complex V x V~ is not further identified with H^i(V) (+) H^i(V~) as a
    biproduct. (5) Of the five
    fields of FEEC.BGG.Verdict, only quasiIso_ι and quasiIso_π carry content: homology follows from
    them, shortExact holds for every S and J, and acyclic follows from shortExact and homology.
    Generality beyond the source (strengthenings, not gaps). (6) Arnold-Hu work with bounded
    Hilbert complexes indexed 0..n, spaces Z^i = V^i (x) E^i, Z~^i = V^(i+1) (x) E~^i ((20)) and connecting maps id (x) s^i with s^i
    between finite-dimensional spaces; the algebraic theorems hold over any ring, on Z (finite
    complexes vanish outside a window), for arbitrary S, and the Hilbert theorem for arbitrary
    bounded S. (7) The hypothesis is weaker than the J-injectivity/surjectivity condition (23),
    which asks s^i injective for i <= J and surjective for i >= J: S^i injective only for i < J and
    onto modulo d for i >= J; S^J bijective is assumed only where (25)-(26) need it
    (FEEC.bggIdentification). In the Hilbert setting, injectivity of S^i for i < J is replaced by
    boundedness below, which id (x) s^i with s^i injective between finite-dimensional spaces
    satisfies. (8) The equality criterion (27) is stated degreewise: dim H^i(BGG) = dim H^i(V) +
    dim H^i(V~) iff S^(i-1) and S^i induce zero on cohomology, which implies Arnold-Hu's
    all-degree form. Theorem 6's dimension bound is stated where both rows have finite-dimensional
    cohomology; Arnold-Hu's inequality is vacuous otherwise.
    Scope. (9) Every claim of (24)-(28), Theorems 6 and 7 and Proposition 1 is stated, in the
    encodings (1)-(4). Not stated: Corollary 1 ((31), explicit cohomology representatives
    P_(R^perp)(H^i + K^i H~^i) in the orthogonal output complex), which needs the orthogonal model
    of (1) and the Moore-Penrose inverse of (4) as Lean objects, and the explicit map (30) of
    Theorem 7 (see (4)). Outside the submission: the applications of §4 (elasticity, Hessian and div div complexes; Feec proves the
    Hessian diagram, Feec.Domain.injSurj_hessianBGG, not compared) and the uniform representation of
    cohomology of §2 (Costabel-McIntosh) are not part of this submission.
    (10) The name BGG follows Arnold-Hu; the representation-theoretic BGG resolution
    [BernsteinGelfandGelfand1975] and the BGG sequences of Čap-Slovák-Souček are background only.

