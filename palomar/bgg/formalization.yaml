status:
  scope: >-
    Formalized and compared: FEEC.bggCohomology (Challenge.lean) for every ring R, every pair of
    Z-indexed cochain complexes of R-modules, every morphism S : V~ -> V[1] and every index J;
    FEEC.bggFinrank, the same over a field, for every degree i where both rows have
    finite-dimensional cohomology. Feec proves the cohomology isomorphism under a weaker
    hypothesis than the compared one (Feec.BGG.Data.eliminates_bgg): S^i injective for i < J and
    R(d^(j-1)) + R(S^(j-1)) = V^j for j > J (onto modulo d, a regular decomposition) instead of
    S^i surjective for i >= J; this is the form that applies to Sobolev rows, where the
    connecting maps of Arnold-Hu need not be onto. The challenge states the surjective form.
    Not compared (proved in Feec, outside the statement): the general elimination theorem on any
    complex shape with arbitrary eliminated index sets (Feec.BGG.Data.derivedHomologyIso), the
    identification of the spaces of the BGG complex with Arnold-Hu (24)-(25)
    (Feec.BGG.Data.bggXEquivOfLt, bggXEquivOfBijective, bggΓEquivKer), the Hilbert-complex version with
    closed ranges (Feec.HilbertComplex.BGG.Analytic), non-vacuity instances (connecting maps the
    identity, Feec.BGG.Data.injSurj_idShift; the Hessian diagram on smooth fields,
    Feec.Domain.injSurj_hessianBGG). Not formalized: the equality criterion (27) and the
    explicit isomorphism of Arnold-Hu Theorem 7, the identification of the connecting map of the
    long exact sequence with the map induced by S.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

