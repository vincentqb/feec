# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the BGG complexes of Arnold and Hu
# (`palomar/bgg/`). The discretization with weak symmetry (FEEC.bggWeakSymmetry) is compared in
# palomar/einsteinbianchi.
version: "v0.4"

project:
  name: "Bernstein-Gelfand-Gelfand complexes (Arnold-Hu 2021): the output complex, its cohomology and dimension, the explicit cohomology map and representatives, the output Hilbert complex with the quotient norm, and the BGG complexes of the L^2 Hessian, elasticity and div-div diagrams on parallelepipeds"
  description: >-
    A Lean 4 formalization of the Bernstein-Gelfand-Gelfand construction of Arnold and Hu (2021),
    §3 and §5, the abstract construction from which they derive the elasticity, Hessian and
    div-div complexes and their closed-range, Hodge-decomposition and Poincare-inequality
    properties from those of de Rham complexes: two cochain complexes of modules (V, d) and
    (V~, d~) over any ring, on Z and of any length, linked by connecting maps S^i : V~^i -> V^(i+1)
    with d S = -S d~ (a morphism of cochain complexes V~ -> V[1] in Mathlib's shift convention).
    The twisted complex T has T^i = V^i x V~^i and differential (sigma, phi) -> (d sigma - S phi,
    d~ phi). The BGG complex at J is the subquotient Gamma / Delta of T that eliminates the top
    spaces after J and the bottom spaces before J. Four compared theorems.
    FEEC.bggCohomology, for every ring, every S and every J: Gamma / Delta is the output complex
    (24)-(26), by cochain maps Gamma / Delta -> V / R(S) and N(S) -> Gamma / Delta bijective
    before and after J (and at J when S^J is bijective), with the differential d~ (S^J)^(-1) d at
    J (BGG.Identification), and T is an extension 0 -> V -> T -> V~ -> 0; with S^i injective for
    i < J and onto modulo d for i >= J (R(d^i) + R(S^i) = V^(i+1), implied by, and weaker than,
    S^i surjective),
    the inclusion Gamma -> T and the projection Gamma -> Gamma / Delta are quasi-isomorphisms (the
    BGG complex has the cohomology of the twisted complex, §5.2), the BGG complex is exact when
    both rows are, and if S is null-homotopic it has the cohomology of the sum complex; if
    S = dK - Kd~ (28), S induces zero on cohomology (Proposition 1) and (omega, mu) ->
    (omega + K mu, mu) is an isomorphism from the sum complex onto T (Theorem 7), and if moreover
    S^i is injective for i <= J with right inverses t^(i+1) of S^i for i >= J ((23) with the
    inverses of (29)), the explicit map FEEC.BGG.sumMap, (omega, mu) -> [omega + K mu] up to J
    and (omega, mu) -> P(d~ t omega + (I + d~ t K) mu) after J with P = 1 - tS, is a cochain map
    from the sum complex to the BGG complex inducing an isomorphism on cohomology, and it carries
    cohomology representatives H x H~ of the rows to cohomology representatives of the BGG
    complex (Corollary 1, (31)). FEEC.bggFinrank, over a field, Theorem 6: where both rows have
    finite-dimensional cohomology, so does the BGG complex, dim H^i <= dim H^i(V) + dim H^i(V~),
    with equality iff S^(i-1) and S^i induce zero on cohomology (27). FEEC.bggHilbert, for
    complexes of bounded operators on Hilbert spaces and bounded connecting maps s: with s^i
    bounded below for i < J and onto modulo d for i >= J (Theorem 6), Gamma^i and Delta^i are
    closed in V^i x V~^i; for the quotient norm of the l2 norm of V^i (+) V~^i, y -> [y] is an
    isometry of the closed subspace Gamma^i (-) Delta^i = Gamma^i ∩ (Delta^i)^perp onto
    Gamma^i / Delta^i (so the quotient norm is a Hilbert norm), the differentials
    [(sigma, phi)] -> [(d sigma - s phi, d~ phi)] are bounded for it, and they have closed range
    where both rows have finite-dimensional cohomology: the output complex is a bounded Hilbert
    complex; and (24)-(26), (29)-(30) and Theorem 7 in the orthogonal form of the paper, under
    (23) and (28) with s^i of closed range for i < J: with the Moore-Penrose inverses
    t = s^dagger (FEEC.BGG.moorePenrose), the output complex on R(S^(i-1))^perp (i <= J) and
    N(S^i) (i > J) with differentials P_(R^perp) d, d~ (S^J)^dagger d, d~ is a complex isomorphic
    to the BGG complex, and the map (30), (omega, mu) -> P_(R^perp)(omega + K mu) up to J and
    P_N(d~ t omega + (I + d~ t K) mu) after J, is a quasi-isomorphism from the sum complex to it
    which carries cohomology representatives H x H~ of the rows to cohomology representatives of
    the output complex (Corollary 1, (31)). FEEC.bggParallelepiped, the examples of §4.1 and §4.2
    on every parallelepiped Omega = A (0, 1)^n + b with A invertible (the cube (0, 1/2)^3 is the one
    of n = 3, A = I/2, b = 0, cube_eq_parallelepiped): with HΛ(Omega) the weak exterior derivative of
    L^2(Omega; Λ) (dMax, the adjoint of the closure of the codifferential on test forms) and
    HΛ(Omega) (x) R^n its copy on vectors of forms, the Hessian diagram (every n; HΛ(Omega) over
    HΛ(Omega) (x) R^n, S v = sum_a dx_a ∧ v_a, J = 0), the elasticity diagram (n = 3;
    HΛ(Omega) (x) R^3 over itself, (S mu)_b = dx_(b+2) ∧ mu_(b+1) - dx_(b+1) ∧ mu_(b+2), J = 1)
    and the div-div diagram (n >= 1; HΛ(Omega) (x) R^n over HΛ(Omega), (S phi)_a = dx_a ∧ phi,
    J = n - 1) have stacked diagrams of their domain complexes (the graph spaces) that satisfy
    the hypotheses of the main clause of FEEC.bggHilbert, s^i bounded below before J and onto
    modulo d from J on (the regular decompositions of §2, Theorem 3, on Omega; but not (23): s^J
    is not onto, for the Hessian diagram if n >= 1), so their BGG complexes, with the quotient
    norm, have bounded differentials with closed range in every degree, with
    finite-dimensional cohomology of dimension n + 1, 6 and n + 1 in degree 0 and 0 in the other
    degrees: the rows have the cohomology of a point, so S induces zero on cohomology and the
    dimensions of the rows add ((27)); and their cohomology in degree 0 is identified:
    [(sigma, phi)] -> u (sigma = (u, du)) is a linear isomorphism of H^0 onto the affine
    functions a + c·x (P_1), the rigid motions a + c × x (RM), resp. the fields a + c x with c
    scalar (RT) on Omega, as L^2 functions (BGG.DomainDiagram.CohomologyIs; in the lowest degree
    of the rows the cohomology of the BGG complex is the space of the sigma with d sigma = S v,
    v closed, and on the connected parallelepiped a 0-form with constant weak gradient is affine),
    the kernels of hess, sym grad and dev grad that the classical complexes resolve
    (Pauly-Zulehner; Arnold-Hu, §1, for RM). The hypothesis "onto modulo d" replaces the
    surjectivity of (23); in the diagrams (20) of Arnold-Hu, whose bottom row has in degree i the
    regularity of the top row in degree i + 1 and S^i = id (x) s^i, (23) is a condition on
    finite-dimensional maps s^i, met by their examples, but it fails in the diagrams of L^2 de Rham
    complexes of the same regularity used here: on every parallelepiped s^J is not onto between
    the L^2 domains (for the Hessian diagram if n >= 1) while the regular decompositions make it
    onto modulo d (both are clauses of FEEC.bggParallelepiped); the clauses with the explicit map (30) assume (23) and do not apply
    there. The statement is self-contained over
    Mathlib
    (ModuleCat, CochainComplex, QuasiIso, ShortComplex.ShortExact, Module.finrank, IsIso,
    ContinuousLinearMap, AntilipschitzWith, IsClosed, WithLp, the quotient norm of Submodule
    quotients, LinearIsometryEquiv, Submodule.orthogonal, Submodule.starProjection,
    ContinuousLinearEquiv.ofBijective; for the parallelepipeds Matrix.mulVec, Matrix.det,
    Set.image, MeasureTheory.Lp, fderiv, ContDiff,
    LinearPMap.adjoint, LinearPMap.graph, HomologicalComplex.cycles, iCycles, homologyπ,
    Filter.EventuallyEq, dotProduct and crossProduct);
    the proof is the library Feec of this repository (Feec.BGG.Data.quasiIso_Γ,
    Feec.BGG.Data.quasiIso_derived, Feec.BGG.Data.finrank_twistComplex_homology_eq_iff,
    Feec.BGG.Data.bggSumMap, Feec.BGG.Data.quasiIso_bggSumMap, Feec.BGG.Data.bgg_represents,
    Feec.BGG.BoundedData.isClosed_bgg_Δ, Feec.HilbertComplex.Subquotient.toQuotEquiv,
    quotD_toQuot, cohomologyEquiv,
    Feec.HilbertComplex.closedRangeAt_of_finiteDimensional_cohomology,
    Feec.BGG.BoundedData.quasiIso_orthSumMap, Feec.BGG.BoundedData.isIso_toOrth,
    Feec.BGG.BoundedData.orth_represents; for the parallelepipeds the BGG data of forms
    Feec.FiniteElement.hessianFormData, elasticityFormData and divDivFormData with S bounded
    below and their regular decompositions, on every open Omega, and the two hypotheses on the
    rows HΛ(Omega), transported from the cube along the pullback of forms,
    Feec.Models.Parallelepiped.FormBGG.deRham_hasRegularDecomposition_domain and
    Feec.Models.Parallelepiped.finrank_cohomology, with
    Feec.FiniteElement.finrank_vecRow_cohomology_of and Feec.BGG.Data.inducesZero_of_isZero_rowBot,
    inducesZero_of_isZero_rowTop; for H^0
    Feec.BGG.Data.exists_bgg_homology_lowCycles and Feec.FiniteElement.ker_maximal_zero_eq_span,
    exists_maximal_eq_sum_dxL2_iff, hessian_lowest_iff, elasticity_lowest_iff,
    divDiv_lowest_iff).
