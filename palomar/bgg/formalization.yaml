      - "Jan Slovák"
      - "Vladimír Souček"
    id: "doi:10.2307/3062111"
    type: "article"
    location: "Ann. of Math. (2) 154 (2001)"
    relationship: "background"
    note: "BGG sequences in differential geometry; not formalized."
    author_endorsement: "not-contacted"
  - title: "Differential operators on the base affine space and a study of g-modules"
    authors:
