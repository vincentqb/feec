      - "I. M. Gelfand"
      - "S. I. Gelfand"
    id: "zbmath:0338.58019"
    type: "incollection"
    location: "Lie Groups and Their Representations (Budapest, 1971), Halsted, 1975, 21-64"
    relationship: "background"
    note: "The BGG resolution, origin of the name; not formalized."
    author_endorsement: "not-contacted"
