fidelity:
  divergences: >-
    Presentation (same mathematics, another encoding). (1) The output complex: Arnold-Hu (24)-(26)
    realize V^i / R(S^(i-1)) as the orthogonal complement V^i (x) R(s^(i-1))^perp with the
    projected differential P_(R^perp) D; the challenge uses the subquotient Gamma / Delta of the
    twisted complex and proves it is the output complex (the clause BGG.Identification of
    FEEC.bggCohomology: V / R(S) before J, N(S) after J, d~ (S^J)^(-1) d at J). (2) The
    anticommutation d S = -S d~ is a morphism of cochain complexes V~ -> V[1], with Mathlib's sign
    convention for the shift (differential -d on V[1]); for Hilbert rows it is built from the
    bounded maps (FEEC.BGG.ofBoundedHom). (3) Bounded Hilbert complex (Theorem 6): Arnold-Hu give
    the output complex the norm of the subspaces Upsilon^i (orthogonal complements);
    FEEC.bggHilbert gives Gamma^i / Delta^i the quotient norm of the l2 norm of V^i (+) V~^i
    (WithLp 2, the rows Gamma, Delta transported to it as FEEC.BGG.ΓL, FEEC.BGG.ΔL, the quotient
    FEEC.BGG.QuotL) and proves that y -> [y] is an isometry of Gamma^i ∩ (Delta^i)^perp onto it,
    so the quotient norm is a Hilbert norm. This is not the paper's norm at J: for i < J the
    quotient norm of [(sigma, phi)] is dist(sigma, R(S^(i-1))) = ||P_(R^perp) sigma||
    (R(S^(i-1)) closed since S^(i-1) is bounded below), for i > J Gamma^i = 0 x N(S^i) and
    Delta^i = 0, so both agree with the norm of Upsilon^i; at J the quotient norm is
    inf_psi (||sigma + S psi||^2 + ||phi - d~ psi||^2)^(1/2) (S^J phi = d sigma), which is >=
    ||P_(R^perp) sigma|| and, under (23), <= (1 + ||(S^J)^(-1) d||^2)^(1/2) ||P_(R^perp) sigma||
    (take S psi = -P_R sigma): equivalent, not equal. This equivalence is not stated in the
    challenge, and closed range of the orthogonal output differentials of the orthogonal clause of
    FEEC.bggHilbert in the paper's norm is not compared (it follows from the main clause through
    the equivalence, closed range being invariant under equivalent norms). The bounded
    differentials are stated by existence, D^i [x] = [x'] whenever x' is the twisted differential
    of x, and closed range as IsClosed (range D^i) where both rows have finite-dimensional
    cohomology in degree i + 1 (the paper derives closed range from finite cohomology in the
    paragraph after Theorem 6). The orthogonal clause identifies the BGG complex with the
    orthogonal output complex of the paper as complexes of modules. (4) Theorem 7's map (30) is
    built with the Moore-Penrose inverse t of s and the orthogonal projections P_(R^perp), P_N into
    the orthogonal output complex; the orthogonal clause of FEEC.bggHilbert states exactly this
    form for Hilbert rows (the output complex as a complex Y with isomorphisms Y^i = Upsilon^i
    carrying its differential to (26), and Y isomorphic to the BGG complex; Arnold-Hu's
    Upsilon^i = V^i (x) R(s^(i-1))^perp is R(S^(i-1))^perp for S = id (x) s, and
    N(S^i) = V^(i+1) (x) N(s^i)), after J in degree i + 1 for i >= J so that
    t^(i+1) = (s^i)^dagger is indexed by the source of s^i. The explicit-map clause of
    FEEC.bggCohomology states it in the subquotient model, for any right inverses t of S^i
    (i >= J), the Moore-Penrose inverse being one: BGG.sumMap gives a representative in Gamma^i
    of the image of (omega, mu); up to J its class is [omega + K mu] in V^i / R(S^(i-1))
    (Arnold-Hu's P_(R^perp)(omega + K mu): P_(R^perp) is absorbed by the quotient), after J it is
    P(d~ t omega + (I + d~ t K) mu) with P = 1 - tS, which is P_N when t is the Moore-Penrose
    inverse ((29)). The compared conclusion: these representatives define a cochain map
    (existence of kappa with the stated components), kappa is a quasi-isomorphism, and it maps
    representatives to representatives. H^i of the sum complex V x V~ is not further identified
    with H^i(V) (+) H^i(V~) as a biproduct. (5) Of the clauses of FEEC.bggCohomology under its
    hypotheses, the two quasi-isomorphisms carry the content: the cohomology isomorphism follows
    from them, exactness from them and the short exact sequence of the rows (a clause for every S
    and J), and the cohomology of the sum complex from them and the isomorphism of the sum complex
    with T (a clause for every null-homotopy). They are stated for the reader.
    Generality beyond the source (strengthenings, not gaps). (6) Arnold-Hu work with bounded
    Hilbert complexes indexed 0..n, spaces Z^i = V^i (x) E^i, Z~^i = V^(i+1) (x) E~^i ((20)) and
    connecting maps id (x) s^i with s^i between finite-dimensional spaces; the algebraic theorems
    hold over any ring, on Z (finite complexes vanish outside a window), for arbitrary S, and the
    Hilbert theorem for arbitrary bounded S; in the orthogonal clause of FEEC.bggHilbert the
    null-homotopy K of (28) is only linear (Arnold-Hu: bounded), and closed range of s^i for i < J
    is assumed, automatic for id (x) s^i with s^i between finite-dimensional spaces. (7) The
    hypothesis of the main clauses is weaker than the J-injectivity/surjectivity condition (23),
    which asks s^i injective for i <= J and surjective for i >= J: S^i injective only for i < J
    and onto modulo d for i >= J; S^J bijective is assumed only where (25)-(26) need it
    (BGG.Identification); the explicit-map clauses assume (23) itself (S^i injective for i <= J),
    with a choice of right inverses for i >= J. In the Hilbert setting, injectivity of S^i for
    i < J is replaced by boundedness below, which id (x) s^i with s^i injective between
    finite-dimensional spaces satisfies. The weakening is needed for the L^2 examples, where S^J
    is not onto between the domains (status.scope; the module docstring of the challenge names
    the Feec theorems). (8) The equality criterion (27) is stated degreewise: dim H^i(BGG) =
    dim H^i(V) + dim H^i(V~) iff S^(i-1) and S^i induce zero on cohomology, which implies
    Arnold-Hu's all-degree form. Theorem 6's dimension bound is stated where both rows have
    finite-dimensional cohomology; Arnold-Hu's inequality is vacuous otherwise.
    Scope. (9) Every claim of (24)-(31), Theorems 6 and 7, Proposition 1 and Corollary 1 is
    stated, in the encodings (1)-(4): Theorem 6's bounded Hilbert complex by the main clause of
    FEEC.bggHilbert, its dimension statements by FEEC.bggFinrank; (30) in the quotient model for
    modules (the explicit-map clause of FEEC.bggCohomology) and in its orthogonal form with
    P_(R⊥) and the Moore-Penrose inverse for Hilbert rows (the orthogonal clause of
    FEEC.bggHilbert); Corollary 1 in both models as: if N(d^i) = R(d^(i-1)) (+) H^i and
    N(d~^i) = R(d~^(i-1)) (+) H~^i (BGG.Represents), then N(D^i) = R(D^(i-1)) (+)
    kappa(H^i x H~^i) in the output complex, kappa(H x H~) being the image under (30) as in
    (31). Outside the submission: the applications of §4 (elasticity, Hessian and div div
    complexes; on the cube, the planned corollary of status.scope) and the uniform representation
    of cohomology of §2 (Costabel-McIntosh); the regular decompositions of the L^2 de Rham rows
    on boxes and parallelepipeds (Theorem 3 of §2 there) are proved in Feec but not stated in the
    challenge, which has no differential operators (see status.scope). (10) The name BGG follows
    Arnold-Hu; the representation-theoretic BGG resolution [BernsteinGelfandGelfand1975] and the
    BGG sequences of Čap-Slovák-Souček are background only.

