# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the algebraic BGG construction (`palomar/bgg/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The algebraic BGG construction: the derived complex of a stacked diagram has the cohomology of the twisted complex, and its dimension bound"
  description: >-
    A Lean 4 formalization of the algebraic core of the Bernstein-Gelfand-Gelfand construction of
    Arnold and Hu (2021): two cochain complexes of modules (V, d) and (V~, d~) over any ring, on Z
    and of any length, linked by connecting maps S^i : V~^i -> V^(i+1) with d S = -S d~ (a
    morphism of cochain complexes V~ -> V[1] in Mathlib's shift convention). The twisted complex
    T has T^i = V^i x V~^i and differential (sigma, phi) -> (d sigma - S phi, d~ phi). The BGG
    complex at J is the subquotient Gamma / Delta of T that eliminates the top spaces after J and
    the bottom spaces before J. The compared theorem FEEC.bggCohomology states: if S^i is
    injective for i < J and surjective for i >= J, the inclusion Gamma -> T and the projection
    Gamma -> Gamma / Delta are quasi-isomorphisms, so the BGG complex has the cohomology of the
    twisted complex in every degree; T is an extension 0 -> V -> T -> V~ -> 0 (whose long exact
    sequence relates its cohomology to the rows); and the BGG complex is exact when both rows are.
    The second compared theorem FEEC.bggFinrank is the dimension bound of Arnold-Hu Theorem 6:
    over a field, if both rows have finite-dimensional cohomology in degree i, so does the BGG
    complex, with dim H^i(BGG) <= dim H^i(V) + dim H^i(V~).
    The statement is self-contained over Mathlib (ModuleCat, CochainComplex, QuasiIso,
    ShortComplex.ShortExact, Module.finrank); the proof is the library Feec of this repository
    (Feec.BGG.Data.quasiIso_Γ and Feec.BGG.Data.quasiIso_derived, in
    Feec/HilbertComplex/BGG/Derived.lean).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

