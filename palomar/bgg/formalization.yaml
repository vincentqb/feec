    authors:
      - "Douglas N. Arnold"
      - "Kaibo Hu"
    id: "doi:10.1007/s10208-021-09498-9"
    type: "article"
    location: "Found. Comput. Math. 21 (2021), §3 ((19)-(31), Theorems 6 and 7, Proposition 1, Corollary 1) and §5 ((58)-(59) the twisted complex, §5.1 the sum complex, §5.2 splitting off an exact subcomplex); locators checked against the arXiv preprint (arXiv:2005.12437), not against the published version"
    relationship: "formalizes"
    note: >-
      §5 proves Theorem 6 in two steps: the twisted complex compared with the sum complex (§5.1)
      and its splitting into the output complex and an exact subcomplex (§5.2). The challenge
      states the second step as a zigzag of quasi-isomorphisms (FEEC.bggCohomology), the
      identification of the subquotient with the output complex (24)-(26)
      (FEEC.bggIdentification), the dimension bound and the equality criterion (27) of Theorem 6
      (FEEC.bggFinrank), the cohomology isomorphism with the sum complex of Theorem 7 under (28)
      (FEEC.bggSum), the explicit cochain map (30) of Theorem 7 with Corollary 1 (FEEC.bggExplicit),
      and the Hilbert-complex conclusions of Theorem 6 and of the remark after it
      (FEEC.bggClosedRange). The equation and section numbers were checked against the arXiv
      preprint; their agreement with the published article is not verified.
    author_endorsement: "not-contacted"
  - title: "Bernstein-Gelfand-Gelfand sequences"
    authors:
