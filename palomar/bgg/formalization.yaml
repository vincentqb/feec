      symmetry, after [AFW2007] (Ch. 5); its discretization (Prop 5.4, Thm 5.5) is compared in
      palomar/einsteinbianchi, not here. The formalization is by the thesis author.
    author_endorsement: "participated"
  - title: "BGG sequences with weak regularity and applications"
