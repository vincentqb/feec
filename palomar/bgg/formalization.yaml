# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the BGG complexes of Arnold and Hu
# (`palomar/bgg/`). Re-created (2026-11-18) from the former palomar/bgg (deleted when palomar/feec
# absorbed it), whose BGG theorems it compares again: FEEC.bggCohomology, FEEC.bggFinrank and
# FEEC.bggHilbert, with the former FEEC.bggIdentification, FEEC.bggSum, FEEC.bggExplicit,
# FEEC.bggOrthogonal and the shortExact field of the former BGG verdict as clauses of these three
# theorems. The discretization with weak symmetry of the former entry (FEEC.bggWeakSymmetry) is
# compared in palomar/einsteinbianchi.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Bernstein-Gelfand-Gelfand complexes (Arnold-Hu 2021): the output complex, its cohomology and dimension, the explicit cohomology map and representatives, and the output Hilbert complex with the quotient norm"
  description: >-
    A Lean 4 formalization of the Bernstein-Gelfand-Gelfand construction of Arnold and Hu (2021),
    §3 and §5, the abstract construction from which they derive the elasticity, Hessian and
    div-div complexes and their closed-range, Hodge-decomposition and Poincare-inequality
    properties from those of de Rham complexes: two cochain complexes of modules (V, d) and
    (V~, d~) over any ring, on Z and of any length, linked by connecting maps S^i : V~^i -> V^(i+1)
    with d S = -S d~ (a morphism of cochain complexes V~ -> V[1] in Mathlib's shift convention).
    The twisted complex T has T^i = V^i x V~^i and differential (sigma, phi) -> (d sigma - S phi,
    d~ phi). The BGG complex at J is the subquotient Gamma / Delta of T that eliminates the top
    spaces after J and the bottom spaces before J. Three compared theorems.
    FEEC.bggCohomology, for every ring, every S and every J: Gamma / Delta is the output complex
    (24)-(26), by cochain maps Gamma / Delta -> V / R(S) and N(S) -> Gamma / Delta bijective
    before and after J (and at J when S^J is bijective), with the differential d~ (S^J)^(-1) d at
    J (BGG.Identification), and T is an extension 0 -> V -> T -> V~ -> 0; with S^i injective for
    i < J and onto modulo d for i >= J (R(d^i) + R(S^i) = V^(i+1), in particular S^i surjective),
    the inclusion Gamma -> T and the projection Gamma -> Gamma / Delta are quasi-isomorphisms (the
    BGG complex has the cohomology of the twisted complex, §5.2), the BGG complex is exact when
    both rows are, and if S is null-homotopic it has the cohomology of the sum complex; if
    S = dK - Kd~ (28), S induces zero on cohomology (Proposition 1) and (omega, mu) ->
    (omega + K mu, mu) is an isomorphism from the sum complex onto T (Theorem 7), and if moreover
    S^i is injective for i <= J with right inverses t^(i+1) of S^i for i >= J ((23) with the
    inverses of (29)), the explicit map FEEC.BGG.sumMap, (omega, mu) -> [omega + K mu] up to J
    and (omega, mu) -> P(d~ t omega + (I + d~ t K) mu) after J with P = 1 - tS, is a cochain map
    from the sum complex to the BGG complex inducing an isomorphism on cohomology, and it carries
    cohomology representatives H x H~ of the rows to cohomology representatives of the BGG
    complex (Corollary 1, (31)). FEEC.bggFinrank, over a field, Theorem 6: where both rows have
    finite-dimensional cohomology, so does the BGG complex, dim H^i <= dim H^i(V) + dim H^i(V~),
    with equality iff S^(i-1) and S^i induce zero on cohomology (27). FEEC.bggHilbert, for
    complexes of bounded operators on Hilbert spaces and bounded connecting maps s: with s^i
    bounded below for i < J and onto modulo d for i >= J (Theorem 6), Gamma^i and Delta^i are
    closed in V^i x V~^i; for the quotient norm of the l2 norm of V^i (+) V~^i, y -> [y] is an
    isometry of the closed subspace Gamma^i (-) Delta^i = Gamma^i ∩ (Delta^i)^perp onto
    Gamma^i / Delta^i (so the quotient norm is a Hilbert norm), the differentials
    [(sigma, phi)] -> [(d sigma - s phi, d~ phi)] are bounded for it, and they have closed range
    where both rows have finite-dimensional cohomology: the output complex is a bounded Hilbert
    complex; and (24)-(26), (29)-(30) and Theorem 7 in the orthogonal form of the paper, under
    (23) and (28) with s^i of closed range for i < J: with the Moore-Penrose inverses
    t = s^dagger (FEEC.BGG.moorePenrose), the output complex on R(S^(i-1))^perp (i <= J) and
    N(S^i) (i > J) with differentials P_(R^perp) d, d~ (S^J)^dagger d, d~ is a complex isomorphic
    to the BGG complex, and the map (30), (omega, mu) -> P_(R^perp)(omega + K mu) up to J and
    P_N(d~ t omega + (I + d~ t K) mu) after J, is a quasi-isomorphism from the sum complex to it
    which carries cohomology representatives H x H~ of the rows to cohomology representatives of
    the output complex (Corollary 1, (31)). The hypothesis "onto modulo d" replaces the
    surjectivity of (23) because (23) fails for the examples: for the Hessian, elasticity and
    div-div diagrams of the L^2 de Rham complexes on any nonempty open set of R^3, S^J is not
    onto between the L^2 domains (Feec.Domain.hessianMaximalData_not_surjective,
    Feec.Domain.elasticityMaximalData_not_surjective,
    Feec.Domain.divDivMaximalData_not_surjective), while on the cube (0, 1/2)^3 the regular
    decompositions make S onto modulo d (Feec.Models.Cube.hessianMaximalData_regularDecomposition_Q
    and its siblings); the clauses with the explicit map (30) assume (23) and do not apply there.
    The statement is self-contained over Mathlib (ModuleCat, CochainComplex, QuasiIso,
    ShortComplex.ShortExact, Module.finrank, IsIso, ContinuousLinearMap, AntilipschitzWith,
    IsClosed, WithLp, the quotient norm of Submodule quotients, LinearIsometryEquiv,
    Submodule.orthogonal, Submodule.starProjection, ContinuousLinearEquiv.ofBijective);
    the proof is the library Feec of this repository (Feec.BGG.Data.quasiIso_Γ,
    Feec.BGG.Data.quasiIso_derived, Feec.BGG.Data.finrank_twistComplex_homology_eq_iff,
    Feec.BGG.Data.bggSumMap, Feec.BGG.Data.quasiIso_bggSumMap, Feec.BGG.Data.bgg_represents,
    Feec.BGG.BoundedData.isClosed_bgg_Δ, Feec.HilbertComplex.Subquotient.toQuotEquiv,
    quotD_toQuot, cohomologyEquiv,
    Feec.HilbertComplex.closedRangeAt_of_finiteDimensional_cohomology,
    Feec.BGG.BoundedData.quasiIso_orthSumMap, Feec.BGG.BoundedData.isIso_toOrth,
    Feec.BGG.BoundedData.orth_represents).
