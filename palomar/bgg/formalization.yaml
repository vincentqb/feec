status:
  scope: >-
    Formalized and compared: FEEC.bggCohomology, FEEC.bggIdentification and FEEC.bggSum for every
    ring R, every pair of Z-indexed cochain complexes of R-modules, every morphism S : V~ -> V[1]
    and every index J; FEEC.bggExplicit for every ring, every null-homotopy K of S, every J and
    every choice of right inverses t; FEEC.bggFinrank, over a field, for every degree i where both rows have
    finite-dimensional cohomology; FEEC.bggClosedRange for every pair of Z-indexed complexes of
    bounded operators on Hilbert spaces over R or C with bounded connecting maps, every J and
    every degree. Not compared (proved in Feec, outside the statement): the general elimination
    theorem on any complex shape with arbitrary eliminated index sets
    (Feec.BGG.Data.derivedHomologyIso); the connecting map of 0 -> V -> T -> V~ -> 0 as the map
    induced by -S, delta[phi] = [-S phi] (Feec.BGG.Data.δ_twistShortComplex), from which the
    criterion (27) is proved; the orthogonal model Gamma ⊖ Delta of the derived complex as a
    Hilbert complex with its cohomology isomorphism and dimension bound
    (Feec.BGG.BoundedData.derivedComplex, derivedComplexCohomologyEquiv,
    finrank_derivedComplex_cohomology_le); the Hilbert quotient norm of Gamma / Delta: for the
    quotient norm of the l2 norm of V^i x V~^i, y -> [y] is an isometry from the orthogonal model
    onto Gamma^i / Delta^i when Delta is closed, intertwining the differentials with the bounded
    differentials [x] -> [T x] of the quotient (Feec.BGG.BoundedData.toDerivedQuotL,
    norm_toDerivedQuotLinear, derivedQuotLEquiv, derivedQuotD, derivedQuotD_toDerivedQuotL;
    fields quotient_surjective and quotient_d of Feec.BGG.HilbertData.DerivedVerdict); the
    explicit cochain retraction Pi : T -> Gamma of the inclusion ((67) in the subquotient model,
    Feec.BGG.Data.bggProj, Γι_bggProj, quasiIso_bggProj) and Theorem 7 and Corollary 1 for every
    complex shape and every elimination (Feec.BGG.Data.quasiIso_sumIso_comp,
    Feec.BGG.Data.derived_represents; fields quasiIso_sum and represents of
    Feec.BGG.HilbertData.DerivedVerdict), and the explicit map (30) for bgg J
    (Feec.BGG.Data.bggSumMap, quasiIso_bggSumMap, bgg_represents; fields quasiIso_bggSumMap and
    bgg_represents of Feec.BGG.HilbertData.BGGVerdict, the conclusion of
    Feec.BGG.HilbertData.bggVerdict); non-vacuity instances (connecting maps the identity,
    Feec.BGG.Data.injSurj_idShift and Feec.BGG.BoundedData.idShift_derivedComplex_closedRangeAt;
    for Theorem 7 and Corollary 1 with nonzero d, d~ and S = dK - Kd~, Feec.BGG.Data.altShift,
    altShift_quasiIso_bggSumMap, altShift_bgg_represents;
    the Hessian diagram on smooth fields, Feec.Domain.injSurj_hessianBGG); and, proved in Feec but
    not compared (the challenge has no differential operators), the explicit map (30) on the
    smooth Hessian, elasticity and div-div complexes of R^3 with no hypothesis: right inverses
    from right-inverse matrices (Feec.Domain.injSurjWith_hessianBGG, injSurjWith_elasticityBGG,
    injSurjWith_divDivBGG), the Koszul null-homotopies S = dK - Kd~ with K multiplication by
    k(x) = sum_l c_l x_l (Feec.Domain.koszul_isNullHomotopy), Theorem 7
    (Feec.Domain.quasiIso_hessianSumMap, quasiIso_elasticitySumMap, quasiIso_divDivSumMap) and
    Corollary 1 in degree 0, where (30) represents the cohomology by the affine functions, the
    infinitesimal rigid motions and the lowest-order Raviart-Thomas fields
    (Feec.Domain.smoothBGGVerdict). Between the L^2 domain complexes S^J is not onto (not
    formalized), so the explicit-map fields of Feec.BGG.HilbertData.BGGVerdict are vacuous for
    these three complexes on L^2 domains. The challenge itself
    proves that S = 𝟙 : V[1] -> V[1] satisfies the hypotheses at every J (FEEC.BGG.hypotheses_id).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

