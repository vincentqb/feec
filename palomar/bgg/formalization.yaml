status:
  scope: >-
    Formalized and compared: FEEC.bggCohomology, FEEC.bggIdentification and FEEC.bggSum for every
    ring R, every pair of Z-indexed cochain complexes of R-modules, every morphism S : V~ -> V[1]
    and every index J; FEEC.bggExplicit for every ring, every null-homotopy K of S, every J and
    every choice of right inverses t; FEEC.bggOrthogonal (with Corollary 1) for every pair of
    Z-indexed complexes of bounded operators on Hilbert spaces over R or C, every bounded s with
    d s = -s d~, every null-homotopy K (linear) and every J under (23) with closed ranges of s^i
    for i < J; FEEC.bggFinrank, over a field, for every degree i where both rows have
    finite-dimensional cohomology; FEEC.bggHilbert for every pair of Z-indexed complexes of
    bounded operators on Hilbert spaces over R or C with bounded connecting maps, bounded below
    before J and onto modulo d from J on, every J and every degree, including the quotient norm
    of Gamma / Delta (an isometry with the Hilbert space Gamma (-) Delta, bounded quotient
    differentials, closed range).
    Proved in Feec, not compared: the general elimination theorem on any complex shape with
    arbitrary eliminated index sets (Feec.BGG.Data.derivedHomologyIso) and the general
    subquotient of a complex of bounded operators as a Hilbert complex
    (Feec.HilbertComplex.Subquotient.complex, complexIso, cohomologyEquiv), of which
    FEEC.bggHilbert is the instance Gamma / Delta; the connecting map of 0 -> V -> T -> V~ -> 0
    as the map induced by -S, delta[phi] = [-S phi] (Feec.BGG.Data.δ_twistShortComplex), from
    which the criterion (27) is proved; the explicit cochain retraction Pi : T -> Gamma of the
    inclusion ((67) in the subquotient model, Feec.BGG.Data.bggProj, Γι_bggProj,
    quasiIso_bggProj) and Theorem 7 and Corollary 1 for every complex shape and every elimination
    (Feec.BGG.Data.quasiIso_sumIso_comp, Feec.BGG.Data.derived_represents); the Moore-Penrose
    inverse of a bounded operator with closed range and the Penrose equations
    (Feec.ForMathlib.InnerProductSpace.MoorePenrose); the orthogonal (30) between domain
    complexes (fields injective_domainData_S and quasiIso_orthSumMap of
    Feec.BGG.HilbertData.BGGVerdict); non-vacuity instances with nonzero d, d~ and S = dK - Kd~
    (Feec.BGG.Data.altShift, altShift_quasiIso_bggSumMap, altShift_bgg_represents,
    Feec.BGG.BoundedData.planeAltShift_quasiIso_orthSumMap, with nonzero output spaces
    R(S^(-1))^perp and N(S^1), S^(-1) not onto and S^1 not one-to-one). The challenge itself
    proves that S = 𝟙 : V[1] -> V[1] satisfies the hypotheses at every J
    (FEEC.BGG.hypotheses_id) and that s = id, d~ = -d satisfy those of FEEC.bggHilbert
    (FEEC.BGG.hypotheses_bounded_id).
    Proved in Feec, not compared (the challenge has no differential operators; stating the
    L^2 de Rham rows with values in K^m, their maximal domains H^1, H(curl), H(div), the H^1
    fields and the connecting matrices of the three diagrams over Mathlib alone would not fit
    the length budget of the challenge): the H^1-regular decompositions of [ArnoldHu2021], §2,
    Theorem 3, of the L^2 de Rham complexes HΛ(Omega) on the cube (0, 1/2)^n
    (Feec.Models.Cube.Sobolev.deRham_hasRegularDecomposition_Q, by Gaffney's identity on the
    torus), transported to every open parallelepiped and every open box by invertible affine
    maps (Feec.Models.Parallelepiped.deRham_hasRegularDecomposition_affine), and in three
    dimensions for the de Rham complexes with values in K^m over every RCLike K
    (deRhamVec_hasRegularDecomposition_affine, deRhamVec_hasRegularDecomposition_Q), with their
    finite-dimensional cohomology (finiteDimensional_cohomology_deRhamVec_affine); these give the
    onto-modulo-d hypothesis R(d) + R(S) = D(d) of the Hessian, elasticity and div-div diagrams
    between the L^2 domain complexes (Feec.Domain.hessianMaximalData_regularDecomposition,
    elasticityMaximalData_regularDecomposition, divDivMaximalData_regularDecomposition), while
    (23) itself fails there: S^J is not onto between the L^2 domains on any nonempty open set
    (Feec.Domain.hessianMaximalData_not_surjective, elasticityMaximalData_not_surjective,
    divDivMaximalData_not_surjective). The finite element (FEEC) theorems for these complexes on
    boxes and parallelepipeds (Feec.Models.Parallelepiped.hessianFEEC_affine, ...) are outside
    this entry: they quantify over stacked conforming families that are not constructed on any
    domain. Also proved in Feec and not compared: the explicit map (30) on the smooth Hessian,
    elasticity and div-div complexes of R^3 with no hypothesis (Feec.Domain.quasiIso_hessianSumMap,
    quasiIso_elasticitySumMap, quasiIso_divDivSumMap, with the Koszul null-homotopies
    Feec.Domain.koszul_isNullHomotopy).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

