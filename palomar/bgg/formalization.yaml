# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the BGG complexes of Arnold and Hu (`palomar/bgg/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Bernstein-Gelfand-Gelfand complexes (Arnold-Hu 2021): the output complex, its cohomology and dimension, the explicit cohomology map and representatives, and the output Hilbert complex with the quotient norm"
  description: >-
    A Lean 4 formalization of the Bernstein-Gelfand-Gelfand construction of Arnold and Hu (2021),
    §3 and §5: two cochain complexes of modules (V, d) and (V~, d~) over any ring, on Z and of any
    length, linked by connecting maps S^i : V~^i -> V^(i+1) with d S = -S d~ (a morphism of cochain
    complexes V~ -> V[1] in Mathlib's shift convention). The twisted complex T has
    T^i = V^i x V~^i and differential (sigma, phi) -> (d sigma - S phi, d~ phi). The BGG complex at
    J is the subquotient Gamma / Delta of T that eliminates the top spaces after J and the bottom
    spaces before J. With S^i injective for i < J and onto modulo d for i >= J
    (R(d^i) + R(S^i) = V^(i+1), in particular S^i surjective): FEEC.bggCohomology, the inclusion
    Gamma -> T and the projection Gamma -> Gamma / Delta are quasi-isomorphisms (the BGG complex has
    the cohomology of the twisted complex), T is an extension 0 -> V -> T -> V~ -> 0, and the BGG
    complex is exact when both rows are. FEEC.bggIdentification, for every S and J: Gamma / Delta
    is the output complex (24)-(26), by cochain maps Gamma / Delta -> V / R(S) and N(S) ->
    Gamma / Delta bijective before and after J (and at J when S^J is bijective), with the
    differential d~ (S^J)^(-1) d at J. FEEC.bggFinrank, over a field, Theorem 6: where both rows
    have finite-dimensional cohomology, so does the BGG complex, dim H^i <= dim H^i(V) + dim H^i(V~),
    with equality iff S^(i-1) and S^i induce zero on cohomology (27). FEEC.bggSum, Theorem 7 and
    Proposition 1: if S = dK - Kd~ (28), S induces zero on cohomology and (omega, mu) ->
    (omega + K mu, mu) is an isomorphism from the sum complex onto T, with no further hypothesis;
    under the hypotheses of FEEC.bggCohomology at any J, the BGG complex has the cohomology of the
    sum complex. FEEC.bggExplicit, (30), Theorem 7 and Corollary 1: under (28), with S^i injective
    for i <= J and right inverses t^(i+1) of S^i for i >= J ((23) with the inverses of (29)), the
    explicit map FEEC.BGG.sumMap, (omega, mu) -> [omega + K mu] up to J and
    (omega, mu) -> P(d~ t omega + (I + d~ t K) mu) after J with P = 1 - tS, is a cochain map from
    the sum complex to the BGG complex inducing an isomorphism on cohomology, and it carries
    cohomology representatives H x H~ of the rows to cohomology representatives of the BGG
    complex (31). FEEC.bggHilbert, Theorem 6 for bounded Hilbert complexes with S^i bounded below
    for i < J and onto modulo d for i >= J: Gamma^i and Delta^i are closed in V^i x V~^i; for the
    quotient norm of the l2 norm of V^i (+) V~^i, y -> [y] is an isometry of the closed subspace
    Gamma^i (-) Delta^i = Gamma^i ∩ (Delta^i)^perp onto Gamma^i / Delta^i (so the quotient norm
    is a Hilbert norm), the differentials [(sigma, phi)] -> [(d sigma - s phi, d~ phi)] are
    bounded for it, and they have closed range where both rows have finite-dimensional
    cohomology: the output complex is a bounded Hilbert complex.
    FEEC.bggOrthogonal, (24)-(26), (29)-(30) and Theorem 7 in the orthogonal form of the paper,
    for bounded Hilbert complexes under (23) with S^i of closed range for i < J: with the
    Moore-Penrose inverses t = s^dagger (FEEC.BGG.moorePenrose), the output complex on
    R(S^(i-1))^perp (i <= J) and N(S^i) (i > J) with differentials P_(R^perp) d, d~ (S^J)^dagger d,
    d~ is a complex isomorphic to the BGG complex, and the map (30), (omega, mu) ->
    P_(R^perp)(omega + K mu) up to J and P_N(d~ t omega + (I + d~ t K) mu) after J, is a
    quasi-isomorphism from the sum complex to it which carries cohomology representatives H x H~
    of the rows to cohomology representatives of the output complex (Corollary 1, (31)).
    The statement is self-contained over Mathlib (ModuleCat, CochainComplex, QuasiIso,
    ShortComplex.ShortExact, Module.finrank, IsIso, ContinuousLinearMap, AntilipschitzWith,
    IsClosed, WithLp, the quotient norm of Submodule quotients, LinearIsometryEquiv,
    Submodule.orthogonal, Submodule.starProjection, ContinuousLinearEquiv.ofBijective);
    the proof is the library Feec of this repository (Feec.BGG.Data.quasiIso_Γ,
    Feec.BGG.Data.quasiIso_derived, Feec.BGG.Data.finrank_twistComplex_homology_eq_iff,
    Feec.BGG.Data.bggProj, Feec.BGG.Data.quasiIso_of_Γι_comp,
    HomologicalComplex.Represents.map, Feec.BGG.BoundedData.isClosed_bgg_Δ,
    Feec.HilbertComplex.Subquotient.toQuotEquiv, quotD_toQuot, cohomologyEquiv,
    Feec.HilbertComplex.closedRangeAt_of_finiteDimensional_cohomology,
    Feec.BGG.BoundedData.quasiIso_orthSumMap, Feec.BGG.BoundedData.isIso_toOrth,
    Feec.BGG.BoundedData.orth_represents).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
