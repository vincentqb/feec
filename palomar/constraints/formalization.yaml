fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms and of the minimal exterior derivative as in
    palomar/fem (the shared blocks FormField, forms and dMin); W~^k = L^2(Omega; Lambda^k) (x) R^3
    is the l^2 sum of three copies (L2Vec); the fields of a state are read as matrices,
    E_ab = (u_a)_{dx_b}, B_ai = (-1)^i (rho_a)_{{i}^c}; IsTSD is symmetric, trace-free and weakly
    divergence-free against test functions of Omega (no boundary condition); IsTSD_0 adds
    vanishing normal traces, tested against all C^1 functions on R^3.
    (2) Operators are relations (graphs), strong solutions those of the shared IsStrongSolution.
    Mathlib has no C_0-semigroups: an evolution (IsEvolution) is a family of bounded linear
    operators over the scalars with S 0 = 1 whose orbits from D(A) are strong solutions on I (no
    group or semigroup law, no strong continuity off D(A) assumed);
    FEEC.constraint_propagation gives existence and uniqueness of the strong solutions and of the
    evolution, on R for skew-adjoint and at t >= 0 for m-dissipative generators, with its group
    (semigroup) law, and the verdicts are stated for every evolution with, where needed, its
    existence. The invariant core is
    defined for groups (all t in R); for the absorbing semigroup the verdict is the failure of
    forward invariance. Over C the real structure of a space, for the derivatives in time, is any
    NormedSpace R instance (it is the restriction of scalars, RCLike.isScalarTower_of_normedSpace
    in the proof), as in palomar/feec. The three spaces of a short complex lie in one universe, as
    the spaces of a Hilbert complex.
    (3) The system (4.14) is a relation on the product of the three spaces (IsHodgeWave), not an
    operator on their l^2 sum: its skew-adjointness on the l^2 sum (the hypothesis under which
    PropagationCriterion.group identifies K* as the largest reducing subspace of K) is proved in
    Feec and not stated in the challenge; the failure of reduction is stated directly, as the
    failure of P_K D(L) in D(L): for a test field u (in D(d^1) and D(d^0*)), the orthogonal
    projection v of u onto L^2(TSD) (characterized as the TSD field with u - v orthogonal to
    L^2(TSD)) is not in H°(curl), so P_K (0, u, 0) is not in D(L); for every boundary condition
    containing n x E = 0 the same holds for some u with (0, u, 0) in D(L), a witness that depends
    on the complex (a test field need not lie in D(d^1)). There the restriction d^1 <= the minimal
    curl serves only to read v outside H°(curl) as P_K (0, u, 0) outside D(L): the proof gives v
    outside H°(curl) for every short Hilbert complex on these spaces. In the magnetic slot the
    failure is stated through the Hodge wave relation itself: for every boundary condition
    containing n x E = 0, the orthogonal projection rho' of some rho with (0, 0, rho) in D(L)
    (characterized as v) has (0, 0, rho') outside D(L), that is rho' outside D(d^1*); the proof
    is by the closed graph theorem (P_{L^2(TSD)} would be bounded on the graph of d^1*, while
    smooth curl-free fields E_t have |curl P E_t| = (t / sqrt 2) |E_t|), so the witness is not
    explicit. For the electric boundary conditions the challenge also states the H(curl) form,
    P_{L^2(TSD)} H(curl) not in H(curl), for matrix fields with rows in H Lambda^1; that these
    are, through the Hodge star of the rows, the magnetic fields of the magnetic slot of D(L) of
    (4.14) (the adjoint of the minimal curl is the maximal curl) is proved in Feec and stated
    only in the docstring. The absorbing operator is stated as the graph of an m-dissipative
    operator, a literal instance of the criterion.
    (4) Electric boundary conditions (named after n x E = 0): vanishing tangential traces (minimal
    exterior derivatives, the complex H°Lambda; essential boundary conditions in the sense of the
    Hodge Laplacian, imposed in the spaces, not the natural ones of H Lambda) in every row, for
    (4.14) and both rows of (6.1). The invariant core of (4.14) is described as
    {0} x S_1* x S_2*, the largest reducing subcomplex of the complex inside K (maximal among the
    products {0} x S_1' x S_2' of subspaces of TSD fields satisfying IsReducingSubcomplex), with
    explicit properties (S_1* within L^2(TSD_0), strictness through the TSD fields
    diag(1, -1, 0) and beta in Feec's proof, a nonzero stationary datum in S_2*), not by a formula
    for S_1*, S_2* on general domains (none is known). The datum beta is given
    almost everywhere by its formula; the boundary conditions containing n x E = 0 are the short
    Hilbert complexes W^0 -> L^2 Lambda^1 (x) R^3 -> L^2 Lambda^2 (x) R^3 (closed, densely
    defined, d^1 d^0 = 0) with d^1 <= the row-wise minimal exterior derivative (the order of
    LinearPMap: D(d^1) in H°(curl), d^1 = curl there), W^0 any real Hilbert space in Type.
    Besides (4.14) they contain, with W^0 = 0 (so d^0 = 0), the first-order system
    E' = -curl* B, B' = curl E with n x E = 0; in the natural members d^1 is the minimal curl
    itself (the other d^1 restrict it to subspaces of H°(curl) closed in its graph norm and dense
    in L^2), and they differ in W^0 and d^0, which change D(L). For the density the class is every
    restriction d^1 of the minimal exterior derivative; its only natural member is the minimal
    curl, and the general statement follows from that case, D(d^1) being in H°(curl). The
    obstruction for (6.1) is the explicit datum (0, 0, 0, *beta) (in the proof) with existence of
    solutions.
    (5) Star-shaped domains: with respect to a ball of the sup norm (equivalently of the Euclidean
    norm). The unit ball is Euclidean; eigenfields (IsEigenfield) are u in H°(curl) with
    curl u in D(curl*) and curl* curl u = xi^2 u (the adjoint of Mathlib's LinearPMap); curl u
    outside H°(curl) is stated as: no w in H°Lambda^1 (x) R^3 has the electric field of w equal to
    the magnetic field of curl u. The ball clause asks a representative C^2 on a neighbourhood of
    the closed ball.
    (6) Absorbing boundary conditions: on the cube (0, 1/2)^3 only, for the first-order system
    without the gauge sigma; the energy space is the closure of the triples (Phi, curl Phi, Phi_tau)
    of C^1 fields, with boundary values on the six faces parametrized by the square (0, 1/2)^2
    (surface measure); the operator is the impedance operator of Monk §4.6 (whether the energy
    space consists of all Green triples is not used). The verdict asserts, for every T > 0, some
    TSD datum leaving L^2(TSD) x L^2(TSD) at some time t in [0, T] (from Feec's loss at some
    t >= 0 by the semigroup law: kept on [0, T], the constraint would be kept by
    S(t) = S(t / n)^n for every t >= 0); the datum need not lie in D(A) (Feec's proof: an
    invariant K would make D(A) and K intersect densely in K, which a boundary functional
    excludes).
    (7) Mirror boundary conditions: on the cube Q only, for the system (4.14) (the bottom row of
    the mirror data: component a with vanishing tangential traces on the faces normal to e_a,
    dPart) and for the system (6.1) (top row d_max, bottom row as for (4.14)), as in
    palomar/einsteinbianchi; one verdict (MirrorVerdict) for a system given by its graph and a
    constraint, asserted for the two. Existence of strong solutions is stated from data of D(L)
    in the constraint, and no invariant core is stated (Feec's K* = K is for its constraint, the
    fields whose reflection-symmetric extensions are TSD, which contains the TSD data of D(L), not
    for the K of the challenge). In Feec the theorems are proved for complex Hilbert complexes of
    matrix fields defined by the Fourier series of the reflection-symmetric extensions, and the
    Solution identifies the challenge's real states with the real parts of their constrained
    states.
    (8) The domain of dependence (depDomain) is the set of centres of the Euclidean balls of
    radii r > t inside Omega, written out (the points of R^3 are Fin 3 -> R with the sup norm),
    meant for t >= 0 (for t < 0 it is R^3); IsSymTFOn asks symmetry and trace-freeness at almost
    every point of a set for the representatives of the L^2 entries (independent of them on
    subsets of Omega), and IsDivFree is the last condition of IsTSD, the Gauss law. The clause
    for the electric boundary conditions on every open set (TSDVerdict.interior) is stated for
    strong solutions of (4.14) (data in D(L) and K); on R^3 it gives that strong solutions from K
    stay in K, not that the evolution keeps K for data outside D(L). It is not stated for the
    other boundary conditions containing n x E = 0, whose d^0 need not be a differential
    operator. That the solutions from (0, E_0, beta), E_0 TSD, leave K in the boundary layer is a
    corollary of ElectricVerdict.beta and of this clause, not a separate statement. The absorbing
    clause holds for every evolution and every TSD datum, in D(A) or not. On a bounded Omega the
    domain of dependence is empty once t reaches the inradius of Omega (1/4 on the cube), so the
    two clauses locate the losses at the earlier times, where ElectricVerdict.beta and
    AbsorbingVerdict.lost give losses (within every [0, T], T > 0).

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the Challenge statement (the two compared theorems and their
    definitions, 2026-11-18, new), and its changes of 2026-11-23: ElectricVerdict.projection,
    renamed projection_electric, has a second conjunct for every boundary condition containing
    n x E = 0, ElectricVerdict.not_dense
    is stated for every restriction d^1 of the minimal curl (the former statement its instance
    d^1 = the minimal curl), and ElectricVerdict.beta states (0, 0, beta) in D(L) for every such
    boundary condition (formerly for (4.14) only, now its instance); then the new clauses
    ElectricVerdict.projection_magnetic (the magnetic slot), TSDVerdict.interior (every open set,
    R^3 included) and AbsorbingVerdict.interior, with the new definitions IsDivFree, IsSymTFOn
    and depDomain, and AbsorbingVerdict.lost within every interval [0, T] (formerly at some
    t >= 0, which follows).
    FEEC.constraint_propagation states the criterion formerly in
    the verdict of palomar/feec (there for the windows of Hilbert complexes approximated by
    subcomplex families; here for every window, and for every skew-adjoint or m-dissipative
    generator), and FEEC.tsd_boundary_conditions contains the statements formerly compared in
    palomar/einsteinbianchi as FEEC.tsd_not_propagates (ElectricVerdict.weakSymmetry),
    FEEC.box_stationary (BoxVerdict.forward; its existence clause through
    ElectricVerdict.evolution, an evolution on R on every bounded open set) and
    FEEC.mirror_tsd_propagates (the (6.1) instance of MirrorVerdict), the same statements over
    the same definitions. New (2026-11-24, not yet reviewed by the author): the mirror verdict is
    one structure MirrorVerdict A K for a system A and a constraint K, asserted for (6.1) (the
    former statement, unchanged up to the membership notation) and for the system (4.14) with
    the mirror boundary conditions (the new definition gradCurlMirror).
    The identifiers of the sources other than the thesis were checked against Crossref
    (2026-11-18). Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only) and an independent AI review. No external
    mathematical review.

