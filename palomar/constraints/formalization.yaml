status:
  scope: >-
    Formalized and compared: FEEC.constraint_propagation (every real Hilbert space, every densely
    defined skew-adjoint L, every m-dissipative A, every closed subspace K; every short Hilbert
    complex and every reducing subcomplex) and
    FEEC.tsd_boundary_conditions (the natural boundary conditions on every nonempty bounded open
    set of R^3, on those star-shaped with respect to a ball, on the unit ball and on every open
    box, for the system (4.14), and on every nonempty bounded open set for the system (6.1); the
    absorbing boundary conditions on the cube; the mirror boundary conditions on the cube for the
    system (6.1)). The Challenge is 589 lines. Open, and not claimed: that only stationary data
    keep TSD on every bounded domain (proved on boxes; on the ball it would follow from the
    absence of TSD eigenfields u with curl u outside H°(curl), excluded here in the class of
    fields C^2 up to the boundary; Feec proves it on the ball only under an elliptic regularity
    hypothesis, Feec.Counterexamples.BallEigenfields.coreSub_le_stationary_ball_of_maxwellRegularity,
    not compared). Not compared here (proved in Feec): the same obstruction for every short
    complex with d_1 inside the minimal curl (any W_0 and d_0); the violation confined to the
    boundary layer by finite speed of propagation (beta_violation_boundary_layer); the sym-curl
    system (4.19) on every bounded domain and every ball (BoundedSymTSD, EveryBallSymTSD); the
    absorbing semigroup's interior equations, the propagation of the Gauss laws and of TSD in the
    domain of dependence (absorbingSemigroup_divFree, absorbingSemigroup_symTF_depDomain); the
    mirror boundary conditions for the system (4.14) on every open box, where K* = K
    (Feec.Models.Box.Mirror.invariantCore_eqBox), and on the whole space and the torus
    (Feec.EinsteinBianchi.euclidean_tsd_propagates and siblings); the convergence of the
    weak-symmetry method to the constrained or unconstrained solution (palomar/einsteinbianchi).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

