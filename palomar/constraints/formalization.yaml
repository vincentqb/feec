  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote most Lean code and proofs under the author's direction, in git worktrees,
        each change gated by a full build with zero errors and warnings, an axiom audit, naming,
        layering and citation checks and an independent agent review before merging.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine and API"
      prompting_notes: >-
        The author set the mathematical goals (the thesis and the literature), the statement design
        and the review standard; agents proposed and proved lemmas.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design, review of definitions and of the challenge statement."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human-directed, AI-written development. The Challenge statement and its definitions were
    written by an AI agent for this submission, to be reviewed by the author; the Solution
    identifies them with the definitions of the library Feec and applies its theorems:
    Solution/Engine.lean (evolutions and strong solutions as Feec's C_0-groups and semigroups
    over R or C, uniqueness of evolutions, the reducing criteria, Stone's group as the
    Lumer-Phillips semigroup of a skew-adjoint L), Solution/Window.lean (the challenge's Hilbert
    complexes and windows as Feec's, as in palomar/feec), Solution/Subcomplex.lean (the
    challenge's short complexes as Feec's ShortHilbertComplex, reducing subcomplexes),
    Solution/Box.lean and GradCurl.lean (the challenge's Hodge wave operator of (4.14) carried to
    Feec's gradCurl complex by unitary maps; every evolution is Feec's wave group; the invariant
    core is Feec's coreSub; the adjoint of the curl, H°(curl), H(curl), L^2(TSD_0) and the
    eigenfields through the fields), Solution/Verdicts.lean (the verdicts of the electric
    boundary conditions), Solution/Absorbing.lean (the energy space and
    the absorbing relation as Feec's impedance operator), Solution/Proxy.lean, Bounded.lean,
    Wave.lean, Wedge.lean, Forms.lean (fields, the system (6.1) and its datum, from
    palomar/einsteinbianchi), MirrorData.lean, MirrorTSD.lean, MirrorState.lean,
    MirrorForward.lean, MirrorChain.lean, MirrorProp.lean (TSD states as the real parts of the
    constrained states of Feec's complex mirror complex on Q, from palomar/einsteinbianchi).

fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms and of the minimal exterior derivative as in
    palomar/fem (the shared blocks FormField, forms and dMin); W~^k = L^2(Omega; Lambda^k) (x) R^3
    is the l^2 sum of three copies (L2Vec); the fields of a state are read as matrices,
    E_ab = (u_a)_{dx_b}, B_ai = (-1)^i (rho_a)_{{i}^c}; IsTSD is symmetric, trace-free and weakly
    divergence-free against test functions of Omega (no boundary condition); IsTSD_0 adds
    vanishing normal traces, tested against all C^1 functions on R^3.
    (2) Operators are relations (graphs), strong solutions those of the shared IsStrongSolution.
    Mathlib has no C_0-semigroups: an evolution (IsEvolution) is a family of bounded linear
    operators over the scalars with S 0 = 1 whose orbits from D(A) are strong solutions on I (no
    group or semigroup law, no strong continuity off D(A) assumed);
    FEEC.constraint_propagation gives existence and uniqueness of the strong solutions and of the
    evolution, on R for skew-adjoint and at t >= 0 for m-dissipative generators, with its group
    (semigroup) law, and the verdicts are stated for every evolution with, where needed, its
    existence. The invariant core is
    defined for groups (all t in R); for the absorbing semigroup the verdict is the failure of
    forward invariance. Over C the real structure of a space, for the derivatives in time, is any
    NormedSpace R instance (it is the restriction of scalars, RCLike.isScalarTower_of_normedSpace
    in the proof), as in palomar/feec. The three spaces of a short complex lie in one universe, as
    the spaces of a Hilbert complex.
    (3) The system (4.14) is a relation on the product of the three spaces (IsHodgeWave), not an
    operator on their l^2 sum: its skew-adjointness on the l^2 sum (the hypothesis under which
    PropagationCriterion.group identifies K* as the largest reducing subspace of K) is proved in
    Feec and not stated in the challenge; the failure of reduction is stated directly, as the
    failure of P_K D(L) in D(L): for a test field u (in D(d^1) and D(d^0*)), the orthogonal
    projection v of u onto L^2(TSD) (characterized as the TSD field with u - v orthogonal to
    L^2(TSD)) is not in H°(curl), so P_K (0, u, 0) is not in D(L). The absorbing operator is stated as the graph of
    an m-dissipative operator, a literal instance of the criterion.
    (4) Electric boundary conditions (named after n x E = 0): vanishing tangential traces (minimal
    exterior derivatives, the complex H°Lambda; essential boundary conditions in the sense of the
    Hodge Laplacian, imposed in the spaces, not the natural ones of H Lambda) in every row, for
    (4.14) and both rows of (6.1). The invariant core of (4.14) is described as
    {0} x S_1* x S_2*, the largest reducing subcomplex of the complex inside K (maximal among the
    products {0} x S_1' x S_2' of subspaces of TSD fields satisfying IsReducingSubcomplex), with
    explicit properties (S_1* within L^2(TSD_0), strictness through the TSD fields
    diag(1, -1, 0) and beta in Feec's proof, a nonzero stationary datum in S_2*), not by a formula
    for S_1*, S_2* on general domains (none is known). The datum beta is given
    almost everywhere by its formula; the boundary conditions containing n x E = 0 are the short
    Hilbert complexes W^0 -> L^2 Lambda^1 (x) R^3 -> L^2 Lambda^2 (x) R^3 (closed, densely
    defined, d^1 d^0 = 0) with d^1 <= the row-wise minimal exterior derivative (the order of
    LinearPMap: D(d^1) in H°(curl), d^1 = curl there), W^0 any real Hilbert space in Type. The
    obstruction for (6.1) is the explicit datum (0, 0, 0, *beta) (in the proof) with existence of
    solutions.
    (5) Star-shaped domains: with respect to a ball of the sup norm (equivalently of the Euclidean
    norm). The unit ball is Euclidean; eigenfields (IsEigenfield) are u in H°(curl) with
    curl u in D(curl*) and curl* curl u = xi^2 u (the adjoint of Mathlib's LinearPMap); curl u
    outside H°(curl) is stated as: no w in H°Lambda^1 (x) R^3 has the electric field of w equal to
    the magnetic field of curl u. The ball clause asks a representative C^2 on a neighbourhood of
    the closed ball.
    (6) Absorbing boundary conditions: on the cube (0, 1/2)^3 only, for the first-order system
    without the gauge sigma; the energy space is the closure of the triples (Phi, curl Phi, Phi_tau)
    of C^1 fields, with boundary values on the six faces parametrized by the square (0, 1/2)^2
    (surface measure); the operator is the impedance operator of Monk §4.6 (whether the energy
    space consists of all Green triples is not used). The verdict asserts some TSD datum leaving
    L^2(TSD) x L^2(TSD) at some time t >= 0; the datum need not lie in D(A) (Feec's proof: an
    invariant K would make D(A) and K intersect densely in K, which a boundary functional
    excludes).
    (7) Mirror boundary conditions: on the cube Q only and for the system (6.1) (top row d_max;
    component a of the bottom row with vanishing tangential traces on the faces normal to e_a,
    dPart), as in palomar/einsteinbianchi: existence of strong solutions is stated from TSD data
    of D(L); in Feec the theorem is proved for a complex Hilbert complex of matrix fields defined
    by the Fourier series of the reflection-symmetric extensions, and the Solution identifies the
    challenge's real states with the real parts of its constrained states.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the Challenge statement (the two compared theorems and their
    definitions, 2026-11-18, new). FEEC.constraint_propagation states the criterion formerly in
    the verdict of palomar/feec (there for the windows of Hilbert complexes approximated by
    subcomplex families; here for every window, and for every skew-adjoint or m-dissipative
    generator), and FEEC.tsd_boundary_conditions contains the statements formerly compared in
    palomar/einsteinbianchi as FEEC.tsd_not_propagates (ElectricVerdict.weakSymmetry),
    FEEC.box_stationary (BoxVerdict.forward; its existence clause through
    ElectricVerdict.evolution, an evolution on R on every bounded open set) and
    FEEC.mirror_tsd_propagates (MirrorVerdict), the same statements over the same definitions.
    The identifiers of the sources other than the thesis were checked against Crossref
    (2026-11-18). Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only) and an independent AI review. No external
    mathematical review.

alignment:
  namespace: "FEEC"
  statements:
    - source: "[Kato1995] §III.5.6; [Pazy1983] §1.4, §1.10; [QuennevilleBelair2015] Thm 4.6, Prop 4.16"
      lean: "FEEC.constraint_propagation"
      module: "Challenge"
      status: "proved"
      note: >-
        Stone's group LinearPMap.IsSkewAdjoint.group with
        Feec.C0Group.IsIsometric.isReducing_iff_invariant, isReducing_invariantCore and
        le_invariantCore_of_isReducing; the Lumer-Phillips semigroup
        LinearPMap.IsMDissipative.semigroup with LinearPMap.IsMDissipative.isReducing_iff, also
        for the skew-adjoint L (LinearPMap.IsSkewAdjoint.isMDissipative); uniqueness by
        Feec.C0Semigroup.isStrongSolution_unique (Solution/Engine.lean); windows by
        Feec.HilbertComplex.window, dense_wave_domain, isSkewAdjoint_wave,
        isMDissipative_neg_hodgeLaplacian and ReducingSubcomplex.isReducing_wave
        (Solution/Window.lean); reducing subcomplexes of the short complex of the challenge by
        Feec.HilbertComplex.ReducingSubcomplex.propagates (Solution/Subcomplex.lean).
    - source: "[QuennevilleBelair2015] §3.4, §4.10 ((4.14), Prop 4.17), §6.1, §6.3"
      lean: "FEEC.tsd_boundary_conditions"
      module: "Challenge"
      status: "proved"
      note: >-
        Electric boundary conditions: Feec.Counterexamples.BoundedDomainTSD (invariantCore_tsd,
        betaL2_not_propagates, on every short complex whose d_1 restricts the minimal curl
        conjugated to the fields by Feec.ShortHilbertComplex.conj, exists_projTSD_not_mem_domain,
        not_dense_tsd_inter, density_dichotomy, both halves, H(curl) through
        Feec.Domain.ConstCoeffOp.maximal_ofMatrixCLM_of_comm and curlOp_formalAdj_apply),
        Feec.Models.BoundedDomain.not_coreSub_le_stationary_iff with
        Feec.Models.StarShaped.StarDomain.eigenDense_gradCurl,
        Feec.Counterexamples.BallEigenfields.eq_zero_of_isEigenfield_of_contDiff_ball,
        Feec.Counterexamples.BoxStationary (mem_invariantCore_tsd_iff_box,
        forward_iff_stationary_box), Feec.Counterexamples.BoundedBGG for (6.1)
        (Solution/GradCurl.lean, Verdicts.lean, Bounded.lean, Box.lean); absorbing:
        Feec.Models.Cube.Absorbing (isMDissipative_absorbing, exists_inner_absorbing_neg,
        not_invariant_tsdPair) (Solution/Absorbing.lean); mirror: Feec.Models.Cube.MirrorBGG
        (propagatesQ, reducingSubcomplexQ) and Feec.Models.Cube.MirrorWeakSymmetry.cosDatum
        (Solution/Mirror*.lean).

acknowledgements: >-
  Mathlib and the Lean FRO; the semigroup, numerical relativity and FEEC literature cited above.
