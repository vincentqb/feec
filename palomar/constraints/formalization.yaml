status:
  scope: >-
    Formalized and compared: FEEC.constraint_propagation (every Hilbert space over R or C, every
    densely defined skew-adjoint L, every m-dissipative A, every closed subspace K; every window of
    every Hilbert complex over R or C and every reducing subcomplex; every real short Hilbert
    complex and every reducing subcomplex) and
    FEEC.tsd_boundary_conditions (the electric boundary conditions on every open set of R^3, R^3
    included (the domain of dependence), on every nonempty bounded open set, on those
    star-shaped with respect to a ball, on the unit ball and on every open box, for the system
    (4.14), and on every nonempty bounded open set for the system (6.1); for every boundary
    condition containing n x E = 0, on every nonempty bounded open set, the datum (0, E_0, beta),
    the projection hypothesis in the electric and in the magnetic slot, and the density; the
    absorbing boundary conditions on the cube, with the domain of dependence; the mirror
    boundary conditions on the cube for the systems (4.14) and (6.1)). The Challenge is 853
    lines. Open,
    and not claimed: that only stationary data
    keep TSD on every bounded domain (proved on boxes; on the ball it would follow from the
    absence of TSD eigenfields u with curl u outside H°(curl), excluded here in the class of
    fields C^2 up to the boundary; Feec proves it on the ball only under the boundary regularity
    of Maxwell eigenfields, absent from Mathlib,
    Feec.Counterexamples.BallEigenDense.coreSub_le_stationary_ball3_of_maxwellRegularity, not
    compared). Not compared here (proved in Feec): the sym-curl system (4.19) on every bounded
    domain and every ball (BoundedSymTSD, EveryBallSymTSD), another system; the mirror boundary
    conditions for the system (4.14) on every open box (Feec.Models.Box.Mirror.propagatesBox,
    existsUnique_memBox, exists_nonstationaryBox), whose comparison needs mirror operators on
    boxes in the challenge (dPart is defined on the cube) and the real forms bridge on boxes, and
    for the system (6.1) on boxes (no BGG mirror complex on boxes in Feec); the invariant core
    of the mirror complexes (Feec.Models.Cube.Mirror.invariantCore_eqQ,
    Feec.Models.Box.Mirror.invariantCore_eqBox: K* = K for Feec's constraint, the fields whose
    reflection-symmetric extensions are TSD; it consists of TSD fields, Mirror.mem_tsdQ_one and
    mem_tsdQ_two, and contains the TSD fields of the domains of curl and curl*,
    Mirror.mem_tsdQ_one_of_tsd and mem_tsdQ_two_of_tsd); the
    torus (Feec.EinsteinBianchi.torus_tsd_propagates), no boundary condition; the unboundedness
    of the projection onto L^2(TSD) in the H(curl) graph norm (projection_unbounded), the reason
    for the magnetic failure; the convergence of the weak-symmetry method to the constrained or
    unconstrained solution (palomar/einsteinbianchi).
