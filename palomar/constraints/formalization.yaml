# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the boundary conditions that keep, or lose,
# the TSD constraints of the linearized Einstein-Bianchi equations (`palomar/constraints/`): the
# criterion (propagation is reduction, the invariant core) and the verdict of each boundary
# condition.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: >-
    Which boundary conditions keep the TSD constraints of the linearized Einstein-Bianchi
    equations
  description: >-
    The linearized Einstein-Bianchi system evolves the electric and magnetic parts E, B of the
    linearized Weyl tensor and describes gravitational waves only while E and B are TSD
    (symmetric, trace-free, divergence-free). It is the Hodge wave equation U' = L U of a Hilbert
    complex whose operators carry the boundary conditions; the thesis (§4.10, Prop 4.17; §6.1)
    studies whether TSD data stay TSD, the question of constraint-preserving boundary conditions
    of the initial boundary value problem of general relativity (Friedrich-Nagy, Kreiss-Winicour,
    Calabrese-Pullin-Reula-Sarbach-Tiglio). Stated over Mathlib in the vocabulary of differential
    forms, with the definitions of forms and minimal exterior derivatives (shared with palomar/fem,
    palomar/waves and palomar/einsteinbianchi, the form fields also with palomar/shapes), Hilbert
    complexes (with palomar/feec, palomar/fem, palomar/crimes and palomar/waves), their windows
    (Total, totalDomain, totalD, wave; with palomar/feec, palomar/crimes and palomar/waves), the
    square sq of an operator (with palomar/feec and palomar/crimes) and strong solutions (with
    palomar/feec, palomar/crimes and palomar/einsteinbianchi), the canonical blocks of
    palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate, and the
    Einstein-Bianchi vocabulary shared with palomar/einsteinbianchi as canonical blocks too: the
    vector forms (L2Vec, vecOp), the fields (mat1, mat2, IsTSD), the system (6.1) (wedge,
    WeakSymmetryData with IsWave, FormData, bggData), its constraint (IsTSDState) and the mirror
    data (dPart, mirrorData). Operators are given by their graphs (relations), an evolution S of
    u' = A u on I (IsEvolution: bounded linear S t over the scalars, S 0 = 1, every orbit from
    D(A) a strong solution on I; no group law assumed) and the invariant core
    K* = {x | S t x in K for all t} (invariantCore) are the common notions of the two compared
    theorems, both structures with one documented field per clause.
    FEEC.constraint_propagation : FEEC.PropagationCriterion, the criterion (Kato III.5.6), over
    the scalars R or C: (group) a densely defined skew-adjoint L has a unique evolution on R, a
    group of isometries (a unitary group, Stone), whose orbits are the strong solutions from
    D(L); a closed subspace K reduces L (P_K D(L) in D(L), L P_K = P_K L) iff S t K is in K for
    all t, iff S t, t >= 0, keeps K and its orthogonal complement; and K* is a closed subspace
    reducing L containing every closed subspace of K that reduces L. (semigroup) An m-dissipative
    A (re <A x, x> <= 0, 1 - A onto) has an evolution on [0, infinity), unique at t >= 0, a
    semigroup of contractions (Lumer-Phillips), whose orbits are the strong solutions, and K
    reduces A iff S t, t >= 0, keeps K and its orthogonal complement.
    (window) On every window [a, a + m) of every Hilbert complex over R or C the Hodge wave
    operator L = d - d* is densely defined and skew-adjoint (the thesis' Thm 4.6), its square
    L^2 = -Delta is m-dissipative, and every evolution of L keeps the product of a reducing
    subcomplex, closed Z^i with P_{Z^i} D(d i j) in D(d i j) and d i j P_{Z^i} = P_{Z^j} d i j
    (the thesis' Prop 4.16). (shortComplex) For a real short Hilbert complex of closed densely
    defined d^0, d^1 (d^1 d^0 = 0) and a reducing subcomplex Z^0 x Z^1 x Z^2, every strong
    solution of the Hodge wave equation (in the relation form of the systems below) starting in
    Z^0 x Z^1 x Z^2 stays in it. So the question for each boundary condition is K*. These are the
    fields propagates_iff, invariantCore, subcomplex and reducing_iff of the former verdict of
    palomar/feec, compared here at least as generally: propagates_iff and invariantCore by group
    with window (the wave group of every window, unique), subcomplex by window, reducing_iff by
    group (the wave group) and by semigroup with window (the heat semigroup of every window, also
    that of the former verdict with variational crimes), for every window of every Hilbert
    complex over R or C, without the approximation hypotheses under which palomar/feec stated
    them. The evolution of the former verdict is the one here: its orbits from D(L) are strong
    solutions on every [0, T], so it agrees with the unique evolution at t >= 0, and at t < 0 by
    the group laws of both.
    FEEC.tsd_boundary_conditions : FEEC.TSDVerdict, the verdict of each boundary condition, one
    field per boundary condition and domain class (ElectricVerdict, StarShapedVerdict, ball,
    BoxVerdict, AbsorbingVerdict, MirrorVerdict), for the system (4.14)
    on states (sigma, u, rho) (E = rows u_a, B = rows of *rho_a), the Hodge wave equation of
    H°Lambda^0 (x) R^3 -> H°Lambda^1 (x) R^3 -> L^2 Lambda^2 (x) R^3 (gradCurlWave; vector
    proxies H°^1 -> H°(curl) -> L^2, grad and curl of the rows), constraint
    K = {0} x L^2(TSD) x L^2(TSD) (tsdConstraint):
    (electric boundary conditions sigma = 0, n x E = 0, those of the minimal complex: every
    nonempty bounded open Omega in R^3, no regularity of the boundary) the complex is a short
    Hilbert complex (closed, densely defined, d^1 d^0 = 0), the system has an evolution, and for
    every one K* = {0} x S_1* x S_2* with closed S_1*, S_2* of TSD fields, the largest reducing
    subcomplex of the complex in K (IsReducingSubcomplex; so PropagationCriterion.shortComplex
    applies to it), S_1* within L^2(TSD_0) (rows weakly divergence-free with vanishing normal
    trace; zero mean), both strictly smaller than L^2(TSD), S_2* containing a nonzero stationary
    datum; from (0, E_0, beta), beta = x_3 (e_1 e_2^T + e_2 e_1^T), TSD with (0, 0, beta) in
    D(L), every strong solution on [0, T], T > 0, has a non-TSD electric field at some time, for
    every boundary condition containing n x E = 0 (every short Hilbert complex
    W^0 -> L^2 Lambda^1 (x) R^3 -> L^2 Lambda^2 (x) R^3 whose d^1 is a restriction of the minimal
    curl, W^0 and d^0 arbitrary, the complex of (4.14) among them);
    K does not reduce L, already because P_K D(L) is not in D(L) (the orthogonal projection onto
    L^2(TSD) of some test field leaves H°(curl)); L^2(TSD) and H°(curl) intersect in a non-dense
    subspace of L^2(TSD); and for the system (6.1) of the complex with weak symmetry of
    Ch. 5-6 (the same boundary conditions in both rows) the TSD datum (0, 0, 0, *beta) of D(L)
    has strong solutions on every [0, T], every one of which has a non-TSD E and a non-symmetric
    B at some times;
    (domains star-shaped with respect to a ball) L^2(TSD) and H(curl) (rows in H Lambda^1)
    intersect in a dense subspace of L^2(TSD), while the closure of L^2(TSD) and H°(curl) is
    L^2(TSD_0), and K* consists of stationary data iff no nonzero TSD eigenfield u of curl* curl
    with frequency xi > 0 has curl u outside H°(curl);
    (the unit ball) every TSD eigenfield (xi != 0) with a representative C^2 on a neighbourhood of
    the closed ball vanishes;
    (every open box) K* = K intersected with N(L), with vanishing electric field: only stationary
    data keep the constraint; and for all subspaces S_1, S_2 of TSD fields a strong solution on
    [0, infinity) stays in {0} x S_1 x S_2 iff it starts there with L U(0) = 0;
    (absorbing, Silver-Muller, boundary conditions n x E_i + (B_i)_tau = 0 on the cube) the
    first-order system E' = -curl B, B' = curl E on states (E, B) (absorbing, with its energy
    space: the closure of the triples (Phi, curl Phi, Phi_tau) of C^1 matrix fields) is the graph
    of an m-dissipative operator, some state radiates (<A x, x> < 0), and every evolution moves
    some TSD datum out of L^2(TSD) x L^2(TSD) (tsdPair);
    (mirror boundary conditions on the cube Q = (0, 1/2)^3, the conditions of fields invariant
    under the reflections in the faces) for the system (6.1), strong solutions are determined by
    their initial value, exist on every [0, T] from every TSD datum of D(L) and stay TSD, and some
    TSD datum U_0 with U_0, L U_0, L^2 U_0 in D(L) has L U_0 != 0.
    Not claimed: whether on every bounded domain only stationary data keep the constraint
    (K* in N(L)). It is open; it is proved on boxes, it is equivalent on domains star-shaped with
    respect to a ball to the absence of TSD eigenfields u with curl u outside H°(curl), and on the
    ball no such eigenfield is C^2 up to the boundary. The proof is the library Feec of this
    repository (Feec.Semigroup.Stone, Feec.Semigroup.Invariance,
    Feec.Semigroup.DissipativeInvariance, Feec.HilbertComplex.Window, Dirac, HodgeHeat, Reducing,
    Feec.Counterexamples.BoundedDomainTSD,
    Feec.Counterexamples.BoundedBGG, BoxStationary, BallEigenfields,
    Feec.Models.StarShaped.EigenDense, Feec.Models.BoundedDomain.MovingTSD,
    Feec.Models.Cube.Absorbing, AbsorbingTSD, Feec.Models.Cube.MirrorBGG, MirrorConstraint).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

