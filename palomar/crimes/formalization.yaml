fidelity:
  divergences: >-
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; complexes are on Z,
    the scalars any RCLike field, the refinement h -> 0 any filter. Mathlib has no
    C0-semigroups: the exact heat evolution is an operator family asserted to exist and
    characterized by its strong solutions (unique, D(A) dense, contractions). The theorem is a
    conjunction of three clauses, each with its own hypotheses, with the verdict structures
    CrimeFamily.StaticVerdict, CrimeFamily.CochainVerdict and EvolutionVerdict as conclusions.
    (2) Windows and total complexes: the discrete differential spaces are total (ungraded)
    complexes (X_h, d_h), d_h^2 = 0, read in a window W^a + ... + W^(a+m-1) (the l2 sum of m
    consecutive degrees); the mixed problems are those of the total differentials (the mixed
    Hodge Laplacian of the total complex of the window, the direct sum of the degreewise
    problems), stated as their variational equations; the continuous and discrete solutions are
    quantified universally (they are unique). Closed ranges are assumed in the degrees a+1, ...,
    a+m-1 (those of the window). (3) Reading maps: the static verdict is stated for reading maps
    that need not be cochain maps nor map into D(d), which generalizes [HolstStern2012] (cochain
    morphisms); the read error compares d sigma with i_h d_h sigma_h. A family carries left
    inverses of the reading maps bounded in W uniformly in h (so ||v|| <= C ||i_h v||), as in the
    library; [HolstStern2012] assume V-bounded projections only (uniform injectivity follows there
    from ||1 - i_h* i_h|| < 1), so this is an extra hypothesis, of every clause: the defect
    delta_h, measured from the discrete graph norm, bounds ||(1 - i_h* i_h) v|| only by
    delta_h (||v|| + ||d_h v||). (4) The Strang lemma takes the residual in the
    form |B(x; y) - <i_h v, f>| <= eps (||tau|| + ||d_h tau|| + ||v|| + ||d_h v|| +
    ||q||) at every discrete test function y = (tau, v, q), B the mixed form of d_h. (5) The
    cohomology isomorphism is stated elementwise (onto: every discrete cycle is pi_h of a cycle
    modulo a discrete boundary; one-to-one: a cycle whose image is a discrete boundary is a
    boundary), for finite-dimensional harmonic forms with i_h pi_h q -> q on them. The cochain
    projections are bounded in the graph norm, ||pi_h x|| <= C_pi (||x|| + ||dx||) on D(d)
    (equivalent up to constants to the V-bounds of [HolstStern2012] §3.3), and need not be the left
    inverses of the family. (6) The heat clause assumes convergence of the static method for every
    datum (which the cochain clause supplies for cochain reading maps) and a vanishing inner-product
    defect delta_h -> 0 in the discrete graph norm (implied by ||1 - i_h* i_h|| -> 0, the hypothesis
    of [HolstStern2012], §3.3; the proof of their Thm 3.10 applies I - J_h only to the solution of
    their modified discrete problem (6), to its differentials and to its Hodge components, while
    their Thm 3.12, for the loads Pi_h f, applies it to Pi_h f; the load here is i_h* f); the
    discrete generator is (d_h - d_h*)^2 = -Delta_h, and the evolution verdict
    is that of the conforming heat equation of palomar/feec (the same structure, with i_h as reading
    map): density of D(L^2), existence and uniqueness of strong solutions, contractions,
    semidiscrete and fully discrete convergence, temporal error. Its proof combines the static
    theory with crimes (the static clause) with the route of [GilletteHolstZhu2017] and the elliptic
    projection of [Wheeler1973]. Its closest source, [HolstTiee2018] Thm 4.2, gives a priori error
    estimates for the semidiscrete heat equation with the cochain morphisms of [HolstStern2012];
    this clause assumes no cochain reading maps, states convergence for every datum (no rate) and
    includes the A-stable fully discrete schemes, so it is the theorem of no single source. It also
    assumes the uniform discrete Poincare inequality, as the static clause does. (7) Non-vacuity:
    FEEC.crime_nonvacuous is stated for some Hilbert complex with R in every degree (finite
    dimensional; the statement does not fix its differentials), with reading maps that are cochain
    maps (and, in the solution, bijective); it shows that the hypotheses of the three clauses admit
    non-isometric reading maps, discrete harmonic forms read off the harmonic forms and positive
    errors, on a complex with nonzero harmonic forms. No compared witness has reading maps that are
    not cochain maps (such witnesses, with a nonzero cochain defect, are proved in Feec,
    Feec.HilbertComplex.Approximation.StaticCrimeWitness, and not compared), and none is an
    infinite-dimensional finite element instance (the weak-symmetry scheme of
    palomar/einsteinbianchi is one in Feec, not compared here). FEEC.crime_nonvacuous has
    ||1 - i_n* i_n|| -> 0; the two defects are separated by FEEC.crime_defect_nonvacuous, stated
    for some Hilbert complex with l2(N, R) in every degree (the statement fixes no differential,
    and states that the differential of the window is unbounded); its solution is a diagonal
    model, not a finite element family. Mass lumping, the motivating example of the description,
    is neither compared nor proved in Feec (Feec.FiniteElement.LumpedMassDefect has the
    element-level identities and bounds only). (8) The heat statement assumes a real structure
    [NormedSpace R (W i)] for derivatives in time, and nothing relating it to the K-structure: a
    real normed-space structure on a normed K-space is the restricted one, which the solution
    proves. (9) Shared vocabulary: the notions this entry shares with the other Palomar entries are
    copied from the canonical blocks of palomar/shared/vocabulary.lean.txt (HilbertComplex; window
    with Total, totalDomain, totalD and wave; the square sq of an operator; boundaries; the mixed
    problem MixedSpace, mixedForm, galerkin and IsMixedSolution; the evolution verdict semiflow
    and EvolutionVerdict; IsStrongSolution; IsAStable, HasOrder, rationalApply), all shared with
    palomar/feec (HilbertComplex also with palomar/fem, palomar/constraints and palomar/waves, the
    windows with palomar/constraints and palomar/waves, sq with palomar/constraints,
    IsStrongSolution with palomar/constraints and palomar/einsteinbianchi, the rational schemes
    with palomar/timestepping), and the gate checks them byte for byte; the
    definitions of the crimes (CrimeFamily and its notions) and of the mixed Hodge Laplacian of a
    window (totalHarmonic, totalMixedSpace) are this entry's.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author. Strictness (2026-11-24): FEEC.crime_defect_nonvacuous, a
    second compared witness, shows that the generalization below is strict (a family with
    ||1 - i_n* i_n|| = 1 that meets the hypotheses of the convergence conjunct of the cochain clause
    and of the heat clause); in Feec the constructors of the wave theory with crimes take the defect
    in the graph norm (ApproxComplexCrime.ofCochainDefect, Family.consistent_of_cochainDefect), the
    residual bound applies 1 - J_h only at the approximant and its differential
    (Family.norm_residual_le), and the split rates take the inner-product defect at the approximants
    (ApproxComplexCrime.rateClass_of_split); each new statement implies the former one with the same
    constants (for the split rates, with the constant C_beta C_w of the former hypotheses in place
    of C_beta). Generalization (2026-11-24): the inner-product defect
    CrimeFamily.defect, a hypothesis of the convergence and rate conjuncts of the cochain clause and
    of the heat clause, is the least delta with ||(1 - i_h* i_h) v|| <= delta (||v|| + ||d_h v||)
    (was the operator norm ||1 - i_h* i_h||, which bounds it), so that inner-product crimes small
    only in the discrete graph norm are admitted by the hypotheses (FEEC.crime_defect_nonvacuous).
    The new statement
    implies the former one (proved in a scratch file, not committed: the former CochainVerdict and
    heat clause follow from the new ones with defect <= ||1 - i_h* i_h||); FEEC.crime_nonvacuous
    states both ||1 - i_n* i_n|| -> 0 and the vanishing of the defect. The Feec theorems were
    generalized at their root (Feec.HilbertComplex.ApproxComplexCrime.Family.graphDefect, the norm
    of 1 - J_h from the graph space of d_h to X_h, in the static, cochain and heat theories with
    crimes and in the wave theory of ApproxComplexCrime, same constants; the families of discrete
    complexes Feec.HilbertComplex.ApproxComplex keep ||1 - J_h|| -> 0 and enter that theory
    through ApproxComplex.toCrime). Independent review (2026-11-24): the former statements of
    FEEC.crimeFEEC and FEEC.crime_nonvacuous re-proved from the new ones in a scratch file (not
    committed); the changed Feec statements checked to imply the former ones with the constants
    stated; the defect witness checked (1 - i_n* i_n is minus the projection on the highest mode,
    so ||1 - i_n* i_n|| = 1, and the defect is at most 1/(n + 1)); FEEC.crime_defect_nonvacuous
    now also states that the differential of the window is unbounded (was informal); the
    unproved quantitative claims about mass lumping removed from the description, the module
    docstring and the README row (mass lumping is the motivating example, not compared); the
    remarks on [HolstStern2012] of fidelity (6) checked against arXiv:1005.4455 (§3.3, the proofs
    of Thms 3.10 and 3.12); in Feec the permutation invariance of the integrals of the
    barycentric coordinates is proved once (Feec.FiniteElement.integral_comp_baryCoord_perm, for
    P1Global.integral_baryCoord and LumpedMassDefect.integral_baryCoord_mul_perm). New entry
    (2026-11-18, one story per entry): FEEC.crimeFEEC and
    FEEC.crime_nonvacuous were Theorem 4 and a witness of palomar/feec; they move here with the
    definitions only they use (CrimeFamily and its notions, totalHarmonic, totalMixedSpace); the
    statement of FEEC.crimeFEEC was unchanged at the move (its three clauses are those of the former
    CrimeFamily.Verdict), and the witness gains the conjuncts (exists cP, S.IsPoincare cP) and
    (forall f, S.ConvergesAt f), consequences of the cochain clause, so that it meets the hypotheses
    of all three clauses. The shared definitions with palomar/feec are canonical blocks (fidelity
    (9)); boundaries, mixed and evolution are new blocks (the text of palomar/feec). Independent
    review (2026-11-18): [HolstTiee2018], the closest source of the heat clause, added to the
    sources and to the module docstring (fidelity (6)); the identifiers of the sources checked
    against Crossref, the theorem numbers of [HolstStern2012] against arXiv:1005.4455. Earlier
    history (in palomar/feec): the crime problems were redesigned as triples with one residual
    (CrimeFamily.IsSolution, ResidualLE, readGap, ConvergesAt, defect) and one evolution verdict for
    the conforming and crime heat equations; the Solution proves the componentwise forms
    (Solution/Legacy.lean) and converts (Solution/Convert.lean). Every merge of the library was
    gated by a full build (zero warnings), an axiom audit (propext, Classical.choice, Quot.sound
    only), regression snapshots and an independent AI review. No external mathematical review.

