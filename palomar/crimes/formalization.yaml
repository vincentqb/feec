# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of variational crimes for Hilbert complexes
# (`palomar/crimes/`): the a priori theory of [HolstStern2012], §3, for discrete complexes that
# are not subcomplexes, and the Hodge heat equation with crimes. Its theorem and witness were
# Theorem 4 of palomar/feec until 2026-11-18 (review.notes).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Variational crimes for Hilbert complexes: stability and the Strang lemma, cochain reading maps and cohomology, and the Hodge heat equation"
  description: >-
    What survives of the approximation theory of Hilbert complexes when the discrete spaces are
    not subspaces of the continuous ones? On curved or approximated domains, on hypersurfaces,
    with quadrature or with nonconforming spaces, a Galerkin method works on a discrete complex
    (X_h, d_h) with its own inner product, compared with the Hilbert complex W through reading
    maps i_h : X_h -> W that are not isometries and need not be cochain maps (variational crimes).
    Holst and Stern ([HolstStern2012] §3) answered for the mixed Hodge Laplacian. The compared
    theorem FEEC.crimeFEEC states the answer on every window W^a + ... + W^(a+m-1) of consecutive
    degrees of a Hilbert complex of closed densely defined operators on Z (any RCLike field) with
    closed ranges in the degrees a+1, ..., a+m-1, for every family of discrete differential spaces
    (FEEC.HilbertComplex.CrimeFamily: finite-dimensional Hilbert spaces X_h with d_h^2 = 0, read
    in the window by uniformly bounded maps i_h with uniformly bounded left inverses, refined along
    any filter; no approximation property, consistency and convergence being hypotheses of the
    clauses), in three clauses. (static) Under a uniform discrete
    Poincare inequality ||v|| <= c_P ||d_h v|| on N(d_h)^perp, the mixed Hodge Laplacian of the
    window and its discretizations with the load i_h* f are uniquely solvable, the discrete
    solutions are stable (||sigma_h|| + ||d_h sigma_h|| + ||u_h|| + ||d_h u_h|| + ||p_h|| <= C
    ||f||), satisfy the Strang lemma (the read error of the discrete solution is at most the read
    error of any discrete triple plus C times its residual in the dual graph norm), and converge
    for every datum once the method is consistent on a dense set of data; the reading maps need
    not be cochain maps nor map into D(d). (cochain) For cochain reading maps (i_h X_h in D(d),
    d i_h = i_h d_h) with cochain projections pi_h bounded in the graph norm: the uniform discrete
    Poincare inequality; convergence for every datum when the inner-product defect delta_h tends
    to 0 and i_h pi_h -> 1 on D(d); eventually an isomorphism H(d) = H(d_h) induced by pi_h (for
    finite-dimensional harmonic forms with i_h pi_h q -> q on them); and the error at most K eps
    for data whose sigma, u, p and P_B u are within eps of i_h X_h in the graph norm with
    delta_h (||sigma|| + ||d sigma|| + ||u|| + ||d u|| + ||p||) <= eps. The inner-product defect is
    measured from the discrete graph norm: delta_h is the least delta with
    ||(1 - i_h* i_h) v|| <= delta (||v|| + ||d_h v||) for every v in X_h (CrimeFamily.defect), at
    most the operator norm ||1 - i_h* i_h||; the estimates apply 1 - i_h* i_h only to discrete
    forms whose graph norm they control. The motivating example is mass lumping of P1 elements
    ([Thomee2006], Ch. 15), an inner-product crime; its analysis is not compared. (heat) Under a
    uniform discrete Poincare inequality, when delta_h -> 0 and the static method converges for
    every datum: the Hodge heat equation u' = L^2 u = -Delta u of the window is well posed (a
    contraction semigroup U characterized by its strong solutions), the semidiscrete solutions of
    u_h' = (d_h - d_h*)^2 u_h = -Delta_h u_h read by i_h converge to its solutions uniformly on
    bounded time intervals for every family of initial values with i_h v_h -> x, and so do the
    iterates of every A-stable rational scheme r = P/Q of order p >= 1 as h and tau tend to 0, with
    the temporal error K n tau tau^p ||Delta_h^(p+1) w|| (K independent of h). The clauses (static)
    and (heat) assume no cochain reading maps, which goes beyond [HolstStern2012] and, for the heat
    equation, [HolstTiee2018] (cochain morphisms), and the inner-product defect is measured from the
    discrete graph norm (theirs is the operator norm ||I - J_h|| on W_h). The compared witness
    FEEC.crime_nonvacuous shows that the hypotheses admit genuine crimes: it states that a Hilbert
    complex with R in every degree, with closed ranges and nonzero harmonic forms on the window
    [0, 3), carries a family with cochain reading maps and cochain projections, i_n pi_n = 1, not
    isometric (i_n* i_n != 1) but with ||1 - i_n* i_n|| -> 0, hence delta_n -> 0, which meets the
    hypotheses of the three clauses (with the discrete Poincare inequality and convergence for every
    datum), reads a discrete harmonic form off the harmonic forms, and has a positive error at some
    datum at every level. The solution's witness is the window R --id--> R --0--> R (harmonic forms
    R (0, 0, 1)) with the reading maps i_n = 1 + h_n N, N(a, b, c) = (0, c, 0), h_n = 1/(n+1), the
    cochain projections pi_n = 1 - h_n N, and the datum (0, 0, 1); the statement fixes none of
    these. The compared witness FEEC.crime_defect_nonvacuous shows that a vanishing defect is a
    strictly weaker hypothesis than ||1 - i_h* i_h|| -> 0: it states that a Hilbert complex with
    l2(N, R) in every degree, whose differential d on the window [0, 2) is unbounded (no C with
    ||d x|| <= C ||x|| on D(d)) and has closed ranges, carries a family with cochain reading maps
    and cochain projections pi_n bounded by 1 in the graph norm, with i_n pi_n -> 1 on D(d),
    ||1 - i_n* i_n|| = 1 at every level and delta_n -> 0, which has the discrete Poincare inequality
    and converges for every datum: it meets the hypotheses of the convergence conjunct of the
    cochain clause and of the heat clause, which ||1 - i_n* i_n|| -> 0 excludes. The solution's
    witness is d^0 = diag(k + 1) on l2 (closed, onto), all other differentials 0, the modes k <= n
    of both degrees as discrete spaces, reading maps that double the square norm of the highest mode
    k = n of degree 0, and the truncations to the modes k <= n, rescaled on that mode, as cochain
    projections: 1 - i_n* i_n is minus the projection on that mode, on which d_n is (n + 1) sqrt 2,
    so ||(1 - i_n* i_n) v|| <= (||v|| + ||d_n v||) / (n + 1), and d is unbounded
    (||d i_n (e_n, 0)|| >= (n + 1) sqrt 2 while ||i_n (e_n, 0)|| <= 2). The conforming case
    (subcomplexes with cochain projections, the inclusion as reading map) is the Palomar entry
    palomar/feec. The statement is self-contained over Mathlib; the proof is the library Feec of
    this repository.
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

