    Formalized and compared: FEEC.dynamicFEEC (Challenge.lean) for every RCLike field, every
    Hilbert complex on Z, every family of subcomplexes along any filter with W-bounded projections
    and the approximation property, every window [a, a+m). Not compared (proved in Feec, outside
