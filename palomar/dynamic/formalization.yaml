fidelity:
  divergences: >-
    (1) Inherent: Mathlib has no C0-semigroups, so the exact evolutions are operator families S
    asserted to exist and characterized by strong solutions (unique, D(A) dense, contraction),
    which makes S unique for t >= 0; for the wave, S is a unitary group with S(s+t) = S(s) S(t).
    Defining C0-semigroups, their generators and the Hille-Yosida/Stone theorems over Mathlib
    would exceed the 1000-line budget.
    (2) Hypotheses, as in [AFW2010] §3.3: the family approximates in the graph norm of d^i in the
    degrees i = a, ..., a+m-1 of the window (in the last degree, which has no differential in the
    truncated window, only the W-approximation that follows is used). The wave conclusions assume
    no bound of the cochain projections at all (the elliptic projections are bounded on every
    subcomplex, C_P = 4 sqrt 3, [QuennevilleBelair2015] Prop. 4.13). The heat conclusions assume
    the projections bounded uniformly in the graph norm in the degrees a, ..., a+m-2 and in W in
    the last degree a+m-1, i.e. bounded in the graph norm of the truncated window (for a window
    ending at the top of the complex, d^(a+m-1) = 0 and this is the graph-norm bound of
    [AFW2010] §3.3), and closed ranges in the degrees a+1, ..., a+m-1; no finite-dimensionality of
    the harmonic forms is assumed.
    (3) The error bound has the explicit constant 2 (1 + C_P), C_P = 4 sqrt 3, and measures best
    approximation of the trajectories of x and L x in the graph norm ||y - w|| + ||d y - d w|| of
    the total differential; it is stated for x in D(L^2), the regularity at which the trajectory
    of L x lies in D(d) (for x in D(L) only, S(s) L x need not lie in D(d) and the hypothesis on
    M fails). The theta-schemes carry the temporal error (theta + 1/2) n tau tau ||B_h^2 w_0||
    (B_h = L_h for the wave, L_h^2 for the heat) and, for the wave, the fully discrete error bound
    (the sum of the semidiscrete and temporal errors).
    (4) Not stated, by cost: a quantitative semidiscrete heat error bound. In Feec it is
    ConstrainedFEEC.rate_heat: ||S(t)x - exp(t L_h^2) R_h x|| <= (2 + 3t) K L h^ord for data
    whose mixed solutions are regular along the orbit, R_h = G_h Q_h Delta + P_H_h Q_h the heat
    Ritz projection. Stating it needs the mixed Hodge Laplacian, the discrete Green operator and
    harmonic projection, the heat Ritz projection and a regularity class in the challenge
    (about 80-120 lines) and a bridge identifying them with Feec's (about 300-500 lines); the
    static rate behind it is the subject of palomar/static.
    (5) Presentation: the differential is encoded as d i j for all pairs, zero unless j = i + 1.
    (6) The heat equation is u' = (d - d*)^2 u = -Delta u, with discrete generator L_h^2 = -Delta_h.
    (7) Windows: the evolutions live on the l2 sum of m consecutive degrees a, ..., a + m - 1 of
    the truncated complex W^a -> ... -> W^(a+m-1): the differentials d^(a-1) into the window and
    d^(a+m-1) out of it are dropped, so for an interior window L = d - d* is the Hodge-Dirac
    operator of the truncated complex, not the restriction of the Hodge-Dirac operator of the
    full complex (the source's setting is the full finite complex, the window [a, a+m) covering
    all nonzero degrees).
    (8) S(0) = 1 is part of the verdict; the residual bound for reducing constraints follows from
    propagation in one line and is stated for the record, as is the fully discrete wave bound.
    The family of subcomplexes (SubcomplexFamily) carries no bound and no approximation
    property: these are hypotheses (Approximates, IsGraphBounded, as in palomar/static).

