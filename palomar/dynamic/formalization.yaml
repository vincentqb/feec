# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the FEEC theorem for the Hodge wave and heat equations (`palomar/dynamic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The FEEC theorem for the Hodge wave and heat equations on Hilbert complexes"
  description: >-
    A Lean 4 formalization of the semidiscrete finite element exterior calculus of the Hodge
    wave and heat equations for an arbitrary Hilbert complex of closed densely defined operators
    on Z and an arbitrary family of finite-dimensional subcomplexes with commuting
    cochain projections bounded uniformly in W and the approximation property. The compared
    theorem FEEC.dynamicFEEC states, on every window of consecutive degrees: the Hodge wave
    equation for L = d - d* is well posed with a unitary group S; its semidiscrete Galerkin
    solutions converge for every datum, with the error bound ||S(t)x - exp(t L_h) v|| <=
    ||v - x|| + C (1 + t) M for x in D(L^2), M a bound of the graph-norm best approximation errors
    of the trajectories of x and L x on [0, t]; the theta-schemes (theta >= 1/2) converge as h
    and the time step tend to 0; a closed constraint propagates iff it reduces L, and then the
    constraint residual of the discrete solutions is bounded by their error; with closed ranges
    and finite-dimensional harmonic fields, the same convergence for the Hodge heat equation.
    The statement is self-contained over Mathlib; the proof is the library Feec of this
    repository (Feec.HilbertComplex.ConformingFamily.feec, Feec.HilbertComplex.ConstrainedFEEC.rate_le).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

