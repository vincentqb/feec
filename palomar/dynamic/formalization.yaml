fidelity:
  divergences: >-
    (1) Mathlib has no C0-semigroups: the exact evolutions are operator families S asserted to
    exist and characterized by strong solutions (unique, D(A) dense, contraction), so S is
    unique for t >= 0; for the wave, S is a unitary group with S(s+t) = S(s) S(t).
    (2) The cochain projections are uniformly bounded in W, the hypothesis of the smoothed
    projections ([AFW2010] §5.5), stronger than graph-norm boundedness of [AFW2010] §3.3.
    (3) The error bound has an existential constant C (in the proof 2 (1 + C_P), C_P the bound
    of the elliptic projections) and measures best approximation of the trajectories of x and
    L x in the graph norm ||y - w|| + ||d y - d w|| of the total differential; it is stated for
    x in D(L^2); the theta-schemes and the heat equation are stated qualitatively.
    (4) The differential is encoded as d i j for all pairs, zero unless j = i + 1.
    (5) The heat equation is u' = (d - d*)^2 u = -Δu, with discrete generator L_h^2 = -Δ_h.
    (6) Windows: the evolutions live on the l2 sum of m consecutive degrees a, ..., a + m - 1 of
    the truncated complex W^a -> ... -> W^(a+m-1): the differentials d^(a-1) into the window and
    d^(a+m-1) out of it are dropped, so for an interior window L = d - d* is the Hodge-Dirac
    operator of the truncated complex, not the restriction of the Hodge-Dirac operator of the
    full complex (the source's setting is the full finite complex, the window [a, a+m) covering
    all nonzero degrees). The heat equation assumes closed ranges in the degrees a + 1, ...,
    a + m - 1 of the window and a finite-dimensional kernel of d - d* on the window.
    (7) S(0) = 1 is part of the verdict; the residual bound for reducing constraints follows from
    propagation in one line and is stated for the record. The family of subcomplexes
    (SubcomplexFamily) carries no bound and no approximation property: these are hypotheses.

