status:
  scope: >-
    Formalized and compared: FEEC.dynamicFEEC (Challenge.lean) for every RCLike field, every
    Hilbert complex on Z, every family of subcomplexes along any filter, every window [a, a+m)
    in whose degrees the family approximates in the graph norm (no bound of the projections for
    the wave; graph-norm bounds in the window for the heat equation). Not compared (proved in
    Feec, outside the statement): the heat rates from the static rates of the mixed method
    (ConstrainedFEEC.rate_heat), rates from Jackson and Sobolev estimates, the uniform fully
    discrete rate O(h^alpha + tau^(p/(p+2))) for every one-step scheme, energy identities,
    departure of non-reducing constraints, leapfrog, Crank-Nicolson signed systems, Runge-Kutta
    and rational schemes, perturbations, variational crimes, and the concrete finite element
    families and physical instances.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

