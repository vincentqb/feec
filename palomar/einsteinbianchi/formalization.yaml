status:
  scope: >-
    Formalized and compared: FEEC.bggWeakSymmetry (all BGG data on real Hilbert spaces in one
    universe, every discretization); FEEC.weakSymmetry_cube (the cube Q = (0, 1/2)^3, the elements
    of Table 5.1 on Freudenthal meshes, both boundary conditions of CubeBC; with the electric
    conditions the instance of the abstract theorem with S_h != S, the Raviart-Thomas
    best-approximation bound, the H^1 static and wave rates, uniqueness for (6.5), the
    convergence of (6.5) from every datum of D(L) and the non-TSD limit of the datum
    (0, 0, 0, *beta) and of its discrete fields; with the mirror conditions the discrete Gauss
    witness, the rate (1 + t) h to the TSD solution for TSD data of D(L^3), and a moving such
    datum); FEEC.weakSymmetry_cube_nonvacuous (nontrivial solutions meet the hypotheses of the
    electric rates). The C^2 rates of the thesis (states C^2 up to the boundary with vanishing
    tangential traces) are corollaries of the H^1 rates: such states are of class H^1 with a
    universal factor on the bound (Feec.Models.Cube.FEM.IsCsFormTr.exists_h1Data, from the
    Lipschitz extension Feec.Domain.exists_h1Data_cube; Solution/Smooth.lean,
    exists_isH1State_of_isSmoothStateTr), so the challenge states the H^1 rates only. The
    propagation of the TSD constraints by the exact evolution under each boundary condition
    (formerly FEEC.tsd_not_propagates, FEEC.box_stationary and FEEC.mirror_tsd_propagates here)
    is compared in palomar/constraints, in FEEC.tsd_boundary_conditions (ElectricVerdict,
    BoxVerdict, MirrorVerdict); this entry restates only what identifies the limit of the method:
    the exact solution from (0, 0, 0, *beta) leaves TSD, and those from TSD data stay TSD with
    the mirror conditions. Not compared here (proved in Feec): the lower bound for the canonical
    interpolant onto the Raviart-Thomas space (exists_interpolationError_ge, implied by the
    compared best-approximation clause); the O(h^s) rates of the mirror scheme for H^(2+s) data
    (mirror_waveFEM_rate_sobolev_of_add_two) and its convergence without rate for D(L^2) TSD data
    (Feec.Models.Cube.MirrorWeakSymmetryTSD.mirror_waveFEM); the rates h^(min(s,1)) for relative
    class H^s data (cubeWave_rate_sobolev). Not claimed: convergence from every datum of D(L)
    with the mirror conditions; the existence of trajectories of (6.5) whose initial states
    converge to a general datum of D(L) (stated for (0, 0, 0, *beta)).
