fidelity:
  divergences: >-
    (1) Boundary conditions: three boundary conditions are compared. The mirror conditions
    (sigma . n = 0; E_(n tau) = 0 in curl E and E_(tau n) = 0 in div E; B_(tau tau) = 0 in curl B;
    and the wall conditions E_(tau n) = 0, B_(nn) = 0 of the divergence constraints) are the
    face conditions of the fields symmetric under the reflections in the faces, so the problem
    on the cube is the problem on the torus of side 2s restricted to the reflection-symmetric
    fields, and the proof goes through that torus. The electric conditions sigma = 0,
    n x E_a = 0 are those of the minimal realizations of grad and curl, with no condition on div E
    and curl B. The absorbing conditions n x E_a + (B_a)_tau = 0 are posed for the system
    E' = -curl B, B' = curl E in (E, B) (the auxiliary field sigma and its condition are absent,
    sigma = 0 being part of the constraint), on (0, 1/2)^3 only. Other boundary conditions (in
    particular the constraint-preserving conditions of derivative type of the literature), boxes
    with unequal sides (proved in Feec without the Green's-formula description) and general
    bounded domains are out of scope.
    (2) Weak formulation: the mirror operators and divergence constraints are Green's formulas
    against C^1 test functions on R^3 vanishing on the closed faces normal to the e_j of a
    prescribed set and free on the other faces; that they define exactly the closed operators of
    the mirror Hilbert complex is proved in Feec (Feec.Models.Cube.Mirror.complexQ_d₀_iff and
    companions, Feec.Models.Cube.Mirror.mem_wave_domain_cube_iff_trace). The electric div and
    curl are distributional (tested against C_c^infinity(C)); grad with sigma = 0 and curl with
    n x E = 0 are defined by duality, Green's formula with no boundary term against every field of
    H(div) resp. H(curl), which is the graph of the minimal realization (a closed operator is the
    adjoint of its adjoint), not by the closure of the test functions. The absorbing energy space
    is the closure of the triples (Phi, curl Phi, Phi_tau) of C^1 fields (Phi_tau the tangential
    components of the rows on the six faces, each face parametrized by (0, 1/2)^2), and the
    generator is defined by its weak equation against the C^1 triples (equivalent, by density, to
    the weak equation against the energy space used in Feec). Pointwise traces of L^2 fields with
    L^2 derivatives are not formalized; the boundary conditions are the reading of the formulas.
    (3) Fields: complex (L^2(C; C)) for the mirror theorems, real (L^2(C; R)) for the electric and
    absorbing theorems, as in the Feec results they are proved from; the definitions are stated
    for both (RCLike). The sign convention is E' = grad sigma - curl B, B' = curl E (L = d - d*
    of the complex).
    (4) Solutions: strong solutions are continuous on the time set with U t in D(L) and the
    derivative within the time set equal to L(U t) + F t at every time (not almost every time, as
    for the strong solutions of Pazy §4.2); classical solutions have in addition t -> L(U t)
    continuous; mild solutions (absorbing theorem) are continuous on [0, infinity) with the
    integral from 0 to t in D(L) and L of it equal to U t - U 0. The absorbing theorem asserts
    that some TSD datum has a mild solution and that every mild solution from it leaves the
    constraint (the proof shows that mild solutions are the semigroup orbits); the leaving datum
    is not shown to lie in D(A) (the proof shows that the TSD states of D(A) are not dense in the
    TSD states). The
    forcing class for existence (mirror) is continuity on [t0, t1] together with
    W^(1,1)(t0, t1; L^2) or L^1(t0, t1; D(L)). The electric and absorbing theorems are for the
    homogeneous system.
    (5) electric_forward_iff is stated for the constraint {0} x TSD x TSD with TSD in the sense of
    distributions (no boundary condition); a constraint with boundary conditions on the TSD fields
    is a subset, to which the forward direction applies. Its existence part gives a strong
    solution on [0, infinity) for every datum of D(L).
    (6) The hypothesis s > 0 excludes the empty cube.
    (7) Scope: the finite element schemes of the thesis (Ch. 5-7), their convergence and the Ch. 7
    numerical experiment are not part of this entry.

