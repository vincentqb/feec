# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of constraint propagation for wave equations
# of Hilbert complexes, with the linearized Einstein-Bianchi system on a cube as instances
# (`palomar/einsteinbianchi/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Constraint propagation for wave equations of Hilbert complexes"
  description: >-
    A general criterion for constraint propagation, with sharp instances. A linear evolution
    u' = A u on a Hilbert space H carries a constraint, a closed subspace K that solutions should
    not leave; for the Hodge wave equation u' = L u, L = d - d*, of a Hilbert complex the
    constraints are divergence conditions (Gauss laws, the TSD conditions of linearized gravity),
    and whether they propagate depends on the boundary conditions built into the complex.
    The criterion (operators on a Hilbert space over R or C, Mathlib's LinearPMap, with Mathlib's
    adjoint and orthogonal projections): for a skew-adjoint A (A^* = -A, as L for every closed
    Hilbert complex), every datum has a unique mild solution on R (existsUnique_mild); the mild
    solutions starting in K stay in K iff K reduces A, i.e. P_K D(A) is contained in D(A) and
    A P_K = P_K A on D(A) (isReducing_iff_propagates); and the data whose solutions stay in K form
    a closed subspace K* of K, the largest closed subspace of K reducing A, which propagates, is
    mapped into itself by A on D(A) and has D(A) intersected with K* dense in it
    (exists_invariantCore). For an m-dissipative A (a contraction semigroup, e.g. absorbing
    boundary conditions) mild solutions on [0, infinity) exist and are unique
    (existsUnique_mild_of_isMDissipative), and K reduces A iff K and its orthogonal complement
    both propagate (isReducing_iff_propagates_of_isMDissipative). Instances: the linearized
    Einstein-Bianchi system of general relativity (Anderson, Choquet-Bruhat, York 1997), whose
    constraint-preserving boundary conditions are a central problem of the initial-boundary value
    problem of general relativity (Friedrich-Nagy 1999; Calabrese-Pullin-Reula-Sarbach-Tiglio
    2003; Kreiss-Winicour 2006), on an open cube C = prod_i (b_i, b_i + s) of R^3 (s > 0), with
    K* computed for three boundary conditions. (i) Tensorial mirror conditions
    sigma . n = 0, E_(n tau) = E_(tau n) = 0, B_(tau tau) = 0 and, in the constraint,
    B_(nn) = 0 (the face conditions of the fields symmetric under the reflections in the faces,
    sigma a vector, E a tensor, B a pseudotensor): K* = K, the TSD (symmetric, trace-free,
    divergence-free) constraints propagate for all data (mirror_propagates), under forcing
    (tsd_propagates), with existence and uniqueness (tsd_existsUnique), and the constraint
    contains non-stationary data (exists_nonstationary). (ii) Electric (perfect conductor)
    conditions sigma = 0, n x E_a = 0, the minimal realizations H0^1 -> H0(curl) -> L^2: K* is
    the stationary data, a mild solution stays in the constraint {0} x TSD x TSD for all t >= 0
    iff its datum lies there and L U0 = 0 (electric_propagates_iff; boundary conditions on the
    TSD fields only shrink the constraint, so none of them makes it propagate), and some TSD datum
    of D(L) leaves the constraint on every time interval (electric_tsd_leaves). (iii) Absorbing
    (Silver-Muller) conditions n x E_a + (B_a)_tau = 0 on Q = (0, 1/2)^3 for (E, B): K* is not
    K, some TSD datum has a mild solution on [0, infinity) and every mild solution from it leaves
    the TSD constraint (absorbing_not_propagates). The system is that of
    [QuennevilleBelair2015] (§3.4, §4.10, (4.14)): the electric and magnetic parts E, B (3x3
    matrix fields) of the linearized Weyl curvature, with an auxiliary vector field sigma,
    evolve by the Hodge wave equation of the matrix grad-curl complex,
    sigma' = div E + f_sigma, E' = grad sigma - curl B + f_E, B' = curl E + f_B
    ((grad sigma)_ab = d_b sigma_a; div and curl row by row). The fields are elements of L^2 of
    the domain over R or C (Mathlib's Lp for the Lebesgue measure restricted to the domain).
    Mirror conditions: grad, curl and div are defined by Green's formulas against C^1 test
    functions vanishing on prescribed closed faces of the closed cube and free on the others
    (IsTest, IsGrad, IsCurl, IsDiv), the operator is IsWave and the constraint Constraint.
    Electric conditions: div and curl are the same Green's formulas against C_c^infinity(C)
    (IsCompactTest, the distributional operators), grad and curl with the boundary condition are
    defined by Green's formula with no boundary term against every field of H(div) resp.
    H(curl) (IsGrad0, IsCurl0), the operator is IsWave0 and the constraint Constraint0
    (sigma = 0, E and B TSD in the sense of distributions, IsTSD0). Absorbing conditions: the
    energy space of the L^2 fields with an L^2 curl and an L^2 tangential trace on the six faces
    (IsEnergy, the closure of the triples (Phi, curl Phi, Phi_tau) of C^1 fields), and the
    generator by its weak equation with the boundary term (IsAbsorbing). Strong and classical
    solutions of U' = L U + F for an operator L given by its graph (IsStrongSolution,
    IsClassicalSolution) ask for the equation at every time; mild solutions (IsMildSolution,
    Pazy §4.2) are continuous with the integral from 0 to t in D(L) and L of it equal to
    U t - U 0; the forcing class of the existence theorem is IsAdmissible (Cazenave-Haraux
    Prop 4.1.6). The statement is self-contained over Mathlib; the proof is the library Feec of
    this repository: Stone's and the Lumer-Phillips theorems (Feec.Semigroup.Stone,
    Feec.Semigroup.LumerPhillips), the reducing-subspace criterion and the invariant core
    (Feec.Semigroup.Invariance: C0Group.IsIsometric.isReducing_iff_invariant,
    C0Group.invariantCore; Feec.Semigroup.DissipativeInvariance: IsMDissipative.isReducing_iff),
    with mild solutions identified with the orbits in Solution/General.lean; the mirror complex
    is the compression of the Fourier grad-curl complex of the torus of side 2s along the mirror
    extensions, with the TSD constraint a reducing subcomplex (Feec.Models.Cube.Mirror,
    Feec.Models.Cube.MirrorTrace); the electric complex on a cube is a compression of a torus
    complex whose wave group has pure point spectrum, so forward invariance in L^2(TSD) forces
    stationarity (Feec.Counterexamples.CubeStationary, Feec.Models.Box.EigenDense), and a TSD
    datum leaves at once because L^2(TSD) intersected with H0(curl) has mean-zero fields only
    (Feec.Counterexamples.BoundedDomainTSD); for the absorbing conditions the TSD states of the
    domain of the generator are not dense in the TSD states, since on them the normal-normal
    component of E vanishes on a face (Feec.Models.Cube.AbsorbingTSD).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

