fidelity:
  divergences: >-
    (1) Boundary conditions: the statement is for the tensorial mirror boundary conditions on a
    cube (sigma . n = 0; E_(n tau) = 0 in curl E and E_(tau n) = 0 in div E; B_(tau tau) = 0 in
    curl B; and the wall conditions E_(tau n) = 0, B_(nn) = 0 of the divergence constraints),
    which are the conditions under which the result is proved; other boundary conditions and
    general bounded domains are out of scope.
    (2) Weak formulation: the operators and the divergence constraints are defined by Green's
    formulas against C^1 test functions on R^3 vanishing on the closed faces of the closed cube
    normal to the e_j of a prescribed set (the parities of the mirror conditions) and free on
    the other faces; the boundary conditions are the reading of these formulas (pointwise
    traces of L^2 fields with L^2 derivatives are not formalized). That these formulas define
    exactly the closed operators of the mirror Hilbert complex (domains included) is proved in
    Feec (Feec.Models.Cube.Mirror.complexQ_d0_iff and companions, mem_wave_domain_cube_iff_trace).
    (3) Fields are complex (L^2(C; C)); real fields are a special case. The system carries the
    auxiliary field sigma of [QuennevilleBelair2015] (4.14), with the constraint sigma = 0; the
    sign convention is E' = grad sigma - curl B, B' = curl E (L = d - d* of the complex).
    (4) Solutions: strong solutions are continuous on the time set with U t in D(L) and the
    derivative within the time set equal to L(U t) + F t at every time (not almost every time,
    as for the strong solutions of Pazy §4.2, so the uniqueness among strong solutions is
    uniqueness in this pointwise class); classical solutions have in addition t -> L(U t)
    continuous. The forcing class
    for existence is continuity on [a, c] together with W^(1,1)(a, c; L^2) (F = x0 + integral of
    an integrable g, a.e.) or L^1(a, c; D(L)), the class of the existence theorem cited by the
    thesis.
    (5) The hypothesis s > 0 excludes the empty cube, on which every statement but the
    non-vacuity theorem is trivial and the non-vacuity theorem fails.
    (6) Scope: the finite element schemes of the thesis (Ch. 5-7), their convergence and the
    Ch. 7 numerical experiment are not part of this entry.

