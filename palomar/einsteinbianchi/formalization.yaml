# formalization.yaml v0.4 for the Palomar submission of constraint propagation for the linearized Einstein-Bianchi system on a cube (`palomar/einsteinbianchi/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Which boundary conditions preserve the constraints of the linearized Einstein-Bianchi system on a cube"
  description: >-
    Constraint propagation in the presence of a boundary: the linearized Einstein-Bianchi system
    of general relativity (Anderson, Choquet-Bruhat, York 1997) preserves its constraints on R^3
    and on the torus, but on a domain with boundary only under suitable boundary conditions, and
    constraint-preserving boundary conditions are a central problem of the initial-boundary value
    problem of general relativity (Friedrich-Nagy 1999; Calabrese-Pullin-Reula-Sarbach-Tiglio
    2003; Kreiss-Winicour 2006). This entry decides the question for three boundary conditions on
    an open cube C = prod_i (b_i, b_i + s) of R^3 (s > 0). (i) Tensorial mirror conditions
    sigma . n = 0, E_(n tau) = E_(tau n) = 0, B_(tau tau) = 0 and, in the constraint,
    B_(nn) = 0 (the face conditions of the fields symmetric under the reflections in the faces,
    sigma a vector, E a tensor, B a pseudotensor): the TSD (symmetric, trace-free,
    divergence-free) constraints propagate, with existence and uniqueness, and the constraint
    contains non-stationary data. (ii) Electric (perfect conductor) conditions sigma = 0,
    n x E_a = 0, i.e. the minimal realizations H0^1 -> H0(curl) -> L^2: a strong solution stays
    in the constraint {0} x TSD x TSD iff its datum lies there and is stationary (so no boundary
    conditions on the TSD fields, which only shrink the constraint, make it propagate), and some
    TSD datum of D(L) leaves the constraint on every time interval. (iii) Absorbing
    (Silver-Muller) conditions n x E_a + (B_a)_tau = 0 on Q = (0, 1/2)^3 for (E, B): some TSD
    datum has a mild solution, and every mild solution from it leaves the TSD constraint.
    The system is that of [QuennevilleBelair2015] (§3.4, §4.10, (4.14)): the electric and
    magnetic parts E, B (3x3 matrix fields) of the linearized Weyl curvature, with an auxiliary
    vector field sigma, evolve by the Hodge wave equation of the matrix grad-curl complex,
    sigma' = div E + f_sigma, E' = grad sigma - curl B + f_E, B' = curl E + f_B
    ((grad sigma)_ab = d_b sigma_a; div and curl row by row). The fields are elements of L^2 of
    the domain over R or C (Mathlib's Lp for the Lebesgue measure restricted to the domain).
    Mirror conditions: grad, curl and div are defined by Green's formulas against C^1 test
    functions vanishing on prescribed closed faces of the closed cube and free on the others
    (IsTest, IsGrad, IsCurl, IsDiv), the operator is IsWave and the constraint Constraint.
    Electric conditions: div and curl are the same Green's formulas against C_c^infinity(C)
    (IsCompactTest, the distributional operators), grad and curl with the boundary condition are
    defined by Green's formula with no boundary term against every field of H(div) resp.
    H(curl) (IsGrad0, IsCurl0), the operator is IsWave0 and the constraint Constraint0
    (sigma = 0, E and B TSD in the sense of distributions, IsTSD0). Absorbing conditions: the
    energy space of the L^2 fields with an L^2 curl and an L^2 tangential trace on the six faces
    (IsEnergy, the closure of the triples (Phi, curl Phi, Phi_tau) of C^1 fields), and the
    generator by its weak equation with the boundary term (IsAbsorbing). Strong and classical
    solutions of U' = L U + F for an operator L given by its graph (IsStrongSolution,
    IsClassicalSolution) ask for the equation at every time; mild solutions (IsMildSolution,
    Pazy §4.2) for t >= 0; the forcing class of the existence theorem is IsAdmissible
    (Cazenave-Haraux Prop 4.1.6). The compared theorems: FEEC.EinsteinBianchi.tsd_propagates,
    tsd_existsUnique and exists_nonstationary (mirror, complex fields); electric_forward_iff and
    electric_tsd_leaves (electric, real fields); absorbing_not_propagates (absorbing, real
    fields). The statement is self-contained over Mathlib; the proof is the library Feec of this
    repository: the mirror complex is the compression of the Fourier grad-curl complex of the
    torus of side 2s along the mirror extensions, with the TSD constraint a reducing subcomplex
    (Feec.Models.Cube.Mirror, Feec.Models.Cube.MirrorTrace); the electric complex on a cube is a
    compression of a torus complex whose wave group has pure point spectrum, so forward
    invariance in L^2(TSD) forces stationarity (Feec.Counterexamples.CubeStationary,
    Feec.Models.Box.EigenDense), and a TSD datum leaves at once because L^2(TSD) intersected
    with H0(curl) has mean-zero fields only (Feec.Counterexamples.BoundedDomainTSD); for the
    absorbing conditions the TSD states of the domain of the generator are not dense in the TSD
    states, since on them the normal-normal component of E vanishes on a face
    (Feec.Models.Cube.AbsorbingTSD).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
