      models: []
      framework: "n/a"
      tool_setup: "Statement design, review of definitions and of the challenge statement."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human-directed, AI-written development. The Challenge statement and its definitions were
    written by an AI agent for this submission, to be reviewed by the author; the Solution
    identifies them with the definitions of the library Feec and applies its theorems:
    Solution/Abstract.lean (the abstract theorem through Feec.BGG.Discrete, from the former
    palomar/bgg entry), DiscreteWave.lean (uniqueness and the discrete Gauss law for (6.5), by
    energy), Cube*.lean and Instance.lean (the electric conditions: the cube data are Feec's,
    the hypotheses, S^0_h != S^0, the best-approximation clause from
    Feec.Models.Cube.WeakSymmetry.exists_bestApproxError_ge, the H^1 rates, uniqueness),
    Converge.lean (new: the challenge's system (6.1) is Feec's forms model
    Feec.EinsteinBianchi.MatrixModel.formsShort through the state map toWS, a pair of the graph
    of its wave operator is a pair of IsWave by the identities of (6.1) at a point of D(L), and
    conversely since IsWave is skew and the wave operator skew-adjoint, hence maximal skew,
    LinearPMap.IsSkewAdjoint.mem_graph_of_inner (new in Feec); the challenge's solutions of (6.5)
    are Feec's on the whole interval (compatibility of their data, existence and uniqueness);
    convergence is Feec.EinsteinBianchi.BoundedConvergence.tendsto_of_isStrongSolution; the datum
    (0, 0, 0, *beta) and its discrete data from Feec.EinsteinBianchi.BoundedFailure), Bounded.lean
    and Proxy.lean (the datum, its strong solutions and their loss of TSD, the fields as Feec's
    matrix fields), Smooth.lean (the C^2 states are H^1 states), MirrorData.lean, MirrorTSD.lean,
    MirrorState.lean, MirrorForward.lean, MirrorChain.lean (TSD states as the real parts of the
    constrained states of Feec's complex mirror complex on Q), MirrorFEM.lean, MirrorSpaces.lean,
    MirrorRate.lean, MirrorMain.lean, MirrorTheorems.lean (the mirror scheme, its rate, the Gauss
    witness from Feec.BGG.exists_discreteSolution_iff_compatible_u); Forms.lean, Poly.lean,
    Mesh.lean, Trace.lean, Spaces.lean, Sobolev.lean adapted from palomar/fem.

fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms, meshes, finite element spaces and H^m as in
    palomar/fem (divergences (1)-(5), (8) there; the shared blocks of
    palomar/shared/vocabulary.lean.txt); the finite element spaces of the cube have vanishing
    traces on the facets in the faces normal to e_j, j in J, the facets cubeFacets J of the
    shared femSpace (on Freudenthal meshes J = univ gives the vanishing of traces on boundary
    facets, Solution femSpace_univ_eq). Strong solutions are those of the shared
    IsStrongSolution for an operator given by its graph, a relation (Mathlib's SetRel), here the
    graph {p | IsWave p.1 p.2} of the wave operator; W~^k = L^2(Omega; Lambda^k) (x) R^3 is the
    l^2 sum of three copies (L2Vec). The fields of a state are read as matrices,
    E_ab = (u_a)_{dx_b}, B_ai = (-1)^i (rho_a)_{{i}^c}; IsTSD is symmetric, trace-free and weakly
    divergence-free (against test functions of Omega, no boundary condition). The Einstein-Bianchi
    vocabulary is the canonical text shared with palomar/constraints (the blocks L2Vec, IsTSD,
    wedge, WeakSymmetryData, bggData, IsTSDState, mirrorData; IsWave is part of the block
    WeakSymmetryData; the docstring of WeakSymmetryData no longer names IsBGG, which follows it
    here). The Freudenthal meshes are asserted existentially, named by their vertices
    (IsFreudenthal).
    (2) The wave operator is the Hodge wave operator of Gamma -> V~^1 -> W^2 x W~^2 given by its
    graph in the sign convention of (6.2) (IsWave), not as a closed operator; strong solutions
    are continuous on [0, T] with derivative within [0, T] in the graph (IsStrongSolution). The
    datum classes are D(L) (the convergence and the non-TSD limit, electric) and D(L^3) (the
    mirror rate, with the norm sum_{k <= 3} ||L^k U_0||, stated as chains IsWave U_0 V_1,
    IsWave V_1 V_2, IsWave V_2 V_3). The solutions of (6.5) enter through their trajectories,
    the paths of (sigma_h, u_h, M_h, rho_h) (Discretization.trajectories); errors are the state
    norm (||sigma - sigma_h||^2 + ||u - u_h||^2 + ||M - M_h||^2 + ||rho - rho_h||^2)^(1/2).
    (3) One theorem over the boundary conditions: CubeBC has two constructors, electric and
    mirror, with their data (CubeBC.data: bggData (cube 3), mirrorData) and the faces of the
    finite element spaces (CubeBC.top, CubeBC.bottom); FEEC.weakSymmetry_cube states for every
    bc the spaces (IsTable51 with these faces) and IsBGG, then the clauses of each boundary
    condition under bc = electric and bc = mirror. The two families of clauses differ because the
    two limits differ (the electric limit leaves TSD, the mirror limit is the TSD solution), and
    because their hypotheses differ: the mirror data satisfy IsBGG but not IsStable (d_max has the
    constants in its kernel), so the static rate and the instance of the stability theorem are
    electric only; the electric rates are for classical solutions of (6.2) of class H^1, the
    mirror rate for TSD data of D(L^3).
    (4) Electric conditions, rates: the multiplier lambda is assumed in L^2 = W^1 and
    ||lambda|| <= L; regularity H^1(Q) (the components sigma, phi_a, d~phi_a, u_a, d~u_a for (5.3);
    IsH1State for (6.2), with M and rho_a in the domain of d_min). The C^2 rates of the thesis are
    not stated: their class (C^2 up to the boundary with vanishing tangential traces, values and
    first derivatives of the fields and of their exterior derivatives bounded by L on the closed
    cube) lies in the H^1 class with bound c L (Feec.Models.Cube.FEM.IsCsFormTr.exists_h1Data:
    the field agrees on the closed cube with chi (f o r), r the nearest-point retraction and chi a
    fixed bump, a compactly supported Lipschitz function with weak derivatives its line
    derivatives, Feec.Domain.H1Data.ofLipschitz; Solution exists_isH1State_of_isSmoothStateTr),
    so they are corollaries. The discretizations are asserted existentially with named spaces
    (Table 5.1 with vanishing boundary traces) and unnamed projections (smoothed projections of
    one smoother in Feec); the continuous hypotheses of the abstract theorem (IsStable: Poincare
    inequalities, exactness, Hodge and regular decompositions) are a clause, so the cube is
    visibly an instance of FEEC.bggWeakSymmetry with S^0_h != S^0. The best-approximation clause
    is for N >= 2 (Feec's lower bound is proved on the level-(N + 2) meshes) and measures v in the
    graph norm; it shows that no projection onto the Raviart-Thomas space makes S^1_h consistent
    at the order h on V~_h^1 in the graph norm, which is why IsConsistent asks consistency on
    regular potentials only.
    (5) Electric conditions, convergence and limit: for every datum U_0 of D(L) and T > 0 a strong
    solution exists (Stone's theorem in Feec), and every family of trajectories of (6.5) without
    source whose initial states converge to U_0 converges to every strong solution from U_0
    uniformly on [0, T] (Lax: stability of (6.1) and (6.5) and convergence on the dense D(L^2));
    no regularity is assumed, and no rate is claimed. The existence of such families is stated
    for the TSD datum (0, 0, 0, *beta) only (in Feec, the trajectories from (0, 0, 0, P rho(0)),
    P the orthogonal projection onto V~_h^2), not for a general datum of D(L). The loss of TSD is
    stated as E(t) not TSD at some t and B(t') not symmetric (B(t')_ai != B(t')_ia for some a, i)
    at some t'; the discrete fields lose TSD at the same times for all large N, since TSD and
    symmetry are closed conditions. That the exact solution leaves TSD is the restriction to Q of
    ElectricVerdict.weakSymmetry of palomar/constraints, restated here as the identification of
    the limit of the method.
    (6) Mirror conditions: on the cube Q only; the bottom row component a is the closure of d_max
    on forms vanishing near the faces normal to e_a (dPart), the top row d_max. In Feec the
    theorems are proved for a complex Hilbert complex of matrix fields defined by the Fourier
    series of the reflection-symmetric extensions (the parity model); the Solution identifies the
    challenge's real states with the real parts of its constrained states. The scheme is the
    variant of (6.5) with S^0_h = pi^1 S^0, S^1_h = pi^2 S^1 for parity-smoothed cochain
    projections (one smoother for both rows), not the thesis' coupling through the canonical
    interpolants. The rate asserts some trajectory (in Feec the one from the elliptic projection
    (6.4) of the exact data). That strong solutions exist from these data and stay TSD is
    MirrorVerdict.exists_solution and MirrorVerdict.propagates of palomar/constraints, restated
    as the identification of the limit; the moving datum
    (E_0 = 2 cos(2 pi x_3) diag(1, -1, 0), or -i times it, read as a real state) is
    MirrorVerdict.moving, restated as the non-vacuity of the rate.
    (7) The discrete Gauss law (IsGauss: sigma_h = 0 and u_h orthogonal to d~psi for the discrete
    constraint pairs d tau = pi^1 S^0 psi) is only the degree-0 (div E = 0) part of the TSD
    constraint. Its preservation is stated in FEEC.bggWeakSymmetry for every discretization of BGG
    data; its non-vacuity in the mirror clause is, for all large N, a trajectory from
    (0, u_0, 0, 0) with u_0 != 0 orthogonal to the discrete constraint gradients, whose M_h is not
    constant.
    (8) FEEC.bggWeakSymmetry is the statement of the former palomar/bgg entry with its
    definitions, extended by two clauses that hold for every discretization: uniqueness for (6.5)
    and the discrete Gauss law (for IsBGG data). Its compared non-vacuity is the electric cube
    instance (spaces of Table 5.1, S_h != S) of FEEC.weakSymmetry_cube, whose rates are nonvacuous
    by FEEC.weakSymmetry_cube_nonvacuous.

