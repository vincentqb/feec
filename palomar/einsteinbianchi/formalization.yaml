status:
  scope: >-
    Formalized and compared: FEEC.bggWeakSymmetry (all BGG data on real Hilbert spaces in one
    universe, every discretization; its non-vacuity with S_h != S is the cube instance in
    FEEC.weakSymmetry_cube, replacing the data on R of the former palomar/bgg entry); FEEC.tsd_not_propagates
    (thesis boundary conditions, every nonempty bounded open set in R^3, the explicit datum
    (0, 0, 0, *beta)); FEEC.box_stationary (grad-curl system, thesis boundary conditions, every open
    box, every pair of subspaces of TSD fields); FEEC.mirror_tsd_propagates (mirror boundary
    conditions on Q: uniqueness, existence from TSD data of D(L), propagation, a TSD datum of
    D(L^3) with L U_0 != 0); FEEC.mirror_weakSymmetry_cube (the method (6.5) with mirror boundary
    conditions: spaces, bounded projections with (5.4), consistency, BGG data, a non-stationary
    solution with u_h(0) != 0 in the discrete Gauss law, the rate (1 + t) h for TSD data of D(L^3)); FEEC.weakSymmetry_cube and
    FEEC.weakSymmetry_cube_nonvacuous (the cube instance of the abstract theorem with the thesis'
    boundary conditions, S_h != S, no O(h) best approximation of S^1 on V~_h^1 by the
    Raviart-Thomas space, C^2 and H^1 rates, non-vacuity). With the thesis' boundary conditions the
    method of FEEC.weakSymmetry_cube converges to a solution that is not TSD: from the TSD datum
    (0, 0, 0, *beta) on Q the exact solution leaves TSD (FEEC.tsd_not_propagates), and (6.5)
    converges to it with no regularity hypothesis, its discrete fields leaving TSD too
    (Feec.EinsteinBianchi.BoundedConvergence.waveFEM_converges_to_non_tsd, not compared: stating it
    needs the identification of the challenge's strong solutions with those of Feec's forms model
    of (6.1) on Q, which this entry does not build; the compared rates assume C^2 or H^1 regularity
    that this solution is not shown to have). Open, and not claimed: that only stationary data keep
    TSD on general bounded domains (proved on boxes and cubes for the grad-curl system; on the ball
    only under an elliptic regularity hypothesis). Not compared here (proved in Feec): the
    lower bound for the canonical interpolant onto the Raviart-Thomas space
    (exists_interpolationError_ge, implied by the compared best-approximation clause); absorbing boundary conditions, which do not keep the
    TSD pair invariant (Feec.Models.Cube.Absorbing.not_invariant_tsdPair); the mirror conditions on
    every open cube and box for the grad-curl system and their weak trace characterization; the
    O(h^s) rates of the mirror scheme for H^(2+s) data and its convergence without rate for D(L^2)
    data; the sym-curl and ball versions of the obstruction.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

