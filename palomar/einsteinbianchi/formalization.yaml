alignment:
  namespace: "FEEC.EinsteinBianchi"
  statements:
    - source: "[QuennevilleBelair2015], Prop 4.17 (propagation), §4.10 (4.14)"
      lean: "FEEC.EinsteinBianchi.tsd_propagates"
      module: "Challenge"
      status: "proved"
      note: "Mirror conditions: strong solutions with data and forcing in the constraint stay in the constraint, on every open cube."
    - source: "[QuennevilleBelair2015], Prop 4.17 (existence and uniqueness); [CazenaveHaraux1998], Prop 4.1.6"
      lean: "FEEC.EinsteinBianchi.tsd_existsUnique"
      module: "Challenge"
      status: "proved"
      note: "Mirror conditions: classical solution in the constraint, unique among strong solutions, for data in D(L) and admissible forcing in the constraint."
    - source: "non-vacuity"
      lean: "FEEC.EinsteinBianchi.exists_nonstationary"
      module: "Challenge"
      status: "proved"
      note: "Mirror conditions: a datum of D(L) in the constraint with L U != 0 on every open cube (in Feec, (0, 2 cos(2 pi x_3) diag(1, -1, 0), 0) transported to the cube)."
    - source: "constraint propagation under electric boundary conditions; context [FriedrichNagy1999], [CPRST2003]"
      lean: "FEEC.EinsteinBianchi.electric_forward_iff"
      module: "Challenge"
      status: "proved"
      note: "Electric conditions: every datum of D(L) has a strong solution on [0, infinity), and a strong solution stays in the constraint {0} x TSD x TSD iff its datum lies there and L U0 = 0."
    - source: "constraint propagation under electric boundary conditions"
      lean: "FEEC.EinsteinBianchi.electric_tsd_leaves"
      module: "Challenge"
      status: "proved"
      note: "Electric conditions: a TSD datum of D(L) (in Feec, (0, 0, x_3 (e_1 e_2^T + e_2 e_1^T))) has strong solutions on every [0, T] and every one of them leaves the constraint in [0, T]."
    - source: "constraint propagation under absorbing boundary conditions; [Monk2003], §1.4"
      lean: "FEEC.EinsteinBianchi.absorbing_not_propagates"
      module: "Challenge"
      status: "proved"
      note: "Absorbing conditions on (0, 1/2)^3: some TSD datum has a mild solution of (E, B)' = A (E, B), and every mild solution from it leaves the TSD constraint."

