fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms, meshes, finite element spaces and H^m as in
    palomar/fem (divergences (1)-(5), (8) there), except that the finite element spaces are
    defined on the cube only, as femSpace J with vanishing traces on the facets in the faces
    normal to e_j, j in J (on Freudenthal meshes femSpace univ is palomar/fem's femSpaceMin, the
    vanishing of traces on boundary facets, Solution femSpace_univ_eq); W~^k = L^2(Omega;
    Lambda^k) ⊗ R^3 is the l^2 sum of three copies (L2Vec). The fields of a state are read as
    matrices, E_ab = (u_a)_{dx_b},
    B_ai = (-1)^i (rho_a)_{{i}^c}; IsTSD is symmetric, trace-free and weakly divergence-free
    (against test functions of Omega, no boundary condition). The Freudenthal meshes are asserted
    existentially, named by their vertices (IsFreudenthal).
    (2) The wave operator is the Hodge wave operator of Gamma -> V~^1 -> W^2 x W~^2 given by its
    graph in the sign convention of (6.2) (IsWave), not as a closed operator; strong solutions
    are continuous on [0, T] with derivative within [0, T] in the graph (IsStrongSolution). The
    datum classes are D(L) (FEEC.tsd_not_propagates, existence and propagation in
    FEEC.mirror_tsd_propagates) and D(L^3) (the rate, with the norm sum_{k <= 3} ||L^k U_0||,
    stated as chains IsWave U_0 V_1, IsWave V_1 V_2, IsWave V_2 V_3).
    (3) FEEC.tsd_not_propagates is the obstruction from one explicit datum on every bounded
    domain, not "only stationary data stay TSD"; the latter is FEEC.box_stationary, on boxes only
    and for the grad-curl system (4.14) (the states (sigma, u, rho) of
    H°Lambda^0 (x) R^3 -> H°Lambda^1 (x) R^3 -> L^2 Lambda^2 (x) R^3, without the multiplier M of
    the Ch. 6 system; IsHodgeWave), with strong solutions on [0, infinity) (Feec's statement is about
    the wave group orbit of every vector; strong solutions are the orbits of the vectors of D(L));
    on general bounded domains it is open in Feec and not claimed. Both use the boundary conditions
    of the thesis, minimal exterior derivatives (bggData, and its bottom row for the box). The
    violation of B's symmetry is stated as B(t)_ai != B(t)_ia for some t, a, i.
    (4) Mirror boundary conditions: on the cube Q = (0, 1/2)^3 only (not other domains); the
    bottom row component a is the closure of d_max on forms vanishing near the faces normal to
    e_a (dPart), the top row d_max. In Feec the theorem is proved for a complex Hilbert complex of
    matrix fields defined by the Fourier series of the reflection-symmetric extensions (the
    parity model, a compression of the torus complex); the Solution identifies the challenge's
    real forms states with the real parts of its constrained states. Non-vacuity of the data
    classes is the last clause of FEEC.mirror_tsd_propagates (the datum E_0 = 2 cos(2 pi x_3)
    diag(1, -1, 0), or -i times it, read as a real state).
    (5) The mirror scheme of FEEC.mirror_weakSymmetry_cube is the variant of (6.5) with
    S^0_h = pi^1 S^0 and S^1_h = pi^2 S^1 for parity-smoothed cochain projections (one smoother
    for both rows), not the thesis' coupling through the canonical interpolants; the
    discretizations are asserted existentially, their spaces named (Table 5.1 with mirror
    boundary conditions), their projections not. The rate asserts some semi-discrete solution:
    in Feec the one from the elliptic projection (6.4) of the exact data; existence for arbitrary
    discrete data is not stated. The error compares u, rho of the exact solution with u_h, rho_h
    and sigma_h, M_h with 0 (sigma = M = 0 for TSD solutions).
    (6) The discrete Gauss law (IsGauss: sigma_h = 0 and u_h orthogonal to d~psi for the discrete
    constraint pairs d tau = pi^1 S^0 psi) is only the degree-0 (div E = 0) part of the TSD
    constraint; the discrete fields of the method need not be TSD (Feec shows TSD is strictly
    stronger, and the discrete Gauss constraints converge only weakly). Its preservation is
    stated in FEEC.bggWeakSymmetry, for every discretization of BGG data, as an invariance of
    solutions of (6.5) without source satisfying it at t = 0. It constrains only (sigma_h, u_h)
    and leaves (M_h, rho_h) free; its non-vacuity in FEEC.mirror_weakSymmetry_cube is, for all
    large N, a solution from (0, u_0, 0, 0) with u_0 != 0 orthogonal to the discrete constraint
    gradients (u_0 represents v -> <M, pi^2 S^1 v> on V~_h^1 for M = pi^2 S^1 v_1 != 0, and
    pi^2 S^1 d~psi = 0 for the discrete pairs), whose M_h is not constant (pi^2 S^1 u_0 != 0).
    (7) The thesis-BC theorems FEEC.weakSymmetry_cube, FEEC.weakSymmetry_cube_nonvacuous: the
    multiplier lambda is assumed in L^2 = W^1 and ||lambda|| <= L in the rates; regularity C^2 up to
    the boundary with vanishing tangential traces (IsTangentialC2) or H^1(Q) (IsH1State); the
    discretizations are asserted existentially with named spaces (Table 5.1 with vanishing boundary
    traces) and unnamed projections (smoothed projections of one smoother in Feec); the continuous
    hypotheses of the abstract theorem (IsBGG, IsStable: Poincare inequalities, exactness, Hodge
    and regular decompositions) are stated as clauses, so the cube is visibly an instance of
    FEEC.bggWeakSymmetry with S^0_h != S^0; unique solvability of (5.6) is that instance (no
    separate clause). The best-approximation clause is for N >= 2 (Feec's lower bound is proved on
    the level-(N + 2) meshes) and measures v in the graph norm (||v||^2 + ||d~v||^2)^(1/2); it
    shows that no projection onto the Raviart-Thomas space makes S^1_h consistent at the order h on
    V~_h^1 in the graph norm, which is why IsConsistent asks consistency on regular potentials
    only. The discrete S^0_h != S^0 clause follows from the same field: v_N = d~psi_N is a row-wise
    discrete gradient, and S^0 psi_N in V_h^1 would put S^1 v_N = -d^1 S^0 psi_N in V_h^2. With these boundary
    conditions the exact evolution itself leaves TSD from TSD data (FEEC.tsd_not_propagates, Q
    being one of its domains): the method converges, but to solutions of (6.2) that need not be the
    constrained Einstein-Bianchi evolution. The compared rates assume a regularity (C^2 or H^1
    classes) that the solution from (0, 0, 0, *beta) is not shown to have; Feec proves, not
    compared, that (6.5) converges with no rate and no regularity hypothesis to that solution,
    which leaves TSD (waveFEM_converges_to_non_tsd).
    (8) FEEC.bggWeakSymmetry is the statement of the former palomar/bgg entry with its definitions (verbatim up to
    grouping of structure fields on lines), extended by two clauses that hold for every
    discretization: uniqueness for (6.5) (no hypothesis) and the discrete Gauss law (for IsBGG
    data). Its compared non-vacuity is the cube instance with the thesis' boundary conditions
    (spaces of Table 5.1, S_h != S) in FEEC.weakSymmetry_cube, whose rates are nonvacuous by
    FEEC.weakSymmetry_cube_nonvacuous; the mirror data satisfy IsBGG but not IsStable (d_max has
    the constants in its kernel), so only the first two clauses apply to the mirror scheme.

