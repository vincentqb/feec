status:
  scope: >-
    Formalized and compared: FEEC.EinsteinBianchi.tsd_propagates, tsd_existsUnique,
    exists_nonstationary (mirror conditions, every open cube prod_i (b_i, b_i + s), s > 0, every
    time interval [t0, t1] and every forcing in the stated classes, complex fields);
    electric_forward_iff and electric_tsd_leaves (electric conditions, every open cube, real
    fields, homogeneous system, strong solutions on [0, infinity) resp. [0, T]);
    absorbing_not_propagates (absorbing conditions on (0, 1/2)^3 only, real fields, the system
    in (E, B) without sigma, mild solutions). Not compared (proved in Feec, outside this
    statement): the same results on boxes with unequal sides (Feec.Models.Box.Mirror,
    Feec.Counterexamples.BoxStationary.forward_iff_stationary_box); the largest invariant
    subspace for the electric conditions (Feec.Counterexamples.CubeStationary.mem_invariantCore_tsd_iff);
    for the absorbing conditions the propagation of the Gauss laws and of TSD in the domain of
    dependence (Feec.Models.Cube.AbsorbingTSD); the propagation on the torus T^3 and on R^3
    (Feec.EinsteinBianchi.torus_tsd_propagates, euclidean_tsd_propagates,
    tsd_propagates_classical); the finite element discretizations of the system and their
    convergence (Feec.Instances.EinsteinBianchi.FEM.einsteinBianchiFEM_crown); the Ch. 7
    Crank-Nicolson plane-wave error (Feec.Numerics.PlaneWaveCube.unit_planeWave_cn_error_le);
    Maxwell's equations (Feec.Instances.Maxwell). Constraint-preserving boundary conditions of
    derivative type (Kreiss-Winicour, CPRST) and the Friedrich-Nagy system are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

