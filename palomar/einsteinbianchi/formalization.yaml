# formalization.yaml v0.4 for the Palomar submission of constraint propagation for the linearized Einstein-Bianchi system on a cube (`palomar/einsteinbianchi/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Constraint propagation for the linearized Einstein-Bianchi system on a cube with mirror boundary conditions"
  description: >-
    A Lean 4 formalization of the propagation of the constraints of the linearized
    Einstein-Bianchi system of general relativity (Anderson, Choquet-Bruhat, York 1997), the
    application of [QuennevilleBelair2015] (§3.4, §4.10, Prop 4.17, Ch. 7). The system evolves
    the electric and magnetic parts E, B (3x3 complex matrix fields) of the linearized Weyl
    curvature, with an auxiliary vector field sigma, as the Hodge wave equation of the matrix
    grad-curl complex: sigma' = div E + f_sigma, E' = grad sigma - curl B + f_E,
    B' = curl E + f_B ((grad sigma)_ab = d_b sigma_a; div and curl row by row). The domain is an
    arbitrary open cube C = prod_i (b_i, b_i + s) of R^3 (s > 0; the unit cube of Ch. 7 is b = 0,
    s = 1) with the tensorial mirror boundary conditions sigma . n = 0, E_(n tau) = E_(tau n) = 0,
    B_(tau tau) = 0, and, in the constraint, B_(nn) = 0. The fields are elements of
    L^2(C; C) (Mathlib's Lp for the Lebesgue measure restricted to C); grad, curl and div are
    defined by Green's formulas against C^1 test functions on R^3 vanishing on prescribed closed
    faces of the closed cube and free on the others (IsTest, IsGrad, IsCurl, IsDiv), so each
    formula is the weak derivative in C together with the boundary condition; the operator
    L(sigma, E, B) = (div E, grad sigma - curl B, curl E) is IsWave, strong and classical
    solutions (IsStrongSolution, IsClassicalSolution; cf. Pazy §4.2) ask for the equation at every
    time of the interval, the forcing class
    is C([a, c]) intersected with W^(1,1)(a, c; L^2) union L^1(a, c; D(L)) (IsAdmissible,
    Cazenave-Haraux Prop 4.1.6), and the constraint is sigma = 0 with E and B symmetric,
    trace-free and divergence-free with the wall conditions E_(tau n) = 0, B_(nn) = 0
    (Constraint, IsTSD). The compared theorems: FEEC.EinsteinBianchi.tsd_propagates (every strong
    solution on [a, c] with initial value and forcing in the constraint stays in the
    constraint); FEEC.EinsteinBianchi.tsd_existsUnique (for an initial value in D(L) and in the
    constraint and admissible forcing in the constraint there is a classical solution on
    [a, c], it stays in the constraint, and every strong solution with the same initial value
    agrees with it on [a, c]); FEEC.EinsteinBianchi.exists_nonstationary (non-vacuity: on every
    open cube some datum in D(L) and in the constraint has L U != 0, so the constraint has
    dynamical content). The statement is self-contained over Mathlib (Lp, PiLp, fderiv,
    ContDiff, set integrals, HasDerivWithinAt, interval integrals); the proof is the library Feec
    of this repository, where the mirror complex on the cube is the compression of the Fourier
    grad-curl complex of the torus along the mirror extensions and the TSD constraint is a
    reducing subcomplex (Feec.Models.Cube.Mirror, Feec.Models.Cube.MirrorTrace).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

