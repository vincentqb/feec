status:
  scope: >-
    Formalized and compared, in the namespace FEEC.ConstraintPropagation: the general criterion
    existsUnique_mild, isReducing_iff_propagates, exists_invariantCore (every skew-adjoint
    operator on every real or complex Hilbert space, every closed subspace) and
    existsUnique_mild_of_isMDissipative, isReducing_iff_propagates_of_isMDissipative (every
    m-dissipative operator); the instances mirror_propagates, tsd_propagates, tsd_existsUnique,
    exists_nonstationary (mirror conditions, every open cube prod_i (b_i, b_i + s), s > 0, every
    time interval [t0, t1] and every forcing in the stated classes, complex fields);
    electric_propagates_iff and electric_tsd_leaves (electric conditions, every open cube, real
    fields, homogeneous system, mild solutions on R resp. strong solutions on [0, T]);
    absorbing_not_propagates (absorbing conditions on (0, 1/2)^3 only, real fields, the system
    in (E, B) without sigma, mild solutions on [0, infinity)). Not compared (proved in Feec,
    outside this statement): that the Hodge wave operator d - d* of every closed Hilbert complex
    is skew-adjoint (Feec.HilbertComplex.isSkewAdjoint_wave) and that a reducing subcomplex gives
    a reducing subspace of it (Feec.HilbertComplex.ReducingSubcomplex.isReducing_totalD), which
    place the criterion on Hilbert complexes; the BGG weak-symmetry system on every bounded
    domain, whose TSD constraint does not propagate
    (Feec.Counterexamples.BoundedBGG.bggComplex_not_propagate, bggComplex_verdict; the electric
    slot of the invariant core lies in L^2(TSD_0), invariantCore₁_le_tsd₀); the same cube results on boxes with unequal sides (Feec.Models.Box.Mirror,
    Feec.Counterexamples.BoxStationary.forward_iff_stationary_box); for the absorbing conditions
    the propagation of the Gauss laws and of TSD in the domain of dependence
    (Feec.Models.Cube.AbsorbingTSD); the propagation on the torus T^3 and on R^3
    (Feec.EinsteinBianchi.torus_tsd_propagates, euclidean_tsd_propagates,
    tsd_propagates_classical); the finite element discretizations of the system and their
    convergence (Feec.Instances.EinsteinBianchi.FEM.einsteinBianchiFEM_crown); Maxwell's
    equations (Feec.Instances.Maxwell). Constraint-preserving boundary conditions of derivative
    type (Kreiss-Winicour, CPRST) and the Friedrich-Nagy system are not formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

