# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of constraint preservation for the linearized
# Einstein-Bianchi equations (`palomar/einsteinbianchi/`): the boundary conditions of the thesis
# lose the constraints, mirror boundary conditions keep them, and the weak-symmetry finite element
# method with each.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: >-
    Constraint preservation for the linearized Einstein-Bianchi equations: the thesis' boundary
    conditions lose the constraints on every bounded domain, mirror boundary conditions keep them,
    and the weak-symmetry finite element method with each
  description: >-
    The linearized Einstein-Bianchi system evolves the electric and magnetic parts E, B of the
    linearized Weyl tensor and describes gravitational waves only while E and B are TSD
    (symmetric, trace-free, divergence-free). The method of the thesis (Ch. 6) solves it as the
    Hodge wave equation (6.1) of the complex with weak symmetry Gamma -> V~^1 -> W^2 x W~^2 of the
    BGG construction, on states (sigma, u, M, rho): u the rows of E (vector 1-forms), rho the rows
    of *B (vector 2-forms), M the multiplier of the symmetry of E, sigma the potential of the
    constraint Gamma = {(sigma, phi) | d sigma = S^0 phi}; the constraint is sigma = 0, M = 0, E and
    B TSD (IsTSDState). Stated over Mathlib in the vocabulary of differential forms, with the
    definitions of forms, polynomial forms, simplicial meshes, finite element spaces and Sobolev
    spaces of palomar/fem and those of the complex with weak symmetry and its discretization of
    palomar/bgg copied verbatim; the wave operator L is given by its graph (IsWave, the equations
    (6.2) without source) and strong solutions are continuous paths in D(L) with derivative L U
    (IsStrongSolution). Five compared theorems.
    FEEC.tsd_not_propagates: with the boundary conditions of the thesis (§6.3; minimal exterior
    derivatives, vanishing tangential traces, in both rows), on every nonempty bounded open
    Omega in R^3 (no regularity), the explicit TSD datum (0, 0, 0, *beta), beta = x_3 (e_1 e_2^T +
    e_2 e_1^T), lies in the domain of L, has strong solutions on every [0, T], and every strong
    solution from it has E(t) not TSD at some t and B(t) not symmetric at some t.
    FEEC.mirror_tsd_propagates: on the cube Q = (0, 1/2)^3 with mirror boundary conditions (top
    row d_max, no condition; component a of the bottom row with vanishing tangential trace on the
    faces normal to e_a: the boundary conditions of the reflection-symmetric fields), strong
    solutions are determined by their initial value, exist on every [0, T] from every TSD datum of
    D(L) and stay TSD, and some TSD datum U_0 with U_0, L U_0, L^2 U_0 in D(L) has L U_0 != 0.
    FEEC.mirror_weakSymmetry_cube: the semi-discrete method (6.5) on Freudenthal meshes of Q with
    the elements of Table 5.1 and mirror boundary conditions, for discretizations with bounded
    projections, (5.4) and consistency of S_h = pi S at the order h_N: its solutions are
    determined by (sigma_h, u_h, M_h, rho_h)(0), the discrete Gauss law (sigma_h = 0, u_h
    orthogonal to d~psi for the discrete constraint pairs) propagates, and there is K such that for
    every TSD state U_0 with U_0, L U_0, L^2 U_0 in D(L) and every strong solution U from U_0 some
    solution of (6.5) has (||sigma_h||^2 + ||u - u_h||^2 + ||M_h||^2 + ||rho - rho_h||^2)^(1/2)(t)
    <= K (sum_{k <= 3} ||L^k U_0||) (1 + t) h_N. FEEC.weakSymmetry_cube and
    FEEC.weakSymmetry_cube_nonvacuous: with the thesis' boundary conditions on Q (minimal exterior
    derivative in both rows, elements of Table 5.1 with vanishing boundary traces) the mixed
    method (5.6) is uniquely solvable, solutions of the semi-discrete method (6.5) are determined
    by their initial values, and both converge at the rates h (static, C^2 and H^1 data) and
    (1 + t) h (wave) to the solutions of (5.3) and (6.2), for nontrivial solutions. With these
    boundary conditions the method converges to a solution that is not TSD: Feec proves (not
    compared) that (6.5) converges, with no regularity hypothesis, to the strong solution from
    the TSD datum (0, 0, 0, *beta) on Q, which leaves TSD by FEEC.tsd_not_propagates, and that its
    discrete fields leave TSD for fine meshes
    (Feec.EinsteinBianchi.BoundedConvergence.waveFEM_converges_to_non_tsd). The proof is the
    library Feec of this repository (Feec.Counterexamples.BoundedBGG, Feec.Models.Cube.MirrorBGG,
    MirrorConstraint, MirrorWeakSymmetry*, MirrorWaveRegularity, Feec.Models.Cube.WeakSymmetry*,
    Feec.HilbertComplex.*, Feec.BGG.*).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

