status:
  scope: >-
    Formalized and compared: FEEC.tsd_not_propagates (thesis boundary conditions, every nonempty
    bounded open set in R^3, the explicit datum (0, 0, 0, *beta)); FEEC.mirror_tsd_propagates
    (mirror boundary conditions on Q: uniqueness, existence from TSD data of D(L), propagation, a
    TSD datum of D(L^3) with L U_0 != 0); FEEC.mirror_weakSymmetry_cube (the method (6.5) with
    mirror boundary conditions: spaces, bounded projections with (5.4), consistency, uniqueness,
    the discrete Gauss law, the rate (1 + t) h for TSD data of D(L^3)); FEEC.weakSymmetry_cube and
    FEEC.weakSymmetry_cube_nonvacuous (the methods (5.6) and (6.5) with the thesis' boundary
    conditions, C^2 and H^1 rates, non-vacuity). With the thesis' boundary conditions the method
    of FEEC.weakSymmetry_cube converges to a solution that is not TSD: from the TSD datum
    (0, 0, 0, *beta) on Q the exact solution leaves TSD (FEEC.tsd_not_propagates), and (6.5)
    converges to it with no regularity hypothesis, its discrete fields leaving TSD too
    (Feec.EinsteinBianchi.BoundedConvergence.waveFEM_converges_to_non_tsd, not compared: the
    compared rates assume C^2 or H^1 regularity that this solution is not shown to have). Not
    compared here (proved in Feec): "only stationary data stay TSD" for the grad-curl system
    with the thesis' boundary conditions on cubes and boxes
    (Feec.Counterexamples.CubeStationary.mem_invariantCore_tsd_iff); on general bounded domains
    only the loss of the constraints from some datum is known; the failure of thesis
    Prop 5.9(2) for every projection onto the Raviart-Thomas spaces
    (Feec.Models.Cube.WeakSymmetry.exists_interpolationError_ge); absorbing boundary conditions,
    which do not keep the TSD pair invariant (Feec.Models.Cube.Absorbing.not_invariant_tsdPair);
    the mirror conditions on every open cube and box for the grad-curl system and their weak
    trace characterization; the O(h^s) rates of the mirror scheme for H^(2+s) data and its
    convergence without rate for D(L^2) data; the sym-curl and ball versions of the obstruction.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

