# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of what the weak-symmetry finite element
# method computes for the linearized Einstein-Bianchi equations (`palomar/einsteinbianchi/`): the
# abstract method, and on the cube its rates and the solution it converges to, with the electric
# and with the mirror boundary conditions.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: >-
    What the weak-symmetry finite element method computes for the linearized Einstein-Bianchi
    equations
  description: >-
    The linearized Einstein-Bianchi system evolves the electric and magnetic parts E, B of the
    linearized Weyl tensor and describes gravitational waves only while E and B are TSD
    (symmetric, trace-free, divergence-free). The method of the thesis (Ch. 5-6) solves it as the
    Hodge wave equation (6.1) of the complex with weak symmetry Gamma -> V~^1 -> W^2 x W~^2 of the
    BGG construction, on states (sigma, u, M, rho): u the rows of E (vector 1-forms), rho the rows
    of *B (vector 2-forms), M the multiplier of the symmetry of E, sigma the potential of the
    constraint Gamma = {(sigma, phi) | d sigma = S^0 phi}; the constraint is sigma = 0, M = 0, E and
    B TSD (IsTSDState). Which boundary conditions keep the constraints for the exact evolution is
    the entry palomar/constraints; this entry asks which solution the method computes. Stated over
    Mathlib in the vocabulary of differential forms, with the definitions of forms, polynomial
    forms, simplicial meshes, finite element and Sobolev spaces and strong solutions shared with
    palomar/fem and palomar/feec, and the Einstein-Bianchi vocabulary shared with
    palomar/constraints (vector forms L2Vec, vecOp; the fields mat1, mat2, IsTSD; the system (6.1):
    wedge, WeakSymmetryData with IsWave, FormData, bggData; the constraint IsTSDState; the mirror
    data dPart, mirrorData): the canonical blocks of palomar/shared/vocabulary.lean.txt, checked
    byte for byte by the gate. The finite element spaces of the cube are
    femSpace (cube 3) M S (cubeFacets J), vanishing traces on the faces of the cube normal to e_j,
    j in J. The definitions of the complex with weak symmetry and its discretization
    (WeakSymmetryData, IsBGG, IsStable, Discretization, IsSolution, IsDiscreteSolution, errorSq,
    projErrorSq) are those of the former palomar/bgg entry; the wave operator L is given by its
    graph (IsWave, the equations (6.2) without source) and strong solutions are continuous paths
    in D(L) with derivative L U (IsStrongSolution); the trajectories of (6.5) are the paths
    t -> (sigma_h, u_h, M_h, rho_h)(t) of its solutions (Discretization.trajectories). The
    boundary conditions of the cube are CubeBC: electric (bggData (cube 3): vanishing tangential
    traces on the boundary in both rows, sigma = 0 and n x E = 0, the thesis' §6.3) and mirror
    (mirrorData: no condition in the top row, in component a of the bottom row vanishing
    tangential traces on the faces normal to e_a), with the faces CubeBC.top, CubeBC.bottom of
    the finite element spaces. Three compared theorems.
    FEEC.bggWeakSymmetry (thesis Prop 5.4, Thm 5.5, Prop 6.2), the abstract method: for all BGG
    data (two segments of unbounded operators between real Hilbert spaces with bounded connecting
    maps) and every discretization (finite-dimensional subcomplexes with bounded cochain
    projections pi; the method replaces S by S_h = pi S), solutions of the semi-discrete problem
    (6.5) are determined by (sigma_h, u_h, M_h, rho_h)(0); for BGG data (d^1 S^0 = -S^1 d~^0,
    complexes) solutions without source keep the discrete Gauss law (sigma_h = 0, u_h orthogonal
    to d~psi for the discrete pairs d tau = pi^1 S^0 psi); and for every C there is K such that,
    under Poincare inequalities on V^0 and V~^0, exactness of the top row at V^1, the Hodge
    decomposition with bound on V~^1, the regular decomposition d^1 V^1 = d^1 S^0 V~^0 with bound
    and ||S^0||, ||S^1|| <= C, and for projections bounded by C satisfying the compatibility
    condition (5.4) pi^1 S^0 pi~^0 = pi^1 S^0, the discrete problem (5.6) has exactly one solution
    for every datum, and if S_h is consistent at the order h (on V~_h^0 and on regular potentials
    of the fields of V~_h^1) the squared error in the graph norms is at most K times the squared
    projection error plus h^2 (Lambda^2 + ||S^1 u||^2) plus ||(S^1 - S^1_h) u||^2, where
    ||lambda|| <= Lambda and |<S^1 u, d^1 w>| <= Lambda ||w|| on V^1.
    FEEC.weakSymmetry_cube, one theorem over the boundary conditions bc: CubeBC: there are
    discretizations of bc.data by the elements of Table 5.1 with the boundary conditions bc on
    Freudenthal meshes of Q = (0, 1/2)^3, with bounded projections, (5.4) and consistency at the
    order h_N (IsTable51 with the faces bc.top, bc.bottom), the data satisfying IsBGG (so the
    uniqueness and Gauss clauses of FEEC.bggWeakSymmetry apply), such that: with the electric
    boundary conditions, the continuous hypotheses of FEEC.bggWeakSymmetry hold (an instance with
    S_h != S: for N >= 2, pi^1 S^0 psi != S^0 psi for some psi in V~_h^0), for some c > 0 and
    every N >= 2 some nonzero v in V~_h^1 has ||S^1 v - w|| >= c (||v||^2 + ||d~v||^2)^(1/2) for
    every w in the Raviart-Thomas space V_h^2 (no projection makes S^1_h consistent at the order
    h on V~_h^1; consistency is asked on regular potentials), the static method (5.6) converges
    at the rate h for solutions of (5.3) of class H^1, solutions of (6.5) are determined by their
    initial values (also phi_h, lambda_h), (6.5) converges at the rate (1 + t) h for classical
    solutions of (6.2) of class H^1 (IsH1State), for every datum U_0 of D(L) strong solutions
    exist on every [0, T] and every family of trajectories of (6.5) whose initial states converge
    to U_0 converges to every strong solution uniformly on [0, T] (no regularity hypothesis), and
    the TSD datum (0, 0, 0, *beta), beta = x_3 (e_1 e_2^T + e_2 e_1^T), is the limit of initial
    states of trajectories of (6.5) while every strong solution from it has E(t) not TSD at some
    t and B(t') not symmetric at some t', and at these times, for all large N, so have the
    discrete fields of every such family: with the electric boundary conditions the method
    computes a solution that is not a gravitational wave. With the mirror boundary conditions,
    for every T > 0 and all large N a trajectory of (6.5) with u_h(0) != 0 satisfies the discrete
    Gauss law at t = 0 and has M_h not constant, and for every TSD state U_0 with U_0, L U_0,
    L^2 U_0 in D(L) strong solutions from U_0 exist on every [0, T], and every one, U, stays TSD
    and some trajectory of (6.5) is within K (sum_{k <= 3} ||L^k U_0||) (1 + t) h_N of U; some
    such datum has L U_0 != 0: the method computes the TSD solution.
    FEEC.weakSymmetry_cube_nonvacuous: with the electric boundary conditions, (5.3) has a
    nontrivial smooth solution meeting the hypotheses of the static rate, and for every T > 0,
    (6.2) has a nontrivial classical solution on [0, T] meeting those of the wave rate.
    The proof is the library Feec of this repository (Feec.BGG.Discrete, Feec.Models.Cube.WeakSymmetry*,
    Feec.EinsteinBianchi.BoundedConvergence, BoundedFailure, MatrixModel, Feec.Models.Cube.MirrorBGG,
    MirrorConstraint, MirrorWeakSymmetry*, MirrorWaveRegularity, Feec.Counterexamples.BoundedBGG,
    Feec.HilbertComplex.*, Feec.BGG.*, Feec.Domain.H1Lipschitz, Feec.Models.Cube.TangentialH1).
