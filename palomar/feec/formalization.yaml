status:
  scope: >-
    Formalized and compared: the three theorems FEEC.projectionFEEC, FEEC.staticFEEC and
    FEEC.evolutionFEEC, and the witness FEEC.spectral_nonvacuous (Challenge.lean, 624 lines). The
    theorems restate the former compared theorems
    FEEC.feec (a verdict of about 40 fields), FEEC.feec_rated, FEEC.staticFEEC_uniform,
    FEEC.exists_cochainProjection and FEEC.exists_subcomplexFamily_iff with no conclusion dropped,
    except those compared in other entries (the correspondence is in review.notes). Compared in
    other entries: the finite element families that meet the hypotheses of the three theorems in
    palomar/fem (FEEC.fem, FEEC.fem_parallelepiped, FEEC.fem_cube). The former witness
    FEEC.feec_cube (the lowest-order Whitney forms on the Freudenthal meshes of the cube
    (0, 1/2)^n) is no longer compared, and none of its conclusions is lost: FEEC.fem on the cube
    (star-shaped with respect to a ball by FEEC.fem_parallelepiped with A = 1/2, b = 0), with
    the Freudenthal meshes of FEEC.fem_cube and the sequence P_1^- Lambda in every degree, gives
    a family whose spaces are the Whitney forms (affine on every Kuhn simplex), with projections
    bounded in L2 uniformly in N in every degree (the last degree of every window included) and
    in the graph norm, approximation, and a Jackson estimate of order h_N = 1/(2(N+1)) on C^2
    forms; FEEC.fem_parallelepiped gives the closed ranges; the former rate C L/(N+1) of the
    mixed method on C^2 data is the rate conjunct of FEEC.staticFEEC for that estimate, not
    restated (the estimate of FEEC.fem_cube asks x and dx in H^1 instead). Also compared in other
    entries: the variational crimes of [HolstStern2012] (FEEC.crimeFEEC and its witness
    FEEC.crime_nonvacuous, formerly Theorem 4 of this entry) in palomar/crimes; the
    constraint-propagation conclusions of the former wave and evolution verdicts (a closed
    constraint propagates iff it reduces the wave operator, the invariant core,
    the constraints of reducing subcomplexes, [QuennevilleBelair2015] Prop 4.16) in
    palomar/constraints (FEEC.constraint_propagation); the BGG theorems of [ArnoldHu2021] in
    palomar/bgg; the weak-symmetry theorem in palomar/einsteinbianchi. Not compared, proved in
    Feec: the explicit constants, the spatial heat rates, the uniform fully discrete rates,
    leapfrog, Runge-Kutta, bounded perturbations, and the identification of the Fourier
    multipliers of the torus with weak derivatives (Feec.Fourier.TorusWeak.mem_graph_iff_isWeak).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

