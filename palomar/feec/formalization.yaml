    FEEC.crime_nonvacuous, FEEC.feec_cube, FEEC.bggCohomology, FEEC.bggFinrank and
    FEEC.bggHilbert (Challenge.lean, 1311 lines: OVER the Palomar limit of 1000 lines; the entry is
    not submittable as it stands, see review.notes). The weak-symmetry theorems of the former
    palomar/bgg (FEEC.bggWeakSymmetry, FEEC.bggWeakSymmetry_nonvacuous and their definitions
    WeakSymmetryData, Discretization) moved to palomar/einsteinbianchi, next to their finite
    element instance on the cube (Table 5.1). Not compared, proved in Feec: of the former
    palomar/bgg, the identification of Gamma / Delta with the output complex (24)-(26), Theorem 7,
    Proposition 1, Corollary 1 and the Moore-Penrose form of (30) (FEEC.bggIdentification,
    FEEC.bggSum, FEEC.bggExplicit, FEEC.bggOrthogonal; near-definitional bookkeeping), and the
    homology, shortExact and acyclic fields of the BGG verdict (consequences of the two
    quasi-isomorphisms); the higher-order families on general meshes (palomar/fem); the wave rate
    on the cube; Arnold-Hu §2 and §4; and, as before, the explicit constants, the spatial heat
    rates, the uniform fully discrete rates, leapfrog, Runge-Kutta, bounded perturbations, the
    wave equation with crimes, the residual splitting, and the physical instances
    (Feec/Physics/EinsteinBianchi, Feec/Models/Cube, palomar/einsteinbianchi).
