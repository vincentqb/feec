  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author. Restructure (2026-11-18, one story: the Galerkin
    approximation of Hilbert complexes): the former compared theorems become three named
    theorems, with every conclusion kept except those compared in other entries.
    Correspondence: FEEC.feec.static (closed ranges, some constant) and FEEC.staticFEEC_uniform
    (one function Phi(c, c_P)) are the second clause of FEEC.staticFEEC, the closed-range form
    through its first clause (closed range iff a Poincare inequality, new), and the static field
    of FEEC.feec_rated is the rate conjunct of that clause; the fields skewAdjoint, wave and heat
    of FEEC.feec are the three clauses of FEEC.evolutionFEEC, and the wave field of
    FEEC.feec_rated (for each scheme and regularity index, a group with the wave verdict and the
    rate) is the HasWaveRate conjunct of its wave clause (one group for every estimate, scheme and
    index; the group is unique); FEEC.exists_cochainProjection (one subcomplex) and the former
    FEEC.exists_subcomplexFamily_iff are the two clauses of FEEC.projectionFEEC (the first stated
    for families, constants uniform in h). Moved out (2026-11-18, one story per entry): Theorem 4
    (FEEC.crimeFEEC, the three clauses of the former CrimeFamily.Verdict) and its witness
    FEEC.crime_nonvacuous to palomar/crimes, with the definitions only they use (CrimeFamily and
    its notions, totalHarmonic, totalMixedSpace); the witness FEEC.feec_cube removed (its family,
    the lowest-order Whitney forms of the cube, is a family of palomar/fem), with the differential
    forms and IsCsForm; new: the witness FEEC.spectral_nonvacuous with TorusForm and torusD (the
    spectral Galerkin family of the torus, Solution/Torus.lean); Challenge 795 -> 618 lines.
    Removed earlier: SubcomplexFamily.Verdict,
    SubcomplexFamily.Rated, CrimeFamily.Verdict and IsReducing (with the fields propagates_iff,
    invariantCore, subcomplex of WaveVerdict and reducing_iff of EvolutionVerdict); new then:
    SubcomplexFamily.HasWaveRate. Earlier history: the challenge merged the former palomar/static
    and palomar/dynamic challenges (statements equivalent), and was redesigned for the 1000-line
    limit with no conclusion dropped: one mixed problem of a pair of closed operators on a Galerkin
    space (FEEC.MixedSpace, mixedForm, galerkin, IsMixedSolution: x in X and B(x; y) = <v, f> for
    all y in X, on a Galerkin space equivalent to the three equations; HilbertComplex.mixedSpace,
    Subcomplex.mixedSpace), solutions as triples; one evolution verdict for a generator and
    discrete spaces with reading maps (EvolutionVerdict A l X iota B S, as Feec's DissipFEEC) for
    the wave and the heat equations (the inclusion X_h -> W), so the heat clause also asserts
    density, the A-stable rational schemes and the temporal error; SubcomplexFamily.HasRate (the
    mixed method has a rate on regularity classes); CochainProjection.harmonicError. The Solution
    proves the componentwise forms (Solution/Legacy.lean) and converts (Solution/Convert.lean).
    Audit A (2026-11-17, an AI editor's read): the per-h fully discrete wave bound (fidelity (5))
    is disclosed; Feec proves Thm 3.7 of [AFW2010] with no closed-range hypothesis
    (Feec.HilbertComplex.Subcomplex.exists_cochainProjection), and no gap in the source's proof is
    claimed. Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only), regression snapshots and an independent AI
    review. No external mathematical review. Vocabulary pass (2026-11-18): the shared notions are
    the canonical blocks of palomar/shared/vocabulary.lean.txt (fidelity (10)); the rational
    schemes are pairs (P, Q) with A-stability on the closed half-plane and the order by
    O(z^(p+1)), the strong solutions those of a graph, both proved equivalent to the earlier text;
    the blocks boundaries, mixed and evolution are new (2026-11-18), the text of this entry,
    shared with palomar/crimes. Independent review (2026-11-18): how the conclusions of the
    former FEEC.feec_cube follow from palomar/fem and FEEC.staticFEEC (status.scope); the
    Arnold-Chen paper on parabolic problems added to the sources; the identification of the
    torus multiplier with the weak exterior derivative stated as Feec proves it (fidelity (7)).
    Witness (2026-11-18): the harmonic forms of the torus are stated finite-dimensional, of
    dimension (n choose k) in degree k (was: nonzero in the degrees 0 <= k <= n, which this
    implies), so that the cohomology clause of the static verdict is exercised (fidelity (7)); the
    solution uses Feec's de Rham model of the torus, now graded by Z, directly.

