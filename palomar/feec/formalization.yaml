status:
  scope: >-
    Formalized and compared: the four theorems FEEC.projectionFEEC, FEEC.staticFEEC,
    FEEC.evolutionFEEC and FEEC.crimeFEEC, and the witnesses FEEC.crime_nonvacuous and
    FEEC.feec_cube (Challenge.lean, 788 lines). They restate the
    former compared theorems FEEC.feec (a verdict of about 40 fields), FEEC.feec_rated,
    FEEC.staticFEEC_uniform, FEEC.exists_cochainProjection, FEEC.exists_subcomplexFamily_iff and
    FEEC.crimeFEEC with no conclusion dropped, except the constraint-propagation conclusions below
    (the correspondence is in review.notes). Compared in other entries: the constraint-propagation
    conclusions of the former wave and evolution verdicts (a closed constraint propagates iff it
    reduces the wave operator, in the sense of [Kato1995] §III.5.6; the invariant core K*, the
    largest closed reducing subspace of a constraint; the constraints of reducing subcomplexes,
    [QuennevilleBelair2015] Prop 4.16; the criterion "K reduces the generator iff S(t), t >= 0,
    keeps K and its orthogonal complement" for the wave and heat generators) are compared in
    palomar/constraints; the BGG theorems of [ArnoldHu2021] (FEEC.bggCohomology, FEEC.bggFinrank,
    FEEC.bggHilbert) in palomar/bgg; the weak-symmetry theorem FEEC.bggWeakSymmetry in
    palomar/einsteinbianchi; the higher-order families on general meshes in palomar/fem. Not
    compared, proved in Feec: the wave rate on the cube; and, as before, the explicit constants,
    the spatial heat rates, the uniform fully discrete rates, leapfrog, Runge-Kutta, bounded
    perturbations, the wave equation with crimes, the residual splitting, and the physical
    instances (Feec/Physics/EinsteinBianchi, Feec/Models/Cube, palomar/einsteinbianchi).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

