fidelity:
  divergences: >-
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; Mathlib's
    HomologicalComplex has everywhere-defined morphisms only. Complexes are on Z (a finite complex
    extends by zero), the scalars are any RCLike field, the refinement h -> 0 is any filter. Mathlib
    has no C0-semigroups: the exact evolutions are operator families asserted to exist and
    characterized by their strong solutions (unique, D(A) dense, contractions; a unitary group for
    the wave equation), which makes them unique for t >= 0. The heat equation is u' = (d - d*)^2 u =
    -Delta u. (2) Static theory, as in the former palomar/static: equivalent forms of the inf-sup
    condition (every x has a y with ||y|| <= ||x|| and ||x||^2 <= C |B(x; y)|) and of the gaps
    (W-norm quantities, equal to the V-norm ones on cycles); one constant C for all bounds of a
    degree; hypotheses localized to the degrees used; finite-dimensional harmonic forms for the
    vanishing of the harmonic gap and the eventual isomorphisms (necessary). Thm 3.7 is stated without
    closed range and with degree-dependent constants (the proof inverts P_H on the range of P_H
    restricted to the discrete harmonic forms); no gap in the source's proof is claimed. (3) Windows, as in the former
    palomar/dynamic: the evolutions live on the l2 sum of m consecutive degrees of the truncated
    complex (for an interior window L = d - d* is the Hodge-Dirac operator of the truncated
    complex). The wave conclusions assume no bound of the projections (the elliptic projections are
    bounded on every subcomplex, C_P = 4 sqrt 3, [QuennevilleBelair2015] Prop. 4.13). The heat
    conclusions assume the projections bounded in the graph norm in the degrees a, ..., a+m-2 and in
    the norm of W on D(d) in the last degree a+m-1 (with no differential in the window; for an
    interior window this W-bound differs from the V-bound of [AFW2010] §3.3 there, neither implying
    the other; the smoothed projections satisfy both), and closed ranges in the degrees a+1, ...,
    a+m-1. (4) Fully discrete: the temporal errors are in the discrete norms ||B_h^(p+1) w||, which
    are not bounded uniformly in h for arbitrary w, so the rated fully discrete wave bound is O(L
    h^(ord s) + tau^p) only along initial values with ||L_h^(p+1) v|| bounded (a per-h estimate, not
    a uniform rate; the uniform rates are proved in Feec and not compared). The rational scheme r(B)
    is n(B) Ring.inverse(d(B)); d(B) is invertible for the dissipative generators of the statement.
    The theta-schemes are not separate fields: the theta-scheme is the rational scheme n = 1 + (1 -
    theta) X, d = 1 - theta X (A-stable for theta >= 1/2, order 1, and 2 for theta = 1/2), whose
    iterates r(tau B)^n w_0 solve the implicit recurrence; the constraint residual bound is not
    restated (immediate from propagates_iff). (5) Rates: a Jackson estimate is data (mesh size h_h
    -> 0, classes Reg s i L, orders ord s, constants B s i) with ||x - v|| and ||d(x - v)|| at most
    B L h^(ord s) for some v in V_h; the static rate is a consequence of quasi-optimality and the
    bound mu_h <= 1 + c of the harmonic gap; the wave rate needs s-regularity of every component of
    the trajectories of x and L x on [0, n tau]. Rated.wave assumes only that the family
    approximates on the window (the hypothesis of the wave verdict, SubcomplexFamily.ApproximatesOn)
    and asserts that a group S with the whole wave verdict exists and satisfies the rate. No heat
    rate is compared. (6) Variational crimes: the discrete differential spaces are total (ungraded)
    complexes (X_h, d_h), d_h^2 = 0, read in a window; the mixed problems are those of the total
    differentials (the mixed Hodge Laplacian of the total complex of the window, the direct sum of
    the degreewise problems), stated as their variational equations; the continuous and discrete
    solutions are quantified universally (they are unique). The general (non-cochain) static verdict
    is stated for reading maps that need not be cochain maps nor map into D(d), which generalizes
    [HolstStern2012] (cochain morphisms); the read error compares d sigma with i_h d_h sigma_h. The
    Strang lemma takes the residual in the form |B(x; y) - <i_h v, f>| <= eps (||tau|| + ||d_h tau||
    + ||v|| + ||d_h v|| + ||q||) at every discrete test function y = (tau, v, q). The cohomology
    isomorphism is stated elementwise (onto: every discrete cycle is pi_h of a cycle modulo a
    discrete boundary; one-to-one: a cycle whose image is a discrete boundary is a boundary). The
    cochain projections are bounded in the graph norm ||pi_h x|| <= C_pi (||x|| + ||dx||) on D(d)
    (equivalent up to constants to the V-bounds of [HolstStern2012] §3.3) and need not be the left
    inverses of the family. The heat verdict with crimes assumes convergence of the static method
    for every datum (which the cochain verdict supplies) and the inner-product defect ||1 - i_h*
    i_h|| -> 0. A family carries left inverses of the reading maps bounded in W uniformly in h (so
    ||v|| <= C ||i_h v||), as in the library; [HolstStern2012] assume V-bounded projections only
    (uniform injectivity follows there from ||1 - i_h* i_h|| < 1), so this is an extra hypothesis of
    the verdicts that do not assume ||1 - i_h* i_h|| -> 0 (static, cochain poincare and rate). (7)
    Non-vacuity: the hypotheses of FEEC.feec are hypotheses on a family of subcomplexes (inhabited,
    e.g. V_h = 0 with pi_h = 0) and of the Jackson estimate (inhabited, e.g. empty classes);
    FEEC.crime_nonvacuous shows that the hypotheses of the cochain verdict admit genuine crimes
    (non-isometric reading maps, read discrete harmonic forms off the harmonic forms, positive
    errors) on a complex with nonzero harmonic forms; its reading maps are cochain maps and
    bijective, so no compared witness has reading maps that are not cochain maps (such witnesses,
    with a nonzero cochain defect, are in Feec,
    Feec.HilbertComplex.Approximation.StaticCrimeWitness, and are not compared). (8) Constraints:
    propagation and the invariant core are stated through the exact group S of the wave verdict (its
    orbits are the solutions), not through a separate notion of mild solution, and on the windows
    the family approximates (where S is asserted to exist); the skew-adjointness of L is stated for
    every window. That L maps the intersection of D(L) and K* into K*, and that this intersection is
    dense in K*, follow from the reducing property and are not restated. The criterion "K reduces
    the generator iff K and K-perp are forward invariant" is a field of the evolution verdict, so it
    is stated for both the wave and the heat generators. (9) The evolution statements assume a real
    structure [NormedSpace R (W i)] for derivatives in time, and nothing relating it to the
    K-structure: a real normed-space structure on a normed K-space is the restricted one (t x and (t
    : K) x are continuous in t and agree on Q), which the solution proves. A compared finite
    element family meeting the conforming hypotheses is FEEC.feec_cube (item (10)).
    (10) Finite element instance. FEEC.feec_cube is stated on the cube
    (0, 1/2)^n with its Freudenthal meshes and the Whitney forms only; palomar/fem states the
    P_r-Λ and P_rΛ families of every admissible sequence on every shape-regular quasi-uniform mesh
    family of a domain star-shaped with respect to a ball, with the identification of the spaces
    with the conforming finite element spaces (femSpace). Here the spaces are described by a
    necessary property only: they are subcomplexes of HΛ (so conforming) whose forms are almost
    everywhere affine on every Kuhn simplex (the Whitney forms are the affine forms a + κ b,
    a strict subspace of P1Λ in the degrees k >= 1; that they are exactly the Whitney forms is not
    stated). The cochain projections are stated bounded in every graph norm uniformly in N (they
    are moreover bounded in L2, not stated). The regularity class of the rate is IsCsForm 0 (C^2
    forms with first derivatives of w and dw bounded by L on the closure), as in palomar/fem, and
    the rate is that of the mixed method in every degree, for every solution of the continuous
    problem (which exists and is unique by FEEC.feec, closed ranges being part of the
    conclusion); the constant C depends on n and j only. HΛ is defined from test forms (the
    adjoint of the closure of the codifferential on test forms), as in palomar/fem. (11) BGG complexes. The output complex: Arnold-Hu (24)-(26) realize V^i / R(S^(i-1)) as an orthogonal
    complement with a projected differential; the challenge uses the subquotient Gamma / Delta of
    the twisted complex (its identification with (24)-(26) is proved in Feec, not compared). (12) The anticommutation d S = -S d~ is a morphism of cochain complexes V~ -> V[1], with Mathlib's
    sign convention for the shift (differential -d on V[1]); for Hilbert rows it is built from the
    bounded maps (FEEC.BGG.ofBoundedHom). (13) Bounded Hilbert complex (Theorem 6): Arnold-Hu give
    the output complex the norm of the orthogonal complements; FEEC.bggHilbert gives
    Gamma^i / Delta^i the quotient norm of the l2 norm of V^i (+) V~^i (FEEC.BGG.ΓL, FEEC.BGG.ΔL,
    FEEC.BGG.QuotL) and proves that y -> [y] is an isometry of Gamma^i ∩ (Delta^i)^perp onto it.
    For i != J this is the norm of Arnold-Hu; at J the quotient norm is
    inf_psi (||sigma + S psi||^2 + ||phi - d~ psi||^2)^(1/2), which is >= ||P_(R^perp) sigma|| and,
    under (23), <= (1 + ||(S^J)^(-1) d||^2)^(1/2) ||P_(R^perp) sigma||: equivalent, not equal.
    This equivalence is a pencil-and-paper remark; it is not proved in Feec and not stated. Closed
    range is stated as IsClosed (range D^i) where both rows have finite-dimensional cohomology in
    degree i + 1. (14) Generality beyond the source: the algebraic theorems hold over any ring, on
    Z, for arbitrary S; the hypothesis is weaker than (23): S^i injective only for i < J and onto
    modulo d for i >= J (bounded below for i < J in the Hilbert setting). (15) The equality
    criterion (27) is stated degreewise, which implies Arnold-Hu's all-degree form.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the challenge merges the former palomar/feec challenge
    (definitions and statements unchanged up to shortened docstrings) and the BGG part of the
    former palomar/bgg (FEEC.bggCohomology stated as the two quasi-isomorphisms; the other fields
    of the former BGG verdict, the identification and Theorem 7 are not compared), with the L2 de
    Rham definitions of palomar/fem (shortened docstrings) and the new FEEC.feec_cube. LINE LIMIT:
    the challenge has 1311 lines, over the Palomar hard limit of 1000; compression (docstrings,
    theorem docstrings that restated the statements) did not close the gap without cutting
    content. Candidates: keep the BGG part as its own entry (about 310 lines with its header,
    leaving about 1000 here before further docstring compression), or move the variational crimes
    to their own entry (about 210 lines); a user decision. Audit A (2026-11-17, an AI editor's
    read): the compared finite element family (FEEC.feec_cube) answers its main finding; the
    per-h fully discrete wave bound (fidelity (4)) and the toy crime witness (fidelity (7)) are
    disclosed; Feec proves Thm 3.7 of [AFW2010] with no closed-range hypothesis
    (Feec.HilbertComplex.Subcomplex.exists_cochainProjection), and no gap in the source's proof is
    claimed. Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only), regression snapshots and an independent AI
    review. No external mathematical review.

