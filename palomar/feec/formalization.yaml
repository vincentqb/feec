status:
  scope: >-
    Formalized and compared: FEEC.feec, FEEC.feec_rated, FEEC.staticFEEC_uniform,
    FEEC.exists_cochainProjection, FEEC.exists_subcomplexFamily_iff, FEEC.crimeFEEC and
    FEEC.crime_nonvacuous (Challenge.lean), for every RCLike field, every Hilbert complex on Z,
    every family of subcomplexes (or of discrete differential spaces) along any filter, every
    degree and every window. Proved in Feec but not compared: the explicit constants (the static
    constant 256 (1 + K^2)(1 + max(c, 1))^2, K = max(c, 1)(1 + c_P^2)^(1/2), is used by the
    solution of FEEC.staticFEEC_uniform), the spatial heat rates (ConstrainedFEEC.rate_heat), the
    uniform fully discrete rate O(h^alpha + tau^(p/(p+2))) for every one-step scheme and the order
    tau^p along smooth comparisons, the explicit theta-scheme temporal errors
    (theta + 1/2) n tau tau ||B_h^2 w_0|| and, for Crank-Nicolson, 5/12 n tau tau^2 ||B_h^3 w_0||
    (compared in the former palomar/dynamic, here subsumed by the rational schemes up to the
    constant), the improved L2 estimate, the necessity of closed range,
    leapfrog, Crank-Nicolson signed systems, Runge-Kutta stability functions, bounded perturbations
    (damping, Ohmic loss) and the Dyson-Phillips semigroups, Brenner-Thomee on Banach spaces, the
    wave equation with variational crimes (the approximating FEEC theorem of the crime front, its
    defect estimates and rates), the residual splitting of the static error into inner-product,
    cochain and harmonic defects, the BGG complexes, and the concrete finite element families and
    physical instances. In particular the boundary-condition results for the linearized
    Einstein-Bianchi system on a cube, compared in the former palomar/constraints, are proved in
    Feec as instances of the constraint criterion of FEEC.feec and are not compared: with mirror
    conditions the TSD constraint reduces the wave operator (K* = K; well-posedness and
    propagation with forcing in the constraint), with electric (perfect conductor) conditions K*
    is the stationary data and TSD data leave the constraint at once, and the absorbing
    (Silver-Muller) generator is m-dissipative with K* != K (Feec/Physics/EinsteinBianchi,
    Feec/Models/Cube/Mirror*, Feec/Models/Cube/Ident.lean, Feec/Models/Cube/Absorbing*,
    Feec/Counterexamples/CubeStationary.lean). The general criterion for mild solutions
    (integrated form) of skew-adjoint and m-dissipative generators on a Hilbert space is in Feec
    (Feec.Semigroup.Invariance, Feec.Semigroup.DissipativeInvariance).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

