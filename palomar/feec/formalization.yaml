  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote most Lean code and proofs under the author's direction, in git worktrees,
        each change gated by a full build with zero errors and warnings, an axiom audit, naming,
        layering and citation checks and an independent agent review before merging.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine and API"
      prompting_notes: >-
        The author set the mathematical goals (the thesis and the FEEC literature), the
        statement design and the review standard; agents proposed and proved lemmas, and wrote
        this challenge from the earlier static and dynamic challenges.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design, review of definitions and of the challenge statement."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human-directed, AI-written development. The Challenge restates over Mathlib the objects of the
    library Feec; the Solution translates them (Solution/Bridge.lean for the static theory,
    Solution/Existence.lean for the converse, Solution/Dynamic.lean for the windows and evolutions,
    Solution/Rates.lean for the rates, Solution/Crime.lean for the crimes, Solution/Witness.lean
    for the witness) and applies Feec.HilbertComplex.SubcomplexFamily.staticFEEC,
    Feec.HilbertComplex.Subcomplex.exists_cochainProjection,
    Feec.HilbertComplex.Subcomplex.exists_isGraphBounded_iff, Feec.HilbertComplex.approxFEEC,
    Feec.HilbertComplex.dissipFEEC_fullyDiscrete, Feec.HilbertComplex.ConstrainedFEEC.heatFEEC,
    Feec.HilbertComplex.ConstrainedFEEC.rate_le,
    Feec.TimeStepping.RationalScheme.norm_apply_pow_sub_exp_le,
    Feec.HilbertComplex.ApproxComplexCrime.Family.staticFEEC, the cochain case
    Feec.HilbertComplex.Approximation.StaticCochain and
    Feec.HilbertComplex.ApproxComplexCrime.HeatFamily.heatFEEC.

fidelity:
  divergences: >-
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; Mathlib's
    HomologicalComplex has everywhere-defined morphisms only. Complexes are on Z (a finite complex
    extends by zero), the scalars are any RCLike field, the refinement h -> 0 is any filter.
    Mathlib has no C0-semigroups: the exact evolutions are operator families asserted to exist and
    characterized by their strong solutions (unique, D(A) dense, contractions; a unitary group for
    the wave equation), which makes them unique for t >= 0. The heat equation is
    u' = (d - d*)^2 u = -Delta u.
    (2) Static theory, as in the former palomar/static: equivalent forms of the inf-sup condition
    (every x has a y with ||y|| <= ||x|| and ||x||^2 <= C |B(x; y)|) and of the gaps (W-norm
    quantities, equal to the V-norm ones on cycles); one constant C for all bounds of a degree;
    hypotheses localized to the degrees used; finite-dimensional harmonic forms for the vanishing
    of the harmonic gap and the eventual isomorphisms (necessary). Thm 3.7 holds without closed
    range and with degree-dependent constants; the source's proof inverts P_H on all of H, which
    needs P_H(H_h) = H; the proof here inverts it on its range.
    (3) Windows, as in the former palomar/dynamic: the evolutions live on the l2 sum of m
    consecutive degrees of the truncated complex (for an interior window L = d - d* is the
    Hodge-Dirac operator of the truncated complex). The wave conclusions assume no bound of the
    projections (the elliptic projections are bounded on every subcomplex, C_P = 4 sqrt 3,
    [QuennevilleBelair2015] Prop. 4.13). The heat conclusions assume the projections bounded in
    the graph norm in the degrees a, ..., a+m-2 and in the norm of W on D(d) in the last degree
    a+m-1 (with no differential in the window; for an interior window this W-bound differs from
    the V-bound of [AFW2010] §3.3 there, neither implying the other; the smoothed projections
    satisfy both), and closed ranges in the degrees a+1, ..., a+m-1.
    (4) Fully discrete: the temporal errors are in the discrete norms ||B_h^(p+1) w||, which are
    not bounded uniformly in h for arbitrary w, so the rated fully discrete wave bound is
    O(L h^(ord s) + tau^p) only along initial values with ||L_h^(p+1) v|| bounded (a per-h
    estimate, not a uniform rate; the uniform rates are proved in Feec and not compared). The
    rational scheme r(B) is n(B) Ring.inverse(d(B)); d(B) is invertible for the dissipative
    generators of the statement. The theta-schemes are not separate fields: the theta-scheme is
    the rational scheme n = 1 + (1 - theta) X, d = 1 - theta X (A-stable for theta >= 1/2, order
    1, and 2 for theta = 1/2), whose iterates r(tau B)^n w_0 solve the implicit recurrence; the
    constraint residual bound is not restated (immediate from propagates_iff).
    (5) Rates: a Jackson estimate is data (mesh size h_h -> 0, classes Reg s i L, orders ord s,
    constants B s i) with ||x - v|| and ||d(x - v)|| at most B L h^(ord s) for some v in V_h; the
    static rate is a consequence of quasi-optimality and the bound mu_h <= 1 + c of the harmonic
    gap; the wave rate needs s-regularity of every component of the trajectories of x and L x on
    [0, n tau]. Rated.wave assumes only that the family approximates on the window (the hypothesis
    of the wave verdict, SubcomplexFamily.ApproximatesOn) and asserts that a group S with the
    whole wave verdict exists and satisfies the rate. No heat rate is compared.
    (6) Variational crimes: the discrete differential spaces are total (ungraded) complexes
    (X_h, d_h), d_h^2 = 0, read in a window; the mixed problems are those of the total
    differentials (the mixed Hodge Laplacian of the total complex of the window, the direct sum of
    the degreewise problems), stated as their variational equations; the continuous and discrete
    solutions are quantified universally (they are unique). The general (non-cochain) static
    verdict is stated for reading maps that need not be cochain maps nor map into D(d), which
    generalizes [HolstStern2012] (cochain morphisms); the read error compares d sigma with
    i_h d_h sigma_h. The Strang lemma takes the residual in the form |B(x; y) - <i_h v, f>| <=
    eps (||tau|| + ||d_h tau|| + ||v|| + ||d_h v|| + ||q||) at every discrete test function
    y = (tau, v, q). The cohomology isomorphism is stated elementwise (onto: every discrete cycle is
    pi_h of a cycle modulo a discrete boundary; one-to-one: a cycle whose image is a discrete
    boundary is a boundary). The cochain projections are bounded in the graph norm
    ||pi_h x|| <= C_pi (||x|| + ||dx||) on D(d) (equivalent up to constants to the V-bounds of
    [HolstStern2012] §3.3) and need not be the left inverses of the family. The heat verdict with
    crimes assumes convergence of the static method for every datum (which the cochain verdict
    supplies) and the inner-product defect ||1 - i_h* i_h|| -> 0. A family carries left inverses
    of the reading maps bounded in W uniformly in h (so ||v|| <= C ||i_h v||), as in the library;
    [HolstStern2012] assume V-bounded projections only (uniform injectivity follows there from
    ||1 - i_h* i_h|| < 1), so this is an extra hypothesis of the verdicts that do not assume
    ||1 - i_h* i_h|| -> 0 (static, cochain poincare and rate).
    (7) Non-vacuity: the hypotheses of FEEC.feec are hypotheses on a family of subcomplexes
    (inhabited, e.g. V_h = 0 with pi_h = 0) and of the Jackson estimate (inhabited, e.g. empty
    classes); FEEC.crime_nonvacuous shows that the hypotheses of the cochain verdict admit genuine crimes
    (non-isometric reading maps, read discrete harmonic forms off the harmonic forms, positive
    errors) on a complex with nonzero harmonic forms; its reading maps are cochain maps and
    bijective, so no compared witness has reading maps that are not cochain maps (such witnesses,
    with a nonzero cochain defect, are in Feec, Feec.HilbertComplex.Approximation.StaticCrimeWitness,
    and are not compared).
    (8) Constraints: propagation and the invariant core are stated through the exact group S of
    the wave verdict (its orbits are the solutions), not through a separate notion of mild
    solution, and on the windows the family approximates (where S is asserted to exist); the
    skew-adjointness of L is stated for every window. That L maps the intersection of D(L) and K*
    into K*, and that this intersection is dense in K*, follow from the reducing property and are
    not restated. The
    criterion "K reduces the generator iff K and K-perp are forward invariant" is a field of the
    evolution verdict, so it is stated for both the wave and the heat generators.
    (9) The evolution statements assume a real structure [NormedSpace R (W i)] for derivatives in
    time, and nothing relating it to the K-structure: a real normed-space structure on a normed
    K-space is the restricted one (t x and (t : K) x are continuous in t and agree on Q), which the
    solution proves. The finite element families that satisfy
    the conforming hypotheses (Whitney forms, P_r and P_r^- families with smoothed projections)
    are constructed in Feec but are not compared.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the challenge of this package was written from the reviewed
    challenges of palomar/static and palomar/dynamic (their definitions and statements are
    contained, up to the changes recorded in fidelity.divergences (3), (4)); the statements of
    rational schemes, Jackson rates and variational crimes are new, and the constraint fields
    (skewAdjoint, invariantCore, subcomplex, EvolutionVerdict.reducing_iff) are folded in from the
    former palomar/constraints. An independent agent
    editorial review checked the statements against the definitions, [AFW2010] §3.3-§3.4
    (arXiv:0906.4325) and [HolstStern2012] §3 (arXiv:1005.4455), and found no hidden
    hypotheses; it is not an author or external review. Every merge of the library was gated by a full build (zero warnings), an
    axiom audit (propext, Classical.choice, Quot.sound only), regression snapshots and an
