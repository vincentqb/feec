sources:
  - title: "Finite element exterior calculus: from Hodge theory to numerical stability"
    authors:
      - "Douglas N. Arnold"
      - "Richard S. Falk"
      - "Ragnar Winther"
    id: "doi:10.1090/S0273-0979-10-01278-4"
    type: "article"
    location: "Bull. Amer. Math. Soc. (N.S.) 47 (2010), §3.3-§3.5 (Theorems 3.4-3.9; (30))"
    relationship: "formalizes"
    note: >-
      The a priori theory of §3.3-§3.4 for the mixed Hodge Laplacian (discrete cohomology,
      harmonic gap, uniform discrete Poincare inequality, unique solvability and stability,
      quasi-optimal graph-norm error bound and convergence) under the hypotheses of §3.3 in the
      degrees used, the converse Thm 3.7, and rates from approximation estimates as in §3.5
      (checked against arXiv:0906.4325: Thms 3.4-3.7 and (30) in §3.3, Thms 3.8, 3.9 in §3.4).
    author_endorsement: "not-contacted"
  - title: "A New Approach to Finite Element Simulations of General Relativity"
    authors:
      - "Vincent Quenneville-Bélair"
    id: "http://hdl.handle.net/11299/175309"
    type: "PhD thesis, University of Minnesota, 2015"
    location: "Ch. 4 (Theorems 4.6, 4.7, 4.14, Propositions 4.13, 4.16, 4.17)"
    relationship: "formalizes"
    note: >-
      The semidiscrete Hodge wave equation for a Hilbert complex: skew-adjointness of the wave
      operator, well-posedness, convergence of the semidiscrete solutions with an error bound by
      the graph-norm best approximation of the trajectory, the rate from approximation estimates,
      propagation of constraints iff they reduce the wave operator and of the constraints of
      reducing subcomplexes. The invariant core K* and the K / K-perp criterion for dissipative
      generators are added here. The formalization is by the thesis author.
    author_endorsement: "participated"
  - title: "Geometric variational crimes: Hilbert complexes, finite element exterior calculus, and problems on hypersurfaces"
    authors:
      - "Michael Holst"
      - "Ari Stern"
    id: "doi:10.1007/s10208-012-9119-7"
    type: "article"
    location: "Found. Comput. Math. 12 (2012), §3 (Thms 3.3, 3.5, 3.9, 3.10, Cors 3.4, 3.11)"
    relationship: "formalizes"
    note: >-
      Approximating families of discrete Hilbert complexes with non-isometric reading maps: the
      stability and Strang-type error estimates of the mixed Hodge Laplacian with the load i_h* f,
      and, for cochain reading maps with bounded cochain projections, the discrete Poincare
      inequality, the isomorphism on cohomology and the error estimate (checked against
      arXiv:1005.4455: Thms 3.3, 3.5 in §3.1, Thms 3.9, 3.10, Cor 3.11 in §3.3). Generalized here to
      reading maps that need not be cochain maps (for the static and heat statements).
    author_endorsement: "not-contacted"
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979)"
    relationship: "formalizes"
    note: >-
