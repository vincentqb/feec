# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the Galerkin approximation of Hilbert
# complexes (`palomar/feec/`; it replaces the former packages palomar/static and palomar/dynamic,
# whose general compared theorems it contains). Its constraint-propagation conclusions are compared
# in palomar/constraints, its BGG theorems in palomar/bgg (status.scope).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Galerkin approximation of Hilbert complexes: bounded cochain projections and uniform stability, the static theory, the Hodge wave and heat equations with fully discrete schemes, and variational crimes"
  description: >-
    When do the Galerkin methods of finite element exterior calculus for the Hodge Laplacian and
    the Hodge heat and wave equations converge, and how fast? For an arbitrary Hilbert complex of
    closed densely defined operators on Z (any RCLike field) and an arbitrary family of
    finite-dimensional subcomplexes V_h of its domain complex V = D(d) with commuting cochain
    projections pi_h, refined along any filter, four compared theorems answer. Theorem 1,
    FEEC.projectionFEEC ([AFW2010] Thm 3.7 and its converse, Thm 3.6, (30)):
    finite-dimensional subcomplexes with the discrete Poincare inequality ||v||_V <= c1 ||dv|| and
    the harmonic bound ||q|| <= c2 ||P_H q|| (constants per degree, uniform in h) have cochain
    projections bounded by (1 + c1)(1 + c2) in the graph norm, whatever the ranges; under closed
    ranges, uniformly graph-bounded cochain projections exist iff both bounds hold uniformly.
    Theorem 2, FEEC.staticFEEC ([AFW2010] Thms 3.4-3.6, 3.8, 3.9, §3.3-§3.5): the range of d^i
    is closed iff d^i satisfies a Poincare inequality; with projections bounded by c in the graph
    norm in the degrees j-1 and j and the Poincare inequalities of d^(j-1), d^j with constant c_P,
    the static verdict holds in degree j with one constant Phi(c, c_P) for every complex, family
    and degree: the gaps between the harmonic forms and the discrete harmonic forms, the maps on
    cohomology (isomorphisms under a strict gap, and eventually where V_h approximates and the
    harmonic forms are finite-dimensional, the harmonic gap then tending to 0), the uniform
    discrete Poincare inequality, unique solvability and uniform inf-sup stability of the mixed
    Hodge Laplacian, stability, quasi-optimality and convergence of the mixed method; and every
    Jackson estimate (classes Reg s of forms approximated in V_h at the order h^(ord s) in the
    graph norm, as in [AFW2010] §3.5) gives the error C L h^(ord s) when sigma, u, p and P_B u are
    s-regular with bound L. Theorem 3, FEEC.evolutionFEEC ([QuennevilleBelair2015] Thms 4.6, 4.7,
    4.14, Prop 4.13; [GilletteHolstZhu2017]; [BrennerThomee1979]): on every window W^a + ... +
    W^(a+m-1) of consecutive degrees the wave operator L = d - d* is skew-adjoint (no closed-range
    hypothesis); where the family approximates (graph norm in the degrees a, ..., a+m-2, norm of W
    in the last degree; no bound of the projections, no closed range), the Hodge wave equation
    for L is well posed with a unitary group S, its semidiscrete Galerkin solutions converge
    uniformly on bounded time intervals for every convergent family of initial values, with the
    error bound ||S(t)x - exp(t L_h) v|| <= ||v - x|| + 2 (1 + 4 sqrt 3)(1 + t) M (M a bound of
    the graph-norm best approximation of the trajectories of x and L x), every A-stable rational
    scheme r = P/Q of order p >= 1 (the theta-schemes, theta >= 1/2, included) converges as h and
    tau tend to 0, with the temporal error K n tau tau^p ||L_h^(p+1) w|| (K independent of h), and
    for every Jackson estimate the fully discrete error is at most ||v - x|| + C (1 + n tau) L
    h^(ord s) + K n tau tau^p ||L_h^(p+1) v|| when the trajectories of x and L x are s-regular with
    bound L; with projections bounded in the graph norm of the window (in the norm of W in the
    last degree) and closed ranges, the Hodge heat equation u' = L^2 u = -Delta u has the same
    evolution verdict (well-posedness, semidiscrete and fully discrete convergence, temporal
    error). Theorem 4, FEEC.crimeFEEC ([HolstStern2012] §3): for discrete differential spaces
    (X_h, d_h) with their own inner products, read in a window by uniformly bounded maps i_h with
    bounded left inverses that need not be isometric, cochain maps, nor map into D(d): on a window
    with closed ranges, under a uniform discrete Poincare inequality, the mixed Hodge Laplacian of
    the window and its discretization with the load i_h* f are uniquely solvable, the discrete
    solutions are stable, satisfy the Strang lemma (error at most the read error of any discrete
    triple plus C times its residual in the dual graph norm) and converge for every datum once the
    method is consistent on a dense set of data; for cochain reading maps with cochain projections
    bounded in the graph norm: the uniform discrete Poincare inequality, convergence for every
    datum when ||1 - i_h* i_h|| -> 0 and i_h pi_h -> 1 on D(d), eventually an isomorphism H(d) =
    H(d_h) induced by pi_h (for finite-dimensional harmonic forms), and the error at most K eps
    for data whose sigma, u, p and P_B u are within eps of i_h X_h in the graph norm with ||1 -
    i_h* i_h|| ||(sigma, u, p)|| <= eps; and the heat equation u' = L^2 u by u_h' = (d_h -
    d_h*)^2 u_h = -Delta_h u_h read by i_h has the evolution verdict of the conforming case when
    the static method converges for every datum and ||1 - i_h* i_h|| -> 0. In short: the elliptic
    and parabolic problems need bounded cochain projections, which by Theorem 1 are uniform
    discrete stability; the hyperbolic one needs only approximation. Two compared witnesses.
    FEEC.crime_nonvacuous: on the window R --id--> R --0--> R (harmonic forms R (0, 0, 1)), the
    cochain reading maps i_n = 1 + h_n N, N(a, b, c) = (0, c, 0), with cochain projections pi_n =
    1 - h_n N satisfy the hypotheses of the cochain clause of Theorem 4 (closed ranges, i_n* i_n !=
    1 but ||1 - i_n* i_n|| -> 0, i_n pi_n = 1), a discrete harmonic form is read off the harmonic
    forms, and the error at the datum (0, 0, 1) is positive at every level. FEEC.feec_cube
    ([AFW2010] §5.2, §5.5; [ChristiansenWinther2008]): on the cube (0, 1/2)^n the L2 de Rham
    complex (the weak exterior derivative, from test forms) is a Hilbert complex with closed range
    in every degree, and the Whitney forms on the Freudenthal meshes (h = 1/(2(N+1))) form a
    family of subcomplexes whose forms are almost everywhere affine on every Kuhn simplex (named
    by its vertices), with smoothed cochain projections bounded in L2 and in every graph norm
    uniformly in N, approximating in the graph norm, with the mixed-method rate C L / (N + 1) for
    C^2 solutions: the hypotheses of Theorems 2 and 3 hold for a real finite element family. The
    statement is self-contained over Mathlib; the proof is the library Feec of this repository.
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

