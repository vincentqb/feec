      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human-directed, AI-written development. The Challenge restates over Mathlib the objects of the
    library Feec; the Solution translates them (Solution/Bridge.lean for the static theory,
    Solution/Existence.lean for the converse, Solution/Dynamic.lean for the windows and evolutions,
    Solution/Rates.lean for the rates, Solution/Crime.lean for the crimes, Solution/Witness.lean
    for the witness, Solution/Forms.lean, Solution/OfFeec.lean and Solution/Cube.lean for the cube
    instance) and applies Feec.HilbertComplex.SubcomplexFamily.staticFEEC,
    Feec.HilbertComplex.Subcomplex.exists_cochainProjection,
    Feec.HilbertComplex.Subcomplex.exists_isGraphBounded_iff, Feec.HilbertComplex.approxFEEC,
    Feec.HilbertComplex.dissipFEEC_fullyDiscrete, Feec.HilbertComplex.ConstrainedFEEC.heatFEEC,
    Feec.HilbertComplex.ConstrainedFEEC.rate_le,
    Feec.TimeStepping.RationalScheme.norm_apply_pow_sub_exp_le,
    Feec.HilbertComplex.ApproxComplexCrime.Family.staticFEEC, the cochain case
    Feec.HilbertComplex.Approximation.StaticCochain and
    Feec.HilbertComplex.ApproxComplexCrime.HeatFamily.heatFEEC.

fidelity:
  divergences: >-
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; Mathlib's
    HomologicalComplex has everywhere-defined morphisms only. Complexes are on Z (a finite complex
    extends by zero), the scalars are any RCLike field, the refinement h -> 0 is any filter. Mathlib
    has no C0-semigroups: the exact evolutions are operator families asserted to exist and
    characterized by their strong solutions (unique, D(A) dense, contractions; a unitary group for
    the wave equation), which makes them unique for t >= 0. The heat equation is u' = (d - d*)^2 u =
    -Delta u. The four theorems are conjunctions of clauses, each with its own hypotheses; the
    conclusion of a clause is a verdict structure (StaticVerdict, WaveVerdict, EvolutionVerdict,
    CrimeFamily.StaticVerdict, CrimeFamily.CochainVerdict) or a rate (HasRate, HasWaveRate).
    (2) Theorem 1: stated for families of finite-dimensional subcomplexes with the discrete
    Poincare and harmonic constants per degree and uniform in h; the former single-subcomplex form
    (FEEC.exists_cochainProjection) is the case of the one-point index type. Thm 3.7 is stated
    without closed range and with degree-dependent constants (the proof inverts P_H on the range of
    P_H restricted to the discrete harmonic forms); no gap in the source's proof is claimed. The
    converse needs closed ranges, which the second clause assumes. (3) Static theory (Theorem 2),
    as in the former palomar/static: equivalent forms of the inf-sup condition (every x has a y
    with ||y|| <= ||x|| and ||x||^2 <= C |B(x; y)|) and of the gaps (W-norm quantities, equal to
    the V-norm ones on cycles); one constant Phi(c, c_P) for all bounds of a degree; hypotheses
    localized to the degrees used; finite-dimensional harmonic forms for the vanishing of the
    harmonic gap and the eventual isomorphisms (necessary). The hypotheses are graph-norm bounds
    c of the projections and Poincare inequalities with constant c_P; the first clause states
    that a Poincare inequality of d^i holds iff its range is closed, so the closed-range form of
    [AFW2010] (and of the former FEEC.feec.static, with some constant) follows. (4) Windows
    (Theorem 3), as in the former palomar/dynamic: the evolutions live on the l2 sum of m
    consecutive degrees of the truncated complex (for an interior window L = d - d* is the
    Hodge-Dirac operator of the truncated complex). The wave conclusions assume no bound of the
    projections (the elliptic projections are bounded on every subcomplex, C_P = 4 sqrt 3,
    [QuennevilleBelair2015] Prop. 4.13). The heat conclusions assume the projections bounded in the
    graph norm in the degrees a, ..., a+m-2 and in the norm of W on D(d) in the last degree a+m-1
    (with no differential in the window; for an interior window this W-bound differs from the
    V-bound of [AFW2010] §3.3 there, neither implying the other; the smoothed projections satisfy
    both), and closed ranges in the degrees a+1, ..., a+m-1. (5) Fully discrete: the temporal
    errors are in the discrete norms ||B_h^(p+1) w||, which are not bounded uniformly in h for
    arbitrary w, so the rated fully discrete wave bound is O(L h^(ord s) + tau^p) only along
    initial values with ||L_h^(p+1) v|| bounded (a per-h estimate, not a uniform rate; the uniform
    rates are proved in Feec and not compared). The rational scheme r(B) is P(B) Ring.inverse(Q(B))
    (rationalApply, 0 if Q(B) is not invertible); Q(B) is invertible for the dissipative
    generators of the statement and A-stable P/Q. The theta-schemes are not separate clauses: the
    theta-scheme is the rational scheme P = 1 + (1 - theta) X, Q = 1 - theta X (A-stable for
    theta >= 1/2, order 1, and 2 for theta = 1/2), whose iterates r(tau B)^n w_0 solve the
    implicit recurrence. (6) Rates: a Jackson estimate is data (mesh size h_h -> 0, classes
    Reg s i L, orders ord s, constants B s i) with ||x - v|| and ||d(x - v)|| at most B L h^(ord s)
    for some v in V_h; the static rate (HasRate, in Theorem 2) is a consequence of
    quasi-optimality and the bound mu_h <= 1 + c of the harmonic gap; the wave rate (HasWaveRate,
    in Theorem 3) needs s-regularity of every component of the trajectories of x and L x on
    [0, n tau] and is stated for the group S of the wave clause (unique: the strong solutions
    determine it on the dense D(L), and it is a group), for every Jackson estimate, every A-stable
    rational scheme and every regularity index, under the hypothesis of the wave clause only
    (SubcomplexFamily.ApproximatesOn). No heat rate is compared. (7) Variational crimes (Theorem 4):
    the discrete differential spaces are total (ungraded) complexes (X_h, d_h), d_h^2 = 0, read in a
    window; the mixed problems are those of the total differentials (the mixed Hodge Laplacian of
    the total complex of the window, the direct sum of the degreewise problems), stated as their
    variational equations; the continuous and discrete solutions are quantified universally (they
    are unique). The general (non-cochain) static verdict is stated for reading maps that need not
    be cochain maps nor map into D(d), which generalizes [HolstStern2012] (cochain morphisms); the
    read error compares d sigma with i_h d_h sigma_h. The Strang lemma takes the residual in the
    form |B(x; y) - <i_h v, f>| <= eps (||tau|| + ||d_h tau|| + ||v|| + ||d_h v|| + ||q||) at every
    discrete test function y = (tau, v, q). The cohomology isomorphism is stated elementwise (onto:
    every discrete cycle is pi_h of a cycle modulo a discrete boundary; one-to-one: a cycle whose
    image is a discrete boundary is a boundary). The cochain projections are bounded in the graph
    norm ||pi_h x|| <= C_pi (||x|| + ||dx||) on D(d) (equivalent up to constants to the V-bounds of
    [HolstStern2012] §3.3) and need not be the left inverses of the family. The heat verdict with
    crimes assumes convergence of the static method for every datum (which the cochain verdict
    supplies) and the inner-product defect ||1 - i_h* i_h|| -> 0. A family carries left inverses of
    the reading maps bounded in W uniformly in h (so ||v|| <= C ||i_h v||), as in the library;
    [HolstStern2012] assume V-bounded projections only (uniform injectivity follows there from ||1 -
    i_h* i_h|| < 1), so this is an extra hypothesis of the verdicts that do not assume ||1 - i_h*
    i_h|| -> 0 (static, cochain poincare and rate). (8)
    Non-vacuity: the hypotheses of Theorems 1-3 are hypotheses on a family of subcomplexes
    (inhabited, e.g. V_h = 0 with pi_h = 0) and of the Jackson estimate (inhabited, e.g. empty
    classes); FEEC.feec_cube is a compared finite element family meeting them (item (11));
    FEEC.crime_nonvacuous shows that the hypotheses of the cochain clause of Theorem 4 admit
    genuine crimes (non-isometric reading maps, read discrete harmonic forms off the harmonic
    forms, positive errors) on a complex with nonzero harmonic forms; its reading maps are cochain
    maps and bijective, so no compared witness has reading maps that are not cochain maps (such
    witnesses, with a nonzero cochain defect, are in Feec,
    Feec.HilbertComplex.Approximation.StaticCrimeWitness, and are not compared). (9) Constraints:
    the constraint-propagation conclusions of the former wave and evolution verdicts are not
    stated here; they are compared in palomar/constraints (status.scope). (10) The evolution
    statements assume a real structure [NormedSpace R (W i)] for derivatives in time, and nothing
    relating it to the K-structure: a real normed-space structure on a normed K-space is the
    restricted one (t x and (t : K) x are continuous in t and agree on Q), which the solution
    proves. (11) Finite element instance. FEEC.feec_cube is stated on the cube (0, 1/2)^n with its
    Freudenthal meshes and the Whitney forms only; palomar/fem states the P_r-Λ and P_rΛ families
    of every admissible sequence on every shape-regular quasi-uniform mesh family of a domain
    star-shaped with respect to a ball, with the identification of the spaces with the conforming
    finite element spaces (femSpace). Here the spaces are described by a necessary property only:
    they are subcomplexes of HΛ (so conforming) whose forms are almost everywhere affine on every
    Kuhn simplex (the Whitney forms are the affine forms a + κ b, a strict subspace of P1Λ in the
    degrees k >= 1; that they are exactly the Whitney forms is not stated). The cochain projections
    are stated bounded in L2 and in every graph norm uniformly in N (the L2 bound is the
    hypothesis of the heat clause of Theorem 3 in the last degree of a window). The regularity
    class of the rate is IsCsForm 0 (C^2 forms with first derivatives of w and dw bounded by L on
    the closure), as in palomar/fem, and the rate is that of the mixed
    method in every degree, for every solution of the continuous problem (which exists and is
    unique by Theorem 2, closed ranges being part of the conclusion); the constant C depends on n
    and j only. HΛ is defined from test forms (the adjoint of the closure of the codifferential on
    test forms), as in palomar/fem. (12) Shared vocabulary: the notions this entry shares with the
    other Palomar entries are copied from the canonical blocks of
    palomar/shared/vocabulary.lean.txt (HilbertComplex with Subcomplex, CochainProjection,
    SubcomplexFamily, graphDist, IsGraphBoundedBy, IsGraphBounded, Approximates and Jackson;
    IsStrongSolution; IsAStable, HasOrder, rationalApply; the differential forms; IsCsForm), and the
    gate checks them byte for byte. The sign sgn takes values in any ring (here R, as in
    palomar/fem). Two of them read differently from the earlier text, with the same meaning.
    Strong solutions are those of an operator given by its graph, a relation A ⊆ X × X (Mathlib's
    SetRel), so the evolution verdict states IsStrongSolution A.graph (definitionally the earlier
    LinearPMap form, Solution: FEEC.isStrongSolution_graph_iff). A rational scheme is a pair
    (P, Q) of real polynomials, A-stable when Q has no zero and |P/Q| <= 1 on the closed left
    half-plane ([HairerWanner1996], §IV.3), of order p when P(z)/Q(z) - e^z = O(z^(p+1)) at 0,
    instead of a structure n/d with deg n <= deg d and no pole in re z <= 0, A-stable on the
    imaginary axis, of order p when X^(p+1) divides n - d T_p; the Solution proves the two forms
    equivalent (FEEC.isAStable_iff, the converse by the maximum modulus principle on the unit disc
    through the Cayley transform w -> (w - 1)/(w + 1); FEEC.hasOrder_iff).

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author. Restructure (2026-11-18, one story: the Galerkin
    approximation of Hilbert complexes): the former compared theorems become four named
    theorems and two witnesses, with every conclusion kept except the constraint-propagation ones
    (compared in palomar/constraints) and the BGG theorems (compared in palomar/bgg).
    Correspondence: FEEC.feec.static (closed ranges, some constant) and FEEC.staticFEEC_uniform
    (one function Phi(c, c_P)) are the second clause of FEEC.staticFEEC, the closed-range form
    through its first clause (closed range iff a Poincare inequality, new), and the static field
    of FEEC.feec_rated is the rate conjunct of that clause; the fields skewAdjoint, wave and heat
    of FEEC.feec are the three clauses of FEEC.evolutionFEEC, and the wave field of
    FEEC.feec_rated (for each scheme and regularity index, a group with the wave verdict and the
    rate) is the HasWaveRate conjunct of its wave clause (one group for every estimate, scheme and
    index; the group is unique); FEEC.exists_cochainProjection (one subcomplex) and the former
    FEEC.exists_subcomplexFamily_iff are the two clauses of FEEC.projectionFEEC (the first stated
    for families, constants uniform in h); the three fields of the former
    CrimeFamily.Verdict are the three clauses of FEEC.crimeFEEC. Removed definitions:
    SubcomplexFamily.Verdict, SubcomplexFamily.Rated, CrimeFamily.Verdict and IsReducing (with the
    fields propagates_iff, invariantCore, subcomplex of WaveVerdict and reducing_iff of
    EvolutionVerdict); new: SubcomplexFamily.HasWaveRate, and the L2 bound of the projections in
    FEEC.feec_cube (so that it meets the heat clause of Theorem 3 on every window). Challenge
    999 -> 788 lines. Earlier
    history: the challenge merged the former palomar/static and palomar/dynamic challenges
    (statements equivalent), the L2 de Rham definitions of palomar/fem (shortened docstrings) and
    FEEC.feec_cube, and was redesigned for the 1000-line limit with no conclusion dropped: one
    mixed problem of a pair of closed operators on a Galerkin space (FEEC.MixedSpace, mixedForm,
    galerkin, IsMixedSolution: x in X and B(x; y) = <v, f> for all y in X, on a Galerkin space
    equivalent to the three equations; HilbertComplex.mixedSpace, Subcomplex.mixedSpace,
    totalMixedSpace), solutions as triples; one evolution verdict for a generator and discrete
    spaces with reading maps (EvolutionVerdict A l X iota B S, as Feec's DissipFEEC) for the
    wave, the heat and the crime heat equations (the conforming ones with the inclusion
    X_h -> W), so the crime heat clause also asserts density, the A-stable rational schemes and
    the temporal error; crime triples (CrimeFamily.IsSolution, ResidualLE, readGap, ConvergesAt,
    defect); SubcomplexFamily.HasRate (the mixed method has a rate on regularity classes) shared
    by FEEC.staticFEEC and FEEC.feec_cube; CochainProjection.harmonicError; dMax with its test
    graph inline. Variational crimes as the general case was assessed and not applied to the
    statements: Feec already embeds the conforming windows (ConformingFamily.Verdict.crime), but
    the conforming theorems have conclusions without crime analogues (harmonic gaps, the inclusion
    isomorphism on cohomology, the 4 sqrt 3 wave bound), so one crime theorem would drop them. The
    Solution proves the componentwise forms (Solution/Legacy.lean) and converts
    (Solution/Convert.lean). Audit A (2026-11-17, an AI editor's read): the compared finite
    element family (FEEC.feec_cube) answers its main finding; the per-h fully discrete wave bound
    (fidelity (5)) and the toy crime witness (fidelity (8)) are disclosed; Feec proves Thm 3.7 of
    [AFW2010] with no closed-range hypothesis
    (Feec.HilbertComplex.Subcomplex.exists_cochainProjection), and no gap in the source's proof is
    claimed. Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only), regression snapshots and an independent AI
    review. No external mathematical review. Vocabulary pass (2026-11-18): the shared notions are
    the canonical blocks of palomar/shared/vocabulary.lean.txt (fidelity (12)); the rational
    schemes are pairs (P, Q) with A-stability on the closed half-plane and the order by
    O(z^(p+1)), the strong solutions those of a graph, both proved equivalent to the earlier text.

