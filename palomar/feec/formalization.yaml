fidelity:
  divergences: >-
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; Mathlib's
    HomologicalComplex has everywhere-defined morphisms only. Complexes are on Z (a finite complex
    extends by zero), the scalars are any RCLike field, the refinement h -> 0 is any filter. Mathlib
    has no C0-semigroups: the exact evolutions are operator families asserted to exist and
    characterized by their strong solutions (unique, D(A) dense, contractions; a unitary group for
    the wave equation), which makes them unique for t >= 0. The heat equation is u' = (d - d*)^2 u =
    -Delta u. The three theorems are conjunctions of clauses, each with its own hypotheses; the
    conclusion of a clause is a verdict structure (StaticVerdict, WaveVerdict, EvolutionVerdict)
    or a rate (HasRate, HasWaveRate).
    (2) Theorem 1: stated for families of finite-dimensional subcomplexes with the discrete
    Poincare and harmonic constants per degree and uniform in h; the former single-subcomplex form
    (FEEC.exists_cochainProjection) is the case of the one-point index type. Thm 3.7 is stated
    without closed range and with degree-dependent constants (the proof inverts P_H on the range of
    P_H restricted to the discrete harmonic forms); no gap in the source's proof is claimed. The
    converse needs closed ranges, which the second clause assumes. (3) Static theory (Theorem 2),
    as in the former palomar/static: equivalent forms of the inf-sup condition (every x has a y
    with ||y|| <= ||x|| and ||x||^2 <= C |B(x; y)|) and of the gaps (W-norm quantities, equal to
    the V-norm ones on cycles); one constant Phi(c, c_P) for all bounds of a degree; hypotheses
    localized to the degrees used; finite-dimensional harmonic forms for the vanishing of the
    harmonic gap and the eventual isomorphisms (necessary). The hypotheses are graph-norm bounds
    c of the projections and Poincare inequalities with constant c_P; the first clause states
    that a Poincare inequality of d^i holds iff its range is closed, so the closed-range form of
    [AFW2010] (and of the former FEEC.feec.static, with some constant) follows. (4) Windows
    (Theorem 3), as in the former palomar/dynamic: the evolutions live on the l2 sum of m
    consecutive degrees of the truncated complex (for an interior window L = d - d* is the
    Hodge-Dirac operator of the truncated complex). The wave conclusions assume no bound of the
    projections (the elliptic projections are bounded on every subcomplex, C_P = 4 sqrt 3,
    [QuennevilleBelair2015] Prop. 4.13). The heat conclusions assume the projections bounded in the
    graph norm in the degrees a, ..., a+m-2 and in the norm of W on D(d) in the last degree a+m-1
    (with no differential in the window; for an interior window this W-bound differs from the
    V-bound of [AFW2010] §3.3 there, neither implying the other; the smoothed projections satisfy
    both), and closed ranges in the degrees a+1, ..., a+m-1. (5) Fully discrete: the temporal
    errors are in the discrete norms ||B_h^(p+1) w||, which are not bounded uniformly in h for
    arbitrary w, so the rated fully discrete wave bound is O(L h^(ord s) + tau^p) only along
    initial values with ||L_h^(p+1) v|| bounded (a per-h estimate, not a uniform rate; the uniform
    rates are proved in Feec and not compared). The rational scheme r(B) is P(B) Ring.inverse(Q(B))
    (rationalApply, 0 if Q(B) is not invertible); Q(B) is invertible for the dissipative
    generators of the statement and A-stable P/Q. The theta-schemes are not separate clauses: the
    theta-scheme is the rational scheme P = 1 + (1 - theta) X, Q = 1 - theta X (A-stable for
    theta >= 1/2, order 1, and 2 for theta = 1/2), whose iterates r(tau B)^n w_0 solve the
    implicit recurrence. (6) Rates: a Jackson estimate is data (mesh size h_h -> 0, classes
    Reg s i L, orders ord s, constants B s i) with ||x - v|| and ||d(x - v)|| at most B L h^(ord s)
    for some v in V_h; the static rate (HasRate, in Theorem 2) is a consequence of
    quasi-optimality and the bound mu_h <= 1 + c of the harmonic gap; the wave rate (HasWaveRate,
    in Theorem 3) needs s-regularity of every component of the trajectories of x and L x on
    [0, n tau] and is stated for the group S of the wave clause (unique: the strong solutions
    determine it on the dense D(L), and it is a group), for every Jackson estimate, every A-stable
    rational scheme and every regularity index, under the hypothesis of the wave clause only
    (SubcomplexFamily.ApproximatesOn). No heat rate is compared. (7) Non-vacuity: the hypotheses
    of the three theorems are hypotheses on a family of subcomplexes and of a Jackson estimate
    (inhabited, e.g. by empty classes). FEEC.spectral_nonvacuous is a compared nontrivial family
    meeting all the hypotheses on the family (those on a Jackson estimate are met by empty
    classes), with no finite element vocabulary: the de Rham complex of the torus T^n in Fourier
    coefficients and its spectral Galerkin spaces. It is stated on the Fourier side:
    the spaces are l2(Z^n; Lambda^k) with complex coefficients (TorusForm), the differential is
    characterized by its graph, {(u, w) | w(xi)_s = torusD u xi s for all xi, s} (the maximal
    multiplier by the symbol 2 pi i xi wedge), and the family by its spaces (u(xi) = 0 for
    |xi|_inf > N) and projections (the truncation of the coefficients). By Parseval these are the
    L2 de Rham complex of T^n and its trigonometric polynomials of degree <= N in each variable;
    that the multiplier is the weak exterior derivative of L2(T^n; Lambda^k) is not part of the
    statement (Feec proves that the torus multiplier of every first-order constant-coefficient
    symbol, linear in the frequency as this one is, is the weak realization of its operator,
    Feec.Fourier.TorusWeak.mem_graph_iff_isWeak; the instance for this symbol is not stated in
    Feec, and none of it is compared). The hypotheses of Theorem 1 (the discrete Poincare
    inequality and the harmonic bound, uniformly in N) are obtained in the solution from the
    second clause of Theorem 1 itself (closed ranges and graph-bounded projections); the
    constants are not stated. No Jackson estimate with nonempty classes is stated for the family
    (the trigonometric approximation rates are not formalized), so the rate conjuncts of
    Theorems 2 and 3 are exercised only by palomar/fem. The witness states that the harmonic
    forms are finite-dimensional, of dimension (n choose k) in degree k (the constant forms), the
    hypothesis of the eventual cohomology isomorphism of the static verdict, so every clause of
    Theorems 1-3 but the rates is exercised. The finite element families of palomar/fem
    (FEEC.fem, FEEC.fem_parallelepiped, FEEC.fem_cube) meet the hypotheses too and are compared
    there, with the definitions of this entry (item (10)).
    (8) The evolution statements assume a real structure [NormedSpace R (W i)] for derivatives in
    time, and nothing relating it to the K-structure: a real normed-space structure on a normed
    K-space is the restricted one (t x and (t : K) x are continuous in t and agree on Q), which the
    solution proves. (9) Variational crimes, constraints: the conforming theory alone is stated
    here. The variational crimes of [HolstStern2012] (discrete complexes that are not
    subcomplexes, non-isometric reading maps) are the subject of palomar/crimes, which shares the
    Hilbert complexes, windows, mixed problems and the evolution verdict of this entry; the
    constraint-propagation conclusions of the former wave and evolution verdicts are compared in
    palomar/constraints as FEEC.constraint_propagation. (10) Shared vocabulary: the notions this
    entry shares with the other Palomar entries are copied from the canonical blocks of
    palomar/shared/vocabulary.lean.txt (HilbertComplex, shared with palomar/fem,
    palomar/constraints, palomar/crimes and palomar/waves; SubcomplexFamily with graphNorm,
    Subcomplex, CochainProjection, graphDist, IsGraphBoundedBy, IsGraphBounded, Approximates and
    Jackson, shared with palomar/fem; window with Total, totalDomain, totalD and wave, shared with
    palomar/constraints, palomar/crimes and palomar/waves; the square sq of an operator, shared
    with palomar/constraints and palomar/crimes; boundaries, the mixed problem (MixedSpace,
    mixedForm, galerkin, IsMixedSolution) and the evolution verdict (semiflow,
    EvolutionVerdict), shared with palomar/crimes; IsStrongSolution, shared with
    palomar/constraints, palomar/crimes and palomar/einsteinbianchi; IsAStable, HasOrder,
    rationalApply, shared with palomar/crimes and palomar/timestepping), and the
    gate checks them byte for byte. Two of them read differently from the earlier text, with the
    same meaning. Strong solutions are those of an operator given by its graph, a relation
    A ⊆ X × X (Mathlib's SetRel), so the evolution verdict states IsStrongSolution A.graph
    (definitionally the earlier LinearPMap form, Solution: FEEC.isStrongSolution_graph_iff). A
    rational scheme is a pair (P, Q) of real polynomials, A-stable when Q has no zero and
    |P/Q| <= 1 on the closed left half-plane ([HairerWanner1996], §IV.3), of order p when
    P(z)/Q(z) - e^z = O(z^(p+1)) at 0, instead of a structure n/d with deg n <= deg d and no pole
    in re z <= 0, A-stable on the imaginary axis, of order p when X^(p+1) divides n - d T_p; the
    Solution proves the two forms equivalent (FEEC.isAStable_iff, the converse by the maximum
    modulus principle on the unit disc through the Cayley transform w -> (w - 1)/(w + 1);
    FEEC.hasOrder_iff).

