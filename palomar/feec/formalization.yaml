# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of finite element exterior calculus for
# Hilbert complexes (`palomar/feec/`; it replaces the former packages palomar/static,
# palomar/dynamic and palomar/constraints, whose general compared theorems it contains).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Finite element exterior calculus for Hilbert complexes"
  description: >-
    The approximation theory of finite element exterior calculus in one statement: the static
    theory of Arnold-Falk-Winther (cohomology, discrete stability, quasi-optimality of the mixed
    Hodge Laplacian), the semidiscrete Hodge wave equation of the author's thesis (well-posedness,
    convergence, error bound, constraint propagation and the invariant core of a constraint), the
    Hodge heat equation, fully discrete
    A-stable time stepping, Jackson rates, and the variational crimes of Holst-Stern, for an
    arbitrary Hilbert complex of closed densely defined operators on Z (any RCLike field) and an
    arbitrary family of finite-dimensional subcomplexes of its domain complex V = D(d) with
    commuting cochain projections, refined along any filter. Seven compared theorems.
    FEEC.feec (the verdict SubcomplexFamily.Verdict): (skew-adjointness, [QuennevilleBelair2015]
    Thm 4.6) on every window the wave operator L = d - d* satisfies L* = -L, with no closed range;
    (static, [AFW2010] Thms 3.4-3.6, 3.8, 3.9)
    in a degree j with projections bounded in the graph norm in degrees j-1 and j and closed
    ranges of d^(j-1) and d^j: the gaps between the harmonic forms and the discrete harmonic
    forms, the maps on cohomology (isomorphisms under a strict gap, and eventually where V_h
    approximates and the harmonic forms are finite-dimensional, the harmonic gap then tending to
    0), the uniform discrete Poincare inequality, unique solvability and uniform inf-sup stability
    of the mixed Hodge Laplacian, quasi-optimality and convergence of the mixed method; (wave,
    [QuennevilleBelair2015] Thms 4.6, 4.7, 4.14, Props 4.13, 4.17) on every window
    W^a + ... + W^(a+m-1) of consecutive degrees in which the family approximates (graph norm in
    the degrees a, ..., a+m-2, norm of W in the last degree), the Hodge wave equation for
    L = d - d* is well posed with a unitary group S, its semidiscrete Galerkin solutions converge
    uniformly on bounded time intervals for every convergent family of initial values, with the
    error bound ||S(t)x - exp(t L_h) v|| <= ||v - x|| + 2 (1 + 4 sqrt 3)(1 + t) M (M a bound of the
    graph-norm best approximation of the trajectories of x and L x), a closed constraint K
    propagates (S(t) K in K for all real t) iff it reduces L (P_K D(L) in D(L), L P_K = P_K L,
    [Kato1995] §III.5.6), the data x with S(t) x in K for all t form the invariant core K*, the
    largest closed subspace of K reducing L, and for a reducing subcomplex (closed Z^i in W^i with
    d P_(Z^i) = P_(Z^j) d on D(d), Prop 4.16) the constraint Z^a + ... + Z^(a+m-1) propagates;
    (heat) with projections bounded in the graph norm of the window and closed ranges, the same
    convergence for the Hodge heat equation u' = L^2 u = -Delta u; for both evolutions a closed K
    reduces the generator iff S(t), t >= 0, maps K into K and its orthogonal complement into
    itself (the criterion for m-dissipative generators, e.g. damped or absorbing problems);
    (fully discrete, [BrennerThomee1979]) for both equations, every A-stable rational scheme
    r = n/d of order p >= 1 (the theta-schemes, theta >= 1/2, included) converges as h and tau
    tend to 0, with the temporal error K n tau tau^p ||B_h^(p+1) w||, K independent of h.
    FEEC.feec_rated (SubcomplexFamily.Rated), for every Jackson estimate (classes Reg s of forms
    approximated in V_h at the order h^(ord s) in the graph norm, as in [AFW2010] §3.5): the error
    of the mixed method is at most C L h^(ord s) when sigma, u, p and P_B u are s-regular with
    bound L, and on every window which the family approximates the group S of the wave equation
    (with the whole wave verdict) exists and the fully discrete wave error of every A-stable
    rational scheme of order p is at most ||v - x|| + C (1 + n tau) L h^(ord s) +
    K n tau tau^p ||L_h^(p+1) v|| when the trajectories of x and L x are s-regular with bound L.
    FEEC.staticFEEC_uniform: the static constant depends only on the bound c of the projections
    and the Poincare constant c_P (one function Phi for every complex, family and degree).
    FEEC.exists_cochainProjection ([AFW2010] Thm 3.7): a finite-dimensional subcomplex with the
    discrete Poincare inequality ||v||_V <= c1 ||dv|| and the harmonic bound ||q|| <= c2 ||P_H q||
    in every degree has a cochain projection bounded by (1 + c1)(1 + c2) in the graph norm; and
    FEEC.exists_subcomplexFamily_iff ([AFW2010] Thms 3.6, 3.7, (30)): under closed ranges,
    uniformly graph-bounded cochain projections exist iff these two conditions hold uniformly.
    FEEC.crimeFEEC ([HolstStern2012] §3; HilbertComplex.CrimeFamily.Verdict): for discrete
    differential spaces (X_h, d_h) with their own inner products, read in a window by uniformly
    bounded maps i_h with bounded left inverses, that need not be isometric, cochain maps, nor map
    into D(d): on a window with closed ranges, under a uniform discrete Poincare inequality, the mixed Hodge
    Laplacian of the window and its discretization with the load i_h* f are uniquely solvable,
    the discrete solutions are stable, satisfy the Strang lemma (error at most the read error of
    any discrete triple plus C times its residual in the dual graph norm) and converge for every
    datum once the method is consistent on a dense set of data, and the heat equation converges
    (i_h exp(-t Delta_h) v_h -> U(t)x uniformly on [0, T] for every family i_h v_h -> x) when the
    static method converges for every datum and ||1 - i_h* i_h|| -> 0; for cochain reading maps
    with cochain projections bounded in the graph norm: the uniform discrete Poincare inequality,
    convergence for every datum when ||1 - i_h* i_h|| -> 0 and i_h pi_h -> 1 on D(d), eventually an
    isomorphism H(d) = H(d_h) induced by pi_h (for finite-dimensional harmonic forms), and the
    error at most K eps for data whose sigma, u, p and P_B u are within eps of i_h X_h in the graph
    norm with ||1 - i_h* i_h|| ||(sigma, u, p)|| <= eps. FEEC.crime_nonvacuous: on the window
    R --id--> R --0--> R (harmonic forms R (0, 0, 1)), the cochain reading maps i_n = 1 + h_n N,
    N(a, b, c) = (0, c, 0), with cochain projections pi_n = 1 - h_n N satisfy the hypotheses
    (closed ranges, i_n* i_n != 1 but ||1 - i_n* i_n|| -> 0, i_n pi_n = 1), a discrete harmonic
    form is read off the harmonic forms, and the error at the datum (0, 0, 1) is positive at every
    level. The statement is self-contained over Mathlib; the proof is the library Feec of this
    repository.
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

