status:
  scope: >-
    Formalized and compared: FEEC.fem and FEEC.femMin for every dimension n >= 1, every bounded
    open domain star-shaped with respect to a ball, every shape-regular quasi-uniform family of
    conforming simplicial meshes of it with h_N -> 0, and every admissible sequence with r_k >= 1,
    including the wave and heat verdicts on every window of degrees; FEEC.fem_parallelepiped for
    every parallelepiped; FEEC.maxwell for n = 3 on the same domains
    and meshes. Not compared (proved in Feec, outside the
    statement): the Whitney forms as a separate family (they are the sequence P_1^- in every
    degree), the dimension counts and unisolvence of the degrees of freedom, the finite element
    theory of the cube with mixed boundary conditions, the cubical and weak-symmetry elements,
    the Einstein-Bianchi instances, the perfect-electric-conductor Maxwell discretization in
    vector proxies (it is the window [0, 3) of FEEC.femMin in forms), the wave and heat rates
    for these families (palomar/feec's feec_rated applies to the Jackson estimate of FEEC.fem,
    not restated here), the H^1 approximation of the smoothed projections;
    the closed range on general star-shaped domains (a hypothesis of the static theory there,
    true on Lipschitz domains by Costabel-McIntosh 2010, not formalized).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

