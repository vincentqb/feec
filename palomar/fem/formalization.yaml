fidelity:
  divergences: >-
    (1) Coordinates: points of R^n are Fin n -> R (sup norm), forms are given by their
    coefficients on dx_s, s an increasing k-subset of Fin n, and L^2(Omega; Lambda^k) is the
    l^2 sum of copies of L^2(Omega); this is the standard coordinate model, not Mathlib's
    (alternating-map) differential forms.
    (2) The weak exterior derivative is defined as the adjoint of the closure of the formal
    adjoint d^t on test forms (Mathlib's LinearPMap.adjoint), and the minimal one as the closure
    of d on test forms (Submodule.toLinearPMap of the closed graph); the docstrings state the
    weak characterization, which is Mathlib's definition of the adjoint domain.
    (3) The finite element spaces are stated as piecewise polynomial forms with single-valued
    tangential traces on every common face (the trace agreement on all subsimplices, not only on
    facets); the sources define them through degrees of freedom or as the piecewise polynomial
    forms in H Lambda^k(Omega). The equivalence with the degrees of freedom is proved in the
    solution; the equivalence with membership in H Lambda^k is not stated (the conformity
    direction is a consequence of the subcomplex property, which is compared).
    (4) Shape regularity is the bound h_T / rho_T <= sigma (Ciarlet §3.1), stated as: every
    simplex contains a ball of radius rho with h_T <= sigma rho, for the sup norm of Fin n -> R
    (Euclidean balls change sigma by a factor depending on n); Feec works with the equivalent
    edge-matrix bounds, and the two directions are proved there (Feec.Mesh.isShapeRegular_of_ball,
    Feec.Mesh.exists_ball_of_isShapeRegular). Quasi-uniformity is assumed (the smoothed
    projections of Feec use a fixed mollification scale h_N); the sources' local variants for
    merely shape-regular meshes are not formalized.
    (5) Admissible sequences have r_k >= 1 in every degree; the piecewise constants
    P_0 Lambda^n are the equal space P_1^- Lambda^n, and the sequences through P_0 Lambda^k with
    k < n are not covered.
    (6) Domains: bounded open, star-shaped with respect to a ball (which implies Lipschitz);
    the sources (AFW2010 §5.5, Christiansen-Winther 2008) allow general Lipschitz polyhedral
    domains, which are not covered (the extension-dilation construction of the
    smoothed projections in Feec uses star-shapedness). The closed range of d, needed by the
    static theory, is proved only on parallelepipeds (FEEC.fem_parallelepiped).
    (7) The Jackson estimate is for C^(s+2) forms with bounded (s+1)-st derivatives on the
    closure of Omega (one more derivative than the order requires), not for Sobolev data; the
    Sobolev rates proved in Feec on the cube are not compared.
    For femMin the smooth form must vanish outside Omega and be C^(s+2) on R^n, so its
    derivatives up to order s+2 vanish on the boundary: a smaller class than the usual one
    (vanishing tangential trace only).
    (8) The boundary facets of femSpaceMin are the facets of a single simplex of the mesh.
    (9) The window verdicts are stated for every window; the heat verdict keeps the closed-range
    hypothesis of palomar/feec in the window (proved here on parallelepipeds by
    FEEC.fem_parallelepiped; true on Lipschitz domains, not formalized for general star-shaped
    domains), its other hypotheses (graph-norm and L^2 bounds of the projections) holding for
    these families by the preceding clauses. The wave verdict has no hypothesis.
    (10) FEEC.maxwell: the window is that of H Lambda(Omega), so the boundary conditions are
    natural (perfect magnetic conductor in the (sigma, E, B) form, B the 2-form proxy and
    H = -B the magnetic field): E . n = 0 and B x n = 0 (H x n = 0) enter through the adjoints
    grad* and curl*, the physical PMC walls; the perfect electric conductor (the minimal
    complex) is compared only in forms, as the window [0, 3) of FEEC.femMin. Scalar fields are
    L^2 fields with one component (Fin 1), and the state is the triple (sigma, E, B) with the scalar potential sigma of the
    Hodge wave equation (sigma = 0 is one of the Gauss laws). Data lie in the domain of the
    Maxwell operator; the statement has no rate (the Jackson estimate of FEEC.fem with the rates
    of palomar/feec gives them, not restated here). The Galerkin solutions are differentiable
    in L^2 on [0, T] with values in V_N; their derivatives are not required to lie in V_N (they
    do when T > 0, V_N being finite-dimensional).

