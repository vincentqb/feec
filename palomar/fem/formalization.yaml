sources:
  - title: "Finite element exterior calculus, homological techniques, and applications"
    authors:
      - "Douglas N. Arnold"
      - "Richard S. Falk"
      - "Ragnar Winther"
    id: "doi:10.1017/S0962492906210018"
    type: "article"
    location: "Acta Numerica 15 (2006), §3 (the spaces P_r Lambda^k, P_r^- Lambda^k, the Koszul differential; §3.4: (3.10), (3.18), Theorems 3.5-3.6), §4 (Theorems 4.10, 4.14: the degrees of freedom and their unisolvence), §5 (assembly of the global spaces with single-valued traces, admissible sequences (5.13))"
    relationship: "formalizes"
    note: >-
      The polynomial spaces are stated in coordinates (a polynomial coefficient for each dx_s),
      P_r^- Lambda^k = P_(r-1) Lambda^k + kappa H_(r-1) Lambda^(k+1), over every field where only
      algebra is involved. The global spaces are stated as piecewise polynomial forms with
      single-valued tangential traces on every common face of two simplices; their equivalence
      with the assembly from the degrees of freedom is proved in Feec and used in the solution,
      not stated. The degrees of freedom are compared on a single simplex (FEEC.unisolvent:
      vanishing moments force zero, and the moments are as many as the dimension, Theorems
      4.9-4.10 and 4.13-4.14). §3.4: the invariance of the summands of (3.10) under the pullback
      of linear maps and their irreducibility under GL(n), (3.18), Theorem 3.5 with its cases
      s = r and s = r - 1 (r = 0 included), Theorem 3.6, over every field of characteristic 0.
      AFW derive the irreducibility from Fulton-Harris (6.9); Feec proves it directly (weight
      parts of diagonal pullbacks, an explicit generator and a pullback reaching it from every
      form not in the other summand), first for invariance under all linear maps, then under
      GL(n) alone (over an infinite field c -> (B + c I)^* omega is a polynomial curve, in a
      GL(n)-invariant space at the cofinitely many c with det(B + c I) != 0, hence with its value
      at c = 0). Characteristic 0 cannot be dropped (FEEC.charZero_iff_classification,
      FEEC.charZero_iff_closed_eq_exact; the source works over R). Not formalized from §3.4: the
      description of the third kind of Theorem 3.5 (s < r - 1) as {omega in P_r Lambda^k |
      d omega in P_s Lambda^(k+1)}, the identities (3.4), (3.7), (3.19) and Lemma 3.7 as
      separate statements (proved in Feec in the form the proofs use), the decomposition (3.20)
      and the inequivalence of its summands, and the classification of the affinely invariant
      subcomplexes (that the 2^(n-1) resolutions of §3.5 are the only ones; not proved in Feec).
      Locators of §3.4 checked against the published text for the former entry
      palomar/periodic; the others as cited in Feec, not rechecked for this entry.
