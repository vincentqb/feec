fidelity:
  divergences: >-
    (1) Coordinates: points of R^n are Fin n -> R (sup norm), forms are given by their
    coefficients on dx_s, s an increasing k-subset of Fin n, and L^2(Omega; Lambda^k) is the
    l^2 sum of copies of L^2(Omega); polynomial forms are coefficient functions
    Finset (Fin n) -> MvPolynomial (Fin n) R, evaluated to form fields; this is the standard
    coordinate model, not Mathlib's (alternating-map) differential forms or its exterior algebra
    (the two are identified in Feec, Feec.Algebra.ExteriorAlgebraForm).
    (2) The weak exterior derivative is defined as the adjoint of the closure of the formal
    adjoint d^t on test forms (Mathlib's LinearPMap.adjoint), and the minimal one as the closure
    of d on test forms (Submodule.toLinearPMap of the closed graph); the docstrings state the
    weak characterization, which is Mathlib's definition of the adjoint domain.
    (3) The finite element spaces are stated as piecewise polynomial forms with single-valued
    tangential traces on every common face (the trace agreement on all subsimplices, not only on
    facets); the sources define them through degrees of freedom or as the piecewise polynomial
    forms in H Lambda^k(Omega). The equivalence of the two descriptions of the global spaces is
    compared in palomar/shapes (FEEC.assembly); the equivalence with membership in H Lambda^k is not
    stated (the conformity direction is a consequence of the subcomplex property, which is
    compared).
    (4) Shape regularity is the bound h_T / rho_T <= sigma (Ciarlet §3.1), stated as: every
    simplex contains a ball of radius rho with h_T <= sigma rho, for the sup norm of Fin n -> R
    (Euclidean balls change sigma by a factor depending on n); Feec works with the equivalent
    edge-matrix bounds, and the two directions are proved there (Feec.Mesh.isShapeRegular_of_ball,
    Feec.Mesh.exists_ball_of_isShapeRegular). Quasi-uniformity is assumed (the smoothed
    projections of Feec use a fixed mollification scale h_N); the sources' local variants for
    merely shape-regular meshes (Christiansen-Winther 2008; Falk-Winther 2014) are not
    formalized.
    (5) Admissible sequences (PolySeq) have r_k >= 1 in every degree; the piecewise constants
    P_0 Lambda^n are the equal space P_1^- Lambda^n, and the sequences through P_0 Lambda^k with
    k < n are not covered (they continue with P_0^- Lambda = 0 and cannot approximate
    H Lambda^(k+1)). This is the only notion of admissible sequence of the entry.
    (6) Domains: bounded open, star-shaped with respect to a ball (which implies Lipschitz);
    the sources (AFW2010 §5.5, Christiansen-Winther 2008) allow general Lipschitz polyhedral
    domains, which are not covered (the extension-dilation construction of the smoothed
    projections in Feec uses star-shapedness). The closed range of d, a hypothesis of
    FEEC.staticFEEC (through Poincare inequalities), of the heat clause of FEEC.evolutionFEEC and
    of the converse of FEEC.projectionFEEC in palomar/feec, and the finite-dimensional harmonic
    forms of the cohomology clause of FEEC.staticFEEC are proved only on parallelepipeds
    (FEEC.fem_parallelepiped); on other star-shaped domains they stay hypotheses of these. The
    wave clause of FEEC.evolutionFEEC needs neither.
    (7) Rates. On general star-shaped domains and mesh families (FEEC.fem) the Jackson class is
    C^(s+2) forms with sup bounds on the (s+1)-st derivatives of x and dx on the closure of
    Omega: one derivative more than the order requires and a W^(s+1,infinity) instead of an
    H^(s+1) norm. For b = true the smooth form must vanish outside Omega and be C^(s+2) on R^n,
    so its derivatives up to order s+2 vanish on the boundary: a smaller class than vanishing
    tangential trace. Sobolev data are compared only on the cube (0, 1/2)^n with its Freudenthal
    meshes (FEEC.fem_cube; other mesh families of the cube are not covered) and only for
    H Lambda; H^m(Omega) is defined by restriction of H^m(R^n) (weak derivatives in L^2(R^n)
    along words, the norm a sum over words, equivalent to the multi-index norm), which equals
    the weak-derivative space of Omega on Lipschitz domains (not formalized); the norm is the
    full H^(s+1) norm, not the seminorm. In every case the rate is attained by the bounded
    cochain projections themselves (Jackson.ProjRate), not only by some element of the space.
    The H^(s+1) estimate ||x - pi_N x|| <= C h^(s+1) ||x||_(H^(s+1)) on general star-shaped
    domains and mesh families (AFW2010 §5.5) is not proved in Feec: by the quasi-optimality of
    the bounded projections it reduces to the best approximation of H^(s+1) forms, which Feec
    proves only on the cube (Fourier series on the torus after periodization). Feec has the
    pieces of a general proof for 2(s+1) > n (the L^2 Bramble-Hilbert lemma with averaged Taylor
    polynomials and the L^2 interpolation estimate of the canonical interpolant on homothetic
    simplices, Feec.FiniteElement.BrambleHilbertL2); missing are that estimate on general
    shape-regular simplices, its assembly over the mesh, and the passage from smooth to H^(s+1)
    data by mollification; without 2(s+1) > n it needs local estimates for the smoothed
    projections or a Clement/Scott-Zhang-type quasi-interpolant.
    (8) One finite element space femSpace Omega M S Gamma k with vanishing traces on a set Gamma
    of facets serves both boundary conditions: Gamma = ∅ for H Lambda(Omega) and Gamma =
    M.boundaryFacets, the facets of a single simplex of the mesh, for the vanishing boundary
    traces of H°Lambda(Omega) (Solution: FEEC.femSpace_empty, FEEC.mem_boundaryFacets_iff), and
    FEEC.fem takes the boundary condition as a Boolean b. The notions shared with other entries
    (Hilbert complexes and their families of subcomplexes, differential and polynomial forms,
    admissible sequences and their polynomial orders, meshes with the Freudenthal meshes
    IsFreudenthal, domains star-shaped with respect to a ball, covector values, finite element
    spaces, the regularity classes IsCsForm, IsCsFormMin and IsSobolevForm) are the canonical
    blocks of palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate; they are
    shared with palomar/feec (the Hilbert complexes and their families), palomar/waves (all but
    the families and IsSobolevForm), palomar/einsteinbianchi (the forms, polynomial forms,
    admissible sequences, meshes, covector values, finite element spaces and IsSobolevForm),
    palomar/constraints (the Hilbert complexes and the forms), palomar/bgg (the forms),
    palomar/shapes (the forms,
    polynomial forms, admissible sequences, simplicial meshes, covector values and finite element
    spaces), palomar/crimes (the Hilbert complexes and the simplicial meshes) and
    palomar/timestepping (the simplicial meshes).

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude (Anthropic) agents: independent review of each merge"
  notes: >-
    No human has reviewed the Challenge statements and definitions yet; the author directed
    their design. Every change merged into the repository was reviewed by an independent AI
    agent (Claude, Anthropic) that had not written it, checking the statements against the cited
    sources and the docstrings against the Lean, and its findings were addressed before merging.
    Each merge was also gated by a full build with zero errors and warnings, an axiom audit
    (propext, Classical.choice and Quot.sound only), the repository's naming, layering and
    citation checks, and lake comparator on the entries whose solutions import a changed
    module. No external mathematical review.

alignment:
  namespace: "FEEC"
  statements:
    - source: "[AFW2006] §5; [AFW2010] §5.2, §5.5; [ChristiansenWinther2008]; [Arnold2018] Ch. 7"
      lean: "FEEC.fem"
      module: "Challenge"
      status: "proved"
      note: >-
        By cases on the boundary condition (Solution fem_dMax, fem_dMin). From
        Feec.Models.StarShaped.MeshFamily.poly, polyMin, exists_uniform_polyProj (the L^2
        extension is the Feec projection, defined on all of L^2), eventually_exists_poly_graph and
        exists_mem_poly_le_of_isCsForm (and their Min versions); the spaces through
        Solution/Spaces.lean (mem_V_iff, mem_V₀_iff); the projection rate from the Jackson
        estimate and the uniform bound (Solution/Complex.lean, Jackson.projRate).
    - source: "[Freudenthal1942]; [AFW2010] §3.1.3 (compactness property), §4 (closed range, harmonic forms); [Arnold2018] Ch. 6"
      lean: "FEEC.fem_parallelepiped"
      module: "Challenge"
      status: "proved"
      note: >-
        From Feec.Models.StarShaped.ParallelepipedWitness and the compactness property of H Lambda
        and H°Lambda on the parallelepiped, Feec.Models.Parallelepiped.hasCompactProperty and
        hasCompactProperty_min (the property of the cube, Feec.Models.Cube.FEM.hasCompactProperty,
        transported along the pullback of forms), which gives the closed ranges and the
        finite-dimensional harmonic forms (Feec.HilbertComplex.HasCompactPropertyAt.isClosed_range,
        finiteDimensional_harmonic; Solution/Complex.lean, hodge_ofFeec); their dimensions from
        Feec.Models.Parallelepiped.finrank_harmonic and finrank_harmonic_min.
    - source: "[AFW2010] §5; [Arnold2018] Ch. 7 (Sobolev approximation); [Evans2010] §5.2"
      lean: "FEEC.fem_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        The family of FEEC.fem on the cube with the Freudenthal meshes
        (Feec.Models.StarShaped.CubeWitness); the best approximation from
        Feec.Models.Cube.FEM.infDist_poly_le_sobolevQ_high (periodic Sobolev spaces of the torus),
        reached from H^m(R^n) data by Feec.Models.Cube.SobolevRestriction.exists_qNorm_le
        (Leibniz's rule for weak derivatives with a cutoff, periodization, weak derivatives on
        the torus, the Fourier norm bounded by the pure derivatives), the vertices of the
        Freudenthal simplices from Feec.Mesh.mem_freudenthalMesh_simplices, and the graph-norm
        bound and the projection rate (Jackson.projRate) through the uniformly L^2-bounded
        cochain projections of FEEC.fem.

