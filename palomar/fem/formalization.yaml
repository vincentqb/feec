status:
  scope: >-
    Formalized and compared: FEEC.fem and FEEC.femMin for every dimension n >= 1, every bounded
    open domain star-shaped with respect to a ball, every shape-regular quasi-uniform family of
    conforming simplicial meshes of it with h_N -> 0, and every admissible sequence with r_k >= 1;
    FEEC.fem_parallelepiped for every parallelepiped; FEEC.fem_cube for the cube (0, 1/2)^n,
    every n >= 1, every admissible sequence and every s; FEEC.maxwell for n = 3 on the same
    domains and meshes as FEEC.fem; FEEC.unisolvent for every n-simplex, r >= 1 and k;
    FEEC.affineInvariantForms over every field of characteristic 0 and every n, k, r, s;
    FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact over every field.
    Not restated (compared in palomar/feec, whose theorems apply to the families of FEEC.fem and
    FEEC.femMin): the static, wave and heat verdicts (the fields static, wave and heat of the
    Verdict of FEEC.feec), constraint propagation in general (the fields propagates_iff,
    invariantCore and subcomplex of its wave verdict; FEEC.maxwell restates that of the Gauss
    laws), and the rates of the static and wave verdicts from the Jackson estimates (the fields
    static and wave of FEEC.feec_rated). Not
    compared
    (proved in Feec, outside the statement): the Whitney forms as a separate family (they are the
    sequence P_1^- in every degree), the assembly of the global spaces from the degrees of
    freedom, the finite element theory of the cube with mixed boundary conditions, the cubical
    and weak-symmetry elements, the Einstein-Bianchi instances, the perfect-electric-conductor
    Maxwell discretization in vector proxies (it is the window [0, 3) of FEEC.femMin in forms),
    the H^1 approximation of the smoothed projections; the polynomial identities, dimension
    formulas and exactness of the polynomial de Rham and Koszul complexes of P_r Lambda,
    P_r^- Lambda and Q_r^- Lambda (the former FEEC.periodicTable of palomar/periodic; Feec.Algebra
    .PolynomialFormDim, Feec.Algebra.CubicalForm), the classification with the summands as
    kernels (Feec.Counterexamples.PositiveCharacteristic.charZero_iff_classification_ker).
    Not formalized: the closed range on general star-shaped or Lipschitz domains (true on
    Lipschitz domains by Picard 1984, Costabel-McIntosh 2010); Sobolev (H^(s+1)) rates on
    general star-shaped domains and mesh families (see fidelity (7)); merely shape-regular
    (not quasi-uniform) meshes; Lipschitz polyhedral domains; the classification of the
    affinely invariant subcomplexes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

