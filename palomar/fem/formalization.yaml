# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of finite element exterior calculus on
# polyhedral domains (`palomar/fem/`), the concrete counterpart of `palomar/feec/`.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Finite element exterior calculus on polyhedral domains: the P_r^- Lambda and P_r Lambda families"
  description: >-
    The finite element de Rham complexes of Arnold-Falk-Winther on simplicial meshes, stated over
    Mathlib with the definitions of the Palomar entry palomar/feec (Hilbert complexes, subcomplex
    families with cochain projections, graph-norm bounds and approximation, Jackson estimates,
    windows of degrees with the wave operator L = d - d*, and the conclusions of its FEEC
    theorem for the Hodge wave and heat equations, EvolutionVerdict, WaveVerdict,
    DynamicVerdict) copied verbatim, so that the families of this entry are families in the
    sense of the theorem FEEC.feec of palomar/feec. Four compared theorems. FEEC.fem: let Omega in R^n (n >= 1) be a
    bounded open domain star-shaped with respect to a ball, M_N conforming simplicial meshes of
    Omega (Mathlib's Affine.Simplex), uniformly shape regular (every simplex T contains a ball of
    radius rho with h_T <= sigma rho, i.e. h_T / rho_T <= sigma) and quasi-uniform
    (q h_N <= h_T), with mesh size h_N -> 0, and S an admissible sequence of polynomial families
    (P_(r_k) Lambda^k or P_(r_k)^- Lambda^k in each degree, r_k >= 1, consecutive degrees
    related by the transitions of AFW2006 §5 / AFW2010 §5.2). Then the L^2 de Rham complex
    H Lambda(Omega) with the weak exterior derivative (the adjoint of the formal adjoint d^t on
    test forms) is a Hilbert complex, and the finite element spaces S_k(M_N) (the L^2 forms that
    are on every simplex a polynomial form of S_k, with single-valued tangential traces on the
    common faces of the mesh) are the spaces of a family of finite-dimensional subcomplexes of it,
    N -> infinity, with commuting cochain projections that extend to projections of L^2 onto
    S_k(M_N) with operator norm bounded uniformly in N (the smoothed projections of AFW2010 §5.5,
    Christiansen-Winther 2008), hence bounded in every graph norm, which approximates every
    element of H Lambda^k(Omega) in the graph norm, which satisfies on every window
    W^a + ... + W^(a+m-1) of form degrees (every a, every m) the conclusions of the FEEC theorem
    of palomar/feec for the Hodge wave equation xi' = L xi (skew-adjoint L, a unitary group S
    giving the unique strong solutions, uniform convergence on [0, T] of the semidiscrete
    solutions exp(t L_h) v_h for converging data and of every A-stable rational time scheme of
    order p >= 1, the temporal error K n tau tau^p ||L_h^(p+1) w||, the semidiscrete error bound
    ||v - x|| + 2 (1 + 4 sqrt 3)(1 + t) M by the graph-norm best approximation M of the
    trajectory, propagation of a closed constraint iff it reduces L, the invariant core, the
    propagation of the constraints of reducing subcomplexes) and for the Hodge heat equation
    u' = L^2 u = -Delta u (the same well-posedness and convergence for the contraction semigroup,
    under closed range in the degrees a+1, ..., a+m-1 of the window), and which has a Jackson
    estimate: a C^(s+2) form whose (s+1)-st derivatives and those of its exterior derivative are
    bounded by L on the closure of Omega is approximated in S_j(M_N) to within B L h_N^(s+1) in
    L^2 and for d, in the degrees j where S contains P_s Lambda^j and P_s Lambda^(j+1).
    FEEC.femMin: the same for the minimal complex (the closure of d on test forms) and the
    spaces with vanishing tangential traces on the boundary facets, for smooth forms vanishing
    outside Omega (the wave verdict on the window [0, 3) for n = 3 is Maxwell's equations with
    perfect-electric-conductor walls). FEEC.fem_parallelepiped: every parallelepiped
    A (0,1)^n + b, A invertible (every open box), is a domain star-shaped with respect to a ball
    carrying such a mesh family,
    and the weak and the minimal exterior derivatives have closed range in every degree; so the
    static FEEC theorem of palomar/feec (discrete Poincare inequality, stability and
    quasi-optimality of the mixed Hodge Laplacian, cohomology) and its rates, and the heat
    verdicts of FEEC.fem and FEEC.femMin, apply to their families there with no remaining
    hypothesis. FEEC.maxwell, the window [0, 3) of FEEC.fem for n = 3 read in vector proxies:
    the vector proxies V_N^0, V_N^1, V_N^2 of S_0(M_N), S_1(M_N), S_2(M_N) (scalar fields,
    vector fields v_j = omega_j, vector fields (omega_12, -omega_02, omega_01); for S = P_1^-
    the Lagrange, Nedelec edge and Raviart-Thomas face elements) lie in the domains of the weak
    gradient, curl and divergence (each defined as the adjoint of the closure of its formal
    adjoint on test fields, as the weak exterior derivative), and they discretize Maxwell's
    equations sigma' = -grad* E, E' = grad sigma - curl* B, B' = curl E (the Hodge wave equation
    of the window H^1 -> H(curl) -> L^2(Omega; R^3); with H = -B and sigma = 0, E' = curl H,
    H' = -curl E with perfect-magnetic-conductor walls): every datum in V_N^0 x V_N^1 x V_N^2
    has a unique Galerkin solution on [0, T], and for data in the domain of the Maxwell
    operator and every T there is a unique strong solution on [0, T], it conserves the energy,
    satisfies the Gauss laws sigma = 0, grad* E = 0, div B = 0 for all t if the data do, and is
    the uniform limit on [0, T] of every family of Galerkin solutions in V_N^0 x V_N^1 x V_N^2
    whose initial data converge to the data; such families exist. The proof is the library Feec
    of this repository (Feec.FiniteElement, Feec.Models.StarShaped, Feec.Models.Parallelepiped,
    Feec.Mesh, Feec.HilbertComplex.Approximation.Crown, Feec.Instances.Maxwell).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

