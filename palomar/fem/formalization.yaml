  notes: >-
    Human-directed, AI-written development. The Challenge statement and its definitions were
    written by an AI agent for this submission, to be reviewed by the author; the Solution
    identifies them with the definitions of the library Feec (Solution/Forms.lean, Poly.lean,
    Mesh.lean, Trace.lean, Spaces.lean, Regularity.lean, Maxwell.lean, Dof.lean, Affine.lean)
    and applies its theorems; the projections attain the Jackson rate by the quasi-optimality
    of a bounded projection (Solution/Complex.lean, Jackson.projRate, from
    Feec.ForMathlib.Analysis.QuasiOptimal). The classification statements and their bridge were
    moved from the former entry palomar/periodic and restated on the coordinate forms of this
    entry (2026-11-17). FEEC.fem_wave (2026-11-18) is proved from FEEC.fem and
    FEEC.inverse_estimate of this entry (Solution/Wave.lean: the windows of the finite element
    subcomplexes as Feec discrete states, the abstract Crank-Nicolson and leapfrog estimates of
    Feec.Models.Cube.Inhomogeneous with the projections of the exact solution as comparison
    fields); the Whitney schemes and the inverse estimate were moved from the former
    palomar/timestepping and restated on windows (Solution/Whitney.lean).

fidelity:
  divergences: >-
    (1) Coordinates: points of R^n are Fin n -> R (sup norm), forms are given by their
    coefficients on dx_s, s an increasing k-subset of Fin n, and L^2(Omega; Lambda^k) is the
    l^2 sum of copies of L^2(Omega); a window [a, a + m) is the l^2 sum Total of its degrees;
    polynomial forms are coefficient functions Finset (Fin n) -> MvPolynomial (Fin n) K over a
    field K, evaluated to form fields over R; this is the standard coordinate model, not
    Mathlib's (alternating-map) differential forms or its exterior algebra (the former
    palomar/periodic used P(K^n) (x) Lambda(K^n)*; the two are identified in Feec,
    Feec.Algebra.ExteriorAlgebraForm). The pullback of polynomial forms is stated by minors,
    (phi^* omega)_t = sum_(#s = #t) det B_(s,t) (omega_s o phi).
    (2) The weak exterior derivative is defined as the adjoint of the closure of the formal
    adjoint d^t on test forms (Mathlib's LinearPMap.adjoint), and the minimal one as the closure
    of d on test forms (Submodule.toLinearPMap of the closed graph); the docstrings state the
    weak characterization, which is Mathlib's definition of the adjoint domain. The total
    differential of a window in the schemes is a total function (HilbertComplex.dApply, 0 off its
    domain), only applied to finite element forms, which lie in its domain.
    (3) The finite element spaces are stated as piecewise polynomial forms with single-valued
    tangential traces on every common face (the trace agreement on all subsimplices, not only on
    facets); the sources define them through degrees of freedom or as the piecewise polynomial
    forms in H Lambda^k(Omega). The degrees of freedom are compared on one simplex
    (FEEC.unisolvent); the equivalence of the two descriptions of the global spaces is proved in
    the solution, not stated; the equivalence with membership in H Lambda^k is not stated (the
    conformity direction is a consequence of the subcomplex property, which is compared).
    FEEC.unisolvent states unisolvence as injectivity of the moments together with the count
    (number of moments = dimension); bijectivity onto the dual for chosen bases of the test
    spaces follows by linear algebra and is not stated. Faces are oriented by the increasing
    order of their vertices (order embeddings Fin (m+1) -> Fin (n+1)); the moments are those of
    AFW2006 §4 up to this orientation sign.
    (4) Shape regularity is the bound h_T / rho_T <= sigma (Ciarlet §3.1), stated as: every
    simplex contains a ball of radius rho with h_T <= sigma rho, for the sup norm of Fin n -> R
    (Euclidean balls change sigma by a factor depending on n); Feec works with the equivalent
    edge-matrix bounds, and the two directions are proved there (Feec.Mesh.isShapeRegular_of_ball,
    Feec.Mesh.exists_ball_of_isShapeRegular). Quasi-uniformity is assumed (the smoothed
    projections of Feec use a fixed mollification scale h_N; FEEC.inverse_estimate and the CFL
    condition use the global mesh size); the sources' local variants for merely shape-regular
    meshes (Christiansen-Winther 2008; Falk-Winther 2014) are not formalized.
    (5) Admissible sequences (PolySeq) have r_k >= 1 in every degree; the piecewise constants
    P_0 Lambda^n are the equal space P_1^- Lambda^n, and the sequences through P_0 Lambda^k with
    k < n are not covered (they continue with P_0^- Lambda = 0 and cannot approximate
    H Lambda^(k+1)). This is the only notion of admissible sequence of the entry.
    (6) Domains: bounded open, star-shaped with respect to a ball (which implies Lipschitz);
    the sources (AFW2010 §5.5, Christiansen-Winther 2008) allow general Lipschitz polyhedral
    domains, which are not covered (the extension-dilation construction of the smoothed
    projections in Feec uses star-shapedness). The closed range of d, a hypothesis of
    FEEC.staticFEEC (through Poincare inequalities), of the heat clause of FEEC.evolutionFEEC and
    of the converse of FEEC.projectionFEEC in palomar/feec, is proved only on parallelepipeds
    (FEEC.fem_parallelepiped); on other star-shaped domains it stays a hypothesis of these. The
    wave clauses (FEEC.evolutionFEEC, FEEC.fem_wave) do not need it.
    (7) Rates. On general star-shaped domains and mesh families (FEEC.fem, FEEC.fem_wave) the
    Jackson class is C^(s+2) forms with sup bounds on the (s+1)-st derivatives of x and dx on
    the closure of Omega: one derivative more than the order requires and a W^(s+1,infinity)
    instead of an H^(s+1) norm. For b = true the smooth form must vanish outside Omega and be
    C^(s+2) on R^n, so its derivatives up to order s+2 vanish on the boundary: a smaller class
    than vanishing tangential trace. Sobolev data are compared only on the cube (0, 1/2)^n with
    its Freudenthal meshes (FEEC.fem_cube; other mesh families of the cube are not covered) and
    only for H Lambda; H^m(Omega) is defined by restriction of H^m(R^n) (weak derivatives in
    L^2(R^n) along words, the norm a sum over words, equivalent to the multi-index norm), which
    equals the weak-derivative space of Omega on Lipschitz domains (not formalized); the norm is
    the full H^(s+1) norm, not the seminorm. In every case the rate is attained by the bounded
    cochain projections themselves (Jackson.ProjRate), not only by some element of the space.
    The H^(s+1) estimate ||x - pi_N x|| <= C h^(s+1) ||x||_(H^(s+1)) on general star-shaped
    domains and mesh families (AFW2010 §5.5) is not proved in Feec: by the quasi-optimality of
    the bounded projections it reduces to the best approximation of H^(s+1) forms, which Feec
    proves only on the cube (Fourier series on the torus after periodization). Feec has the
    pieces of a general proof for 2(s+1) > n (the L^2 Bramble-Hilbert lemma with averaged Taylor
    polynomials and the L^2 interpolation estimate of the canonical interpolant on homothetic
    simplices, Feec.FiniteElement.BrambleHilbertL2); missing are that estimate on general
    shape-regular simplices, its assembly over the mesh, and the passage from smooth to H^(s+1)
    data by mollification; without 2(s+1) > n it needs local estimates for the smoothed
    projections or a Clement/Scott-Zhang-type quasi-interpolant.
    (8) One finite element space femSpace Omega M S Gamma k with vanishing traces on a set Gamma
    of facets serves both boundary conditions: Gamma = ∅ for H Lambda(Omega) and Gamma =
    M.boundaryFacets, the facets of a single simplex of the mesh, for the vanishing boundary
    traces of H°Lambda(Omega) (Solution: FEEC.femSpace_empty, FEEC.mem_boundaryFacets_iff), and
    FEEC.fem (formerly FEEC.fem and FEEC.femMin) and FEEC.fem_wave take the boundary condition as
    a Boolean b. The notions shared with other entries (Hilbert complexes, their windows and
    families, differential and polynomial forms, admissible sequences and the Whitney sequence
    topSeq, meshes with the Freudenthal meshes IsFreudenthal, finite element spaces, the
    regularity classes IsCsForm and IsSobolevForm) are the canonical blocks of
    palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate.
    (9) FEEC.maxwell: the window is that of H Lambda(Omega), so the boundary conditions are
    natural (perfect magnetic conductor in the (sigma, E, B) form, B the 2-form proxy and
    H = -B the magnetic field): E . n = 0 and B x n = 0 (H x n = 0) enter through the adjoints
    grad* and curl*, the physical PMC walls; the perfect electric conductor (the minimal
    complex) is not compared in vector proxies. Scalar fields are L^2 fields with one component
    (Fin 1), and the state is the triple (sigma, E, B) with the scalar potential sigma of the
    Hodge wave equation (sigma = 0 is one of the Gauss laws). Data lie in the domain of the
    Maxwell operator; the statement has no rate (the rates of the window [0, 3) of FEEC.fem in
    forms are those of FEEC.fem_wave, fully discrete, and of the wave clause of
    FEEC.evolutionFEEC of palomar/feec, semidiscrete; in vector proxies they are not compared).
    The Galerkin solutions are differentiable in L^2 on [0, T] with values in V_N; their
    derivatives are not required to lie in V_N (they do when T > 0, V_N being
    finite-dimensional). Most of FEEC.maxwell is the transport of the window of FEEC.fem to
    vector proxies.
    (10) AFW2006 §3.4 is stated over every field K of characteristic 0 (the source works over
    R). The hypothesis is necessary (FEEC.charZero_iff_classification,
    FEEC.charZero_iff_closed_eq_exact), but both iff theorems quantify over all dimensions: in a
    fixed dimension the classification can hold in characteristic p (in dimension 1 every
    subspace of H_r Lambda^k is 0 or H_r Lambda^k); they do not identify the dimensions in which
    it fails. The conclusions of invariance (the summands of (3.10), (3.18), Theorem 3.5) are
    stated for the pullback of every linear (resp. affine) map, singular ones included; the
    hypotheses of the classifications only for the invertible ones (GL(n, K) for the subspaces
    of H_r Lambda^k; x -> g x + b for Theorem 3.6, which is stronger than AFW's hypothesis of all
    affine maps). The irreducibility is stated for r, k >= 1 (H_(r+1) Lambda^(k+1)); Theorem
    3.6's s >= -1 is stated as the two alternatives s = -1 (d P_(r+1) Lambda^(k-1)) and
    0 <= s <= r.
    (11) FEEC.fem_wave. Homogeneous boundary conditions only: the trial and test spaces are the
    finite element forms of the window (with vanishing boundary traces for b = true), the
    boundary data of the steps vanish, the load is zero, and the exact solution lies in the
    domain of the wave operator of the complex (natural, resp. essential, boundary conditions);
    inhomogeneous data are the cube theorems (12) only. The exact solution is stated by its
    hypotheses at the L^2 level: U, U_1, U_2, U_3 with two-sided derivatives at every real time
    (U is defined on all of R, as solutions of the wave equation are), (U(t), U_1(t)) in the
    graph of d - d* and ||U_3(t)|| <= L on [0, T], and the values and time increments in the
    Jackson class of FEEC.fem with the bounds L and L |t' - t| (a Lipschitz condition in the
    class; the C^(s+2) surrogate of (7)); no compared witness exhibits a nonzero such solution
    (U = 0 satisfies the hypotheses and gives the stability bounds; on boxes the cosine modes
    with the natural boundary conditions are such solutions, not formalized). The rate is the
    spatial order h^(s+1) of the projections and the temporal order Delta t^2 of both schemes,
    uniformly in N; the error is in L^2 at t_K = K Delta t, from arbitrary starting values in
    X_h (with the starting errors added), not in the energy norm. Crank-Nicolson is the only
    implicit scheme of the statement (every A-stable rational scheme, with a temporal error in
    the discrete datum, is the wave clause of FEEC.evolutionFEEC); leapfrog is a two-step
    scheme, stable under the CFL condition, the factor 1 - c from the energy argument; the
    constant C_0 of the inverse estimate is asserted (from a norm equivalence on the reference
    simplex, by compactness, so it has no explicit value), and the CFL condition is stated for
    every constant C_0 >= 0 of the estimate. Its inverse estimate is that of the window, with
    the global mesh size; the window is that of the complex of FEEC.fem, the given H (any
    Hilbert complex of the challenge whose differentials are dMax, resp. dMin, is this one).
    (12) FEEC.crankNicolson_cube and FEEC.leapfrog_cube (the runs of the thesis' Ch. 7, from the
    former palomar/timestepping): one row of the thesis' three-row Einstein-Bianchi scheme (the
    rows decouple); the exact solution is a classical solution on R x R^3 with the stated bounds
    on [0, T] (RowSolution), and no boundary condition is imposed on it: the boundary degrees of
    freedom of the scheme are those of the Whitney interpolant of the exact solution at every
    step for all three fields (any g_n with g_n - Pi_h U(t_n) in the fields with vanishing
    traces), the initial value is the interpolant of U(0), the load is zero. This is an interior
    error estimate with exact Dirichlet data everywhere, not the natural boundary conditions of
    a well-posed initial-boundary value problem. With vanishing boundary data the schemes are
    those of FEEC.fem_wave (b = true, S = topSeq, s = 0), whose Jackson class (vanishing to
    second order on the boundary) is smaller than the RowSolution bounds; for nonvanishing data
    neither theorem implies the other. The error is in L^2 at t_M = M Delta t; rates for finite
    Sobolev regularity and the constraint monitors are not stated. Everything is on one domain,
    (0, 1/2)^3, and one mesh family. Leapfrog: the three-level scheme with the same boundary data
    and the two starting values u_0 = Pi_h U(0), u_1 = Pi_h U(Delta t) (interpolants of the exact
    solution; no one-step starting procedure); the stability clause is for vanishing boundary
    degrees of freedom; the time step need not satisfy the CFL condition for well-posedness
    (the step is explicit); sharpness of the CFL condition is not stated. The relation to the
    abstract theorems is explained, not compared: with vanishing boundary data a Crank-Nicolson
    step is r(Delta t A_h) on the fields with vanishing traces, r(z) = (2 + z)/(2 - z), A_h
    skew-adjoint for the L^2 product. Non-vacuity of RowSolution is FEEC.rowSolution_nonvacuous
    (constant fields inhabit it too; the witness is a plane wave with nonzero time derivative).
    The schemes are stated with the same step notions as FEEC.fem_wave (HilbertComplex.IsCNStep,
    IsLeapfrogStep on the window [0, 3), the trial space Vh, the test space of vanishing traces),
    the rows as the window Total, the interpolant and the representatives of U(t) on windows
    (IsWhitneyInterp, IsRepr); the former statements (rows as triples, wd, waveForm, RowMem,
    rowNorm, IsRowInterp, one degree per interpolant) are the same up to these identifications,
    and the unisolvence clause is stated on every window [0, m) (formerly in every degree k).
    (13) FEEC.inverse_estimate: the hypothesis that the open simplices lie in Omega (true when
    Omega is the interior of its closure, e.g. for star-shaped or convex Omega; it makes the
    L^2(Omega) norm the sum of the norms on whole simplices) replaces regularity of Omega; the
    global estimate is stated with the mesh size h_N, not elementwise; C depends on n, S, k and
    the shape-regularity and quasi-uniformity constants of the family.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the Challenge statement (the thirteen compared theorems and
    their definitions); FEEC.fem (the former FEEC.fem and FEEC.femMin, one theorem over the
    boundary condition since 2026-11-18), FEEC.fem_parallelepiped, FEEC.fem_cube, FEEC.maxwell as
    of 2026-11-06, restated 2026-11-17 without the window verdicts (the static, wave and heat
    theorems apply through palomar/feec) and with the projection rates (Jackson.ProjRate);
    FEEC.inverse_estimate, FEEC.crankNicolson_cube, FEEC.leapfrog_cube and
    FEEC.rowSolution_nonvacuous moved from palomar/timestepping (2026-11-18), the Whitney schemes
    restated on windows with the step notions of FEEC.fem_wave; FEEC.fem_wave new on 2026-11-18;
    FEEC.unisolvent and faceMoment new on 2026-11-17; the classification theorems moved from
    palomar/periodic (2026-10-31 to 2026-11-04) and restated on the coordinate forms on
    2026-11-17. Every merge of the library was gated by a full build (zero warnings), an axiom
    audit (propext, Classical.choice, Quot.sound only) and an independent AI review. No external
    mathematical review.

