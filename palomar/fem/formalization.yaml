status:
  scope: >-
    Formalized and compared: FEEC.fem for both boundary conditions (H Lambda and H°Lambda), every
    dimension n >= 1, every bounded open domain star-shaped with respect to a ball, every
    shape-regular quasi-uniform family of conforming simplicial meshes of it with h_N -> 0, and
    every admissible sequence with r_k >= 1; FEEC.fem_parallelepiped for every parallelepiped;
    FEEC.fem_cube for the cube (0, 1/2)^n, every n >= 1, every admissible sequence and every s.
    Not restated (compared in palomar/feec, whose theorems apply to the families of FEEC.fem as
    the project description explains): the uniform discrete Poincare inequality and harmonic
    bound (the converse of FEEC.projectionFEEC), the mixed method and its rates
    (FEEC.staticFEEC), the semidiscrete and A-stable fully discrete wave and heat equations with
    the rates of the Jackson estimates (FEEC.evolutionFEEC). Compared in other entries: the
    inverse estimate, the fully discrete Hodge wave equation, the Whitney schemes of the cube and
    Maxwell's equations (palomar/waves); the unisolvence of the degrees of freedom, their
    assembly into the finite element spaces and the classification of the affinely invariant
    spaces of polynomial forms (palomar/shapes). Not compared (proved in Feec, outside the
    statement): the Whitney forms as a separate family (they are the sequence topSeq of
    palomar/waves), the finite element theory of the cube with mixed boundary conditions, the
    cubical and weak-symmetry elements, the H^1 approximation of the smoothed projections.
    Not formalized: the closed range, the finite-dimensional harmonic forms and the compactness
    property on general star-shaped or Lipschitz domains (true on Lipschitz domains by Picard
    1984, Costabel-McIntosh 2010); Sobolev (H^(s+1)) rates on general star-shaped domains and
    mesh families (see fidelity (7)); merely shape-regular (not quasi-uniform) meshes; Lipschitz
    polyhedral domains.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

