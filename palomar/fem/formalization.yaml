# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the finite element de Rham complexes
# (`palomar/fem/`): their uniform stability, the convergence of their Galerkin methods (the fully
# discrete Hodge wave equation, Maxwell's equations), and the algebra of their shape functions
# (formerly `palomar/periodic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Finite element de Rham complexes are uniformly stable, and their Galerkin methods converge"
  description: >-
    The finite element de Rham complexes of Arnold-Falk-Winther on simplicial meshes are uniformly
    stable, and so their Galerkin methods converge; stated over Mathlib. The abstract notions
    (Hilbert complexes, their windows, subcomplex families with cochain projections, graph-norm
    bounds and approximation, Jackson estimates) are those of the Palomar entry palomar/feec (the
    shared blocks HilbertComplex, SubcomplexFamily and window of
    palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate), whose theorems apply
    to the families of this entry: FEEC.staticFEEC (the mixed method) needs graph-norm bounds in
    the degrees j - 1, j, proved here in every degree, and Poincare inequalities, equivalent to
    closed ranges (proved here on parallelepipeds), and its rates are those of the Jackson
    estimates proved here; the wave clause of FEEC.evolutionFEEC needs only approximation on the
    window (graph-norm approximation, proved here, and approximation in L^2 in the last degree,
    which follows by density), so it holds on every domain of this entry with the rates h^(s+1);
    its heat clause needs moreover graph-norm bounds, the L^2 bound of the projections in the last
    degree (both proved here) and closed ranges (parallelepipeds); with closed ranges the converse
    of FEEC.projectionFEEC gives the uniform discrete Poincare inequality and harmonic bound from
    the graph-norm bounds; FEEC.crimeFEEC is for discrete spaces that are not subcomplexes (these
    are). Constraint propagation is the entry palomar/constraints.
    Thirteen compared theorems.
    FEEC.fem (uniform stability): let Omega in R^n (n >= 1) be a bounded open domain star-shaped
    with respect to a ball, M_N conforming simplicial meshes of Omega (Mathlib's Affine.Simplex),
    uniformly shape regular (every simplex T contains a ball of radius rho with
    h_T <= sigma rho) and quasi-uniform (q h_N <= h_T), with mesh size h_N -> 0, and S an
    admissible sequence of polynomial families (P_(r_k) Lambda^k or P_(r_k)^- Lambda^k in each
    degree, r_k >= 1, consecutive degrees related by the transitions of AFW2006 §5 / AFW2010 §5.2).
    Then, for b = false, the L^2 de Rham complex H Lambda(Omega) (the weak exterior derivative,
    the adjoint of the formal adjoint d^t on test forms), and for b = true the minimal complex
    H°Lambda(Omega) (the closure of d on test forms), is a Hilbert complex, and the finite
    element spaces S_k(M_N) (the L^2 forms that are on every simplex a polynomial form of S_k,
    with single-valued tangential traces on the common faces of the mesh; for b = true with
    vanishing traces on the boundary facets) are the spaces of a family of finite-dimensional
    subcomplexes, N -> infinity, whose commuting cochain projections extend to projections of
    L^2 with operator norm bounded uniformly in N (the smoothed projections of AFW2010 §5.5,
    Christiansen-Winther 2008), hence bounded in every graph norm, which approximates in the
    graph norm, with a Jackson estimate attained by the projections: for a C^(s+2) form x whose
    (s+1)-st derivatives and those of dx are bounded by L on the closure of Omega (vanishing
    outside Omega for b = true), ||x - pi_N x|| and ||dx - d pi_N x|| are at most B L h_N^(s+1),
    in the degrees j where S contains P_s Lambda^j and P_s Lambda^(j+1).
    FEEC.inverse_estimate: for every shape-regular quasi-uniform family of meshes of an open Omega
    whose open simplices lie in Omega, every admissible sequence and every degree k, the forms of
    S_k(M_N) lie in H Lambda^k(Omega) and h_N ||dv|| <= C ||v||, C independent of N.
    FEEC.fem_wave (the fully discrete Hodge wave equation, homogeneous boundary conditions): under
    the hypotheses of FEEC.fem, for H Lambda(Omega) (natural boundary conditions) or
    H°Lambda(Omega) (vanishing traces), on every window [a, a + m) of degrees, with the finite
    element forms X_h of the window: some C_0 has h_N ||d x|| <= C_0 ||x|| on X_h (the inverse
    estimate); and for every s such that S reproduces P_s Lambda in the degrees of the window,
    some C bounds, for every solution U of the Hodge wave equation U' = (d - d*) U on [0, T] (in
    the domain of the wave operator: the boundary conditions of the complex), C^3 in time with
    ||U'''|| <= L on [0, T], whose values and time increments lie in the Jackson class of
    FEEC.fem with the bounds L and L |t' - t|, every N, time step Delta t > 0 and K Delta t <= T:
    Crank-Nicolson iterates u_k in X_h (every time step, from any u_0 in X_h) have
    ||u_K - U(K Delta t)|| <= ||u_0 - U(0)|| + C (1 + T) L (h_N^(s+1) + Delta t^2), and leapfrog
    iterates (under the CFL condition 2 C_0 Delta t <= c h_N, c < 1, for every constant C_0 >= 0
    of the inverse estimate, from any u_0, u_1 in X_h) have
    (1 - c) ||u_K - U(K Delta t)|| <= ||u_0 - U(0)|| + ||u_1 - U(Delta t)|| +
    C (1 + T) L (h_N^(s+1) + Delta t^2); C is independent of N, Delta t, T, L, U, c, C_0 and the
    starting values. For U = 0 these are the stability bounds ||u_K|| <= ||u_0|| and
    (1 - c) ||u_K|| <= ||u_0|| + ||u_1||.
    FEEC.fem_parallelepiped: every parallelepiped A (0,1)^n + b, A invertible (every open box), is
    such a domain, carries such a mesh family, and the weak and the minimal exterior derivatives
    have closed range in every degree: the closed ranges that FEEC.staticFEEC, the heat clause of
    FEEC.evolutionFEEC and the converse of FEEC.projectionFEEC need besides the conclusions of
    FEEC.fem. FEEC.fem_cube, Sobolev rates: the cube (0, 1/2)^n carries such a mesh family, the
    Freudenthal meshes (stated by their vertices: every simplex of M_N is a Kuhn simplex
    h (z + K_sigma), h = 1/(2(N+1)), with vertices h (z + e_sigma(0) + ... + e_sigma(j-1))), for
    which the family of FEEC.fem (b = false) attains the rate h_N^(s+1) for Sobolev data: if x
    and dx lie in H^(s+1)(Omega) with norm at most L (H^m(Omega) the restrictions to Omega of the
    forms whose coefficients have weak derivatives in L^2(R^n) along all words of length at most
    m), then ||x - pi_N x|| and ||d x - d pi_N x|| are at most B L h_N^(s+1), in every dimension.
    FEEC.crankNicolson_cube and FEEC.leapfrog_cube, the runs of the thesis' Ch. 7 with the
    boundary degrees of freedom of the exact solution (inhomogeneous data, which FEEC.fem_wave
    does not cover): on the Freudenthal meshes of Q = (0, 1/2)^3, for H Lambda(Q), the Whitney
    spaces V_h (the sequence topSeq: P_1 Lambda^0, P_1^- Lambda^1, P_1^- Lambda^2) of the window
    [0, 3) with test space the fields of vanishing boundary traces: continuous form fields have
    exactly one Whitney interpolant on every window [0, m) (face integrals as degrees of
    freedom); the Crank-Nicolson and leapfrog steps with the boundary degrees of freedom of any
    g are uniquely solvable for every time step; V_h^1 with vanishing traces is nonzero; some C_0
    has h_N ||d v|| <= C_0 ||v|| on V_h; for every smooth solution U of the Hodge wave equation
    on [0, T] x cl Q with bound L (RowSolution: C^2 in space, C^3 in time, bounds of the first
    derivatives of U and dU, Lipschitz in time, and of the third time derivative), the
    Crank-Nicolson iterates from Pi_h U(0) with the boundary degrees of freedom of Pi_h U(t_n)
    have ||u_M - U(t_M)|| <= C L (1 + T) (h_N + Delta t^2), and, for every constant C_0 >= 0 of
    the inverse estimate under 2 C_0 Delta t <= c h_N, c < 1, leapfrog iterates with vanishing
    boundary data from u_0, u_1 have sqrt(1 - c) ||u_(m+1)|| <= sqrt((1 + c)(||u_0||^2 +
    ||u_1||^2)) and the leapfrog iterates from Pi_h U(0), Pi_h U(Delta t) with the boundary
    degrees of freedom of Pi_h U(t_n) have ||u_M - U(t_M)|| <= C L (1 + T) (h_N + Delta t^2) /
    (1 - c), C independent of C_0, N, Delta t, c, T, L, U. FEEC.rowSolution_nonvacuous: for every
    T a row solution (row 0 of the thesis' plane wave) has, at every time, a point of Q where the
    electric field and its time derivative are nonzero.
    FEEC.maxwell, the application: the window [0, 3) of FEEC.fem (b = false) for n = 3 read in
    vector proxies: the vector proxies V_N^0, V_N^1, V_N^2 of S_0(M_N), S_1(M_N), S_2(M_N) (scalar
    fields, vector fields v_j = omega_j, vector fields (omega_12, -omega_02, omega_01); for
    S = P_1^- the Lagrange, Nedelec edge and Raviart-Thomas face elements) lie in the domains of
    the weak gradient, curl and divergence (each defined as the adjoint of the closure of its
    formal adjoint on test fields), and they discretize Maxwell's equations
    sigma' = -grad* E, E' = grad sigma - curl* B, B' = curl E (the Hodge wave equation of the
    window H^1 -> H(curl) -> L^2(Omega; R^3); with H = -B and sigma = 0, E' = curl H,
    H' = -curl E with perfect-magnetic-conductor walls): every datum in V_N^0 x V_N^1 x V_N^2
    has a unique Galerkin solution on [0, T], and for data in the domain of the Maxwell
    operator and every T there is a unique strong solution on [0, T], it conserves the energy,
    satisfies the Gauss laws sigma = 0, grad* E = 0, div B = 0 for all t if the data do, and is
    the uniform limit on [0, T] of every family of Galerkin solutions in V_N^0 x V_N^1 x V_N^2
    whose initial data converge to the data; such families exist.
    The shape functions (algebra over a field; the analytic theorems do not use it; it belongs to
    the deferred periodic-table entry and stays compared here until then): FEEC.unisolvent
    (AFW2006 Theorems 4.10, 4.14): on every n-simplex T and for r >= 1, a form of P_r Lambda^k
    (resp. P_r^- Lambda^k) whose moments int_f tr_f omega wedge eta vanish for all m-faces f of T
    and all eta in P^-_(r+k-m) Lambda^(m-k)(R^m) (resp. P_(r+k-m-1) Lambda^(m-k)(R^m)),
    k <= m < r + k, is zero, and the number of these moments, sum_m C(n+1, m+1) dim (test space),
    is dim P_r Lambda^k (resp. dim P_r^- Lambda^k): the moments are unisolvent.
    FEEC.affineInvariantForms (AFW2006 §3.4, over every field K of characteristic 0; polynomial
    forms in coordinates, PolyForm K n, with the same P_r Lambda^k, H_r Lambda^k, kappa and
    P_r^- Lambda^k as the finite element spaces, and the pullback (phi^* omega)_t =
    sum_(#s = #t) det B_(s,t) (omega_s o phi) along phi(x) = B x + b): d H_r Lambda^k and
    kappa H_r Lambda^k are invariant under the pullback of every linear map, and the subspaces of
    H_r Lambda^k invariant under GL(n, K) are 0, d H_(r+1) Lambda^(k-1), kappa H_(r-1)
    Lambda^(k+1) and H_r Lambda^k (r, k >= 1); d P_(r+1) Lambda^(k-1) and X(r, s, k) =
    d P_(r+1) Lambda^(k-1) + kappa P_s Lambda^(k+1) (s <= r, k >= 1) are invariant under the
    pullback of every affine map, X(r, r, k) = P_(r+1)^- Lambda^k, X(r+1, r, k) = P_(r+1)
    Lambda^k and d P_1 Lambda^(k-1) = P_0 Lambda^k (Theorem 3.5); and for 0 < k < n every
    nonzero finite-dimensional space of k-forms invariant under the invertible affine maps is
    d P_(r+1) Lambda^(k-1) or some X(r, s, k), s <= r (Theorem 3.6).
    FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact: over every field K,
    the classification of the GL(n)-invariant subspaces of H_(r+1) Lambda^(k+1), and the
    homogeneous Poincare lemma ker d meet H_r Lambda^(k+1) = d H_(r+1) Lambda^k (AFW2006 (3.2)),
    hold in every dimension and all degrees iff K has characteristic 0.
    The proof is the library Feec of this repository (Feec.FiniteElement, Feec.Models.StarShaped,
    Feec.Models.Parallelepiped, Feec.Mesh, Feec.Instances.Maxwell,
    Feec.Models.Cube.SobolevRateHigh, Feec.Models.Cube.SobolevRestriction,
    Feec.FiniteElement.GlobalInverseEstimate, Feec.Models.Cube.Inhomogeneous,
    Feec.Models.Cube.InhomogeneousError, Feec.Models.Cube.InhomogeneousLeapfrog,
    Feec.Numerics.PlaneWaveCubeError, Feec.FiniteElement.LocalDof,
    Feec.FiniteElement.InvariantForm, Feec.FiniteElement.AffineInvariantForm,
    Feec.Counterexamples.PositiveCharacteristic). This entry absorbs the former entry
    palomar/periodic (its classification theorems) and the Whitney schemes of the former
    palomar/timestepping (FEEC.inverse_estimate, FEEC.crankNicolson_cube, FEEC.leapfrog_cube,
    FEEC.rowSolution_nonvacuous, formerly in the namespace TimeStepping).
