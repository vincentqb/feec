# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of finite element exterior calculus on
# polyhedral domains (`palomar/fem/`), the concrete counterpart of `palomar/feec/`, with the
# algebra of its shape functions (formerly `palomar/periodic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Finite element exterior calculus on polyhedral domains: the P_r^- Lambda and P_r Lambda families"
  description: >-
    The finite element de Rham complexes of Arnold-Falk-Winther on simplicial meshes, and the
    algebra of their shape functions, stated over Mathlib. The abstract definitions (Hilbert
    complexes, subcomplex families with cochain projections, graph-norm bounds and
    approximation, Jackson estimates) are stated in full and self-contained in the challenge, in
    the words of the Palomar entry palomar/feec (the shared block HilbertComplex of
    palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate), so that the families
    of this entry are families in the sense of its theorems, whose conclusions are not restated
    here: under the bounds,
    approximation and closed ranges proved here, FEEC.feec gives the fields static (the mixed
    method), wave (the Hodge wave equation, with constraint propagation: propagates_iff,
    invariantCore, subcomplex) and heat (the Hodge heat equation) of its Verdict, and
    FEEC.feec_rated gives, for the Jackson estimates of this entry, the rates of the static and
    wave verdicts (the fields static and wave of Rated). Jackson.ProjRate is this entry's
    definition. Nine compared theorems; the challenge orders them as
    the construction goes: the shape functions (why P_r Lambda and P_r^- Lambda, over which
    fields), their degrees of freedom, the assembled spaces with their smoothed projections and
    rates, the domains on which the closed-range hypothesis of the static verdict of FEEC.feec
    holds, and Maxwell's equations.
    FEEC.fem: let Omega in R^n
    (n >= 1) be a bounded open domain star-shaped with respect to a ball, M_N conforming
    simplicial meshes of Omega (Mathlib's Affine.Simplex), uniformly shape regular (every
    simplex T contains a ball of radius rho with h_T <= sigma rho, i.e. h_T / rho_T <= sigma)
    and quasi-uniform (q h_N <= h_T), with mesh size h_N -> 0, and S an admissible sequence of
    polynomial families (P_(r_k) Lambda^k or P_(r_k)^- Lambda^k in each degree, r_k >= 1,
    consecutive degrees related by the transitions of AFW2006 §5 / AFW2010 §5.2). Then the L^2
    de Rham complex H Lambda(Omega) with the weak exterior derivative (the adjoint of the formal
    adjoint d^t on test forms) is a Hilbert complex, and the finite element spaces S_k(M_N)
    (the L^2 forms that are on every simplex a polynomial form of S_k, with single-valued
    tangential traces on the common faces of the mesh) are the spaces of a family of
    finite-dimensional subcomplexes of it, N -> infinity, with commuting cochain projections
    that extend to projections of L^2 onto S_k(M_N) with operator norm bounded uniformly in N
    (the smoothed projections of AFW2010 §5.5, Christiansen-Winther 2008), hence bounded in
    every graph norm, which approximates every element of H Lambda^k(Omega) in the graph norm,
    and which has a Jackson estimate attained by the projections themselves: for a C^(s+2) form
    x whose (s+1)-st derivatives and those of its exterior derivative are bounded by L on the
    closure of Omega, ||x - pi_N x|| <= B L h_N^(s+1) and ||d x - d pi_N x|| <= B L h_N^(s+1),
    in the degrees j where S contains P_s Lambda^j and P_s Lambda^(j+1) (Jackson.ProjRate; the
    Jackson structure records the same bound for some element of S_j(M_N)).
    FEEC.femMin: the same for the minimal complex (the closure of d on test forms) and the
    spaces with vanishing tangential traces on the boundary facets, for smooth forms vanishing
    outside Omega. FEEC.fem_parallelepiped: every parallelepiped A (0,1)^n + b, A invertible
    (every open box), is a domain star-shaped with respect to a ball carrying such a mesh
    family, and the weak and the minimal exterior derivatives have closed range in every
    degree, the remaining hypothesis of the static and heat verdicts of FEEC.feec and of the
    static rate of FEEC.feec_rated, which so apply there with no hypothesis left. FEEC.fem_cube, Sobolev rates: the cube (0, 1/2)^n
    carries such a mesh family, the Freudenthal meshes (stated by their vertices: every simplex
    of M_N is a Kuhn simplex h (z + K_sigma), h = 1/(2(N+1)), with vertices
    h (z + e_sigma(0) + ... + e_sigma(j-1))), for which, for every admissible sequence S, the
    spaces S_k(M_N) are those of a family of subcomplexes of H Lambda(Omega) as in FEEC.fem
    (cochain projections extending to uniformly bounded L^2 projections, graph-norm bounds,
    approximation) whose cochain projections attain the rate h_N^(s+1) for Sobolev data: if x and dx lie in H^(s+1)(Omega)
    with norm at most L (H^m(Omega) the restrictions to Omega of the forms whose coefficients
    have weak derivatives in L^2(R^n) along all words of length at most m, with the norm of the
    extension), then ||x - pi_N x|| and ||d x - d pi_N x|| are at most B L h_N^(s+1), in the
    degrees j where S contains P_s Lambda^j and P_s Lambda^(j+1), in every dimension n (no
    condition 2(s+1) > n). FEEC.maxwell, the window [0, 3) of FEEC.fem for n = 3 read in vector
    proxies: the vector proxies V_N^0, V_N^1, V_N^2 of S_0(M_N), S_1(M_N), S_2(M_N) (scalar
    fields, vector fields v_j = omega_j, vector fields (omega_12, -omega_02, omega_01); for
    S = P_1^- the Lagrange, Nedelec edge and Raviart-Thomas face elements) lie in the domains of
    the weak gradient, curl and divergence (each defined as the adjoint of the closure of its
    formal adjoint on test fields), and they discretize Maxwell's equations
    sigma' = -grad* E, E' = grad sigma - curl* B, B' = curl E (the Hodge wave equation of the
    window H^1 -> H(curl) -> L^2(Omega; R^3); with H = -B and sigma = 0, E' = curl H,
    H' = -curl E with perfect-magnetic-conductor walls): every datum in V_N^0 x V_N^1 x V_N^2
    has a unique Galerkin solution on [0, T], and for data in the domain of the Maxwell
    operator and every T there is a unique strong solution on [0, T], it conserves the energy,
    satisfies the Gauss laws sigma = 0, grad* E = 0, div B = 0 for all t if the data do, and is
    the uniform limit on [0, T] of every family of Galerkin solutions in V_N^0 x V_N^1 x V_N^2
    whose initial data converge to the data; such families exist. The shape functions:
    FEEC.unisolvent (AFW2006 Theorems 4.10, 4.14): on every n-simplex T and for r >= 1, a form
    of P_r Lambda^k (resp. P_r^- Lambda^k) whose moments int_f tr_f omega wedge eta vanish for
    all m-faces f of T and all eta in P^-_(r+k-m) Lambda^(m-k)(R^m) (resp.
    P_(r+k-m-1) Lambda^(m-k)(R^m)), k <= m < r + k, is zero, and the number of these moments,
    sum_m C(n+1, m+1) dim (test space), is dim P_r Lambda^k (resp. dim P_r^- Lambda^k): the
    moments are unisolvent (the face integral is stated explicitly, faceMoment: the face
    parametrized by its ordered vertices over the reference simplex, the integrand the top
    coefficient of the pulled-back form wedged with the test form). FEEC.affineInvariantForms
    (AFW2006 §3.4, over every field K of characteristic 0; polynomial forms in coordinates,
    PolyForm K n, with the same P_r Lambda^k, H_r Lambda^k, kappa and P_r^- Lambda^k as the
    finite element spaces, and the pullback (phi^* omega)_t = sum_(#s = #t) det B_(s,t)
    (omega_s o phi) along phi(x) = B x + b): d H_r Lambda^k and kappa H_r Lambda^k are invariant
    under the pullback of every linear map, and the subspaces of H_r Lambda^k invariant under
    GL(n, K) are 0, d H_(r+1) Lambda^(k-1), kappa H_(r-1) Lambda^(k+1) and H_r Lambda^k
    (r, k >= 1); d P_(r+1) Lambda^(k-1) and X(r, s, k) = d P_(r+1) Lambda^(k-1) +
    kappa P_s Lambda^(k+1) (s <= r, k >= 1) are invariant under the pullback of every affine
    map, X(r, r, k) = P_(r+1)^- Lambda^k, X(r+1, r, k) = P_(r+1) Lambda^k and
    d P_1 Lambda^(k-1) = P_0 Lambda^k (Theorem 3.5); and for 0 < k < n every nonzero
    finite-dimensional space of k-forms invariant under the invertible affine maps is
    d P_(r+1) Lambda^(k-1) or some X(r, s, k), s <= r (Theorem 3.6): affine invariance, which
    lets a shape space be defined on one reference simplex, leaves only these spaces.
    FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact: over every field
    K, the classification of the GL(n)-invariant subspaces of H_(r+1) Lambda^(k+1), and the
    homogeneous Poincare lemma ker d meet H_r Lambda^(k+1) = d H_(r+1) Lambda^k (AFW2006 (3.2)),
    hold in every dimension and all degrees iff K has characteristic 0 (in characteristic
    p > 0: for n = 2 the 1-forms with coefficients in the span of x^(p^2), y^(p^2); for n = 1
    the closed, non-exact form x^(p-1) dx). The proof is the library Feec of this repository
    (Feec.FiniteElement, Feec.Models.StarShaped, Feec.Models.Parallelepiped, Feec.Mesh,
    Feec.Instances.Maxwell, Feec.Models.Cube.SobolevRateHigh,
    Feec.Models.Cube.SobolevRestriction, Feec.FiniteElement.LocalDof,
    Feec.FiniteElement.InvariantForm, Feec.FiniteElement.AffineInvariantForm,
    Feec.Counterexamples.PositiveCharacteristic). This entry absorbs the former entry
    palomar/periodic (its classification theorems; its catalogue of polynomial identities and
    dimension counts, FEEC.periodicTable, is not compared here).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

