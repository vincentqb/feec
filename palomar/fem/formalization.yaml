        Feec.FiniteElement.PolySeq.exists_mul_norm_d_le on the Feec meshes M.toFeec Omega (shape
        regularity from the inscribed balls, isShapeRegular_toFeec), whose spaces are the
        challenge's (mem_V_iff). From the former palomar/timestepping.
