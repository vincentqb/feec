      instantiated by the simplicial Lagrange elements of every dimension and degree,
      unisolvence included; local scalar elements, without spaces of forms or projections. A
      search of OpenAlex, arXiv, HAL, the Isabelle AFP and Mathlib on 2026-11-25 found no
      formalization of Whitney forms, of the P_r Lambda or P_r^- Lambda spaces, of discrete
      exterior calculus or of bounded commuting projections.
