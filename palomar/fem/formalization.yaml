      lean: "FEEC.fem"
      module: "Challenge"
      status: "proved"
      note: >-
        By cases on the boundary condition (Solution fem_dMax, fem_dMin). From
        Feec.Models.StarShaped.MeshFamily.poly, polyMin, exists_uniform_polyProj (the L^2
        extension is the Feec projection, defined on all of L^2), eventually_exists_poly_graph and
        exists_mem_poly_le_of_isCsForm (and their Min versions); the spaces through
        Solution/Spaces.lean (mem_V_iff, mem_V₀_iff); the projection rate from the Jackson
        estimate and the uniform bound (Solution/Complex.lean, Jackson.projRate).
