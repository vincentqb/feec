# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the uniformly bounded commuting
# projections of the finite element de Rham complexes (`palomar/fem/`).
version: "v0.4"

project:
  name: "Uniformly bounded commuting projections for the finite element de Rham complexes"
  description: >-
    Do the finite element de Rham complexes of finite element exterior calculus, built from the
    polynomial spaces P_r Lambda^k and P_r^- Lambda^k of Arnold-Falk-Winther, admit cochain
    projections bounded uniformly in the mesh? Stated over Mathlib, the answer is yes, with or
    without boundary conditions, on every bounded open domain star-shaped with respect to a
    ball (polyhedral, its closure being meshed), for every shape-regular quasi-uniform family of
    simplicial meshes and every admissible sequence of polynomial spaces; the families
    approximate in the graph norm and the projections attain the rate h^(s+1). Three compared
    theorems.
    FEEC.fem (the headline): let Omega in R^n (n >= 1) be a bounded open domain star-shaped
    with respect to a ball, M_N conforming simplicial meshes of Omega (Mathlib's Affine.Simplex),
    uniformly shape regular (every simplex T contains a ball of radius rho with
    h_T <= sigma rho) and quasi-uniform (q h_N <= h_T), with mesh size h_N -> 0, and S an
    admissible sequence of polynomial families (P_(r_k) Lambda^k or P_(r_k)^- Lambda^k in each
    degree, r_k >= 1, consecutive degrees related by the transitions of AFW2006 §5 / AFW2010 §5.2).
    Then, for b = false, the L^2 de Rham complex H Lambda(Omega) (the weak exterior derivative,
    the adjoint of the formal adjoint d^t on test forms), and for b = true the minimal complex
    H°Lambda(Omega) (the closure of d on test forms), is a Hilbert complex, and the finite
    element spaces S_k(M_N) (the L^2 forms that are on every simplex a polynomial form of S_k,
    with single-valued tangential traces on the common faces of the mesh; for b = true with
    vanishing traces on the boundary facets) are the spaces of a family of finite-dimensional
    subcomplexes, N -> infinity, whose commuting cochain projections extend to projections of
    L^2 with operator norm bounded uniformly in N (the smoothed projections of AFW2010 §5.5,
    Christiansen-Winther 2008), hence bounded in every graph norm, which approximates in the
    graph norm, with a Jackson estimate attained by the projections: for a C^(s+2) form x whose
    (s+1)-st derivatives and those of dx are bounded by L on the closure of Omega (vanishing
    outside Omega for b = true), ||x - pi_N x|| and ||dx - d pi_N x|| are at most B L h_N^(s+1),
    in the degrees j where S contains P_s Lambda^j and P_s Lambda^(j+1).
    FEEC.fem_parallelepiped: every parallelepiped A (0,1)^n + b, A invertible (every open box), is
    such a domain and carries such a mesh family, and H Lambda(Omega) and H°Lambda(Omega) are
    Hilbert complexes with, in every degree k, closed range, finite-dimensional harmonic forms
    N(d^k) ∩ N((d^(k-1))*), of dimension [k = 0] for H Lambda and [k = n] for H°Lambda, and the
    compactness property (the unit ball of D(d^k) ∩ D((d^(k-1))*) in its graph norm is
    relatively compact in L^2). FEEC.fem_cube, Sobolev rates: the cube (0, 1/2)^n carries
    such a mesh family, the Freudenthal meshes (stated by their vertices: every simplex of M_N is
    a Kuhn simplex h (z + K_sigma), h = 1/(2(N+1)), with vertices
    h (z + e_sigma(0) + ... + e_sigma(j-1))), for which a family with the conclusions of FEEC.fem
    (b = false; in the proof, the family of FEEC.fem) attains the rate h_N^(s+1) for Sobolev
    data: if x and dx lie in H^(s+1)(Omega) with norm at most L (H^m(Omega) the restrictions to Omega of the forms whose coefficients have weak
    derivatives in L^2(R^n) along all words of length at most m), then ||x - pi_N x|| and
    ||d x - d pi_N x|| are at most B L h_N^(s+1), in every dimension.
    This is exactly what the Galerkin theorems of the Palomar entry palomar/feec need
    (FEEC.projectionFEEC, FEEC.staticFEEC, FEEC.evolutionFEEC), in the same notions (the shared
    blocks HilbertComplex and SubcomplexFamily of palomar/shared/vocabulary.lean.txt, checked
    byte for byte by the gate): the converse of
    FEEC.projectionFEEC (the uniform discrete Poincare inequality and harmonic bound) needs
    uniformly graph-bounded cochain projections and closed ranges; FEEC.staticFEEC (the mixed
    method) graph-norm bounds in two consecutive degrees and Poincare inequalities, which are
    the closed ranges, and its rates are those of the Jackson estimates; the wave clause of
    FEEC.evolutionFEEC needs approximation alone (in the last degree of the window in L^2, which
    follows from graph-norm approximation by density), so it holds on every domain of this
    entry; its heat clause moreover graph-norm bounds, the L^2 bound of the projections in the
    last degree (both from FEEC.fem) and closed ranges (FEEC.fem_parallelepiped). On
    parallelepipeds all of them apply, at the rates h^(s+1), and so does the cohomology clause of
    the static verdict, which needs moreover the finite-dimensional harmonic forms of
    FEEC.fem_parallelepiped: for every mesh family and admissible sequence the cochain
    projections eventually induce isomorphisms H^k(Omega) ≅ H^k(S(M_N)). The rate attained
    by the projections themselves (Jackson.ProjRate) is more than these theorems need: it gives
    the comparison fields of the fully discrete schemes of palomar/waves.
    The proof is the library Feec of this repository (Feec.FiniteElement, Feec.Models.StarShaped,
    Feec.Models.Parallelepiped, Feec.Mesh, Feec.Models.Cube.SobolevRateHigh,
    Feec.Models.Cube.SobolevRestriction).
  authors:
    - "Vincent Quenneville-Bélair"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

