    Human-directed, AI-written development. The Challenge statement and its definitions were
    written by an AI agent for this submission, to be reviewed by the author; the Solution
    identifies them with the definitions of the library Feec (Solution/Forms.lean, Poly.lean,
    Mesh.lean, Trace.lean, Spaces.lean, Regularity.lean, Maxwell.lean, Dof.lean, Affine.lean)
    and applies its theorems; the projections attain the Jackson rate by the quasi-optimality
    of a bounded projection (Solution/Complex.lean, Jackson.projRate, from
    Feec.ForMathlib.Analysis.QuasiOptimal). The classification statements and their bridge were
    moved from the former entry palomar/periodic and restated on the coordinate forms of this
    entry (2026-11-17).

fidelity:
  divergences: >-
    (1) Coordinates: points of R^n are Fin n -> R (sup norm), forms are given by their
    coefficients on dx_s, s an increasing k-subset of Fin n, and L^2(Omega; Lambda^k) is the
    l^2 sum of copies of L^2(Omega); polynomial forms are coefficient functions
    Finset (Fin n) -> MvPolynomial (Fin n) K over a field K, evaluated to form fields over R;
    this is the standard coordinate model, not Mathlib's (alternating-map) differential forms
    or its exterior algebra (the former palomar/periodic used P(K^n) (x) Lambda(K^n)*; the two
    are identified in Feec, Feec.Algebra.ExteriorAlgebraForm). The pullback of polynomial forms
    is stated by minors, (phi^* omega)_t = sum_(#s = #t) det B_(s,t) (omega_s o phi).
    (2) The weak exterior derivative is defined as the adjoint of the closure of the formal
    adjoint d^t on test forms (Mathlib's LinearPMap.adjoint), and the minimal one as the closure
    of d on test forms (Submodule.toLinearPMap of the closed graph); the docstrings state the
    weak characterization, which is Mathlib's definition of the adjoint domain.
    (3) The finite element spaces are stated as piecewise polynomial forms with single-valued
    tangential traces on every common face (the trace agreement on all subsimplices, not only on
    facets); the sources define them through degrees of freedom or as the piecewise polynomial
    forms in H Lambda^k(Omega). The degrees of freedom are compared on one simplex
    (FEEC.unisolvent); the equivalence of the two descriptions of the global spaces is proved in
    the solution, not stated; the equivalence with membership in H Lambda^k is not stated (the
    conformity direction is a consequence of the subcomplex property, which is compared).
    FEEC.unisolvent states unisolvence as injectivity of the moments together with the count
    (number of moments = dimension); bijectivity onto the dual for chosen bases of the test
    spaces follows by linear algebra and is not stated. Faces are oriented by the increasing
    order of their vertices (order embeddings Fin (m+1) -> Fin (n+1)); the moments are those of
    AFW2006 §4 up to this orientation sign.
    (4) Shape regularity is the bound h_T / rho_T <= sigma (Ciarlet §3.1), stated as: every
    simplex contains a ball of radius rho with h_T <= sigma rho, for the sup norm of Fin n -> R
    (Euclidean balls change sigma by a factor depending on n); Feec works with the equivalent
    edge-matrix bounds, and the two directions are proved there (Feec.Mesh.isShapeRegular_of_ball,
    Feec.Mesh.exists_ball_of_isShapeRegular). Quasi-uniformity is assumed (the smoothed
    projections of Feec use a fixed mollification scale h_N); the sources' local variants for
    merely shape-regular meshes (Christiansen-Winther 2008; Falk-Winther 2014) are not
    formalized.
    (5) Admissible sequences (PolySeq) have r_k >= 1 in every degree; the piecewise constants
    P_0 Lambda^n are the equal space P_1^- Lambda^n, and the sequences through P_0 Lambda^k with
    k < n are not covered (they continue with P_0^- Lambda = 0 and cannot approximate
    H Lambda^(k+1)). This is the only notion of admissible sequence of the entry (the former
    palomar/periodic also allowed r_k = 0 after a full P_0 Lambda^k, for the exactness of the
    polynomial complexes, which is no longer compared).
    (6) Domains: bounded open, star-shaped with respect to a ball (which implies Lipschitz);
    the sources (AFW2010 §5.5, Christiansen-Winther 2008) allow general Lipschitz polyhedral
    domains, which are not covered (the extension-dilation construction of the smoothed
    projections in Feec uses star-shapedness). The closed range of d, a hypothesis of the
    static and heat verdicts of FEEC.feec and of the static rate of FEEC.feec_rated, is proved
    only on parallelepipeds (FEEC.fem_parallelepiped); on other star-shaped domains it stays a
    hypothesis of these.
    (7) Rates. On general star-shaped domains and mesh families (FEEC.fem, FEEC.femMin) the
    Jackson class is C^(s+2) forms with sup bounds on the (s+1)-st derivatives of x and dx on
    the closure of Omega: one derivative more than the order requires and a W^(s+1,infinity)
    instead of an H^(s+1) norm. For femMin the smooth form must vanish outside Omega and be
    C^(s+2) on R^n, so its derivatives up to order s+2 vanish on the boundary: a smaller class
    than vanishing tangential trace. Sobolev data are compared only on the cube (0, 1/2)^n with
    its Freudenthal meshes (FEEC.fem_cube; other mesh families of the cube are not covered) and
    only for H Lambda; H^m(Omega) is defined by restriction of H^m(R^n) (weak derivatives in
    L^2(R^n) along words, the norm a sum over words, equivalent to the multi-index norm), which
    equals the weak-derivative space of Omega on Lipschitz domains (not formalized); the norm is
    the full H^(s+1) norm, not the seminorm. In every case the rate is attained by the bounded
    cochain projections themselves (Jackson.ProjRate), not only by some element of the space.
    The H^(s+1) estimate ||x - pi_N x|| <= C h^(s+1) ||x||_(H^(s+1)) on general star-shaped
    domains and mesh families (AFW2010 §5.5) is not proved in Feec: by the
    quasi-optimality of the bounded projections it reduces to the best approximation of
    H^(s+1) forms, which Feec proves only on the cube (Fourier series on the torus after
    periodization). Feec has the pieces of a general proof for 2(s+1) > n (the L^2
    Bramble-Hilbert lemma with averaged Taylor polynomials and the L^2 interpolation estimate of
    the canonical interpolant on homothetic simplices, Feec.FiniteElement.BrambleHilbertL2);
    missing are that estimate on general shape-regular simplices, its assembly over the mesh,
    and the passage from smooth to H^(s+1) data by mollification; without 2(s+1) > n it needs
    local estimates for the smoothed projections or a Clement/Scott-Zhang-type quasi-interpolant.
    (8) One finite element space femSpace Omega M S Gamma k with vanishing traces on a set Gamma
    of facets serves both families: Gamma = ∅ for H Lambda(Omega) and Gamma = M.boundaryFacets,
    the facets of a single simplex of the mesh, for the vanishing boundary traces of
    H°Lambda(Omega) (the earlier femSpace and femSpaceMin; Solution: FEEC.femSpace_empty,
    FEEC.mem_boundaryFacets_iff). The notions shared with other entries (Hilbert complexes and
    their families, differential and polynomial forms, admissible sequences, meshes with the
    Freudenthal meshes IsFreudenthal, finite element spaces, the regularity classes IsCsForm and
    IsSobolevForm) are the canonical blocks of palomar/shared/vocabulary.lean.txt, checked byte
    for byte by the gate; IsGraphBounded is now stated through IsGraphBoundedBy (definitionally
    the earlier direct form), the Freudenthal meshes of FEEC.fem_cube through IsFreudenthal (the
    earlier inline clause), and dMax, dMin inline (the earlier codiffGraph, codiffMin and
    testGraph are definitional steps, defined in Solution/Forms.lean).
    (9) FEEC.maxwell: the window is that of H Lambda(Omega), so the boundary conditions are
    natural (perfect magnetic conductor in the (sigma, E, B) form, B the 2-form proxy and
    H = -B the magnetic field): E . n = 0 and B x n = 0 (H x n = 0) enter through the adjoints
    grad* and curl*, the physical PMC walls; the perfect electric conductor (the minimal
    complex) is not compared in vector proxies. Scalar fields are L^2 fields with one component
    (Fin 1), and the state is the triple (sigma, E, B) with the scalar potential sigma of the
    Hodge wave equation (sigma = 0 is one of the Gauss laws). Data lie in the domain of the
    Maxwell operator; the statement has no rate (the rates of the window [0, 3) of FEEC.fem in
    forms, from its Jackson estimate, are the wave field of FEEC.feec_rated of palomar/feec; in
    vector proxies they are not compared). The Galerkin solutions are
    differentiable in L^2 on [0, T] with values in V_N; their derivatives are not required to
    lie in V_N (they do when T > 0, V_N being finite-dimensional). Most of FEEC.maxwell is the
    transport of the window of FEEC.fem to vector proxies.
    (10) AFW2006 §3.4 is stated over every field K of characteristic 0 (the source works over
    R). The hypothesis is necessary (FEEC.charZero_iff_classification,
    FEEC.charZero_iff_closed_eq_exact), but both iff theorems quantify over all dimensions: in a
    fixed dimension the classification can hold in characteristic p (in dimension 1 every
    subspace of H_r Lambda^k is 0 or H_r Lambda^k); they do not identify the dimensions in which
    it fails. The conclusions of invariance (the summands of (3.10), (3.18), Theorem 3.5) are
    stated for the pullback of every linear (resp. affine) map, singular ones included; the
    hypotheses of the classifications only for the invertible ones (GL(n, K) for the subspaces
    of H_r Lambda^k; x -> g x + b for Theorem 3.6, which is stronger than AFW's hypothesis of all
    affine maps). The irreducibility is stated for r, k >= 1 (H_(r+1) Lambda^(k+1)); Theorem
    3.6's s >= -1 is stated as the two alternatives s = -1 (d P_(r+1) Lambda^(k-1)) and
    0 <= s <= r.

