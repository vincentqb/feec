related_formalizations: []

status:
  scope: >-
    Formalized and compared: FEEC.feec (Challenge.lean) for every RCLike field, every Hilbert
    complex on Z, every conforming family along any filter, every degree j (static) and every
    window [a, a+m) (wave, heat). Not compared (proved in Feec, outside the statement): rates
    from Jackson estimates, quasi-optimality and the harmonic gap, discrete Poincaré and inf-sup
    constants, energy identities, constraint residuals and departure of non-reducing
    constraints, leapfrog, Crank-Nicolson signed systems, Runge-Kutta and rational schemes,
    perturbations, variational crimes, and the concrete finite element families (Whitney,
    P_r, P_r^-, cubical Q^-) and physical instances.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

