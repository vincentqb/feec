fidelity:
  divergences: >-
    (1) Mathlib has no C0-semigroups: the exact evolutions are operator families S asserted to
    exist and characterized by strong solutions (unique, D(A) dense, contraction), so S is
    unique for t >= 0; for the wave, S is a unitary group with S(s+t) = S(s) S(t).
    (2) Convergence statements are qualitative (every datum, every family of discrete data
    converging to it); the rates of the source are not part of the compared statement.
    (3) The cochain projections are uniformly bounded in W, the hypothesis of the smoothed
    projections ([AFW2010] §5.5), stronger than graph-norm boundedness of [AFW2010] §3.3.
    (4) The differential is encoded as d i j for all pairs, zero unless j = i + 1.
    (5) Static cohomology: the map induced by the inclusion V_h ⊆ W is bijective eventually
    (the source states the map induced by the projection; the two are inverse).
    (6) The heat equation is u' = (d - d*)^2 u = -Δu, with discrete generator L_h^2 = -Δ_h.
    (7) Windows: the evolutions live on the l2 sum of m consecutive degrees, with the window's
    own closedness hypotheses for the heat equation (closed ranges of H; finite-dimensional
    kernel of d - d* on the window).

review:
  status: "self-assessed"
  reviewers:
