# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the FEEC theorem (`palomar/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The FEEC theorem: finite element exterior calculus for Hilbert complexes, static, wave and heat"
  description: >-
    A Lean 4 formalization of the approximation theory of finite element exterior calculus
    (FEEC) for an arbitrary Hilbert complex of closed densely defined operators on Z and an
    arbitrary conforming family of finite-dimensional subcomplexes with uniformly bounded
    commuting projections and the approximation property. The compared theorem FEEC.feec
    states: (static) with closed ranges and finite-dimensional harmonic forms in degree j,
    the inclusion eventually induces an isomorphism of discrete and continuous cohomology,
    the mixed Hodge Laplacian and its Galerkin discretizations are uniquely solvable and the
    discrete solutions converge in the graph norm; (wave) on every window of the complex the
    Hodge wave equation for d - d* is well posed with a unitary group, its semidiscrete Galerkin
    solutions and its theta-schemes (theta >= 1/2) converge for every datum as h and the time
    step tend to 0, and a closed constraint is propagated by the flow iff it reduces d - d*;
    (heat) with closed ranges and finite-dimensional harmonic fields, the same for the Hodge
    heat equation. The statement is self-contained over Mathlib; the proof is the library
    Feec of this repository (the crown theorem Feec.HilbertComplex.ConformingFamily.feec).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

