fidelity:
  divergences: >-
    (1) A polynomial differential form on K^n is its family of coefficients s -> omega_s in the
    basis dx_s, s ranging over the subsets of Fin n (the sources' increasing multi-indices); the
    exterior derivative and the Koszul differential are given by their coordinate formulas
    (d omega)_s = sum_(j in s) eps(j,s) d_j omega_(s \ j) and
    (kappa omega)_s = sum_(j not in s) eps(j,s) x_j omega_(s u j), eps(j,s) = (-1)^#{l in s | l < j},
    rather than through Mathlib's exterior powers or Kahler differentials. A k-form is a form
    vanishing off #s = k; all spaces are subspaces of the space of all forms.
    (2) The coefficients are in an arbitrary field of characteristic 0 (the sources work over R).
    (3) P_r^- Lambda^k is defined as P_(r-1) Lambda^k + kappa H_(r-1) Lambda^(k+1), the sources'
    definition, for r >= 1; at r = 0 the definition takes an unused junk value and the clauses
    assume r >= 1. Since P_(r+1)^- = P_r + kappa H_r by definition, the content of the first
    Koszul decomposition is that the sum is direct.
    (4) Exactness is stated degree by degree as an identity of subspaces,
    ker d intersected with the space of (k+1)-forms = d(space of k-forms), and the degree-0
    cohomology as ker d intersected with the 0-forms = P_0 Lambda^0 (the constants); not as a
    HomologicalComplex in Mathlib's homological algebra.
    (5) The decompositions are stated where both summands are generic: P_r Lambda^k = P_r^-
    Lambda^k (+) d H_(r+1) Lambda^(k-1) for k >= 1, r >= 1 and H_r Lambda^k = kappa
    H_(r-1) Lambda^(k+1) (+) d H_(r+1) Lambda^(k-1) for r, k >= 1; the degenerate cases
    (k = 0 or r = 0) are not stated.
    (6) Q_r^- Lambda^k is defined by its coordinate description (omega_s a combination of
    monomials x^alpha with alpha_j <= r - 1 for j in s and alpha_j <= r otherwise), not as the
    tensor product of one-dimensional P_r^- spaces; the equivalence is proved in Feec but not
    part of the statement. Only the isotropic degree r is stated.
    (7) Only the polynomial algebra is stated: no meshes, degrees of freedom or unisolvence, and
    no serendipity column of the periodic table.

