# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the classification of invariant spaces of polynomial differential forms (`palomar/periodic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Classification of invariant spaces of polynomial differential forms"
  description: >-
    A Lean 4 formalization of the classification of the invariant spaces of polynomial
    differential forms on K^n (Arnold-Falk-Winther 2006, §3.4), over every field K of
    characteristic 0, with the proof that characteristic 0 is necessary, and of the polynomial
    algebra of the spaces it classifies, the shape spaces P_r Lambda^k and P_r^- Lambda^k of the
    simplicial columns of the periodic table of the finite elements (Arnold-Logg 2014), together
    with the cubical spaces Q_r^- Lambda^k (Arnold-Boffi-Bonizzoni 2015, §5). Affine invariance
    is what lets a finite element shape space be defined on a reference simplex and transported
    to every simplex independently of the affine map (AFW2006 §3.4); the classification shows
    that, for 0 < k < n, besides P_r Lambda^k and P_r^- Lambda^k only the spaces
    d P_(r+1) Lambda^(k-1) + kappa P_s Lambda^(k+1), s < r - 1, have it. The formal proof
    replaces the representation theory (Fulton-Harris) of the source by a direct argument valid
    over every field of characteristic 0, and shows that characteristic 0 cannot be dropped. A polynomial
    differential form is an element of
    P(K^n) (x) Lambda(K^n)* = MvPolynomial (Fin n) K (x) ExteriorAlgebra K (Module.Dual K (Fin n -> K)),
    the k-forms with coefficients in a space S of polynomials are S (x) Lambda^k (Mathlib's
    exteriorPower), the exterior derivative is d(p (x) theta) = sum_j d_j p (x) (dx_j wedge theta),
    the Koszul differential is kappa(p (x) theta) = sum_j x_j p (x) (e_j contracted into theta)
    (Mathlib's CliffordAlgebra.contractLeft), and the pullback along phi(x) = B x + b is
    phi^*(p (x) theta) = (p o phi) (x) Lambda(B^T) theta (MvPolynomial.aeval tensor
    ExteriorAlgebra.map of the dual map). H_r Lambda^k and P_r Lambda^k have coefficients
    homogeneous of degree r, of degree at most r, and P_r^- Lambda^k = P_(r-1) Lambda^k +
    kappa H_(r-1) Lambda^(k+1) (r >= 1), P_0^- Lambda^k = 0.
    The compared theorem FEEC.affineInvariantForms states, over every field K of characteristic
    0: d H_r Lambda^k and kappa H_r Lambda^k are invariant under the pullback of every linear
    map, and the subspaces of H_r Lambda^k invariant under GL(n, K) are 0,
    d H_(r+1) Lambda^(k-1), kappa H_(r-1) Lambda^(k+1) and H_r Lambda^k (r, k >= 1);
    d P_(r+1) Lambda^(k-1) and X(r, s, k) = d P_(r+1) Lambda^(k-1) + kappa P_s Lambda^(k+1)
    (s <= r, k >= 1) are invariant under the pullback of every affine map,
    X(r, r, k) = P_(r+1)^- Lambda^k, X(r+1, r, k) = P_(r+1) Lambda^k and
    d P_1 Lambda^(k-1) = P_0 Lambda^k (Theorem 3.5); and for 0 < k < n every nonzero
    finite-dimensional space of k-forms invariant under the invertible affine maps is
    d P_(r+1) Lambda^(k-1) or some X(r, s, k), s <= r (Theorem 3.6). The compared theorems
    FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact state, over every
    field K, that the classification of the GL(n)-invariant subspaces of H_(r+1) Lambda^(k+1),
    and the homogeneous Poincare lemma ker d meet H_r Lambda^(k+1) = d H_(r+1) Lambda^k
    (AFW2006 (3.2)), hold in every dimension n and all degrees iff K has characteristic 0 (over
    a field of characteristic p > 0: for n = 2 the 1-forms with coefficients in the span of
    x^(p^2), y^(p^2); for n = 1 the closed, non-exact form x^(p-1) dx). The compared theorem
    FEEC.periodicTable states, over every field (of characteristic 0 for the clauses marked
    [CharZero K]), in every dimension n, form degree k, polynomial degree r and multidegree b:
    the dimensions of P_r Lambda^k, H_r Lambda^k, P_r^- Lambda^k, kappa H_r Lambda^(k+1) and
    Q_b^- Lambda^k and the degrees-of-freedom counts of AFW2006 Theorems 4.9, 4.13;
    d o d = 0, kappa o kappa = 0, the Leibniz rule for kappa and the closure of P_r Lambda and
    P_r^- Lambda under the wedge product; that the polynomial de Rham complexes of
    P_(r-k) Lambda^k, P_r^- Lambda^k, Q_b^- Lambda^k and of every admissible sequence of the
    periodic table are cochain complexes (CochainComplex (ModuleCat K) N) exact in positive
    degree with the constants as closed 0-forms; the exactness of the homogeneous de Rham and
    Koszul complexes and of the polynomial Koszul complex; the homotopy formula
    (d kappa + kappa d) omega = (r + k) omega on H_r Lambda^k, the Koszul decompositions
    H_r Lambda^k = kappa H_(r-1) Lambda^(k+1) (+) d H_(r+1) Lambda^(k-1),
    P_r Lambda^k = kappa P_(r-1) Lambda^(k+1) (+) d P_(r+1) Lambda^(k-1) (k >= 1) and
    P_r Lambda^k = P_r^- Lambda^k (+) d H_(r+1) Lambda^(k-1), and the characterizations of
    P_r^- Lambda^k of AFW2006 §3.3 (field by field in alignment below). The statement is
    self-contained over Mathlib (MvPolynomial and its submodules homogeneousSubmodule,
    restrictTotalDegree and restrictSupport, TensorProduct, ExteriorAlgebra, exteriorPower,
    CliffordAlgebra.contractLeft, Matrix.GeneralLinearGroup, CochainComplex, ModuleCat,
    finrank); the proof is the library Feec of this repository
    (Feec.Algebra.ExteriorAlgebraForm identifies Mathlib's exterior algebra with the
    coefficient forms of Feec; Feec.FiniteElement.InvariantForm,
    Feec.FiniteElement.AffineInvariantForm, Feec.Counterexamples.PositiveCharacteristic,
    Feec.Algebra.PolynomialFormDim, Feec.Algebra.CubicalForm).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

