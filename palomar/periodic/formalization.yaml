# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the algebra of the periodic table of the finite elements (`palomar/periodic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The algebra of the periodic table of the finite elements: P_r, P_r^- and Q_r^- polynomial differential forms"
  description: >-
    A Lean 4 formalization of the polynomial algebra behind the periodic table of the finite
    elements (Arnold-Logg 2014): the spaces of polynomial differential forms on K^n used by the
    simplicial families P_r Lambda^k and P_r^- Lambda^k (Arnold-Falk-Winther 2006, §3; 2010,
    §5.1) and the cubical family Q_r^- Lambda^k (Arnold-Boffi-Bonizzoni 2015, §5), in any
    multidegree b. A polynomial differential form is an element of
    P(K^n) (x) Lambda(K^n)* = MvPolynomial (Fin n) K (x) ExteriorAlgebra K (Module.Dual K (Fin n -> K)),
    the k-forms with coefficients in a space S of polynomials are S (x) Lambda^k (Mathlib's
    exteriorPower), the exterior derivative is d(p (x) theta) = sum_j d_j p (x) (dx_j wedge theta)
    and the Koszul differential is kappa(p (x) theta) = sum_j x_j p (x) (e_j contracted into theta)
    (Mathlib's CliffordAlgebra.contractLeft). Over every field K (of characteristic 0 for the
    clauses marked [CharZero K]), in every dimension n, form degree k and polynomial degree r, the
    compared theorem FEEC.periodicTable states: (1) dim P_r Lambda^k = C(r+n, r+k) C(r+k, k),
    dim H_r Lambda^k = C(n, k) C(n+r-1, r), dim P_r^- Lambda^k = C(r+n, r+k) C(r+k-1, k) (r >= 1), dim kappa H_r Lambda^(k+1) =
    dim d H_(r+1) Lambda^k = C(n+r, r+k+1) C(r+k, k), dim Q_b^- Lambda^k =
    sum_(#s = k) prod_j (b_j + 1 - [j in s]) and dim Q_r^- Lambda^k = C(n, k) r^k (r+1)^(n-k);
    (2) d o d = 0, kappa o kappa = 0, the Leibniz rule
    kappa(omega wedge eta) = kappa omega wedge eta + (-1)^k omega wedge kappa eta (the wedge product
    is the product of the algebra), the closures P_r Lambda^k wedge P_s Lambda^l in
    P_(r+s) Lambda^(k+l), P_r^- Lambda^k wedge P_s^- Lambda^l in P_(r+s)^- Lambda^(k+l) and
    P_s P_r^- Lambda^k in P_(r+s)^- Lambda^k, and the three polynomial de Rham complexes
    P_r Lambda^0 -> P_(r-1) Lambda^1 -> ... -> P_0 Lambda^r -> 0, P_r^- Lambda^0 -> P_r^- Lambda^1 -> ...
    and Q_b^- Lambda^0 -> Q_b^- Lambda^1 -> ... are cochain complexes of K-vector spaces
    (CochainComplex (ModuleCat K) N), exact (HomologicalComplex.ExactAt) in every positive degree,
    whose closed 0-forms are the constants (r >= 1 for P_r^-), the first a subcomplex of the
    second (r >= 1); the homogeneous de Rham complexes H_r Lambda^0 -> H_(r-1) Lambda^1 -> ... and
    the homogeneous and polynomial Koszul complexes 0 -> H_(r-n) Lambda^n -> ... -> H_r Lambda^0 -> 0
    and 0 -> P_(r-n) Lambda^n -> ... -> P_r Lambda^0 -> 0 are exact, but for the constants
    (P_(r+1) Lambda^0 = kappa P_r Lambda^1 (+) P_0 Lambda^0), as kernel-in-image identities;
    (3) the homotopy formula
    (d kappa + kappa d) omega = (r + k) omega on H_r Lambda^k, the injectivity of d on the range of
    kappa and of kappa on the range of d, the Koszul decompositions
    H_(r+1) Lambda^(k+1) = kappa H_r Lambda^(k+2) (+) d H_(r+2) Lambda^k,
    H_(r+1) Lambda^0 = kappa H_r Lambda^1, H_0 Lambda^(k+1) = d H_1 Lambda^k,
    P_(r+1) Lambda^(k+1) = kappa P_r Lambda^(k+2) (+) d P_(r+2) Lambda^k,
    P_0 Lambda^(k+1) = d P_1 Lambda^k and
    P_r Lambda^(k+1) = P_r^- Lambda^(k+1) (+) d H_(r+1) Lambda^k (every r, P_0^- = 0), hence
    d P_r^- Lambda^k = d P_r Lambda^k, the two forms
    P_(r+1)^- Lambda^k = P_r Lambda^k (+) kappa H_r Lambda^(k+1) = P_r Lambda^k + kappa P_r Lambda^(k+1)
    of the definition, P_r^- Lambda^0 = P_r Lambda^0, P_r^- Lambda^n = P_(r-1) Lambda^n, the
    equivalent definition P_r^- Lambda^k = {omega in P_r Lambda^k | kappa omega in P_r Lambda^(k-1)}
    (r + k >= 1), the strict inclusions
    P_(r-1) Lambda^k < P_r^- Lambda^k (k < n) and P_r^- Lambda^(k+1) < P_r Lambda^(k+1) (k < n),
    and that a closed form of P_(r+1)^- Lambda^k lies in P_r Lambda^k (H_r: the forms with
    homogeneous coefficients of degree r); (4) the dimension counts of the degrees of freedom,
    dim P_r Lambda^k = sum_(m <= n) C(n+1, m+1) dim P_(r+k-m)^- Lambda^(m-k)(K^m) and
    dim P_r^- Lambda^k = sum_(m <= n) C(n+1, m+1) dim P_(r+k-m-1) Lambda^(m-k)(K^m) (r >= 1, the
    summand 0 unless k <= m < r + k), and for every admissible sequence (in each degree k the
    space P_(r_k) Lambda^k or P_(r_k)^- Lambda^k, r_k >= 1, followed by P_(r_k)^- Lambda^(k+1)
    or P_(r_k - 1) Lambda^(k+1)) that its spaces form a cochain complex, exact in positive degree
    [CharZero K] with the constants as closed 0-forms. A second compared theorem, FEEC.affineInvariantForms,
    states over every field K of characteristic 0 the classification of the affinely invariant
    spaces of AFW2006 §3.4, with the pullback
    phi^*(p (x) theta) = (p o phi) (x) Lambda(B^T) theta along phi(x) = B x + b
    (MvPolynomial.aeval tensor ExteriorAlgebra.map of the dual map): d H_r Lambda^k and
    kappa H_r Lambda^k are invariant under the pullback of every linear map, and the subspaces
    of H_r Lambda^k invariant under GL(n, K) are 0, d H_(r+1) Lambda^(k-1),
    kappa H_(r-1) Lambda^(k+1) and H_r Lambda^k (r, k >= 1); X(r, s, k) = d P_(r+1) Lambda^(k-1) + kappa P_s Lambda^(k+1) is
    affinely invariant for s <= r, X(r, r, k) = P_(r+1)^- Lambda^k, X(r+1, r, k) = P_(r+1) Lambda^k
    and d P_1 Lambda^(k-1) = P_0 Lambda^k (Theorem 3.5); and for 0 < k < n every nonzero
    finite-dimensional space of k-forms invariant under the invertible affine maps is
    d P_(r+1) Lambda^(k-1) or some X(r, s, k), s <= r (Theorem 3.6). A third compared theorem,
    FEEC.charZero_iff_classification, states over every field K that characteristic 0 is
    necessary: the classification of the GL(n)-invariant subspaces of H_(r+1) Lambda^(k+1) holds
    in every dimension n and all r, k iff K has characteristic 0 (over a field of characteristic
    p > 0, n = 2, the 1-forms with coefficients in the span of x^(p^2), y^(p^2) are a
    counterexample). The
    statement is self-contained over Mathlib (MvPolynomial and its submodules
    homogeneousSubmodule, restrictTotalDegree and restrictSupport, TensorProduct, ExteriorAlgebra,
    exteriorPower, CliffordAlgebra.contractLeft, CochainComplex, ModuleCat, finrank); the proof is
    the library Feec of this repository (Feec.Algebra.ExteriorAlgebraForm identifies Mathlib's
    exterior algebra with the coefficient forms of Feec; Feec.Algebra.PolynomialFormDim,
    Feec.Algebra.CubicalForm, Feec.FiniteElement.InvariantForm,
    Feec.FiniteElement.AffineInvariantForm).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
