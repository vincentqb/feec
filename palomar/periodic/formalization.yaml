status:
  scope: >-
    Formalized and compared: FEEC.periodicTable (Challenge.lean) for every field (of
    characteristic 0 where marked), every n, k, r and multidegree b (r >= 1 where the sources
    require it), and FEEC.affineInvariantForms over every field of characteristic 0, every n,
    k, r, s, and FEEC.charZero_iff_classification (characteristic 0 is necessary for the
    GL(n)-classification) over every field. Not compared (proved in Feec, outside the statement):
    the failure of the Poincare lemma for H_r Lambda^k in positive characteristic
    (Feec.Counterexamples.PositiveCharacteristic.charZero_iff_closed_eq_exact), the homotopy formula over
    every commutative ring, the tensor-product characterization of Q_b^- Lambda^k as a span of
    products of one-dimensional factors (Feec.Koszul.cubeFormMinus_eq_span), the serendipity
    spaces S_r Lambda^k, the parametrization of the admissible P/P^- sequences ending in
    P_s Lambda^n by their kinds (Feec.FiniteElement.PolySeq.ofKinds), the closed-form dimensions
    of the classical elements in K^2 and K^3 (Feec.Koszul.finrank_polyForm_three_one, ...),
    and the finite element spaces on meshes (degrees of freedom, unisolvence, Whitney forms).
