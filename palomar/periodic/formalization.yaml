# formalization.yaml v0.4 for the Palomar submission of the algebra of the periodic table of the finite elements (`palomar/periodic/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The algebra of the periodic table of the finite elements: P_r, P_r^- and Q_r^- polynomial differential forms"
  description: >-
    A Lean 4 formalization of the polynomial algebra behind the periodic table of the finite
    elements (Arnold-Logg 2014): the spaces of polynomial differential forms on K^n used by the
    simplicial families P_r Lambda^k and P_r^- Lambda^k (Arnold-Falk-Winther 2006, §3) and the
    cubical family Q_r^- Lambda^k (Arnold-Boffi-Bonizzoni 2015, §3). Over every field K of
    characteristic 0, in every dimension n, form degree k and polynomial degree r, the compared
    theorem FEEC.periodicTable states: (1) dim P_r Lambda^k = C(r+n, r+k) C(r+k, k),
    dim P_r^- Lambda^k = C(r+n, r+k) C(r+k-1, k) (r >= 1) and
    dim Q_r^- Lambda^k = C(n, k) r^k (r+1)^(n-k); (2) the three polynomial de Rham complexes
    P_r Lambda^0 -> P_(r-1) Lambda^1 -> ..., P_r^- Lambda^0 -> P_r^- Lambda^1 -> ... and
    Q_r^- Lambda^0 -> Q_r^- Lambda^1 -> ... are exact: in positive degree the closed forms are
    exactly the exterior derivatives of the previous space, in degree 0 they are the constants;
    (3) the Koszul decompositions P_(r+1)^- Lambda^k = P_r Lambda^k (+) kappa H_r Lambda^(k+1),
    P_r Lambda^(k+1) = P_r^- Lambda^(k+1) (+) d H_(r+1) Lambda^k and
    H_(r+1) Lambda^(k+1) = kappa H_r Lambda^(k+2) (+) d H_(r+2) Lambda^k (direct sums of
    subspaces), kappa the Koszul differential and H_r the forms with homogeneous coefficients of
    degree r. The statement is self-contained over Mathlib (MvPolynomial, its submodules
    homogeneousSubmodule, restrictTotalDegree and restrictSupport, Submodule.pi, finrank); the
    proof is the library Feec of this repository (Feec.Algebra.PolynomialFormDim,
    Feec.Algebra.CubicalForm).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

