    characteristic 0 where marked), every n, k, r and multidegree b (r >= 1 where the sources
    require it). Not compared (proved in Feec, outside the statement): the homotopy formula over
    every commutative ring, the tensor-product characterization of Q_b^- Lambda^k as a span of
    products of one-dimensional factors (Feec.Koszul.cubeFormMinus_eq_span), the serendipity
    spaces S_r Lambda^k, the admissible P/P^- sequences of the periodic table
    (Feec.FiniteElement.PolySeq.ofKinds), and the finite element spaces on meshes (degrees of
    freedom, unisolvence, Whitney forms).
