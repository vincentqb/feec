      - "Daniele Boffi"
      - "Francesca Bonizzoni"
    id: "doi:10.1007/s00211-014-0631-3"
    type: "article"
    location: "Numer. Math. 129 (2015), §5 (the spaces Q_r^- Lambda^k(I^n), their dimension, the subcomplex property); §3 (tensor products of complexes)"
    relationship: "formalizes"
    note: >-
      The definition Q_r^- Lambda^k = (+)_sigma [(x)_i P_(r - delta(i,sigma))(I)] dx_sigma of §5
      (stated in multidegree b, the source's case b = (r, ..., r)), its dimension
      C(n, k) (r + 1)^(n-k) r^k (all r >= 0) and d Q_r^- Lambda^k in Q_r^- Lambda^(k+1); the
      exactness of the Q_r^- complex, which the source obtains from the tensor-product
      construction of §3, is proved in Feec by the Poincare lemma along the coordinates. Locators
      checked against arXiv:1212.6559v4, the final preprint; the published section numbering was
      not checked (earlier versions of this file cited §3).
    author_endorsement: "not-contacted"
