fidelity:
  divergences: >-
    (1) Scalars: an arbitrary field K, of characteristic 0 in the clauses marked [CharZero K]
    (the sources work over R); this generalizes the sources. Forms are polynomial: the sources'
    smooth forms enter only through P Lambda, which is the space Form of the statement.
    (2) Model of forms: P(K^n) (x) Lambda(K^n)*, MvPolynomial tensor Mathlib's exterior algebra
    of the covectors, the model of AFW2006 §3.1 (dim P_r Lambda^k = dim P_r dim Alt^k); the
    1-form dx_j is the coordinate covector LinearMap.proj j, the wedge product is the product of
    the exterior algebra, and kappa contracts with the position vector field through Mathlib's
    CliffordAlgebra.contractLeft (the exterior algebra is Mathlib's Clifford algebra of the zero
    form). The sources' formula (kappa omega)_x(v_1, ...) = omega_x(X(x), v_1, ...) is its value
    on alternating maps; the identification of Lambda(K^n)* with alternating maps is not part of
    the statement.
    (3) Degree conventions: the sources' convention P_s = H_s = 0 for s < 0 is encoded by the
    index shifts of the statement (H_(r+1) Lambda^(k+1) = kappa H_r Lambda^(k+2) (+) ..., the
    separate edge cases r = 0 and k = 0) and by polyFormSeq r k = P_(r-k) Lambda^k for k <= r
    and 0 for k > r; P_0^- Lambda^k = 0 as in AFW2006 §3.3.
    (4) Resolutions: each complex is the CochainComplex (ModuleCat K) N of its spaces with the
    restriction of d, which needs d o d = 0 and d S_k in S_(k+1); these are stated as fields of
    the structure (extDeriv_comp_extDeriv, map_*_le) and the complexes are built from them, so
    the exactness fields depend on earlier fields. The augmentation K -> S_0 of the resolutions
    (3.21), (3.22) is stated as the identity ker d meet S_0 = P_0 Lambda^0 (the constants) rather
    than as exactness of an augmented complex; the two are equivalent.
    (5) Q_b^- Lambda^k is ABB's explicit description (+)_sigma [(x)_j P_(b_j - [j in sigma])(I)]
    dx_sigma, sigma increasing, with the polynomial factor as the span of the monomials x^alpha,
    alpha_j <= b_j - [j in sigma] (restrictSupport); the tensor product (x)_j of one-variable
    spaces is this monomial span, and the internal direct sum is a supremum of subspaces (its
    directness is the dimension formula). ABB's construction of Q_r^- Lambda as the tensor
    product of the one-dimensional complexes P_r(I) -> P_(r-1)(I) dx (§3, (7)-(8)) is not
    restated: it would need tensor products of cochain complexes and their realization as forms
    on I^n (the identification Alt^k R^m (x) Alt^l R^n -> Alt^(k+l) R^(m+n)), roughly 150 more
    lines of statement for the same space.
    (6) AFW2006 §3.4 is stated over every field K of characteristic 0 (FEEC.affineInvariantForms;
    the source works over R). The hypothesis is necessary for the classification of the
    GL(n)-invariant subspaces of H_r Lambda^k (FEEC.charZero_iff_classification: it holds in every
    dimension iff K has characteristic 0; the counterexample is over every field of
    characteristic p > 0, in dimension 2). The conclusions of invariance (the summands of (3.10), (3.18),
    Theorem 3.5) are stated for the pullback of every linear (resp. affine) map, singular ones
    included; the hypotheses of the classifications only for the invertible ones: GL(n, K) for
    the subspaces of H_r Lambda^k (AFW's sentence concerns GL(n)), the invertible affine maps
    x -> g x + b for Theorem 3.6 (AFW's hypothesis is all affine maps; the statement is stronger).
    The irreducibility is stated for r, k >= 1 (as H_(r+1) Lambda^(k+1) in the
    statement), the case of AFW's sentence (Feec proves it for r + k > 0 with the summands as
    kernels, Feec.FiniteElement.IsLinearInvariant.eq_of_le_homForm); AFW's Theorem 3.6 is stated with s >= -1, here as the two
    alternatives s = -1 (d P_(r+1) Lambda^(k-1)) and 0 <= s <= r. Not formalized from §3.4: the
    description of the third kind of Theorem 3.5 (s < r - 1) as the forms of P_r Lambda^k with
    d omega in P_s Lambda^(k+1), and its strict inclusions; the pullback identities (3.4), (3.7)
    and (3.19) are not stated separately (Feec proves them, Feec.FiniteElement.polyPullback_mem_polyForm,
    polyPullback_koszul, Feec.Koszul.interior_C_mem_polyForm), nor the translation lemmas of
    Lemma 3.7 (Feec proves them in the form used by the proof of Theorem 3.6,
    Feec.FiniteElement.IsAffineInvariant.closed_le_of_succ, koszulClosed_le_of_succ,
    closed_le_of_koszulClosed_le). The 2^(n-1) intermediate resolutions of §3.5 are stated as the
    complexes of all admissible sequences (Admissible, seqForm; the full and trimmed kinds encoded
    by a Boolean sequence), without their count. §3.6 (change of origin). Everything beyond the
    polynomial algebra and the dimension counts of Theorems 4.9, 4.13: meshes, the degrees of
    freedom as moments, unisolvence and the serendipity column of the periodic table (Feec proves them;
    their statement needs integration over the faces of simplices and cubes and would not fit the
    budget of a self-contained challenge). The exactness of the homogeneous de Rham and Koszul
    complexes and of the non-homogeneous Koszul complex is stated as kernel-in-image identities
    (ker d meet S_(k+1) <= d S_k), not as CochainComplex.ExactAt: the Koszul complexes are chain
    complexes with decreasing form degree and would need a second complex builder; the identities
    are the content of ExactAt (Solution/Bridge.lean, exactAt_deRham_iff).
    (7) Source errata: AFW2006 (3.11) (and its AFW2010 counterpart) is stated for all k; at k = 0
    it fails for the constants, and the statement asserts it for k >= 1. The second half of
    AFW2006 (3.1), dim H_r Lambda^k(R^n) = dim P_r Lambda^k(R^(n-1)), is false as printed
    (n = k = 1, r = 0); the statement asserts the identity the source uses in the proof of (3.13),
    dim H_r Lambda^k(R^n) = dim P_r(R^(n-1)) C(n, k) = C(n, k) C(n+r-1, r).

