    authors:
      - "Douglas N. Arnold"
      - "Richard S. Falk"
      - "Ragnar Winther"
    id: "doi:10.1017/S0962492906210018"
    type: "article"
    location: "Acta Numerica 15 (2006), §3.1-§3.3, §3.5: (3.1)-(3.3), (3.5), (3.6), (3.8), the Koszul complex after (3.8), Theorems 3.1-3.4, (3.10), (3.11), the definition of P_r^- Lambda^k (both forms) and its equivalent form, (3.15)-(3.17), (3.21), (3.22), Lemma 3.8"
    relationship: "formalizes"
    note: >-
      Locators checked against the published text (author-hosted PDF of the Acta Numerica
      article). Formalized: (3.1) and (3.15) (dimensions); (3.2), (3.3), (3.8) and the
      non-homogeneous Koszul complex after (3.8) (exactness, as kernel-in-image identities; (3.3)
      as the resolution (3.21)); (3.5) (kappa o kappa = 0); (3.6) (the Leibniz rule for kappa);
      Theorem 3.1 (homotopy formula (3.9)); Theorem 3.2 (injectivity); (3.10) with its edge cases
      r = 0 and k = 0; (3.11) for k >= 1, with its case r = 0 (P_0 Lambda^(k+1) = d P_1 Lambda^k);
      Theorem 3.3; §3.3: the definition in both forms P_(r-1) + kappa H_(r-1) (direct) and
      P_(r-1) + kappa P_(r-1), the convention P_r^- Lambda^k = 0 for r <= 0, the equivalent
      definition, P_r^- Lambda^0 = P_r Lambda^0, P_r^- Lambda^n = P_(r-1) Lambda^n, the strict
      inclusions, the closure P_r wedge P_s in P_(r+s), (3.16) and (3.17); Theorem 3.4; the
      resolutions (3.21), (3.22) of §3.5 and the subcomplex inclusion (3.21) in (3.22);
      Lemma 3.8: (1) is the definition and d P_r Lambda^k in P_(r-1) Lambda^(k+1)
      (map_polyFormSeq_le), (2) is Theorem 3.4 (ker_inf_polyFormMinus_le), (3) is
      map_extDeriv_polyFormMinus (d P_r^- = d P_r), from the identity
      P_r = P_r^- + d P_(r+1) Lambda^(k-1) of its proof (polyForm_eq). Errata: (3.11) as printed
      also claims k = 0, false for the constants (P_r Lambda^0 contains the constants, which are
      neither in kappa P_(r-1) Lambda^1 nor in the range of d); the statement asserts it for
      k >= 1. The second half of (3.1), dim H_r Lambda^k(R^n) = dim P_r Lambda^k(R^(n-1)), is
      false as printed (n = 1, k = 1, r = 0: dim H_0 Lambda^1(R) = 1, P_0 Lambda^1(R^0) = 0); the
      proof of (3.13) uses it as dim H_r Lambda^k(R^n) = dim P_r(R^(n-1)) dim Alt^k R^n, which is
      what the statement asserts, in closed form C(n, k) C(n+r-1, r). Not formalized: §3.4 and
      the pullback identities (3.4) and (3.7) of §3.1-§3.2 (see fidelity.divergences (6)), the
      2^(n-1) intermediate resolutions of §3.5, §3.6.
    author_endorsement: "not-contacted"
  - title: "Finite element exterior calculus: from Hodge theory to numerical stability"
    authors:
