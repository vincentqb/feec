status:
  scope: >-
    Formalized and compared: FEEC.affineInvariantForms over every field of characteristic 0,
    every n, k, r, s; FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact
    (characteristic 0 is necessary for the GL(n)-classification and for the homogeneous
    Poincare lemma) over every field; FEEC.periodicTable for every field (of characteristic 0
    where marked), every n, k, r and multidegree b (r >= 1 where the sources require it; the complexes
    of admissible sequences with r_k >= 1 in every degree). Not formalized: the decomposition
    (3.20) and the inequivalence of its summands, the classification of the affinely invariant subcomplexes (the 2^(n-1)
    resolutions of AFW2006 §3.5 as the only ones), the third kind of Theorem 3.5 as
    {omega in P_r Lambda^k | d omega in P_s Lambda^(k+1)}. Not compared (proved in Feec,
    outside the statement): the classification with the summands as kernels for r + k > 0
    (Feec.Counterexamples.PositiveCharacteristic.charZero_iff_classification_ker), the
    homotopy formula over every commutative ring, the tensor-product characterization of
    Q_b^- Lambda^k as a span of products of one-dimensional factors
    (Feec.Koszul.cubeFormMinus_eq_span), the serendipity spaces S_r Lambda^k, the
    parametrization of the admissible P/P^- sequences ending in P_s Lambda^n by their kinds
    (Feec.FiniteElement.PolySeq.ofKinds), the closed-form dimensions of the classical elements
    in K^2 and K^3 (Feec.Koszul.finrank_polyForm_three_one, ...), and the finite element spaces
    on meshes (degrees of freedom, unisolvence, Whitney forms; the affine invariance of the
    shape spaces of every admissible sequence enters the FEEC verdicts of
    Feec.Models.Cube.FEM.feec_affineInvariant).
