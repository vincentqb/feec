      given P_r Lambda^0, and without the count 2^(n-1); P_0 Lambda^n enters as P_1^- Lambda^n,
      but the resolutions through a space P_0 Lambda^k with k < n, which occur only for r < n,
      are not covered, except (3.21) itself); the dimension counts of Theorems 4.9 and 4.13 (dim P_r Lambda^k and
      dim P_r^- Lambda^k as sums over the faces of a simplex of the dimensions of the test
