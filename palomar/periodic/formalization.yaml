sources:
  - title: "Finite element exterior calculus, homological techniques, and applications"
    authors:
      - "Douglas N. Arnold"
      - "Richard S. Falk"
      - "Ragnar Winther"
    id: "doi:10.1017/S0962492906210018"
    type: "article"
    location: "Acta Numerica 15 (2006), §3.1-§3.5: (3.1)-(3.3), (3.5), (3.6), (3.8), the Koszul complex after (3.8), Theorems 3.1-3.6, (3.10), (3.11), the definition of P_r^- Lambda^k (both forms) and its equivalent form, (3.15)-(3.18), the decomposition (3.10) into irreducible linear-invariant subspaces, (3.21), (3.22), the 2^(n-1) intermediate resolutions of §3.5, Lemma 3.8; §4: the dimension counts of Theorems 4.9 and 4.13; §5: admissible sequences"
    relationship: "formalizes"
    note: >-
      Locators checked against the published text (author-hosted PDF of the Acta Numerica
      article). Formalized: (3.1) and (3.15) (dimensions); (3.2), (3.3), (3.8) and the
      non-homogeneous Koszul complex after (3.8) (exactness, as kernel-in-image identities; (3.3)
      as the resolution (3.21)); (3.5) (kappa o kappa = 0); (3.6) (the Leibniz rule for kappa);
      Theorem 3.1 (homotopy formula (3.9)); Theorem 3.2 (injectivity); (3.10) with its edge cases
      r = 0 and k = 0; (3.11) for k >= 1, with its case r = 0 (P_0 Lambda^(k+1) = d P_1 Lambda^k);
      Theorem 3.3; §3.3: the definition in both forms P_(r-1) + kappa H_(r-1) (direct) and
      P_(r-1) + kappa P_(r-1), the convention P_r^- Lambda^k = 0 for r <= 0, the equivalent
      definition, P_r^- Lambda^0 = P_r Lambda^0, P_r^- Lambda^n = P_(r-1) Lambda^n, the strict
      inclusions, the closure P_r wedge P_s in P_(r+s), (3.16) and (3.17); Theorem 3.4; the
      resolutions (3.21), (3.22) of §3.5 and the subcomplex inclusion (3.21) in (3.22), and every
      intermediate resolution of §3.5, as the complex of an admissible sequence (Admissible,
      seqForm: in each degree P_(r_k) or P_(r_k)^-, with the transitions of §5; stated for every
      admissible sequence, not only those ending in a given P_s Lambda^n, and without the count
      2^(n-1)); the dimension counts of Theorems 4.9 and 4.13 (dim P_r Lambda^k and
      dim P_r^- Lambda^k as sums over the faces of a simplex of the dimensions of the test
      spaces; the degrees of freedom themselves and their unisolvence, which need integration over
      faces, are proved in Feec over R and not compared);
      Lemma 3.8: (1) is the definition and d P_r Lambda^k in P_(r-1) Lambda^(k+1)
      (map_polyFormSeq_le), (2) is Theorem 3.4 (ker_inf_polyFormMinus_le), (3) is
      map_extDeriv_polyFormMinus (d P_r^- = d P_r), from the identity
      P_r = P_r^- + d P_(r+1) Lambda^(k-1) of its proof (polyForm_eq). Errata: (3.11) as printed
      also claims k = 0, false for the constants (P_r Lambda^0 contains the constants, which are
      neither in kappa P_(r-1) Lambda^1 nor in the range of d); the statement asserts it for
      k >= 1. The second half of (3.1), dim H_r Lambda^k(R^n) = dim P_r Lambda^k(R^(n-1)), is
      false as printed (n = 1, k = 1, r = 0: dim H_0 Lambda^1(R) = 1, P_0 Lambda^1(R^0) = 0); the
      proof of (3.13) uses it as dim H_r Lambda^k(R^n) = dim P_r(R^(n-1)) dim Alt^k R^n, which is
      what the statement asserts, in closed form C(n, k) C(n+r-1, r). §3.4
      (FEEC.affineInvariantForms, over every field of characteristic 0): the invariance of the summands of (3.10) under the
      pullback of linear maps and their irreducibility under GL(n), (3.18), Theorem 3.5 with its
      cases s = r and s = r - 1 (r = 0 included), Theorem 3.6. AFW derive the
      irreducibility from Fulton-Harris (6.9); Feec proves it directly (weight parts of diagonal
      pullbacks, an explicit generator and a pullback reaching it from every form not in the
      other summand), first for invariance under all linear maps, then under GL(n) alone: over an
      infinite field c -> (B + c I)^* omega is a polynomial curve, in a GL(n)-invariant space at
      the cofinitely many c with det(B + c I) != 0, hence with its value B^* omega at c = 0
      (Feec.FiniteElement.polyPullback_mem_of_forall_units). Characteristic 0 cannot be dropped
      (formalized and compared, FEEC.charZero_iff_classification): over every field of
      characteristic p > 0, with q = p^2 and U the span of the x_i^q, the 1-forms with
      coefficients in U are invariant under every linear map, as (sum_l b_l x_l)^q =
      sum_l b_l^q x_l^q, and for n >= 2 are none of 0, d H_(q+1) Lambda^0, kappa H_(q-1) Lambda^2
      and H_q Lambda^1 (they contain x_1^q dx_1, with kappa(x_1^q dx_1) = x_1^(q+1) != 0, and miss
      d(x_1^(q-1) x_2^2), whose coefficient q - 1 = -1 on x_1^(q-2) x_2^2 dx_1 does not vanish);
      Feec.Counterexamples.PositiveCharacteristic. Proved in Feec, not compared: the same for the
      summands as kernels (charZero_iff_classification_ker) and the failure of the Poincare lemma
      (3.2) in characteristic p, x^(p-1) dx closed and not exact (charZero_iff_closed_eq_exact).
      Not formalized: the description of the third kind of Theorem 3.5 (s < r - 1) as
      {omega in P_r Lambda^k | d omega in P_s Lambda^(k+1)} and its strict inclusions, the
      identities (3.4), (3.7) and (3.19) and Lemma 3.7 as separate statements (used in the proofs,
      Feec.FiniteElement.polyPullback_mem_polyForm, polyPullback_koszul,
      IsAffineInvariant.closed_le_of_succ), the count 2^(n-1) of the intermediate resolutions of
      §3.5, §3.6.
