# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of error guarantees for fully discrete finite
# element schemes on simplicial meshes (`palomar/schemes/`), the numerical-analysis counterpart of
# `palomar/fem/` (structure theory) and `palomar/timestepping/` (time stepping).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Error guarantees for fully discrete finite element schemes on simplicial meshes"
  description: >-
    Two finite element schemes on the cube Q = (0, 1/2)^3 with its Freudenthal meshes (every
    simplex a Kuhn simplex h (z + K_sigma), h = 1/(2(N+1)), named by its vertices), stated with
    explicit spaces and an explicit scheme, with error bounds whose constants are independent of
    the mesh, the time step and the solution. Stated over Mathlib with the definitions of
    differential forms, polynomial forms, simplicial meshes, finite element spaces and Sobolev
    spaces of the Palomar entry palomar/fem copied verbatim. Three compared theorems.
    FEEC.crankNicolson_cube (thesis Ch. 7): the Hodge wave equation of the de Rham window
    H Lambda^0 -> H Lambda^1 -> L^2 Lambda^2 on Q (sigma' = -d^t E, E' = d sigma - d^t B,
    B' = d E; in vector proxies sigma' = div E, E' = grad sigma - curl B, B' = curl E), with no
    boundary condition imposed on the exact solution, discretized by the Whitney elements
    P_1 Lambda^0 -> P_1^- Lambda^1 -> P_1^- Lambda^2 (Lagrange, Nedelec, Raviart-Thomas) and the
    Crank-Nicolson rule <u' - u, v> = (Delta t / 2) <A (u' + u), v> for all v in the spaces with
    vanishing boundary traces, A the skew form <dx, y> - <x, dy>, the boundary degrees of freedom
    of every step taken from the Whitney interpolant of the exact solution. On every Freudenthal
    mesh the face integrals are unisolvent (every continuous form field has exactly one Whitney
    interpolant in each degree), every step is uniquely solvable for every time step, and
    V_h^1 with vanishing traces is nonzero; there is C such that for every smooth solution with
    bound L (C^2 in space, C^3 in time, first derivatives of u and du bounded by L and
    L-Lipschitz in time, third time derivative bounded by L), every Delta t > 0 and
    M Delta t <= T, the iterates from the interpolant of the initial value satisfy
    ||u_M - U(t_M)||_{L^2} <= C L (1 + T) (h_N + Delta t^2). FEEC.weakSymmetry_cube (thesis
    §5.3, Table 5.1, Thm 5.5, §6.3, Prop 6.2): the mixed method (5.6) with S_h = pi S for the
    complex with weak symmetry of the BGG construction (the linearized Einstein-Bianchi
    complex; the constraint d sigma = S^0 phi imposed by a Lagrange multiplier instead of C^1
    elements), with the minimal exterior derivative in both rows, S^0 v = S^1 v = sum_a dx_a ∧
    v_a (in vector proxies S^0 = I, S^1 = 2 vskw) and the elements of Table 5.1 with vanishing
    boundary traces (top row P_1 Lambda^0 -> P_1^- Lambda^1 -> P_1^- Lambda^2, bottom row
    P_2 Lambda^0 -> P_2^- Lambda^1 -> P_1 Lambda^2 componentwise): there are discretizations
    with these spaces and projections bounded by one constant C satisfying the compatibility
    condition (5.4), S_h is consistent at the order h_N, the discrete problem (5.6) has exactly
    one solution for every datum, the static error is at most (K L h_N)^2 for exact solutions
    with ||lambda|| <= L whose sigma, phi_a, u_a are C^2 up to the boundary with vanishing
    tangential traces and bound L, and also for those whose sigma, phi_a, d~phi_a, u_a, d~u_a
    lie in H^1(Q) (restrictions of H^1(R^3)) with norms at most L; solutions of the
    semi-discrete wave problem (6.5) are determined by (sigma_h, u_h, M_h, rho_h)(0); and for
    every classical solution of the wave problem (6.2) whose states and time derivatives are of
    the C^2 class or of the H^1 class and whose multiplier and its derivative are bounded by L,
    some solution of (6.5) is within K L (1 + t) h_N of it. FEEC.weakSymmetry_cube_nonvacuous:
    the static and wave rates apply to nontrivial solutions. The proof is the library Feec of
    this repository (Feec.Models.Cube.InhomogeneousError, Inhomogeneous, the Whitney element
    Feec.FiniteElement.WhitneyComplex, Feec.HilbertComplex.BGG.*, Feec.Models.Cube.WeakSymmetry*,
    Feec.Domain.H1Restriction).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

