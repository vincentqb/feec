status:
  scope: >-
    Formalized and compared: FEEC.inverse_estimate (every admissible sequence, every degree,
    general shape-regular quasi-uniform families); FEEC.leapfrog_cube (the same row, elements,
    boundary data and solutions as Crank-Nicolson: inverse estimate on the Whitney row, explicit
    well-posedness, stability and the O((h + Delta t^2)/(1 - c)) error under the concrete CFL
    condition 2 C_0 Delta t <= c h_N); FEEC.crankNicolson_cube (one row of the thesis' Ch. 7
    scheme, the Hodge wave equation of the de Rham window on the cube, with the Whitney elements and
    boundary degrees of freedom from the exact solution: unisolvence, well-posedness, V_h^1 != 0,
    the O(h + Delta t^2) error); FEEC.weakSymmetry_cube for the elements of Table 5.1 (bounded
    projections with (5.4), consistency, unique solvability, static rates for C^2 and H^1 data,
    uniqueness and rates of the semi-discrete wave problem); FEEC.weakSymmetry_cube_nonvacuous.
    Not compared here (proved in Feec): the abstract theorem behind the weak-symmetry rates (it
    is the palomar/bgg entry's), the three-row Einstein-Bianchi version of the Crank-Nicolson
    scheme and its constraint monitors, the plane-wave computation of Ch. 7, the lumped-mass
    P_1 heat equation in the maximum norm (discrete maximum principle, O(h^2) Dirichlet and
    O(h) Neumann nodal and L^infinity errors, backward Euler and A-stable rational schemes),
    the mesh-level tools (unisolvence of the P_r and P_r^- degrees of freedom, Bramble-Hilbert
    interpolation errors, local inverse estimates on shape-regular meshes), the abstract leapfrog
    second-order bound against e^{tL_h} and the explicit constants (the leapfrog error constant
    Feec.Models.Cube.Inhomogeneous.leapfrogConst = 12 sum B_i + sum #Lambda^i |Q|^{1/2}; the
    inverse-estimate constant 2^n n A from the local Lipschitz constant A), the mirror boundary
    conditions and fractional Sobolev rates of the weak-symmetry elements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

