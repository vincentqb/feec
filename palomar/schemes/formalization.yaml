  namespace: "FEEC"
  statements:
    - source: "[QuennevilleBelair2015] Prop 5.4, Thm 5.5"
      lean: "FEEC.weakSymmetry"
      module: "Challenge"
      status: "proved"
      note: >-
        Solution/Abstract.lean (weakSymmetry_of): the data and discretizations as
        Feec.BGG.Segment, Feec.BGG.Discrete; Feec.BGG.Discrete.existsUnique_mixed_h and
        Feec.BGG.Discrete.error_estimate_of_weakConsistency, with the consistency on regular
        potentials through Feec.BGG.Discrete.weakConsistency_of_potential_of_bound (added to
        Feec.HilbertComplex.BGG.WeakConsistency for this entry).
    - source: "[QuennevilleBelair2015] §5.3, Table 5.1, Thm 5.5, §6.3, Table 6.1, Prop 6.2"
      lean: "FEEC.weakSymmetry_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        The cube data are Feec's bggSegment (cubeData_eq); the discretizations from
        Feec.Models.Cube.WeakSymmetry.tableRows_uniform_cochainProjection and cubeFEM, the
        continuous hypotheses from exists_curlPotential_bound, the consistency from the cube
        interpolation estimates; the C^2 static rate is FEEC.weakSymmetry with cubeFEM_err_*_tr
        and exists_isCsFormTr_segS1; the wave clauses from cubeWave_rate_tr' and
        Feec.BGG.DiscreteSolution.unique (Solution/CubeWave.lean, CubeUnique.lean). The H^1
        classes enter Feec's relative parity class H^1_univ by Gaffney's identity on the cube
        (sobRel_zero_of_mem, sobRel_one_of_mem, sobRel_two_of_mem), d* of H^1(R^n) data being
        computed by integration by parts (Feec.Domain.H1Restriction and
        Feec.Models.Cube.WeakSymmetryH1, added to Feec for this entry; IsSobolevForm is
        Feec.Domain.H1Data on the cube by Solution/Sobolev.lean); then the
        H^1 static rate is FEEC.weakSymmetry with norm_sub_proj_le_sobStateConst and
        abs_inner_D1_le_of_sobRel_one, and the H^1 wave rate cubeWave_rate_sobolev_of_one_le
        (Solution/CubeSobolev.lean).
    - source: "[QuennevilleBelair2015] Thm 5.5, §6.3"
      lean: "FEEC.weakSymmetry_cube_nonvacuous"
      module: "Challenge"
      status: "proved"
      note: >-
        From Feec.Models.Cube.WeakSymmetry.exists_coupled_manufactured_solution and
        waveManufactured_hyps (Solution/CubeNonvac.lean); the H^1 classes from
        Feec.Domain.exists_h1Data_testField, the manufactured fields being test fields times
        functions of t.

