status:
  scope: >-
    Formalized and compared: FEEC.weakSymmetry for all BGG data on real Hilbert spaces in one
    universe and all discretizations satisfying its hypotheses; FEEC.weakSymmetry_cube for the
    cube (0, 1/2)^3, its Freudenthal meshes and the elements of Table 5.1 with vanishing
    boundary traces (the hypotheses with one constant, consistency included; the static rates
    for C^2 and for H^1 data; the uniqueness of the semi-discrete wave solutions; the wave rates
    for C^2 and for H^1 states); FEEC.weakSymmetry_cube_nonvacuous. Not compared (proved in
    Feec, outside the statement): the mirror (mixed) boundary conditions of the thesis and their
    convergence, the fractional Sobolev rates h^min(s,1) (Feec.Models.Cube.WeakSymmetrySobolevRate),
    the fully discrete schemes, the constraint propagation of the Einstein-Bianchi system, the
    existence of semi-discrete solutions for arbitrary initial data (only the one starting from
    the elliptic projection of the exact data is asserted, existentially). Not formalized: the
    elasticity system and elements of AFW2007.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

