    Mesh.lean, Trace.lean, Spaces.lean, Regularity.lean adapted from palomar/fem) and applies its
    theorems.

fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms, meshes, finite element spaces and H^m as in
    palomar/fem (divergences (1)-(5), (8) there); W~^k = L^2(Omega; Lambda^k) ⊗ R^3 is the l^2
    sum of three copies (L2Vec).
    (2) The multiplier lambda is assumed in L^2 = W^1: the theorems apply to the solutions of
    (5.3) and (6.2) that have an L^2 multiplier (in vector proxies lambda = -div u row by row,
    so this asks u_a in H(div)). The rates also assume ||lambda|| <= L; on the cube this bound
    follows, up to a constant, from the regularity of u (S^0* lambda = d~^0* u), which is not
    used to remove it. The abstract theorem assumes a bound Lambda on d^1* S^1 u; on the cube it
    is derived from the regularity of u.
    (3) The abstract hypotheses use one constant C for the Poincaré inequalities, the Hodge and
    regular decompositions, ||S||, the bounds of the projections and the consistency; K depends
    only on C.
    (4) Consistency (cf. Prop 5.9) is the hypothesis Discretization.IsConsistent of the abstract
    theorem: ||(S^0 - S^0_h) psi|| <= C h ||d~psi|| on V~_h^0, and every d~v, v in V~_h^1, has a
    regular potential w (d~w = d~v, ||w|| <= C ||d~v||) on which pi~^1 and S^1_h are accurate to
    order h. It is proved for the cube discretizations (part of FEEC.weakSymmetry_cube).
    (5) The cube discretizations are asserted existentially: their spaces are named (Table 5.1
    with vanishing boundary traces on the Freudenthal meshes), their projections are not (Feec
    uses the smoothed projections of one smoother for both rows, bounded uniformly). The method
    (5.6) depends on pi through S_h = pi S, so the statement covers the method for one admissible
    choice of projections, not for a canonical one; naming the smoothed projections would need
    their construction (mollification, extension, canonical interpolants) in the challenge.
    (6) Regularity: the rates are stated for exact solutions C^2 up to the boundary with
    vanishing tangential traces (IsTangentialC2), and for solutions in H^1(Q) with their
    differentials (IsSobolevForm, IsH1State: sigma, phi_a, d~phi_a, u_a, d~u_a for the static
    rate; sigma, d~phi_a, u_a, d~u_a, M, rho_a for the wave rate, with M, rho_a in H̊Λ^2(Q));
    the traces of the other fields vanish through their operator domains, S^0 phi = d sigma and
    S^1 u are derived. The fractional rates h^min(s,1) of Feec are not compared; h is the
    optimal order for these elements. The non-vacuity theorem covers the C^2 and the H^1 classes
    (its witnesses are built from test fields, so they lie in both).
    (7) The wave problem: classical solutions are paths in the operator domains with continuous
    right derivatives in L^2 (and of d~phi, d~u); the wave rate asserts some semi-discrete
    solution (in Feec, the one starting from the elliptic projection (6.4) of the exact data)
    with the rate, and uniqueness of semi-discrete solutions given (sigma_h, u_h, M_h, rho_h)(0)
    is a separate clause; existence for arbitrary discrete data is not stated.
    (8) Only the boundary conditions of the minimal complex in both rows (the thesis' choice on
    the cube) are compared; the mirror boundary conditions are not.
    (9) The discrete complex with S_h is not a subcomplex of the continuous one (a variational
    crime), so the window verdicts of palomar/feec and palomar/fem do not apply to it; the
    analysis is that of the abstract theorem.

