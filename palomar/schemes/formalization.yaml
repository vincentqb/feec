fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms, meshes, finite element spaces and H^m as in
    palomar/fem (divergences (1)-(5), (8) there); W~^k = L^2(Omega; Lambda^k) ⊗ R^3 is the l^2
    sum of three copies (L2Vec). The Freudenthal meshes are asserted existentially, named by
    their vertices (IsFreudenthal; a mesh of the cube by such simplices contains all of them).
    (2) Crank-Nicolson: one row of the thesis' three-row Einstein-Bianchi scheme (the rows
    decouple); the exact solution is a classical solution on R^3 with the stated bounds on
    [0, T] (RowSolution), and no boundary condition is imposed on it: the boundary degrees of
    freedom of the scheme are those of the Whitney interpolant of the exact solution at every
    step (any g_n with g_n - Pi_h U(t_n) in V_h with vanishing traces), the initial value is
    the interpolant of U(0), the load is zero. The error is in L^2 at t_M = M Delta t; C is
    asserted (in Feec an explicit constant). Rates for finite Sobolev regularity, the discrete
    divergence and the other constraint monitors are not stated. The weak exterior derivative
    of the scheme is written as a total function wd (0 off its domain), only applied to finite
    element forms.
    (3) Weak symmetry: the multiplier lambda is assumed in L^2 = W^1 (in vector proxies this
    asks u_a in H(div)) and ||lambda|| <= L in the rates.
    (4) The weak-symmetry discretizations are asserted existentially: their spaces are named
    (Table 5.1 with vanishing boundary traces), their projections are not (Feec uses the
    smoothed projections of one smoother for both rows); the method (5.6) depends on pi through
    S_h = pi S, so the statement covers the method for one admissible choice of projections.
    Their boundedness, (5.4) and the consistency at the order h_N (cf. thesis Prop 5.9) are
    stated as properties of these projections.
    (5) Regularity of the weak-symmetry rates: C^2 up to the boundary with vanishing tangential
    traces (IsTangentialC2), or H^1(Q) with the differentials (IsSobolevForm, IsH1State); h is
    the optimal order for these elements.
    (6) The wave problem: classical solutions are paths in the operator domains with
    continuous right derivatives; the wave rate asserts some semi-discrete solution (in Feec,
    the one from the elliptic projection (6.4) of the exact data), uniqueness given
    (sigma_h, u_h, M_h, rho_h)(0) is a separate clause; existence for arbitrary discrete data is
    not stated.

