status:
  scope: >-
    Formalized and compared: FEEC.crankNicolson_cube (one row of the thesis' Ch. 7 scheme, the
    Hodge wave equation of the de Rham window on the cube, with the Whitney elements and
    boundary degrees of freedom from the exact solution: unisolvence, well-posedness, V_h^1 != 0,
    the O(h + Delta t^2) error); FEEC.weakSymmetry_cube for the elements of Table 5.1 (bounded
    projections with (5.4), consistency, unique solvability, static rates for C^2 and H^1 data,
    uniqueness and rates of the semi-discrete wave problem); FEEC.weakSymmetry_cube_nonvacuous.
    Not compared here (proved in Feec): the abstract theorem behind the weak-symmetry rates (it
    is the palomar/bgg entry's), the three-row Einstein-Bianchi version of the Crank-Nicolson
    scheme and its constraint monitors, the plane-wave computation of Ch. 7, the lumped-mass
    P_1 heat equation in the maximum norm (discrete maximum principle, O(h^2) Dirichlet and
    O(h) Neumann nodal and L^infinity errors, backward Euler and A-stable rational schemes),
    the mesh-level tools (unisolvence of the P_r and P_r^- degrees of freedom, Bramble-Hilbert
    interpolation errors, inverse estimates on shape-regular meshes) and explicit leapfrog under
    a CFL condition, the mirror boundary conditions and fractional Sobolev rates of the
    weak-symmetry elements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

