    every field; FEEC.unisolvent for every n-simplex, r >= 1 and k.
    Not claimed: the classification of the affinely invariant complexes of polynomial forms (the
    periodic table; AFW2006 §3.5): the theorems classify spaces, not complexes.
    Not compared (proved in Feec, outside the statement): the polynomial identities, dimension
    formulas and exactness of the polynomial de Rham and Koszul complexes of P_r Lambda,
    P_r^- Lambda and Q_r^- Lambda (formerly compared in palomar/periodic, exactness and
    dimensions only; Feec.Algebra.PolynomialFormDim, Feec.Algebra.CubicalForm), the
    classification with the summands as kernels
    (Feec.Counterexamples.PositiveCharacteristic.charZero_iff_classification_ker), the assembly
    of global finite element spaces from the degrees of freedom (used in palomar/fem).
