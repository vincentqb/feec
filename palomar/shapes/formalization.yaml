# formalization.yaml v0.4 for the Palomar submission of the affinely invariant polynomial
# differential forms and their degrees of freedom (`palomar/shapes/`). New on 2026-11-18, from the
# former palomar/fem (FEEC.unisolvent, FEEC.affineInvariantForms,
# FEEC.charZero_iff_classification, FEEC.charZero_iff_closed_eq_exact), which had taken the
# classification theorems from the former palomar/periodic.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Affinely invariant polynomial differential forms and their degrees of freedom"
  description: >-
    Which spaces of polynomial differential forms are the local spaces of finite element exterior
    calculus, and do they have degrees of freedom? Stated over Mathlib, for polynomial forms in
    coordinates (PolyForm K n: a polynomial coefficient omega_s in K[x_1, ..., x_n] for every
    dx_s), with P_r Lambda^k (coefficients of degree at most r), H_r Lambda^k (homogeneous of
    degree r), the Koszul differential kappa (contraction with the position vector field), the
    trimmed spaces P_r^- Lambda^k = P_(r-1) Lambda^k + kappa H_(r-1) Lambda^(k+1) and the
    pullback (phi^* omega)_t = sum_(#s = #t) det B_(s,t) (omega_s o phi) along phi(x) = B x + b.
    Four compared theorems.
    FEEC.affineInvariantForms (the headline; AFW2006 §3.4, over every field K of characteristic
    0): d H_r Lambda^k and kappa H_r Lambda^k are invariant under the pullback of every linear
    map, and the subspaces of H_r Lambda^k invariant under GL(n, K) are 0,
    d H_(r+1) Lambda^(k-1), kappa H_(r-1) Lambda^(k+1) and H_r Lambda^k (r, k >= 1);
    d P_(r+1) Lambda^(k-1) and X(r, s, k) = d P_(r+1) Lambda^(k-1) + kappa P_s Lambda^(k+1)
    (s <= r, k >= 1) are invariant under the pullback of every affine map,
    X(r, r, k) = P_(r+1)^- Lambda^k, X(r+1, r, k) = P_(r+1) Lambda^k and
    d P_1 Lambda^(k-1) = P_0 Lambda^k (Theorem 3.5); and for 0 < k < n every nonzero
    finite-dimensional space of k-forms invariant under the invertible affine maps is
    d P_(r+1) Lambda^(k-1) or some X(r, s, k), s <= r (Theorem 3.6). So for 0 < k < n the
    nonzero finite-dimensional affinely invariant spaces of polynomial k-forms are exactly
    P_r Lambda^k (r >= 0), P_r^- Lambda^k (r >= 1), d P_(r+1) Lambda^(k-1) (r >= 0) and the
    X(r, s, k) with 0 <= s <= r - 2 (X(r, r, k) = P_(r+1)^- Lambda^k and
    X(r, r - 1, k) = P_r Lambda^k being the trimmed and full spaces).
    FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact: over every field K,
    the classification of the GL(n)-invariant subspaces of H_(r+1) Lambda^(k+1), and the
    homogeneous Poincare lemma ker d meet H_r Lambda^(k+1) = d H_(r+1) Lambda^k (AFW2006 (3.2)),
    hold in every dimension and all degrees iff K has characteristic 0: the hypothesis of
    FEEC.affineInvariantForms cannot be dropped.
    FEEC.unisolvent (AFW2006 Theorems 4.10, 4.14): on every n-simplex T and for r >= 1, a real
    form of P_r Lambda^k (resp. P_r^- Lambda^k) whose moments int_f tr_f omega wedge eta vanish
    for all m-faces f of T and all eta in P^-_(r+k-m) Lambda^(m-k)(R^m) (resp.
    P_(r+k-m-1) Lambda^(m-k)(R^m)), k <= m < r + k, is zero, and the number of these moments,
    sum_m C(n+1, m+1) dim (test space), is dim P_r Lambda^k (resp. dim P_r^- Lambda^k): the
    moments are unisolvent, so they are degrees of freedom of the spaces.
    Not claimed: the classification of complexes. The theorems classify the affinely invariant
    spaces of polynomial k-forms one degree at a time; that the complexes built from them, the
    "periodic table" of finite element exterior calculus (the resolutions of AFW2006 §3.5), are
    the only affinely invariant complexes of polynomial forms is neither stated nor proved.
    The proof is the library Feec of this repository (Feec.FiniteElement.LocalDof,
    Feec.FiniteElement.InvariantForm, Feec.FiniteElement.AffineInvariantForm,
    Feec.Counterexamples.PositiveCharacteristic).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

