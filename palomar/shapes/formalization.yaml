fidelity:
  divergences: >-
    (1) Coordinates: polynomial forms are coefficient functions
    Finset (Fin n) -> MvPolynomial (Fin n) K over a field K (the coefficient of dx_s, s a set of
    indices), the standard coordinate model, not Mathlib's exterior algebra (the former
    palomar/periodic used P(K^n) (x) Lambda(K^n)*; the two are identified in Feec,
    Feec.Algebra.ExteriorAlgebraForm). The pullback of polynomial forms is stated by minors,
    (phi^* omega)_t = sum_(#s = #t) det B_(s,t) (omega_s o phi). Real polynomial forms are
    evaluated to form fields on R^n = Fin n -> R (evalForm) for the moments.
    (2) AFW2006 §3.4 is stated over every field K of characteristic 0 (the source works over R).
    The hypothesis is necessary (FEEC.charZero_iff_classification,
    FEEC.charZero_iff_closed_eq_exact), but both iff theorems quantify over all dimensions: in a
    fixed dimension the classification can hold in characteristic p (in dimension 1 every
    subspace of H_r Lambda^k is 0 or H_r Lambda^k); they do not identify the dimensions in which
    it fails. The conclusions of invariance (the summands of (3.10), (3.18), Theorem 3.5) are
    stated for the pullback of every linear (resp. affine) map, singular ones included; the
    hypotheses of the classifications only for the invertible ones (GL(n, K) for the subspaces
    of H_r Lambda^k; x -> g x + b for Theorem 3.6, which is stronger than AFW's hypothesis of all
    affine maps). The irreducibility is stated for r, k >= 1 (H_(r+1) Lambda^(k+1)); Theorem
    3.6's s >= -1 is stated as the two alternatives s = -1 (d P_(r+1) Lambda^(k-1)) and
    0 <= s <= r.
    (3) FEEC.unisolvent states unisolvence as injectivity of the moments together with the count
    (number of moments = dimension); bijectivity onto the dual for chosen bases of the test
    spaces follows by linear algebra and is not stated. A moment is taken over a simplex given by
    the list of its vertices (faceMoment); the faces of a simplex are listed in the increasing
    order of their vertex indices (T.points o e, e an order embedding Fin (m+1) -> Fin (n+1)); the
    moments are those of AFW2006 §4 up to this orientation sign.
    (3') FEEC.assembly: the finite element space S_k(M) is the shared femSpace, the L^2 forms
    that are on every simplex a form of S_k with single-valued tangential traces on every common
    face of two simplices, not AFW's definition by single-valued moments; the equivalence of the
    two conditions is its first item, with the moments over a common face compared along every
    enumeration of its vertices or along one (the reorderings act on the test spaces, which are
    affinely invariant). The faces of the mesh are its sets of vertices of simplices, each counted
    once; the assignments of the second item are, for every face, a linear functional on the test
    forms, read along a chosen enumeration of its vertices. AFW2010 Theorem 5.7 identifies these
    spaces with the piecewise polynomial forms of H Lambda^k(Omega); that identification is not
    claimed (the inclusion in H Lambda^k(Omega) is proved in Feec and is part of the subcomplexes
    of palomar/fem; the converse is not proved). The uniqueness of the pieces, hence the
    bijection, and the dimension need an open domain: a mesh of a null set carries only the zero
    form.
    (4) Shared notions: the polynomial forms (PolyForm, polyForm, homForm, koszul, polyFormMinus,
    evalForm), the form fields and the sign epsilon(j, s) that they and the moments use
    (FormField, sgn), the covector value covEval, the L^2 forms (FormIdx, L2Form), the admissible
    sequences (PolySeq), the simplicial meshes (SimplicialMesh, vertexSet) and the finite element
    spaces (TraceEq, IsFemPieces, femSpace) are the canonical blocks of
    palomar/shared/vocabulary.lean.txt, checked byte for byte by the gate, shared with
    palomar/fem, palomar/waves and palomar/einsteinbianchi (the form fields and L^2 forms also
    with palomar/constraints and palomar/bgg). A block is copied whole: the block of the L^2
    forms also defines the partial derivative, the exterior derivative and codifferential of form
    fields, test functions, the weak exterior derivative and the cube, which these theorems do
    not use.

