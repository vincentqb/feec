status:
  scope: >-
    Formalized and compared: FEEC.affineInvariantForms over every field of characteristic 0 and
    every n, k, r, s; FEEC.charZero_iff_classification and FEEC.charZero_iff_closed_eq_exact over
    every field; FEEC.unisolvent for every n-simplex, r >= 1 and k; FEEC.assembly for every
    simplicial mesh, admissible sequence and degree, the uniqueness of the pieces and the
    dimension for meshes of open sets. Not claimed: the identification of the finite element
    spaces with the piecewise polynomial forms of H Lambda^k(Omega) (AFW2010 Theorem 5.7).
    Not claimed: the classification of the affinely invariant complexes of polynomial forms (the
    periodic table; AFW2006 §3.5): the theorems classify spaces, not complexes.
    Not compared (proved in Feec, outside the statement): the polynomial identities, dimension
    formulas and exactness of the polynomial de Rham and Koszul complexes of P_r Lambda,
    P_r^- Lambda and Q_r^- Lambda (formerly compared in palomar/periodic, exactness and
    dimensions only; Feec.Algebra.PolynomialFormDim, Feec.Algebra.CubicalForm), the
    classification with the summands as kernels
    (Feec.Counterexamples.PositiveCharacteristic.charZero_iff_classification_ker); for the
    assembled spaces, the spaces with vanishing traces on the boundary (their dimension is the
    number of moments of the faces not contained in a boundary facet,
    Feec.FiniteElement.LocalElement.finrank_V₀), the commuting canonical interpolant
    (Feec.FiniteElement.LocalElement.globalInterp_extDeriv) and the inclusion in H Lambda^k(Omega)
    (Feec.FiniteElement.LocalElement.glue_mem_maximal; the subcomplexes of palomar/fem).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

