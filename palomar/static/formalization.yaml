status:
  scope: >-
    Formalized and compared: FEEC.staticFEEC (Challenge.lean) for every RCLike field, every
    Hilbert complex on Z, every family of subcomplexes along any filter, every degree j. Not
    compared (proved in Feec, outside the statement): explicit constants, the reverse gap
    estimate from discrete to continuous harmonic forms ([AFW2010] Thm 3.5, second inequality),
    the discrete inf-sup condition by Fortin operators, rates from Jackson estimates, the
    improved L2 estimate under elliptic regularity, the necessity of closed range, and the
    concrete finite element families (Whitney, P_r, P_r^-, cubical Q^-, serendipity spaces).
