fidelity:
  divergences: >-
    The statement uses the hypotheses of the source (§3.3: cochain projections pi_h : V -> V_h
    commuting with d and bounded in the graph norm; the approximation property in the graph norm)
    and its norms (the graph norm (||x||^2 + ||dx||^2)^(1/2); ||sigma||_V + ||u||_V + ||p|| on the
    mixed space). Remaining differences, none of which weakens a conclusion of the source:
    (1) Encoding (inherent): the differential is a family d i j : W^i -> W^j of closed densely
    defined operators (Mathlib LinearPMap) for all pairs, zero unless j = i + 1; Mathlib's
    HomologicalComplex has everywhere-defined morphisms only, so it cannot carry unbounded
    differentials. Complexes are on Z (a finite complex of the source extends by zero), the
    scalars are any RCLike field (the source is real), and the refinement h -> 0 is any filter.
    (2) Equivalent forms: dist(q, H_h^j) for ||(I - P_{H_h}) q||; the inf-sup condition as "every
    x in V_h^(j-1) x V_h^j x H_h^j has a y there with ||y|| <= ||x|| and ||x||^2 <= C |B(x; y)|"
    (inf-sup constant gamma = 1/C), equivalent up to a constant factor in gamma to the source's
    "some y != 0 with B(x; y) >= gamma ||x|| ||y||" by scaling y (over C, also rotating it), and
    meaningful when the discrete space is 0; the orthogonality of the
    Poincare inequality is in W, which on the discrete cycles is the V-orthogonality of the source
    (dz = 0); the quantities of Thms 3.4 and 3.5 (||q - pi_h q||, ||q||, dist(q, H_h),
    ||q - P_H q||, the harmonic gap) are in the W norm where the source writes the V norm, equal
    there because q, pi_h q, P_H q and the discrete harmonic forms are cycles (d = 0); a mixed
    solution is the system (3.12), one equation per test function.
    (3) Constants: one constant C for all the bounds of a degree (the largest of the source's);
    FEEC.staticFEEC_uniform takes the Poincare constant c_P as a hypothesis on both degrees
    (equivalent to closed range, which FEEC.staticFEEC assumes) and one bound c for both
    projections.
    (4) Hypotheses localized to the degrees used, so weaker than the source's global ones: bounded
    projections in degrees j - 1 and j, closed range in degrees j and j + 1, the approximation
    property only in the clauses that need it.
    (5) Finite-dimensional H^j in the vanishing of the harmonic gap and the eventual isomorphisms:
    the setting of the source (finite-dimensional cohomology, as for the de Rham complex), and
    necessary: for d = 0 on an infinite-dimensional W^j, V_h the span of the first n vectors of an
    orthonormal basis and pi_h the orthogonal projection, mu_h = 1 for every h and H^j(V_h) is
    finite-dimensional while H^j is not. Thm 3.4 itself is stated without it, under the strict gap
    ||q - pi_h q|| < ||q|| on the nonzero harmonic forms.

