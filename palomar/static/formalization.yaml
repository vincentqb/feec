fidelity:
  divergences: >-
    (1) The cochain projections are linear maps on all of W^i, bounded only on D(d) in the graph
    norm (||pi x|| + ||d pi x|| <= C (||x|| + ||d x||)); [AFW2010] §3.3 has projections on the
    domain V only. Every such projection extends linearly (not continuously) to W^i, so the
    hypothesis is equivalent; it is not restricted to the degrees j - 1, j used.
    (2) The graph norm is ||x|| + ||d x|| (the source uses the equivalent (||x||^2 + ||dx||^2)^(1/2));
    the constants differ by a factor at most 2.
    (3) Quasi-optimality is an inequality with an existential constant C independent of h and of
    the data; in the error the harmonic term is ||p - p_h|| in W, the distances are in the graph
    norm to V_h (for p and P_B u, whose differentials vanish, ||p - v|| + ||d v||).
    (4) Static cohomology: the map induced by the inclusion V_h ⊆ W is eventually bijective (the
    source states the map induced by the projection; the two are inverse).
    (5) The differential is encoded as d i j for all pairs, zero unless j = i + 1.
    (6) Finite dimension of the harmonic forms in degree j is assumed (needed for the cohomology
    isomorphism and the vanishing harmonic gap); closed range is assumed in degrees j and j + 1
    only.

