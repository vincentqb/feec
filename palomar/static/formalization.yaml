# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the static FEEC theorem (`palomar/static/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The static FEEC theorem: a priori theory of the mixed Hodge Laplacian for Hilbert complexes"
  description: >-
    A Lean 4 formalization of the a priori approximation theory of finite element exterior
    calculus (Arnold-Falk-Winther 2010, §3.3-§3.4) for an arbitrary Hilbert complex of closed
    densely defined operators on Z and an arbitrary family of finite-dimensional subcomplexes
    with commuting cochain projections bounded uniformly in the graph norm and the
    approximation property in the graph norm. The compared theorem FEEC.staticFEEC states: in a
    degree j where the ranges of d^(j-1) and d^j are closed and the harmonic forms are
    finite-dimensional, the inclusion eventually induces an isomorphism of discrete and
    continuous cohomology, the harmonic gap tends to 0, the discrete Poincare inequality holds
    uniformly, the mixed Hodge Laplacian and its Galerkin discretizations are uniquely
    solvable, and the discrete solutions are quasi-optimal in the graph norm (error at most
    C times the best approximation of sigma, u, p and, weighted by the harmonic gap, of the
    boundary part of u), hence converge. The statement is self-contained over Mathlib; the
    proof is the library Feec of this repository (Feec.HilbertComplex.GraphFamily.staticFEEC).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

