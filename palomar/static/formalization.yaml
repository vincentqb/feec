# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the static FEEC theorem (`palomar/static/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The static FEEC theorem: a priori theory of the mixed Hodge Laplacian for Hilbert complexes"
  description: >-
    A Lean 4 formalization of the a priori approximation theory of finite element exterior
    calculus (Arnold-Falk-Winther 2010, §3.3-§3.4) for an arbitrary Hilbert complex of closed
    densely defined operators on Z and an arbitrary family of finite-dimensional subcomplexes of
    its domain complex V = D(d), normed by the graph norm ||x||_V = (||x||^2 + ||dx||^2)^(1/2),
    with commuting cochain projections pi_h : V -> V_h. The compared theorem FEEC.staticFEEC
    assumes, in a degree j, projections bounded uniformly in h in the graph norm in degrees j-1
    and j and closed ranges of d^(j-1) and d^j, and states (Thm 3.5) dist(q, H_h) <= ||q - pi_h q||
    on the harmonic forms and ||q - P_H q|| <= ||P_H q - pi_h P_H q|| on the discrete harmonic
    forms; (Thm 3.4) pi_h induces a left inverse of the map induced by the inclusion on
    cohomology, and both are isomorphisms when ||q - pi_h q|| < ||q|| on the nonzero harmonic
    forms; (Thm 3.6) the uniform discrete Poincare inequality ||v||_V <= C ||dv||; (Thm 3.8)
    unique solvability of the mixed Hodge Laplacian and of its Galerkin discretizations, the
    uniform discrete inf-sup condition of the mixed form and the bound C ||f|| of the discrete
    solutions; (Thm 3.9) quasi-optimality in the graph norm (error at most C times the best
    approximation of sigma, u, p and, weighted by the harmonic gap, of P_B u). Where the
    subcomplexes approximate in the graph norm (degree j; degrees j-1 and j for convergence) and
    the harmonic forms are finite-dimensional, the harmonic gap tends to 0, the cohomology maps are
    eventually isomorphisms, and the discrete solutions converge. The statement is self-contained
    over Mathlib; the proof is the library Feec of this repository
    (Feec.HilbertComplex.SubcomplexFamily.staticFEEC). The second compared theorem
    FEEC.staticFEEC_uniform states that the constant depends only on the bound c of pi_h and the
    Poincare constant c_P (||v||_V <= c_P ||dv|| on V^i orthogonal to the cycles, in degrees j-1
    and j): there is one function Phi such that, for every complex, family and degree with these
    bounds, every conclusion holds with the constant Phi(c, c_P).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

