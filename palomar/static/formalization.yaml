status:
  scope: >-
    Formalized and compared: FEEC.staticFEEC (Challenge.lean) for every RCLike field, every
    Hilbert complex on Z, every conforming family along any filter with graph-norm bounded
    projections and graph-norm approximation, every degree j. Not compared (proved in Feec,
    outside the statement): explicit constants, uniform stability of the discrete solution
    operator, the discrete inf-sup condition by Fortin operators, rates from Jackson estimates,
    the improved L2 estimate under elliptic regularity, the necessity of closed range, and the
    concrete finite element families (Whitney, P_r, P_r^-, cubical Q^-, serendipity spaces).
