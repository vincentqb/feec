# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the static FEEC theorem (`palomar/static/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "The static FEEC theorem: a priori theory of the mixed Hodge Laplacian for Hilbert complexes"
  description: >-
    A Lean 4 formalization of the a priori approximation theory of finite element exterior
    calculus (Arnold-Falk-Winther 2010, §3.3-§3.4) for an arbitrary Hilbert complex of closed
    densely defined operators on Z and an arbitrary family of finite-dimensional subcomplexes
    with commuting cochain projections. The compared theorem FEEC.staticFEEC assumes, in a degree
    j, projections bounded uniformly in the graph norm in degrees j-1 and j and closed ranges of
    d^(j-1) and d^j, and states: dist(q, discrete harmonic forms) <= ||q - pi_h q|| on the
    harmonic forms; the discrete Poincare inequality holds uniformly; the mixed Hodge Laplacian
    and its Galerkin discretizations are uniquely solvable, with discrete solutions bounded by
    C ||f||; the discrete solutions are quasi-optimal in the graph norm (error at most C times the
    best approximation of sigma, u, p and, weighted by the harmonic gap, of the boundary part of
    u). Where the subcomplexes approximate in the graph norm (degree j; degrees j-1 and j for
    convergence) and the harmonic forms are finite-dimensional, the harmonic gap tends to 0, the
    inclusion eventually induces an isomorphism of discrete and continuous cohomology, and the
    discrete solutions converge. The statement is self-contained over Mathlib; the proof is the
    library Feec of this repository (Feec.HilbertComplex.SubcomplexFamily.staticFEEC).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

