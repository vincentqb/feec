fidelity:
  divergences: >-
    (1) The cochain projections are linear maps on all of W^i, bounded only on D(d) in the graph
    norm (||pi x|| + ||d pi x|| <= C (||x|| + ||d x||)), in degrees j - 1 and j; [AFW2010] §3.3
    has projections on the domain V only. Every such projection extends linearly (not
    continuously) to W^i, so the hypothesis is equivalent.
    (2) The graph norm is ||x|| + ||d x|| (the source uses the equivalent (||x||^2 + ||dx||^2)^(1/2));
    the constants differ by a factor at most 2.
    (3) Quasi-optimality is an inequality with an existential constant C independent of h and of
    the data; in the error the harmonic term is ||p - p_h|| in W, the distances are in the graph
    norm to V_h (for p and P_B u, whose differentials vanish, ||p - v|| + ||d v||). Uniform
    stability is the bound ||sigma_h||_V + ||u_h||_V + ||p_h|| <= C ||f|| of the discrete
    solutions (the source states the inf-sup constant of the discrete mixed form).
    (4) Thm 3.5 is stated by its first inequality, dist(q, H_h) <= ||q - pi_h q|| on the harmonic
    forms, and the vanishing harmonic gap; the cohomology map is the one induced by the
    inclusion V_h ⊆ W (the source states the map induced by the projection; the two are inverse).
    (5) The differential is encoded as d i j for all pairs, zero unless j = i + 1. The family of
    subcomplexes (SubcomplexFamily) carries no bound and no approximation property; these are
    hypotheses (of the theorem, and of the clauses that need them).
    (6) Closed range is assumed in degrees j and j + 1 only; the approximation property and the
    finite dimension of the harmonic forms only in the clauses about harmonic forms, cohomology
    and convergence.

