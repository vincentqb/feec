name = "FeecPalomarStatic"
version = "0.1.0"
defaultTargets = ["Challenge", "Solution"]
# Share the dependencies (and the Mathlib cache) of the root package.
packagesDir = "../../.lake/packages"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "6e2a148e19b0c1dbde6f99cdcfa73fe1f4094ed4"

# The proof development: the root package of this repository.
[[require]]
name = "Feec"
path = "../.."

# The statement: imports Lean core and Mathlib only.
[[lean_lib]]
name = "Challenge"

# The proof: the challenge's definitions verbatim (`Solution.Defs`), the bridge to `Feec`
# (`Solution.Bridge`) and the theorem (`Solution`).
[[lean_lib]]
name = "Solution"
globs = ["Solution", "Solution.+"]
