status:
  scope: >-
    Formalized and compared (Challenge.lean), in the order of the story: the input
    TimeStepping.hilleYosida and its instance TimeStepping.backwardEuler; the headline on Banach
    spaces, TimeStepping.stable and TimeStepping.error; the Hilbert case,
    TimeStepping.vonNeumann and TimeStepping.contractive; families of space discretizations,
    TimeStepping.stable_of_bounded, TimeStepping.error_of_bounded, TimeStepping.converges,
    TimeStepping.converges_backwardEuler and TimeStepping.converges_contractive; the heat equation
    in the maximum norm, TimeStepping.subMarkov, TimeStepping.maxNormHeat and TimeStepping.fdHeat
    (whose first clause is the former TimeStepping.isSubMarkovGenerator_fdLaplacian); the
    hypotheses on r, TimeStepping.backwardEuler_isAStable and
    TimeStepping.crankNicolson_isAStable. The Whitney-element schemes of the Hodge wave equation
    on the cube that this entry compared until 2026-11-18 (TimeStepping.inverse_estimate,
    TimeStepping.crankNicolson_cube, TimeStepping.leapfrog_cube,
    TimeStepping.rowSolution_nonvacuous) are finite element results: they leave this entry for
    palomar/fem and remain proved in Feec
    (Feec.FiniteElement.PolySeq.exists_mul_norm_d_le, Feec.Models.Cube.Inhomogeneous,
    Feec.Models.Cube.InhomogeneousError, Feec.Models.Cube.InhomogeneousLeapfrog,
    Feec.Numerics.PlaneWaveCubeError). Proved in Feec but not compared: von Neumann's inequality
    for polynomials on incomplete inner product spaces; the maximum-norm error of the lumped-mass
    finite element function on the simplices (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat, its
    field fe, and on the cube Feec.Models.Cube.MaxNormHeat.maxNormHeat); backward Euler along
    C^2 trajectories for every uniformly stable family of bounded generators
    (Feec.TimeStepping.StableFamily.norm_sub_res_pow_le_of_traj; compared for the lumped-mass
    Laplacian only, in TimeStepping.maxNormHeat); the Galerkin form of the lumped-mass Laplacian
    on the cube; the Neumann problem in the maximum norm (Feec.Models.Cube.MaxNormNeumann).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

