# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of rational time stepping on Banach spaces
# and its finite difference and finite element instances (`palomar/timestepping/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Rational time stepping on Banach spaces, with finite difference and finite element instances"
  description: >-
    To solve an evolution equation u' = A u numerically, a one-step method replaces the exact
    evolution e^(tau A) over a time step tau by a rational function r(tau A) of the step, for
    instance backward Euler r(z) = 1/(1 - z) or Crank-Nicolson r(z) = (2 + z)/(2 - z). The
    method is A-stable if |r(z)| <= 1 on the closed left half-plane. On a Hilbert space and for
    a dissipative A, von Neumann's inequality makes every A-stable scheme a contraction. Many
    discretizations of interest are not Hilbert-contractive, however: the heat equation in the
    maximum norm is the standard example. There, Brenner and Thomee (1979) showed that every
    A-stable scheme is nearly stable, ||r(tau A)^n|| <= M (1 + C sqrt(n)) for any semigroup with
    ||e^(tA)|| <= M on any Banach space, and that its error for smooth data is of the order of the
    scheme, with no sqrt(n) loss. Because the constants depend only on r, the bounds hold
    uniformly over whole families of space discretizations. The entry states this abstract theory
    and two concrete instances on meshes of a cube.
    In Lean 4 over Mathlib: (1) Brenner-Thomee's stability bound for every A-stable real rational
    r (|r(infinity)| = 1 included) and every bounded strongly continuous semigroup of a real or
    complex Banach space, with the resolvent (1 - tau A)^(-1) shown to exist and be unique and
    r(tau A) defined through it; (2) the sharp smooth-data error estimate
    ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x|| for r of order m
    (Gomilko-Tomilov 2024, Thm 1.1(ii)); (3) the Hille-Yosida resolvent estimates; (4) the
    convergence half of the Lax equivalence theorem for families of bounded generators on
    Banach spaces X_h read in a Banach space E: if the semidiscrete solutions converge to
    S(t) x uniformly on bounded time intervals, the fully discrete solutions of every
    power-bounded time scheme consistent of order p >= 1 converge to S(n tau_h) x, uniformly over
    the time levels, for every datum; (5) von Neumann's inequality for rational functions of
    contractions and the contractivity ||r(tau A)^n|| <= (sup_y |r(iy)|)^n of A-stable schemes for
    m-dissipative, possibly unbounded, operators on real or complex Hilbert spaces; (6) the
    heat equation on a cube by finite differences in the maximum norm: for every A-stable r of
    order m, every classical solution u with bounded fourth derivatives whose initial value
    satisfies the compatibility conditions of order m (its odd 2s-periodic extension is of class
    C^(2m+2), with the words d^2_(i_1) ... d^2_(i_(m+1)) of its derivatives bounded by B'), the
    scheme started from the nodal interpolant has maximum-norm error
    ||I_h u(k tau) - r(tau Delta_h)^k I_h u(0)|| <= k tau (n B h^2/12 + K n^(m+1) B' tau^m),
    O(h^2 + tau^m) with K depending on r and m only; (7) the Hodge wave equation of the de Rham
    window H Lambda^0 -> H Lambda^1 -> L^2 Lambda^2 on the cube (0, 1/2)^3 by the Whitney
    elements P_1 Lambda^0 -> P_1^- Lambda^1 -> P_1^- Lambda^2 on its Freudenthal meshes, with
    boundary degrees of freedom from the exact solution: the implicit Crank-Nicolson rule
    (unisolvent face integrals, a uniquely solvable step for every time step, error
    C L (1 + T)(h + Delta t^2)) and the explicit leapfrog rule (stable and of error
    C L (1 + T)(h + Delta t^2)/(1 - c) under the CFL condition 2 C_0 Delta t <= c h, for every
    constant C_0 of the inverse estimate h ||d_h v|| <= C_0 ||v|| on the Whitney row), with the
    global inverse estimate h ||dv|| <= C ||v|| on every shape-regular, quasi-uniform family of
    meshes for every admissible sequence of finite element spaces, and a plane wave meeting the
    hypotheses of both error bounds; (8) backward Euler (order 1) and Crank-Nicolson (order 2,
    |r(infinity)| = 1) satisfy the hypotheses on r. The statements use Mathlib's polynomials,
    bounded operators, LinearPMap, Ring.inverse, NormedSpace.exp, Asymptotics.IsBigO,
    HasDerivWithinAt, fderiv, Lp spaces, affine simplices and TendstoUniformlyOn; the
    definitions of differential forms, simplicial meshes and finite element spaces are those of
    palomar/fem. The proof is the library Feec of this repository (Feec.TimeStepping.*,
    Feec.ForMathlib.InnerProductSpace.VonNeumann, Feec.Models.Cube.MaxNormHeat,
    Feec.Models.Cube.FiniteDifferenceHeat, Feec.ForMathlib.Calculus.DifferenceLaplacian,
    Feec.FiniteElement.GlobalInverseEstimate,
    Feec.Models.Cube.Inhomogeneous, Feec.Models.Cube.InhomogeneousError,
    Feec.Models.Cube.InhomogeneousLeapfrog, Feec.Numerics.PlaneWaveCubeError and their
    imports).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

