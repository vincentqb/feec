    m-dissipative and quasi-contractive generators on Hilbert spaces with the semigroup
    characterized by strong solutions, conditional error bounds on Banach spaces with stability
    assumed, complex-coefficient forms and the Cayley transform (formerly compared in the
    palomar/vonneumann entry, which this entry replaces; see fidelity).
