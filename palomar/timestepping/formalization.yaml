sources:
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979) 683-694, Thms 1 and 4"
    relationship: "formalizes"
    note: >-
      The stability bound ||r(tau A)^n|| <= C M sqrt(n) for bounded semigroups and A-stable
      r (Thm 1, as restated in Gomilko-Tomilov 2024, Thm 1.1(i)), formalized as M (1 + C sqrt(n))
      with C depending on r only (TimeStepping.stable), on real or complex Banach spaces (real
      ones through the complexification) and for every A-stable r, |r(infinity)| = 1 included;
      the proof is the Hille-Phillips calculus r(tau A) = Phi(mu_r) and a Fourier bound on the
      total variation of mu_r^n (Plancherel and Carlson's inequality on a dyadic decomposition,
      the technique of the paper as Gomilko-Tomilov, §1.1, describe it: partitions of unity and
      local Carlson inequalities). The smooth-data estimate
      ||r(tau A)^n x - S(n tau) x|| <= C M n tau tau^m ||A^(m+1) x|| for r of order m
      (TimeStepping.error), as stated in Gomilko-Tomilov 2024, Thm 1.1(ii) with s = m + 1, which
      attributes it to Thms 1 and 4 and the remarks of this paper; the proof (translates of
      kernels in the Hille-Phillips calculus and an L^1 bound O(n) of the error kernel) is not the
      paper's. The bounded-generator forms (TimeStepping.stable_of_bounded,
      TimeStepping.error_of_bounded) and the maximum-norm applications (TimeStepping.maxNormHeat,
      TimeStepping.fdHeat) are instances of the two bounds, and so is the error of backward Euler
      (TimeStepping.backwardEuler) for omega = 0, with explicit constants. The paper itself
      was not consulted beyond its abstract (||r^n(hA)|| <= C n^(1/2) for nh bounded and
      A-acceptable r, checked 2026-11-18 through OpenAlex); Thms 1 and 4 were checked as restated
      in Gomilko-Tomilov 2024, Thm 1.1 (arXiv:2403.14411v2).
    author_endorsement: "not-contacted"
  - title: "Rational Approximation of Operator Semigroups via the B-Calculus"
    authors:
      - "Alexander Gomilko"
      - "Yuri Tomilov"
    id: "doi:10.1016/j.jfa.2024.110426"
    type: "article"
    location: "J. Funct. Anal. 287 (2024) 110426, Thm 1.1(ii) (arXiv:2403.14411)"
    relationship: "formalizes"
    note: >-
      Checked against arXiv:2403.14411v2. Thm 1.1 is the Banach-space statement of
      Brenner-Thomee (attributed there to [BT1979, Thms 1, 4 and Remarks]), written for -A the
      generator and r approximating e^(-z): (i) ||r^n(tA/n)|| <= C(r) M n^(1/2)
      (TimeStepping.stable); (ii), case s = q + 1 = m + 1, ||e^(-tA) x - r^n(tA/n) x|| <=
      C M t^(m+1)/n^m ||A^(m+1) x|| = C M n tau tau^m ||A^(m+1) x|| with tau = t/n
      (TimeStepping.error); the paper notes both are optimal in general (shift semigroups on
      L^1). The less smooth cases s < m + 1 and the paper's own Hilbert-space refinements via the
      B-calculus are not formalized.
    author_endorsement: "not-contacted"
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors:
      - "Amnon Pazy"
    id: "doi:10.1007/978-1-4612-5561-1"
    type: "book"
    location: "Appl. Math. Sci. 44, Springer (1983), §1.4, §1.5, §3.4"
    relationship: "formalizes"
    note: >-
      The Hille-Yosida resolvent estimates ||(z - A)^(-m)|| <= M/(re z - omega)^m (§1.5;
      TimeStepping.hilleYosida, and the bound of TimeStepping.backwardEuler at z = 1/tau),
      m-dissipative operators (§1.4; TimeStepping.contractive) and the approximation of
      semigroups by families of discrete spaces (§3.4, background for TimeStepping.converges).
      Section numbers recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Eine Spektraltheorie für allgemeine Operatoren eines unitären Raumes"
    authors:
      - "John von Neumann"
    id: "doi:10.1002/mana.3210040124"
    type: "article"
    location: "Math. Nachr. 4 (1951) 258-281"
    relationship: "formalizes"
    note: >-
      Von Neumann's inequality: the closed unit disc is a spectral set of every contraction of a
      Hilbert space (TimeStepping.vonNeumann, for rational functions with poles outside the closed
      disc; q = 1 gives polynomials). Paper not consulted; the statement as recalled in
      Hairer-Wanner, §IV.11.
    author_endorsement: "n/a"
  - title: "Solving Ordinary Differential Equations II"
    authors:
      - "Ernst Hairer"
      - "Gerhard Wanner"
    id: "doi:10.1007/978-3-642-05221-7"
    type: "book"
    location: "Springer Ser. Comput. Math. 14, 2nd ed. (1996), §IV.3 and §IV.11"
    relationship: "formalizes"
    note: >-
      §IV.3: stability functions, A-stability (|r(z)| <= 1 on the closed left half-plane,
      TimeStepping.IsAStable) and order (r(z) - e^z = O(z^(m+1)), TimeStepping.HasOrder).
      §IV.11 (von Neumann's theorem): ||r(hA)|| <= sup over re z <= 0 of |r(z)| for A with
      logarithmic norm mu(A) <= 0 in an inner product norm, stated there for matrices; here
      (TimeStepping.contractive) for m-dissipative, possibly unbounded, A on real or complex
      Hilbert spaces, with the supremum over the imaginary axis, for all powers. Section numbers
      and wording recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Galerkin Finite Element Methods for Parabolic Problems"
    authors:
      - "Vidar Thomée"
    id: "doi:10.1007/3-540-33122-0"
    type: "book"
    location: "Springer Ser. Comput. Math. 25, 2nd ed. (2006), Ch. 7, 9, 15"
    relationship: "background"
    note: >-
      Ch. 7 (Single Step Fully Discrete Schemes for the Homogeneous Equation) and Ch. 9 (Single
      Step Methods and Rational Approximations of Semigroups): stability and consistency give
      convergence, the background of TimeStepping.converges, TimeStepping.converges_backwardEuler
      and TimeStepping.converges_contractive; Ch. 15 (The Method of Lumped Masses): the lumped-mass
      method, its discrete maximum principle on non-obtuse meshes and its relation to finite
      differences, the background of TimeStepping.maxNormHeat and TimeStepping.fdHeat. Ch. 9 also
      treats, recalled and not checked, the power-boundedness of A-stable schemes for analytic
      semigroups (Crouzeix-Larsson-Piskarev-Thomee 1993, Palencia 1993, below), not formalized.
      Chapter numbers and titles checked against Crossref (DOIs 10.1007/3-540-33122-0_7, _9,
      _15); contents not consulted.
    author_endorsement: "not-contacted"
  - title: "The stability of rational approximations of analytic semigroups"
    authors:
      - "Michel Crouzeix"
      - "Stig Larsson"
      - "Sergei Piskarev"
      - "Vidar Thomée"
    id: "doi:10.1007/BF01990345"
    type: "article"
    location: "BIT 33 (1993) 74-84"
    relationship: "background"
    note: >-
      For bounded analytic semigroups on Banach spaces, A-acceptable (A-stable) and more generally
      A(theta)-acceptable rational approximations are stable, Crank-Nicolson included (the
      abstract, checked 2026-11-18 on the publisher's page; the paper was not consulted). It is
      the sharper bound, without the sqrt(k), that TimeStepping.maxNormHeat does not state: it
      would need the analyticity of the semigroups e^(t L_h) in the maximum norm uniformly in the
      mesh, which is not formalized either (fidelity (5)).
    author_endorsement: "not-contacted"
  - title: "A Stability Result for Sectorial Operators in Banach Spaces"
    authors:
      - "César Palencia"
    id: "doi:10.1137/0730071"
    type: "article"
    location: "SIAM J. Numer. Anal. 30 (1993) 1373-1384"
    relationship: "background"
    note: >-
      A general stability theorem for approximations of holomorphic semigroups on Banach spaces
      by A-acceptable rational functions, |r(infinity)| = 1 included, which settles the L^p
      stability (p != 2) of Crank-Nicolson schemes for parabolic problems (the abstract, checked
      2026-11-18 through OpenAlex; the paper was not consulted). Background for the same scope
      limit of TimeStepping.maxNormHeat as Crouzeix-Larsson-Piskarev-Thomee 1993.
    author_endorsement: "not-contacted"
  - title: "Maximum principle and uniform convergence for the finite element method"
    authors:
      - "Philippe G. Ciarlet"
      - "Pierre-Arnaud Raviart"
    id: "doi:10.1016/0045-7825(73)90019-4"
    type: "article"
    location: "Comput. Methods Appl. Mech. Engrg. 2 (1973) 17-31"
    relationship: "formalizes"
    note: >-
      The discrete maximum principle on non-obtuse meshes: if the gradients of the barycentric
      coordinates of every simplex meet at non-acute angles, the P1 stiffness matrix has
      nonpositive off-diagonal entries; with lumped masses the P1 Laplacian is then a sub-Markov
      generator (TimeStepping.maxNormHeat, first clause), so ||e^(t L_h)|| <= 1 in the maximum
      norm (TimeStepping.subMarkov). The paper treats the elliptic problem; the time-dependent use
      is that of Thomee, Ch. 15. Paper not consulted.
    author_endorsement: "not-contacted"
  - title: "A New Approach to Finite Element Simulations of General Relativity"
    authors:
      - "Vincent Quenneville-Bélair"
    id: "http://hdl.handle.net/11299/175309"
    type: "PhD thesis, University of Minnesota, 2015"
    location: "Ch. 4 (the semidiscrete Hodge wave and heat equations), Ch. 7 (the Crank-Nicolson runs)"
    relationship: "background"
    note: >-
      The thesis integrates its semidiscrete Hodge wave equations with Crank-Nicolson, the
      A-stable scheme with |r(infinity)| = 1 of TimeStepping.crankNicolson_isAStable, in the
      Hilbert case of TimeStepping.contractive. The statements of this entry are not from the
      thesis. The formalization is by the thesis author.
    author_endorsement: "participated"
  - title: "Finite element exterior calculus: from Hodge theory to numerical stability"
    authors:
      - "Douglas N. Arnold"
      - "Richard S. Falk"
      - "Ragnar Winther"
    id: "doi:10.1090/S0273-0979-10-01278-4"
    type: "article"
    location: "Bull. Amer. Math. Soc. (N.S.) 47 (2010), §4 (L^2 de Rham complexes)"
    relationship: "background"
    note: >-
      The weak exterior derivative of the shared forms block (dMax), copied with the partial
      derivatives that TimeStepping.fdHeat uses; dMax itself is not used here. Locator as cited in
      Feec, not rechecked for this entry.
    author_endorsement: "not-contacted"
  - title: "The Finite Element Method for Elliptic Problems"
    authors:
      - "Philippe G. Ciarlet"
    id: "doi:10.1137/1.9780898719208"
    type: "book"
    location: "§3.1 (shape-regular families)"
    relationship: "background"
    note: >-
      The shape regularity of the shared mesh block; TimeStepping.maxNormHeat needs no shape
      regularity, quasi-uniformity or mesh family.
    author_endorsement: "not-contacted"
  - title: "Simplizialzerlegungen von beschränkter Flachheit"
    authors:
      - "Hans Freudenthal"
    id: "doi:10.2307/1968813"
    type: "article"
    location: "Ann. of Math. 43 (1942) (the Freudenthal triangulations of the cube)"
    relationship: "background"
    note: >-
      The Freudenthal mesh of the cube, the non-obtuse mesh whose lumped-mass Laplacian is the
      finite difference Laplacian (TimeStepping.fdHeat, second clause; the mesh is asserted
      existentially, the Freudenthal mesh in the proof).
    author_endorsement: "not-contacted"

