status:
  scope: >-
    Formalized and compared (Challenge.lean): TimeStepping.hilleYosida, TimeStepping.stable,
    TimeStepping.error, TimeStepping.converges, TimeStepping.vonNeumann,
    TimeStepping.contractive, TimeStepping.fdHeat, TimeStepping.backwardEuler_isAStable,
    TimeStepping.crankNicolson_isAStable, TimeStepping.inverse_estimate,
    TimeStepping.crankNicolson_cube, TimeStepping.leapfrog_cube and
    TimeStepping.rowSolution_nonvacuous. This entry absorbs the time-stepping half of the former
    palomar/schemes entry (the weak-symmetry Einstein-Bianchi method moves to its own entry).
    Proved in Feec but no longer compared, as routine corollaries of the compared theorems or
    finite-dimensional facts: backward Euler on Banach spaces with growth M e^(omega t) and its
    first-order error bound (stability is hilleYosida at z = 1/tau); the stability and error
    bounds for bounded generators with ||e^(tL)|| <= M written with p(tau L) q(tau L)^(-1), and
    the error along a trajectory with a defect; convergence of backward Euler for every datum
    (backward Euler meets the hypotheses of converges); von Neumann's inequality for polynomials
    on incomplete inner product spaces; the sub-Markov property of the finite difference
    Laplacian and the positive contraction semigroups it generates; the maximum-norm heat
    estimates for arbitrary discrete data and on every family of non-obtuse meshes
    (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat). Also proved in Feec, not compared: the
    three-row Einstein-Bianchi Crank-Nicolson scheme and its constraint monitors, the
    plane-wave computation of the thesis' Ch. 7, the explicit constant of the leapfrog error
    (Feec.Models.Cube.Inhomogeneous.leapfrogConst), the mesh-level tools (unisolvence,
    Bramble-Hilbert interpolation errors, local inverse estimates).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

