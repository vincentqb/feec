fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q) of real polynomials, not a reduced fraction.
    A-stability (TimeStepping.IsAStable) asks that q have no zero and |p/q| <= 1 on the closed left
    half-plane: for a non-reduced pair this also excludes removable zeros of q there. Order m
    (TimeStepping.HasOrder) is r(z) - e^z = O(z^(m+1)) at 0. IsAStable, HasOrder and rationalApply
    are the shared block rationalScheme of palomar/shared/vocabulary.lean.txt (with palomar/feec;
    checked byte for byte by the gate), as are the partial derivatives (block forms) and simplicial
    meshes (block SimplicialMesh) of palomar/fem. Mathlib has no C_0-semigroups or functional
    calculus for unbounded operators: a strongly continuous semigroup is a family S with S(0) = 1,
    the semigroup law and continuous orbits on [0, infinity) (TimeStepping.IsC0Semigroup); its
    generator is given by its graph, (x, y) with right derivative y of t -> S(t) x at 0
    (TimeStepping.generatorGraph); D(A^(m+1)) and A^(m+1) x are chains in that graph; r(tau A) is
    P(R) Q(R)^(-1) at the resolvent R = (1 - tau A)^(-1), P(R) = sum_(k <= N) p_k (R - 1)^k R^(N-k),
    N = deg q (TimeStepping.rationalOfResolvent; that is R^N p(1 - R^(-1)), and 1 - R^(-1) = tau A).
    Mathlib's NormedSpace.exp gives e^(tL) for bounded L, and r(tau L) = p(tau L) q(tau L)^(-1)
    (TimeStepping.rationalApply, used for bounded generators); the two agree for bounded L (proved
    in the bridge, not compared). Suprema in von Neumann's inequality and in
    TimeStepping.contractive are in [0, infinity] (the extended norm).
    (2) Constants. "C depending on r only" is "exists C, for all spaces": Lean quantifies the
    universe of the spaces outside the statement, so each universe has its own constant; the proof
    gives the same one in every universe. In TimeStepping.error, error_of_bounded and fdHeat the
    constant depends on r and m; in TimeStepping.maxNormHeat the error constant is a function K of
    the order m (stability needs no order); in fdHeat it is moreover independent of the dimension n,
    the cube, the grid and the solution.
    (3) Families. The uniformity of the stability and error bounds over families of discretizations
    L_h is expressed by the order of quantifiers (the constants come before the operator, and in
    maxNormHeat before the mesh); TimeStepping.converges states the families explicitly (spaces X_h,
    generators L_h, reading maps iota_h with left inverses pi_h, a filter on the index set). Its
    hypotheses: ||S(t)|| <= M and ||e^(t L_h)|| <= M with the same M, ||iota_h||, ||pi_h|| <= C, the
    scheme power bounded on every horizon by Ms(T) and consistent of order p >= 1 with K >= 0, tau_h
    -> 0; the semidiscrete convergence is a hypothesis, so the theorem is the time-discretization
    half of a Lax equivalence theorem. It serves the story as the step from power-boundedness to
    convergence for every datum, in its two compared instances: backward Euler is power bounded by
    Hille-Yosida (TimeStepping.converges_backwardEuler, no hypothesis on the scheme), and every
    A-stable scheme of order m >= 1 of dissipative generators on Hilbert spaces by
    TimeStepping.contractive (TimeStepping.converges_contractive, with ||S(t)|| <= 1 and ||e^(t
    L_h)|| <= 1; consistency from TimeStepping.error_of_bounded at n = 1). For an A-stable scheme on
    a Banach space without uniform power bounds (only M (1 + C sqrt(n))) it does not apply, and
    convergence for every datum is not claimed; such schemes converge at their order for data in
    D(A^(m+1)) (TimeStepping.error).
    (4) Temporal error and uniformity in h. In TimeStepping.error_of_bounded and in the last clause
    of TimeStepping.maxNormHeat the temporal term K M n tau tau^m ||L_h^(m+1) v|| is that of the
    discrete datum v, not of the exact solution: for v = I_h u(0) it is bounded uniformly in h only
    when the discrete Laplacians of the data are, which needs compatibility conditions at the
    boundary (without them it can grow like h^(-2(m+1))). No bound of it uniform in h is claimed in
    general: on a non-uniform mesh it need not be bounded uniformly in h even for compatible data.
    Backward Euler, power bounded, has a temporal term of the exact solution instead (the backward
    Euler clause of maxNormHeat, k tau 3/2 tau B with B a bound of the second time derivative of u
    at the nodes): uniform in h when u_tt is bounded on [0, T] x the closed domain and the nodes lie
    in the closed domain, which for a solution of the heat equation is a compatibility condition of
    order 1 on its initial value (for incompatible data u_tt blows up at the boundary as t -> 0, and
    B with it as the nodes approach the boundary). On the cube TimeStepping.fdHeat bounds the
    temporal term of every A-stable scheme uniformly in h for initial data satisfying the
    compatibility conditions of order m, ||Delta_h^(m+1) I_h u(0)|| <= n^(m+1) B', which gives the
    O(h^2 + tau^m) estimate.
    (5) TimeStepping.maxNormHeat. The P1 gradient grad Pi_T u is defined through the edge matrix (g
    = E^(-T) delta, the gradient of the affine interpolant of the vertex values), the stiffness form
    by elementwise assembly sum_T int_T grad Pi_T u . grad Pi_T w on vertex values (equal to the
    Dirichlet form of the continuous piecewise affine functions on a conforming mesh, proved in
    Feec, Feec.FiniteElement.P1Global, not compared), the lumped mass by the vertex quadrature
    sum_(T ni y) |T|/(n + 1), and the lumped-mass Laplacian -M_L^(-1) K in matrix form on arbitrary
    injective nodes x : iota -> R^n: vertices that are not nodes carry homogeneous Dirichlet data,
    and a node that is no vertex has a zero row (m = 0). Non-obtuse means grad lambda_j . grad
    lambda_k <= 0 for j != k on every simplex (all dihedral angles at most pi/2), with grad lambda_j
    the P1 gradient of the vertex hat values. No shape regularity, quasi-uniformity, mesh family or
    condition on the domain is assumed: the discrete maximum principle holds on every non-obtuse
    mesh, and the constants C, K are uniform over all of them and all dimensions; the error bounds
    are not convergence statements uniform in the mesh (see (4) and the consistency error below).
    The stability clause states that q(tau L_h) is invertible, so r(tau L_h) is not the 0 of
    Ring.inverse. The sqrt(k) is what the contractivity of e^(t L_h) alone gives. For bounded
    analytic semigroups on Banach spaces the A-stable rational approximations, Crank-Nicolson
    (|r(infinity)| = 1) included, are power bounded (Crouzeix, Larsson, Piskarev and Thomee 1993;
    Palencia 1993; as stated in their abstracts, sources above); applied to e^(t L_h), that would
    need the analyticity of these semigroups in the maximum norm uniformly in the mesh, and neither
    is formalized. The errors are in the maximum norm at the nodes, for every function u with time
    derivative u_1 (and, for backward Euler, u_2) at the nodes, against its nodal consistency error
    eps (for a classical solution of u_t = Delta u, u_1 = Delta u); eps is a hypothesis and depends
    on the mesh: it is O(h^2) on the Freudenthal meshes of a cube (Feec, the consistency clause
    behind fdHeat) but need not be small on a general non-obtuse mesh, so no rate in h is claimed
    there. The error of the finite element function in L^infinity of the domain is proved in Feec,
    not compared.
    (6) TimeStepping.fdHeat. The first clause is the discrete maximum principle for finite
    differences on every finite grid of Z^iota (the M-matrix property; for the grids of a cube also
    a consequence of the second clause and TimeStepping.maxNormHeat). The second states the
    existence of a non-obtuse mesh of the cube whose lumped-mass Laplacian on the interior grid
    nodes is the finite difference Laplacian (in the proof the Freudenthal mesh of Kuhn simplices,
    Feec.Mesh.freudenthalMesh): it makes the cube an instance of maxNormHeat and shows that its
    hypothesis IsNonobtuse is met, in every dimension. The classical solution is stated by its
    hypotheses (u(t) of class C^4 on all of R^n, two-sided time derivative u_1 = Delta u at the
    points of the open cube and of [0, T] (so u is defined slightly beyond [0, T]), u = 0 on the
    boundary, |d_i^4 u(t)| <= B on the closed cube), only for t in [0, T]. The compatibility
    conditions are stated as the existence of the odd 2s-periodic extension u~ of u(0) (u~ = u(0) on
    the closed cube, odd under the 2n face reflections) of class C^(2m+2), with |d^2_(i_1) ...
    d^2_(i_(m+1)) u~| <= B' on R^n; this is the usual Fourier-type condition (for n = 1: the even
    derivatives of u(0) of order <= 2m + 2 vanish at both ends), stronger than the vanishing of
    Delta^j u(0) on the boundary in general. Class C^(2m+2) asks one vanishing order more (2m + 2)
    than the bound needs: a Lipschitz derivative of order 2m + 1 of u~ would do. The scheme starts
    from the nodal interpolant I_h u(0). No bound on the time derivatives of u beyond those implied
    is assumed. The hypotheses of fdHeat are explicit and met by the first Dirichlet eigenmode
    e^(-lambda t) prod_i sin(pi (x_i - b_i)/s) (odd and 2s-periodic), not stated as a compared
    theorem.
    (7) Hilbert spaces and backward Euler. TimeStepping.contractive assumes only that q has no zero
    in the closed left half-plane; its bound (sup_y |r(iy)|)^n is <= 1 exactly for A-stable r, and
    infinite when deg p > deg q; it concerns generators of contraction semigroups (M = 1).
    TimeStepping.backwardEuler takes the resolvent R as given: TimeStepping.hilleYosida supplies it
    on complex spaces, TimeStepping.stable on real or complex ones for omega = 0; for real spaces
    with omega > 0 its existence is proved in Feec (Feec.C0Semigroup.isResolvent_resolvent_ofReal),
    not compared. For omega > 0 the bound M/(1 - omega tau)^k is a stability bound on bounded time
    intervals, not power-boundedness.
    (8) Scope against the sources. Real or complex Banach spaces in stable, error,
    stable_of_bounded, error_of_bounded, backwardEuler and the convergence theorems (real ones
    through the complexification); hilleYosida and vonNeumann are stated on complex spaces.
    Contractivity for unbounded m-dissipative A with the supremum over the imaginary axis only; the
    discrete maximum principle and the maximum-norm bounds on every non-obtuse mesh in every
    dimension. Less smooth data (x in D(A^s), s < m + 1, Gomilko-Tomilov) are not covered.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the statements of this entry are new or restated from
    palomar/vonneumann and the earlier forms of this entry (the von Neumann and Hilbert-space
    statements were reviewed by the author in their earlier form). Restructured 2026-11-18 as one
    story (A-stable rational time stepping for C_0-semigroups, with the heat equation in the
    maximum norm as the application that needs Banach spaces; status.scope lists what left the
    entry): the dropped statements came back as instances of the headline, and
    TimeStepping.maxNormHeat is new. TimeStepping.fdHeat was restated 2026-11-17 after an
    independent cold audit found that its earlier form (an arbitrary discrete datum v, with the
    temporal term K k tau tau^m ||Delta_h^(m+1) v||) was advertised as O(h^2 + tau^m): it starts
    from I_h u(0) and bounds the temporal term by the compatible initial value. Independent agent
    editorial reviews checked the Banach statements against Gomilko-Tomilov 2024, Thm 1.1 (arXiv
    v2) and audited the earlier entry; an independent agent review of the restructured entry
    (2026-11-18) checked the bibliographic data of Brenner-Thomee, Gomilko-Tomilov,
    Crouzeix-Larsson-Piskarev-Thomee, Palencia, von Neumann, Ciarlet-Raviart and Freudenthal
    against Crossref, and the statements it cites from the first four against their abstracts
    (Gomilko-Tomilov against Thm 1.1 of arXiv v2). These are not author or external reviews.
    Every merge of
    the library was gated by a full build (zero warnings), an axiom audit (propext,
    Classical.choice, Quot.sound only) and an independent AI review. No external mathematical
    review.

alignment:
  namespace: "TimeStepping"
  statements:
    - source: "[Pazy1983], §1.5"
      lean: "TimeStepping.hilleYosida"
      module: "Challenge"
      status: "proved"
      note: "The input: Hille-Yosida estimates at complex z, re z > omega, complex Banach spaces; at z = 1/tau the resolvent that defines r(tau A) and is backward Euler."
    - source: "[BrennerThomee1979]; [Pazy1983], §1.5"
      lean: "TimeStepping.backwardEuler"
      module: "Challenge"
      status: "proved"
      note: >-
        The instance r(z) = 1/(1 - z) under growth M e^(omega t): stable (power bounded for
        omega = 0), explicit first-order error. Feec.TimeStepping.norm_pow_le_of_generator and
        Feec.TimeStepping.RationalScheme.norm_backwardEuler_pow_sub_S_le.
    - source: "[BrennerThomee1979] (the sqrt(n) stability bound)"
      lean: "TimeStepping.stable"
      module: "Challenge"
      status: "proved"
      note: "Headline. Every A-stable r, bounded strongly continuous semigroups of real or complex Banach spaces: the resolvent exists and is unique, Q(R) is invertible, ||r(tau A)^n|| <= M (1 + C sqrt(n))."
    - source: "[BrennerThomee1979]; [GomilkoTomilov2024], Thm 1.1(ii), s = m + 1"
      lean: "TimeStepping.error"
      module: "Challenge"
      status: "proved"
      note: "Headline. Every A-stable r of order m: ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x||."
    - source: "[VonNeumann1951]"
      lean: "TimeStepping.vonNeumann"
      module: "Challenge"
      status: "proved"
      note: "Rational functions of contractions with poles outside the closed unit disc, complex Hilbert spaces; the input to contractive."
    - source: "[HairerWanner1996], §IV.11; [Pazy1983], §1.4"
      lean: "TimeStepping.contractive"
      module: "Challenge"
      status: "proved"
      note: "The Hilbert counterpart of the headline (M = 1, no sqrt(n)). Real rational r, m-dissipative A on real or complex Hilbert spaces: ||r(tau A)^n|| <= (sup_y |r(iy)|)^n."
    - source: "[BrennerThomee1979]"
      lean: "TimeStepping.stable_of_bounded"
      module: "Challenge"
      status: "proved"
      note: >-
        The case S(t) = e^(tL) of stable, uniformly in the bounded generator L with
        ||e^(tL)|| <= M, with r(tau L) = p(tau L) q(tau L)^(-1). TimeStepping.norm_rationalApply_pow_le
        (Feec.TimeStepping.StableFamily.norm_step_pow_le for a one-member family, and step_eq).
    - source: "[BrennerThomee1979]; [GomilkoTomilov2024], Thm 1.1(ii)"
      lean: "TimeStepping.error_of_bounded"
      module: "Challenge"
      status: "proved"
      note: >-
        The case S(t) = e^(tL) of error, and along trajectories with a defect (Duhamel).
        TimeStepping.norm_rationalApply_pow_sub_le (Feec.TimeStepping.StableFamily.norm_step_pow_sub_exp_le
        and norm_sub_step_pow_le_of_traj).
    - source: "[Thomee2006], Ch. 7, 9; [Pazy1983], §3.4"
      lean: "TimeStepping.converges"
      module: "Challenge"
      status: "proved"
      note: "Families of discretizations on Banach spaces: power-bounded schemes consistent of order p >= 1 converge for every datum, uniformly over the time levels. Feec.TimeStepping.BanachFEEC.TimeScheme.converges."
    - source: "[Thomee2006], Ch. 7; [Pazy1983], §1.5"
      lean: "TimeStepping.converges_backwardEuler"
      module: "Challenge"
      status: "proved"
      note: "Backward Euler converges for every datum, with no hypothesis on the scheme. Feec.TimeStepping.StableFamily.backwardEuler in TimeScheme.converges."
    - source: "[Thomee2006], Ch. 7; [HairerWanner1996], §IV.11"
      lean: "TimeStepping.converges_contractive"
      module: "Challenge"
      status: "proved"
      note: >-
        Dissipative generators on Hilbert spaces: every A-stable scheme of order m >= 1 converges
        for every datum, with no hypothesis on the scheme. Feec.TimeStepping.StableFamily.rationalScheme
        (M = 1, Feec.TimeStepping.norm_exp_le_one), power bounded by
        Feec.TimeStepping.RationalScheme.norm_apply_le_one, in TimeScheme.converges.
    - source: "[CiarletRaviart1973]; [Thomee2006], Ch. 15"
      lean: "TimeStepping.subMarkov"
      module: "Challenge"
      status: "proved"
      note: "Sub-Markov generators: e^(tL) and backward Euler are positive contractions of the maximum norm (M = 1). Feec.ForMathlib.Analysis.SubMarkov."
    - source: "[CiarletRaviart1973]; [Thomee2006], Ch. 15; [BrennerThomee1979]"
      lean: "TimeStepping.maxNormHeat"
      module: "Challenge"
      status: "proved"
      note: >-
        The application. On every non-obtuse mesh and set of nodes, the lumped-mass P1 Laplacian
        is a sub-Markov generator (Feec.FiniteElement.isSubMarkovGenerator_lumpedLaplacianOn),
        backward Euler has a first-order nodal error with a temporal term of the solution
        (Feec.TimeStepping.StableFamily.norm_sub_res_pow_le_of_traj), and for every A-stable
        scheme q(tau L_h) is invertible, ||r(tau L_h)^k|| <= 1 + C sqrt(k), and the nodal error
        bound holds, C and K(m) independent of the mesh (Solution/Lumped.lean identifies the
        definitions with Feec's).
    - source: "[Thomee2006], Ch. 15; [BrennerThomee1979]"
      lean: "TimeStepping.fdHeat"
      module: "Challenge"
      status: "proved"
      note: >-
        Finite differences for the heat equation: the discrete maximum principle on every grid
        (FiniteDifference.isSubMarkovGenerator_laplacian); on a cube, the lumped-mass Laplacian of
        a non-obtuse mesh of the cube (Feec.Mesh.freudenthalMesh,
        Feec.FiniteElement.isNonobtuse_freudenthalMesh,
        Feec.Models.Cube.FiniteDifferenceHeat.fdLaplacian_eq), and for any A-stable scheme of
        order m and compatible initial data, started from I_h u(0), maximum-norm error
        k tau (n B h^2/12 + K n^(m+1) B' tau^m)
        (Feec.Models.Cube.FiniteDifferenceHeat.rational_compatible).
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.backwardEuler_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: backward Euler is A-stable of order 1."
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.crankNicolson_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: Crank-Nicolson is A-stable, |r(infinity)| = 1, of order 2."

acknowledgements: "Mathlib and the Lean FRO; the sources cited above."
