fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q) of real polynomials, not a reduced fraction.
    A-stability (TimeStepping.IsAStable) asks that q have no zero and |p/q| <= 1 on the closed
    left half-plane: for a non-reduced pair this also excludes removable zeros of q there.
    Order m (TimeStepping.HasOrder) is r(z) - e^z = O(z^(m+1)) at 0. Mathlib has no
    C_0-semigroups or functional calculus for unbounded operators: a strongly continuous
    semigroup is a family S with S(0) = 1, the semigroup law and continuous orbits on [0,
    infinity) (TimeStepping.IsC0Semigroup); its generator is given by its graph, (x, y) with
    right derivative y of t -> S(t) x at 0 (TimeStepping.generatorGraph); D(A^(m+1)) and
    A^(m+1) x are chains in that graph; r(tau A) is P(R) Q(R)^(-1) at the resolvent
    R = (1 - tau A)^(-1), P(R) = sum_(k <= N) p_k (R - 1)^k R^(N-k), N = deg q
    (TimeStepping.rationalOfResolvent; that is R^N p(1 - R^(-1)), and 1 - R^(-1) = tau A).
    Mathlib's NormedSpace.exp gives e^(tL) for bounded L, and r(tau L) = p(tau L) q(tau L)^(-1)
    (TimeStepping.rationalApply, used by fdHeat); the two agree for bounded L (proved in the
    bridge, not compared). Suprema in von Neumann's inequality and in TimeStepping.contractive
    are in [0, infinity] (the extended norm).
    (2) Constants. "C depending on r only" is "exists C, for all spaces": Lean quantifies the
    universe of the spaces outside the statement, so each universe has its own constant; the
    proof gives the same one in every universe. In TimeStepping.error and fdHeat the constant
    depends on r and m; in fdHeat it is moreover independent of the dimension n, the cube, the
    grid and the solution. The constants C of the Whitney error bounds and of the inverse
    estimates are asserted (explicit in Feec for the error bounds, leapfrogConst; the
    inverse-estimate constant 2^n n A has A from a norm equivalence on the reference simplex, by
    compactness, so it has no explicit value). TimeStepping.leapfrog_cube therefore states the
    CFL condition for every constant C_0 >= 0 of the inverse estimate on the Whitney row, one
    existing: any computed C_0 gives a concrete time-step restriction.
    (3) Families. The uniformity of the stability and error bounds over families of
    discretizations L_h is expressed by the order of quantifiers (the constants come before
    the operator); TimeStepping.converges states the families explicitly (spaces X_h, generators
    L_h, reading maps iota_h with left inverses pi_h, a filter on the index set). Its
    hypotheses: ||S(t)|| <= M and ||e^(t L_h)|| <= M with the same M, ||iota_h||, ||pi_h|| <= C,
    the scheme power bounded on every horizon by Ms(T) and consistent of order p >= 1 with
    K >= 0, tau_h -> 0; the semidiscrete convergence is a hypothesis, so the theorem is the
    time-discretization half of a Lax equivalence theorem. For an A-stable scheme on a Banach
    space without uniform power bounds (only M (1 + C sqrt(n))) it does not apply, and
    convergence for every datum is not claimed (it fails in general on Banach spaces); backward
    Euler satisfies its hypotheses (hilleYosida), the exact flow trivially.
    (4) TimeStepping.fdHeat. The classical solution is stated by its hypotheses (u(t) of class
    C^4 on all of R^n, two-sided time derivative u_1 = Delta u at the points of the open cube and
    of [0, T] (so u is defined slightly beyond [0, T]), u = 0 on the boundary, |d_i^4 u(t)| <= B
    on the closed cube), only for t in [0, T]. The compatibility conditions are stated as the
    existence of the odd 2s-periodic extension u~ of u(0) (u~ = u(0) on the closed cube, odd
    under the 2n face reflections) of class C^(2m+2), with |d^2_(i_1) ... d^2_(i_(m+1)) u~| <= B'
    on R^n; this is the usual Fourier-type condition (for n = 1: the even derivatives of u(0) of
    order <= 2m + 2 vanish at both ends), stronger than the vanishing of Delta^j u(0) on the
    boundary in general. Class C^(2m+2) asks one vanishing order more (2m + 2) than the bound
    needs: a Lipschitz derivative of order 2m + 1 of u~ would do. The scheme starts from the nodal interpolant I_h u(0). The temporal term
    is controlled through the discrete datum, ||Delta_h^(m+1) I_h u(0)|| <= n^(m+1) B'; no bound
    on the time derivatives of u beyond those implied is assumed. The discrete maximum principle
    (||e^(t Delta_h)|| <= 1) is used in the proof, not stated. TimeStepping.contractive assumes
    only that q has no zero in the closed left half-plane; its bound (sup_y |r(iy)|)^n is <= 1
    exactly for A-stable r, and infinite when deg p > deg q.
    (5) The Whitney schemes. Coordinates and definitions of forms, meshes and finite element
    spaces as in palomar/fem (the shared blocks of palomar/shared/vocabulary.lean.txt, checked
    byte for byte by the gate, as are IsAStable, HasOrder and rationalApply, shared with
    palomar/feec); one finite element space with vanishing traces on a set of facets serves
    both Whitney rows, Gamma = ∅ and Gamma = M.boundaryFacets, the facets of a single simplex
    (the earlier femSpace and femSpaceMin; Solution femSpace_empty,
    SimplicialMesh.mem_boundaryFacets_iff); polynomial forms are over a field K, used at K = ℝ, the
    sign sgn takes values in any ring and dMax states its test graph inline (definitionally the
    earlier real forms and codiffMin); the Freudenthal meshes are asserted existentially, named
    by their vertices (IsFreudenthal; a mesh of the cube by such simplices contains all of them).
    Crank-Nicolson: one row of the thesis' three-row Einstein-Bianchi scheme (the rows
    decouple); the exact solution is a classical solution on R x R^3 (all times, all of space;
    for the wave equation smooth data give such solutions) with the stated bounds on [0, T]
    (RowSolution), and no boundary condition is imposed on it: the boundary degrees of
    freedom of the scheme are those of the Whitney interpolant of the exact solution at every
    step for all three fields (any g_n with g_n - Pi_h U(t_n) in V_h with vanishing traces), the
    initial value is the interpolant of U(0), the load is zero. This is an interior error
    estimate with exact Dirichlet data everywhere, not the natural boundary conditions of a
    well-posed initial-boundary value problem. The error is in L^2 at t_M = M Delta t; rates for
    finite Sobolev regularity and the constraint monitors are not stated. The weak exterior
    derivative of the scheme is a total function wd (0 off its domain), only applied to finite
    element forms. Everything is on one domain, (0, 1/2)^3, and one mesh family, except the
    inverse estimate.
    (5a) The relation to the abstract theorems is explained, not compared: with vanishing
    boundary data a Crank-Nicolson step is r(Delta t A_h) on V_h with vanishing traces,
    r(z) = (2 + z)/(2 - z) (TimeStepping.crankNicolson_isAStable) and A_h skew-adjoint for the
    L^2 product, the setting of TimeStepping.contractive; the Lean proof of
    TimeStepping.crankNicolson_cube uses the energy identity of the Cayley transform in Feec
    (Feec.TimeStepping.Cayley) rather than TimeStepping.contractive, and the identification of
    the step with r(Delta t A_h) is not a compared statement. Leapfrog is a two-step method, not
    a rational one-step scheme.
    (5b) Leapfrog: the three-level scheme with the same boundary data and the two starting values
    u_0 = Pi_h U(0), u_1 = Pi_h U(Delta t) (interpolants of the exact solution; no one-step
    starting procedure). The error carries the factor 1/(1 - c) of the energy argument, and the
    stability clause is for vanishing boundary degrees of freedom. The time step need not satisfy
    the CFL condition for well-posedness (the step is explicit). Sharpness of the CFL condition
    (instability beyond it) is not stated.
    (5c) Inverse estimate: the hypothesis that the open simplices lie in Omega (true when Omega is
    the interior of its closure, e.g. for convex Omega and the cube; it makes the L^2(Omega) norm
    the sum of the norms on whole simplices) replaces regularity of Omega; the global estimate is
    stated with the mesh size h_N, not elementwise; C depends on n, S, k and the
    shape-regularity and quasi-uniformity constants of the family.
    Non-vacuity of RowSolution is TimeStepping.rowSolution_nonvacuous (constant fields inhabit
    it too; the witness is a plane wave with nonzero time derivative). The hypotheses of fdHeat
    are explicit and met by the first Dirichlet eigenmode e^(-lambda t) prod_i sin(pi (x_i - b_i)/s)
    (odd and 2s-periodic), not stated as a compared theorem.
    (6) Relation to the former entries. From palomar/vonneumann (replaced earlier): von Neumann's
    inequality (now only its rational form), contractivity for m-dissipative A, Hille-Yosida,
    Brenner-Thomee's stability bound and the sharp error estimate. From palomar/schemes
    (deleted): the inverse estimate, the Crank-Nicolson and leapfrog Whitney schemes (leapfrog
    now for every inverse-estimate constant) and their non-vacuity, under new names in the
    TimeStepping namespace. Dropped from the compared list (all remain proved in Feec): see
    status.scope.
    (7) Stronger than the sources. Real or complex Banach spaces throughout (real ones through
    the complexification); every A-stable r, including |r(infinity)| = 1; contractivity for
    unbounded m-dissipative A with the supremum over the imaginary axis only; the inverse
    estimate for every admissible sequence of FEEC spaces. Less smooth data (x in D(A^s),
    s < m + 1, Gomilko-Tomilov) are not covered.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: the statements of this entry are new or restated from
    palomar/vonneumann and palomar/schemes (the von Neumann and Hilbert-space statements were
    reviewed by the author in their earlier form). TimeStepping.fdHeat was restated 2026-11-17
    after an independent cold audit found that its earlier form (an arbitrary discrete datum v,
    with the temporal term K k tau tau^m ||Delta_h^(m+1) v||) was advertised as O(h^2 + tau^m):
    it now starts from I_h u(0) and bounds the temporal term by the compatible initial value.
    TimeStepping.leapfrog_cube was restated the same day to quantify over every inverse-estimate
    constant. Independent agent editorial reviews checked the Banach statements against
    Gomilko-Tomilov 2024, Thm 1.1 (arXiv v2) and audited the merged entry; they are not author
    or external reviews. Every merge of the library was gated by a full build (zero warnings),
    an axiom audit (propext, Classical.choice, Quot.sound only) and an independent AI review. No
    external mathematical review.

alignment:
  namespace: "TimeStepping"
  statements:
    - source: "[Pazy1983], §1.5"
      lean: "TimeStepping.hilleYosida"
      module: "Challenge"
      status: "proved"
      note: "Hille-Yosida estimates at complex z, re z > omega, complex Banach spaces; at z = 1/tau the power-boundedness of backward Euler."
    - source: "[BrennerThomee1979] (the sqrt(n) stability bound)"
      lean: "TimeStepping.stable"
      module: "Challenge"
      status: "proved"
      note: "Every A-stable r, bounded strongly continuous semigroups of real or complex Banach spaces: the resolvent exists and is unique, Q(R) is invertible, ||r(tau A)^n|| <= M (1 + C sqrt(n))."
    - source: "[BrennerThomee1979]; [GomilkoTomilov2024], Thm 1.1(ii), s = m + 1"
      lean: "TimeStepping.error"
      module: "Challenge"
      status: "proved"
      note: "Every A-stable r of order m: ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x||."
    - source: "[Thomee2006], Ch. 7, 9; [Pazy1983], §3.4"
      lean: "TimeStepping.converges"
      module: "Challenge"
      status: "proved"
      note: "Families of discretizations on Banach spaces: stability and consistency of order p >= 1 give fully discrete convergence for every datum, uniformly over the time levels."
    - source: "[VonNeumann1951]"
      lean: "TimeStepping.vonNeumann"
      module: "Challenge"
      status: "proved"
      note: "Rational functions of contractions with poles outside the closed unit disc, complex Hilbert spaces."
    - source: "[HairerWanner1996], §IV.11; [Pazy1983], §1.4"
      lean: "TimeStepping.contractive"
      module: "Challenge"
      status: "proved"
      note: "Real rational r, m-dissipative A on real or complex Hilbert spaces: ||r(tau A)^n|| <= (sup_y |r(iy)|)^n."
    - source: "[Thomee2006], Ch. 15; [BrennerThomee1979]"
      lean: "TimeStepping.fdHeat"
      module: "Challenge"
      status: "proved"
      note: >-
        Finite differences for the heat equation on a cube, any A-stable scheme of order m,
        compatible initial data, started from I_h u(0): maximum-norm error
        k tau (n B h^2/12 + K n^(m+1) B' tau^m).
        Feec.Models.Cube.FiniteDifferenceHeat.rational_compatible (the rational-scheme clause of
        finiteDifferenceHeat at v = I_h u(0), with norm_fdLaplacian_pow_interp_le).
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.backwardEuler_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: backward Euler is A-stable of order 1."
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.crankNicolson_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: Crank-Nicolson is A-stable, |r(infinity)| = 1, of order 2; the rule of TimeStepping.crankNicolson_cube."
    - source: "[Ciarlet2002] §3.2; [BrennerScott2008] §4.5"
      lean: "TimeStepping.inverse_estimate"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.FiniteElement.PolySeq.exists_mul_norm_d_le (Feec.FiniteElement.GlobalInverseEstimate)
        on the Feec meshes M.toFeec, whose spaces are the challenge's (Solution/Spaces.lean).
    - source: "[QuennevilleBelair2015] Ch. 7; [Thomee2006], Ch. 1"
      lean: "TimeStepping.crankNicolson_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.Models.Cube.Inhomogeneous.RowSolution.whitney_cn_error_le_row and
        whitney_existsUnique_cnStep; the challenge's spaces are Feec.Models.Cube.FEM.whitney and
        whitneyMin (Solution/WhitneySpaces.lean), its interpolant the canonical interpolant
        (Solution/WhitneyInterp.lean), its step Feec.TimeStepping.IsDirichletCNStep
        (Solution/WhitneyScheme.lean).
    - source: "[Joly2003]; [QuennevilleBelair2015] Ch. 7"
      lean: "TimeStepping.leapfrog_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.Models.Cube.Inhomogeneous.exists_mul_norm_discreteD_whitneyRow_le (an inverse
        constant), Feec.TimeStepping.existsUnique_isDirichletLeapfrogStep,
        whitney_leapfrog_stable and RowSolution.whitney_leapfrog_error_le_row, the last two for an
        arbitrary inverse constant K >= 0 (Solution/Leapfrog.lean).
    - source: "[QuennevilleBelair2015] Ch. 7"
      lean: "TimeStepping.rowSolution_nonvacuous"
      module: "Challenge"
      status: "proved"
      note: >-
        Row 0 of Feec.Numerics.PlaneWaveCube.planeWaveRows (A_+ = 1, A_x = 0, omega = 1), whose
        dx_0 coefficient is -sin (y_2 - t) with time derivative cos (y_2 - t)
        (Solution/PlaneWave.lean).

