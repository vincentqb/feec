  msc2020: ["47D06", "65J08", "65M12", "65M06", "65M60", "65L20", "47A60"]

sources:
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979) 683-694, Thms 1 and 4"
    relationship: "formalizes"
    note: >-
      The stability bound ||r(tau A)^n|| <= C M sqrt(n) for bounded semigroups and A-stable
      r (Thm 1, as restated in Gomilko-Tomilov 2024, Thm 1.1(i)), formalized as M (1 + C sqrt(n))
      with C depending on r only (TimeStepping.stable), on real or complex Banach spaces (real
      ones through the complexification) and for every A-stable r, |r(infinity)| = 1 included;
      the proof is the Hille-Phillips calculus r(tau A) = Phi(mu_r) and a Fourier bound on the
      total variation of mu_r^n (Plancherel and Carlson's inequality on a dyadic decomposition,
      the technique of the paper as Gomilko-Tomilov, §1.1, describe it: partitions of unity and
      local Carlson inequalities). The smooth-data estimate
      ||r(tau A)^n x - S(n tau) x|| <= C M n tau tau^m ||A^(m+1) x|| for r of order m
      (TimeStepping.error), as stated in Gomilko-Tomilov 2024, Thm 1.1(ii) with s = m + 1, which
      attributes it to Thms 1 and 4 and the remarks of this paper; the proof (translates of
      kernels in the Hille-Phillips calculus and an L^1 bound O(n) of the error kernel) is not the
      paper's. The bounded-generator clauses of TimeStepping.stable and TimeStepping.error and
      the maximum-norm applications (TimeStepping.maxNormHeat, TimeStepping.fdHeat) are instances
      of the two bounds, and so is the error of backward Euler (TimeStepping.backwardEuler) for
      omega = 0, with explicit constants. The paper itself
      was not consulted beyond its abstract (||r^n(hA)|| <= C n^(1/2) for nh bounded and
      A-acceptable r, checked 2026-11-18 through OpenAlex); Thms 1 and 4 were checked as restated
      in Gomilko-Tomilov 2024, Thm 1.1 (arXiv:2403.14411v2).
    author_endorsement: "not-contacted"
  - title: "Rational Approximation of Operator Semigroups via the B-Calculus"
    authors:
      - "Alexander Gomilko"
      - "Yuri Tomilov"
    id: "doi:10.1016/j.jfa.2024.110426"
    type: "article"
    location: "J. Funct. Anal. 287 (2024) 110426, Thm 1.1(ii) (arXiv:2403.14411)"
    relationship: "formalizes"
    note: >-
      Checked against arXiv:2403.14411v2. Thm 1.1 is the Banach-space statement of
      Brenner-Thomee (attributed there to [BT1979, Thms 1, 4 and Remarks]), written for -A the
      generator and r approximating e^(-z): (i) ||r^n(tA/n)|| <= C(r) M n^(1/2)
      (TimeStepping.stable); (ii), case s = q + 1 = m + 1, ||e^(-tA) x - r^n(tA/n) x|| <=
      C M t^(m+1)/n^m ||A^(m+1) x|| = C M n tau tau^m ||A^(m+1) x|| with tau = t/n
      (TimeStepping.error); the paper notes both are optimal in general (shift semigroups on
      L^1). The less smooth cases s < m + 1 and the paper's own Hilbert-space refinements via the
      B-calculus are not formalized.
    author_endorsement: "not-contacted"
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors:
      - "Amnon Pazy"
    id: "doi:10.1007/978-1-4612-5561-1"
    type: "book"
    location: "Appl. Math. Sci. 44, Springer (1983), §1.4, §1.5, §3.4"
    relationship: "formalizes"
    note: >-
      The Hille-Yosida resolvent estimates ||(z - A)^(-m)|| <= M/(re z - omega)^m (§1.5;
      TimeStepping.hilleYosida, and the bound of TimeStepping.backwardEuler at z = 1/tau),
      m-dissipative operators (§1.4; TimeStepping.contractive) and the approximation of
      semigroups by families of discrete spaces (§3.4, background for TimeStepping.converges).
      Section numbers recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Eine Spektraltheorie für allgemeine Operatoren eines unitären Raumes"
    authors:
      - "John von Neumann"
    id: "doi:10.1002/mana.3210040124"
    type: "article"
    location: "Math. Nachr. 4 (1951) 258-281"
    relationship: "formalizes"
    note: >-
      Von Neumann's inequality: the closed unit disc is a spectral set of every contraction of a
      Hilbert space (TimeStepping.vonNeumann, for rational functions with poles outside the closed
      disc; q = 1 gives polynomials). Paper not consulted; the statement as recalled in
      Hairer-Wanner, §IV.11.
    author_endorsement: "n/a"
  - title: "Solving Ordinary Differential Equations II"
    authors:
      - "Ernst Hairer"
      - "Gerhard Wanner"
    id: "doi:10.1007/978-3-642-05221-7"
    type: "book"
    location: "Springer Ser. Comput. Math. 14, 2nd ed. (1996), §IV.3 and §IV.11"
    relationship: "formalizes"
    note: >-
      §IV.3: stability functions, A-stability (|r(z)| <= 1 on the closed left half-plane,
      TimeStepping.IsAStable) and order (r(z) - e^z = O(z^(m+1)), TimeStepping.HasOrder).
      §IV.11 (von Neumann's theorem): ||r(hA)|| <= sup over re z <= 0 of |r(z)| for A with
      logarithmic norm mu(A) <= 0 in an inner product norm, stated there for matrices; here
      (TimeStepping.contractive) for m-dissipative, possibly unbounded, A on real or complex
      Hilbert spaces, with the supremum over the imaginary axis, for all powers. Section numbers
      and wording recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Galerkin Finite Element Methods for Parabolic Problems"
    authors:
      - "Vidar Thomée"
    id: "doi:10.1007/3-540-33122-0"
    type: "book"
    location: "Springer Ser. Comput. Math. 25, 2nd ed. (2006), Ch. 7, 9, 15"
    relationship: "background"
    note: >-
      Ch. 7 (Single Step Fully Discrete Schemes for the Homogeneous Equation) and Ch. 9 (Single
      Step Methods and Rational Approximations of Semigroups): stability and consistency give
      convergence, the background of TimeStepping.converges; Ch. 15 (The Method of Lumped
      Masses): the lumped-mass
      method, its discrete maximum principle on non-obtuse meshes and its relation to finite
      differences, the background of TimeStepping.maxNormHeat, TimeStepping.maxNormRate and
      TimeStepping.fdHeat. Ch. 9 also
      treats, recalled and not checked, the power-boundedness of A-stable schemes for analytic
      semigroups (Crouzeix-Larsson-Piskarev-Thomee 1993, Palencia 1993, below), not formalized.
      Chapter numbers and titles checked against Crossref (DOIs 10.1007/3-540-33122-0_7, _9,
      _15); contents not consulted.
    author_endorsement: "not-contacted"
  - title: "The stability of rational approximations of analytic semigroups"
    authors:
      - "Michel Crouzeix"
      - "Stig Larsson"
      - "Sergei Piskarev"
      - "Vidar Thomée"
    id: "doi:10.1007/BF01990345"
    type: "article"
    location: "BIT 33 (1993) 74-84"
    relationship: "background"
    note: >-
      For bounded analytic semigroups on Banach spaces, A-acceptable (A-stable) and more generally
      A(theta)-acceptable rational approximations are stable, Crank-Nicolson included (the
      abstract, checked 2026-11-18 on the publisher's page; the paper was not consulted). It is
      the sharper bound, without the sqrt(k), that TimeStepping.maxNormHeat does not state: it
      would need the analyticity of the semigroups e^(t L_h) in the maximum norm uniformly in the
      mesh, which is not formalized either (fidelity (5)).
    author_endorsement: "not-contacted"
  - title: "A Stability Result for Sectorial Operators in Banach Spaces"
    authors:
      - "César Palencia"
    id: "doi:10.1137/0730071"
    type: "article"
    location: "SIAM J. Numer. Anal. 30 (1993) 1373-1384"
    relationship: "background"
    note: >-
      A general stability theorem for approximations of holomorphic semigroups on Banach spaces
      by A-acceptable rational functions, |r(infinity)| = 1 included, which settles the L^p
      stability (p != 2) of Crank-Nicolson schemes for parabolic problems (the abstract, checked
      2026-11-18 through OpenAlex; the paper was not consulted). Background for the same scope
      limit of TimeStepping.maxNormHeat as Crouzeix-Larsson-Piskarev-Thomee 1993.
    author_endorsement: "not-contacted"
  - title: "Maximum principle and uniform convergence for the finite element method"
    authors:
      - "Philippe G. Ciarlet"
      - "Pierre-Arnaud Raviart"
    id: "doi:10.1016/0045-7825(73)90019-4"
    type: "article"
    location: "Comput. Methods Appl. Mech. Engrg. 2 (1973) 17-31"
    relationship: "formalizes"
    note: >-
      The discrete maximum principle on non-obtuse meshes: if the gradients of the barycentric
      coordinates of every simplex meet at non-acute angles, the P1 stiffness matrix has
      nonpositive off-diagonal entries; with lumped masses the P1 Laplacian is then a sub-Markov
      generator (TimeStepping.maxNormHeat, first clause), so ||e^(t L_h)|| <= 1 in the maximum
      norm (TimeStepping.subMarkov). The paper treats the elliptic problem; the time-dependent use
      is that of Thomee, Ch. 15. Paper not consulted.
    author_endorsement: "not-contacted"
  - title: "A New Approach to Finite Element Simulations of General Relativity"
    authors:
      - "Vincent Quenneville-Bélair"
    id: "http://hdl.handle.net/11299/175309"
    type: "PhD thesis, University of Minnesota, 2015"
    location: "Ch. 4 (the semidiscrete Hodge wave and heat equations), Ch. 7 (the Crank-Nicolson runs)"
    relationship: "background"
    note: >-
      The thesis integrates its semidiscrete Hodge wave equations with Crank-Nicolson, the
      A-stable scheme with |r(infinity)| = 1 of TimeStepping.crankNicolson_isAStable, in the
      Hilbert case of TimeStepping.contractive. The statements of this entry are not from the
      thesis. The formalization is by the thesis author.
    author_endorsement: "participated"
  - title: "Simplizialzerlegungen von beschränkter Flachheit"
    authors:
      - "Hans Freudenthal"
    id: "doi:10.2307/1968813"
    type: "article"
    location: "Ann. of Math. 43 (1942) (the Freudenthal triangulations of the cube)"
    relationship: "background"
    note: >-
      The Freudenthal mesh of the cube, the non-obtuse mesh whose lumped-mass Laplacian is the
      finite difference Laplacian (TimeStepping.fdHeat, second clause; the mesh is asserted
      existentially, the Freudenthal mesh in the proof).
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    Formalized and compared (Challenge.lean), in the order of the answer: on Banach spaces the
    headline TimeStepping.stable and TimeStepping.error, whose second clauses are their cases for
    bounded generators (until 2026-11-18 the separate TimeStepping.stable_of_bounded and
    TimeStepping.error_of_bounded, with the same constants), and TimeStepping.backwardEuler (which
    now also asserts that the resolvent exists and is unique, on real or complex spaces); on
    Hilbert spaces TimeStepping.contractive; convergence for every datum,
    TimeStepping.converges, whose three clauses are the former TimeStepping.converges,
    TimeStepping.converges_backwardEuler and TimeStepping.converges_contractive (the last stated
    for Hilbert spaces given by the parallelogram law and contraction semigroups, equivalent by
    Lumer-Phillips for bounded generators to dissipative generators on inner product spaces); the
    heat equation in the maximum norm, TimeStepping.subMarkov, TimeStepping.maxNormHeat, the rate
    TimeStepping.maxNormRate (new 2026-11-24: the second-order nodal consistency where the mesh is
    translation invariant at the nodes, the substituted errors, and the cross-polytope on which
    the consistency error does not tend to 0) and its witness TimeStepping.fdHeat (whose first
    clause is the former
    TimeStepping.isSubMarkovGenerator_fdLaplacian); the hypotheses on r,
    TimeStepping.backwardEuler_isAStable and TimeStepping.crankNicolson_isAStable; the two
    classical inputs TimeStepping.hilleYosida and TimeStepping.vonNeumann. The Whitney-element
    schemes of the Hodge wave equation on the cube that this entry compared until 2026-11-18
    (TimeStepping.inverse_estimate, TimeStepping.crankNicolson_cube, TimeStepping.leapfrog_cube,
    TimeStepping.rowSolution_nonvacuous) are finite element results: they left this entry for the
    finite element entries and remain proved in Feec
    (Feec.FiniteElement.PolySeq.exists_mul_norm_d_le, Feec.Models.Cube.Inhomogeneous,
    Feec.Models.Cube.InhomogeneousError, Feec.Models.Cube.InhomogeneousLeapfrog,
    Feec.Numerics.PlaneWaveCubeError). Proved in Feec but not compared: von Neumann's inequality
    for polynomials on incomplete inner product spaces; the maximum-norm error of the lumped-mass
    finite element function on the simplices (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat, its
    field fe, and on the cube Feec.Models.Cube.MaxNormHeat.maxNormHeat); backward Euler along
    C^2 trajectories for every uniformly stable family of bounded generators
    (Feec.TimeStepping.StableFamily.norm_sub_res_pow_le_of_traj; compared for the lumped-mass
    Laplacian only, in TimeStepping.maxNormHeat); the Galerkin form of the lumped-mass Laplacian
    on the cube; the Neumann problem in the maximum norm (Feec.Models.Cube.MaxNormNeumann).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents wrote most Lean code and proofs under the author's direction, in git worktrees,
        each change gated by a full build with zero errors and warnings, an axiom audit, naming,
        layering and citation checks and an independent agent review before merging.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine and API"
      prompting_notes: >-
        The author set the mathematical goals, the statement design and the review standard;
        agents proposed and proved lemmas and wrote this submission.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design and review of earlier challenge statements."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
  notes: >-
    The challenge was assembled by agents from the earlier palomar/vonneumann challenge (its
    Banach-space and Hilbert-space statements), the statements for families of discretizations
    and the maximum norm of the first form of this entry, and new statements for the lumped-mass
    P1 Laplacian on non-obtuse meshes (TimeStepping.maxNormHeat and the second clause of
    TimeStepping.fdHeat); on 2026-11-18 it was rechecked against its one-page specification (the
    question and its answer): the steps toward the headline became its clauses (stable, error,
    converges), and no conclusion was dropped. The bridges translate the definitions to Feec:
    Solution/Bridge.lean (the rational schemes, semigroups, bounded generators and sub-Markov
    generators; new mathematics there: P(R) Q(R)^(-1) = p(tau L) q(tau L)^(-1) for bounded L,
    TimeStepping.step_eq, and the order from divisibility of p - q T_m by X^(m+1),
    TimeStepping.hasOrder_of_dvd) and Solution/Lumped.lean (meshes, the P1 gradient by the edge
    matrix, the lumped-mass Laplacian and non-obtuse meshes are those of Feec). New in Feec for
    this entry: the P1 gradient by the edge matrix and the P1 interpolant of a vertex hat function
    (Feec.FiniteElement.p1Grad_eq_vecMul, Feec.FiniteElement.p1Grad_nodalIndicator); earlier, the
    compatible-data estimate behind fdHeat
    (Feec.Models.Cube.FiniteDifferenceHeat.rational_compatible); on 2026-11-18, the iterated
    derivatives on coordinate vectors of C^p functions as iterated partial derivatives
    (iteratedFDeriv_apply_single_eq_foldr, with its pure and paired cases
    iteratedFDeriv_apply_single_eq_iterate and FiniteDifference.iteratedFDeriv_apply_pairs) and
    the converse of the Lumer-Phillips theorem for bounded generators
    (Feec.TimeStepping.re_inner_le_zero_of_norm_exp_le_one); on 2026-11-24, for
    TimeStepping.maxNormRate, the second-order nodal consistency of the lumped-mass Laplacian where
    the mesh is translation invariant (Feec.FiniteElement.LumpedConsistency:
    Feec.FiniteElement.abs_lumpedLaplacianOn_sub_laplacian_le, the Freudenthal meshes
    Feec.FiniteElement.isTranslationInvariantAt_freudenthalMesh, the cross-polytope mesh
    Feec.FiniteElement.crossMesh and its centre stencil) and the second difference along a
    direction (abs_secondDiff_sub_iteratedFDeriv_le,
    Feec.ForMathlib.Calculus.DirectionalSecondDifference).

fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q) of real polynomials, not a reduced fraction.
    A-stability (TimeStepping.IsAStable) asks that q have no zero and |p/q| <= 1 on the closed left
    half-plane: for a non-reduced pair this also excludes removable zeros of q there. Order m
    (TimeStepping.HasOrder) is r(z) - e^z = O(z^(m+1)) at 0. IsAStable, HasOrder and rationalApply
    are the shared block rationalScheme of palomar/shared/vocabulary.lean.txt (with palomar/feec
    and palomar/crimes; checked byte for byte by the gate), as are the simplicial meshes (block
    SimplicialMesh, with palomar/fem, palomar/waves and palomar/einsteinbianchi). The derivatives
    in TimeStepping.fdHeat are Mathlib's iterated derivatives on coordinate vectors,
    D^k f(x)(e_(i_1), ..., e_(i_k)) (iteratedFDeriv). Mathlib has no C_0-semigroups or functional
    calculus for unbounded operators: a strongly continuous semigroup is a family S with S(0) = 1,
    the semigroup law and continuous orbits on [0, infinity) (TimeStepping.IsC0Semigroup); its
    generator is given by its graph, (x, y) with right derivative y of t -> S(t) x at 0
    (TimeStepping.generatorGraph); D(A^(m+1)) and A^(m+1) x are chains in that graph; r(tau A) is
    P(R) Q(R)^(-1) at the resolvent R = (1 - tau A)^(-1), P(R) = sum_(k <= N) p_k (R - 1)^k R^(N-k),
    N = deg q (TimeStepping.rationalOfResolvent; that is R^N p(1 - R^(-1)), and 1 - R^(-1) = tau A).
    Mathlib's NormedSpace.exp gives e^(tL) for bounded L, and r(tau L) = p(tau L) q(tau L)^(-1)
    (TimeStepping.rationalApply, used for bounded generators); the two agree for bounded L (proved
    in the bridge, not compared). A Hilbert space in the last clause of TimeStepping.converges is
    a Banach space whose norm satisfies the parallelogram law (Mathlib's InnerProductSpaceable;
    by the Jordan-von Neumann theorem its norm comes from an inner product), so that the family
    of discretizations is stated once for the three clauses. Suprema in von Neumann's inequality
    and in TimeStepping.contractive are in [0, infinity] (the extended norm).
    (2) Constants. "C depending on r only" is "exists C, for all spaces": Lean quantifies the
    universe of the spaces outside the statement, so each universe has its own constant; the proof
    gives the same one in every universe. The constant C of TimeStepping.stable serves its two
    clauses (semigroups and bounded generators), and so does the constant K of TimeStepping.error,
    which depends on r and m; in TimeStepping.maxNormHeat the error constant is a function K of the
    order m (stability needs no order); in fdHeat it is moreover independent of the dimension n,
    the cube, the grid and the solution.
    (3) Families. The uniformity of the stability and error bounds over families of discretizations
    L_h is expressed by the order of quantifiers (the constants come before the operator, and in
    maxNormHeat before the mesh); TimeStepping.converges states the families explicitly (spaces X_h,
    generators L_h, reading maps iota_h with left inverses pi_h, a filter on the index set). Its
    hypotheses: ||S(t)|| <= M and ||e^(t L_h)|| <= M with the same M, ||iota_h||, ||pi_h|| <= C,
    tau_h -> 0, and the convergence of the semidiscrete solutions, so the theorem is the
    time-discretization half of a Lax equivalence theorem. Its first clause asks of the scheme that
    it be power bounded on every horizon by Ms(t) and consistent of order m >= 1 with K >= 0; the
    second is backward Euler, power bounded by Hille-Yosida, with no hypothesis on the scheme; the
    third, also with no hypothesis on the scheme, is every A-stable scheme of order m >= 1 when the
    X_h are Hilbert spaces and M <= 1 (contraction semigroups, ||S(t)|| <= 1 and
    ||e^(t L_h)|| <= 1): for bounded L_h on a Hilbert space, ||e^(t L_h)|| <= 1 is equivalent to
    re <L_h y, y> <= 0 (both directions in Feec, Feec.TimeStepping.norm_exp_le_one and
    Feec.TimeStepping.re_inner_le_zero_of_norm_exp_le_one), so the clause is the former
    TimeStepping.converges_contractive (dissipative generators on inner product spaces), and
    r(tau_h L_h) is a contraction by TimeStepping.contractive and consistent by
    TimeStepping.error at n = 1. For an A-stable scheme on a Banach space without uniform power
    bounds (only M (1 + C sqrt(n))) the theorem does not apply, and convergence for every datum is
    not claimed; such schemes converge at their order for data in D(A^(m+1))
    (TimeStepping.error).
    (4) Temporal error and uniformity in h. In the bounded-generator clause of TimeStepping.error
    and in the last clause of TimeStepping.maxNormHeat the temporal term
    K M n tau tau^m ||L_h^(m+1) v|| is that of the discrete datum v, not of the exact solution: for
    v = I_h u(0) it is bounded uniformly in h only when the discrete Laplacians of the data are,
    which needs compatibility conditions at the boundary (without them it can grow like
    h^(-2(m+1))). No bound of it uniform in h is claimed in general: on a non-uniform mesh it need
    not be bounded uniformly in h even for compatible data. Backward Euler, power bounded, has a
    temporal term of the exact solution instead (the backward Euler clause of maxNormHeat,
    k tau 3/2 tau B with B a bound of the second time derivative of u at the nodes): uniform in h
    when u_tt is bounded on [0, T] x the closed domain and the nodes lie in the closed domain,
    which for a solution of the heat equation is a compatibility condition of order 1 on its
    initial value (for incompatible data u_tt blows up at the boundary as t -> 0, and B with it as
    the nodes approach the boundary). On the cube TimeStepping.fdHeat bounds the temporal term of
    every A-stable scheme uniformly in h for initial data satisfying the compatibility conditions
    of order m, ||Delta_h^(m+1) I_h u(0)|| <= n^(m+1) B', which gives the O(h^2 + tau^m)
    estimate.
    (5) TimeStepping.maxNormHeat. The P1 gradient grad Pi_T u is defined through the edge matrix (g
    = E^(-T) delta, the gradient of the affine interpolant of the vertex values), the stiffness form
    by elementwise assembly sum_T int_T grad Pi_T u . grad Pi_T w on vertex values (equal to the
    Dirichlet form of the continuous piecewise affine functions on a conforming mesh, proved in
    Feec, Feec.FiniteElement.P1Global, not compared), the lumped mass by the vertex quadrature
    sum_(T ni y) |T|/(n + 1), and the lumped-mass Laplacian -M_L^(-1) K in matrix form on arbitrary
    injective nodes x : iota -> R^n: vertices that are not nodes carry homogeneous Dirichlet data,
    and a node that is no vertex has a zero row (m = 0). Non-obtuse means grad lambda_j . grad
    lambda_k <= 0 for j != k on every simplex (all dihedral angles at most pi/2), with grad lambda_j
    the P1 gradient of the vertex hat values. No shape regularity, quasi-uniformity, mesh family or
    condition on the domain is assumed: the discrete maximum principle holds on every non-obtuse
    mesh, and the constants C, K are uniform over all of them and all dimensions; the error bounds
    are not convergence statements uniform in the mesh (see (4) and the consistency error below).
    The stability clause states that q(tau L_h) is invertible, so r(tau L_h) is not the 0 of
    Ring.inverse. The sqrt(k) is what the contractivity of e^(t L_h) alone gives. For bounded
    analytic semigroups on Banach spaces the A-stable rational approximations, Crank-Nicolson
    (|r(infinity)| = 1) included, are power bounded (Crouzeix, Larsson, Piskarev and Thomee 1993;
    Palencia 1993; as stated in their abstracts, sources above); applied to e^(t L_h), that would
    need the analyticity of these semigroups in the maximum norm uniformly in the mesh, and neither
    is formalized. The errors are in the maximum norm at the nodes, for every function u with time
    derivative u_1 (and, for backward Euler, u_2) at the nodes, against its nodal consistency error
    eps (for a classical solution of u_t = Delta u, u_1 = Delta u); eps is a hypothesis and depends
    on the mesh: TimeStepping.maxNormRate bounds it by n B h^2/12 where the mesh is translation
    invariant at the nodes, and shows that on non-obtuse meshes in general it need not tend to 0
    (see (9)). The error of the finite element function in L^infinity of the domain is proved in
    Feec, not compared.
    (6) TimeStepping.fdHeat. The first clause is the discrete maximum principle for finite
    differences on every finite grid of Z^iota (the M-matrix property; for the grids of a cube also
    a consequence of the second clause and TimeStepping.maxNormHeat). The second states the
    existence of a non-obtuse mesh of the cube whose lumped-mass Laplacian on the interior grid
    nodes is the finite difference Laplacian (in the proof the Freudenthal mesh of Kuhn simplices,
    Feec.Mesh.freudenthalMesh): it makes the cube an instance of maxNormHeat and shows that its
    hypothesis IsNonobtuse is met, in every dimension. The classical solution is stated by its
    hypotheses (u(t) of class C^4 on all of R^n, two-sided time derivative
    u_1 = Delta u = sum_i D^2 u(t)(e_i, e_i) at the points of the open cube and of [0, T] (so u
    is defined slightly beyond [0, T]), u = 0 on the boundary,
    |d_i^4 u(t)| = |D^4 u(t)(e_i, e_i, e_i, e_i)| <= B on the closed cube), only for t in [0, T].
    The compatibility conditions are stated as the existence of the odd 2s-periodic extension u~
    of u(0) (u~ = u(0) on the closed cube, odd under the 2n face reflections) of class C^(2m+2),
    with |D^(2m+2) u~(e_(l 0), e_(l 0), ..., e_(l m), e_(l m))| <= B' on R^n for every sequence
    of directions l (only l 0, ..., l m enter), that is the words d^2_(l 0) ... d^2_(l m) u~ of
    pure second derivatives (FiniteDifference.iteratedFDeriv_apply_pairs); this is the usual
    Fourier-type condition (for n = 1: the even derivatives of u(0) of order <= 2m + 2 vanish at
    both ends), stronger than the vanishing of Delta^j u(0) on the boundary in general. Class
    C^(2m+2) asks one vanishing order more (2m + 2) than the bound needs: a Lipschitz derivative
    of order 2m + 1 of u~ would do. The scheme starts from the nodal interpolant I_h u(0). No
    bound on the time derivatives of u beyond those implied is assumed. The hypotheses of fdHeat
    are explicit and met by the first Dirichlet eigenmode
    e^(-lambda t) prod_i sin(pi (x_i - b_i)/s) (odd and 2s-periodic), not stated as a compared
    theorem.
    (7) Hilbert spaces and backward Euler. TimeStepping.contractive assumes only that q has no zero
    in the closed left half-plane; its bound (sup_y |r(iy)|)^n is <= 1 exactly for A-stable r, and
    infinite when deg p > deg q; it concerns generators of contraction semigroups (M = 1).
    TimeStepping.backwardEuler asserts that the resolvent (1 - tau A)^(-1) exists and is unique for
    omega tau < 1, on real or complex spaces (Feec.C0Semigroup.isResolvent_resolvent_ofReal);
    TimeStepping.hilleYosida states the Hille-Yosida estimates at every complex z with
    re z > omega on complex spaces. For omega > 0 the bound M/(1 - omega tau)^k of backward Euler
    is a stability bound on bounded time intervals, not power-boundedness.
    (8) Scope against the sources. Real or complex Banach spaces in stable, error, backwardEuler and
    converges (real ones through the complexification); hilleYosida and vonNeumann are stated on
    complex spaces. Contractivity for unbounded m-dissipative A with the supremum over the
    imaginary axis only; the discrete maximum principle and the maximum-norm bounds on every
    non-obtuse mesh in every dimension. Less smooth data (x in D(A^s), s < m + 1,
    Gomilko-Tomilov) are not covered.
    (9) TimeStepping.maxNormRate. Translation invariance at a node y
    (TimeStepping.IsTranslationInvariantAt) is a condition on the simplices at y only: with every
    simplex T at y, the translates T + (y - v) for the vertices v of T are simplices of the mesh
    (each has the vertex y), as vertex sets: the numbering of the vertices does not enter, as none
    of the notions of the entry depends on it. It holds at the vertices where the mesh agrees with a
    lattice triangulation of R^n, e.g. at the interior nodes of the Freudenthal meshes (the second
    clause of TimeStepping.fdHeat states it, with edges of length at most sqrt(n) times the grid
    size, so that the bounds apply on the cube with h = sqrt(n) s/(N + 1)); for n >= 2 it fails at
    the centre of the cross-polytope. Every node must be a vertex (a node that is no vertex has a
    zero row) and the condition is asked at every node, so the nodes are vertices around which the
    mesh looks like a lattice triangulation (on the cube, the interior grid nodes); the vertices
    that are not nodes carry homogeneous Dirichlet data (u vanishes there), and no other boundary
    condition is covered. h bounds the Euclidean lengths of all edges at the nodes: on the
    Freudenthal meshes the diagonal edges have length sqrt(n) times the grid size, so there the
    consistency bound is n^2 B (grid size)^2/12 with B a bound of all fourth directional
    derivatives, weaker than the n B (grid size)^2/12 with pure fourth partials behind
    TimeStepping.fdHeat. The fourth derivatives are bounded on the closed simplices in every
    direction, |D^4 u(y)(d, d, d, d)| <= B |d|^4 with |d|^2 = d . d (Euclidean, while the norm of
    R^n in the statements is the sup norm). The consistency clause is stated node by node; the time
    clauses ask B >= 0 (needed only when there is no node) and substitute the consistency bound for
    the hypothesis eps of TimeStepping.maxNormHeat, with u_1 = Delta u at the nodes. The backward
    Euler clause has a temporal term of the solution alone, so from v = I_h u(0) its error O(tau +
    h^2) holds uniformly over all these meshes; the A-stable clause keeps the temporal term of the
    datum, K k tau tau^m ||L_h^(m+1) v||, which is not bounded uniformly in h in general (it is for
    compatible data on the cube, TimeStepping.fdHeat). The counterexample is a mesh of the
    cross-polytope {z | sum_i |z_i| < h} given existentially (in the proof its 2^n orthant simplices
    conv(0, +-h e_1, ..., +-h e_n), Feec.FiniteElement.crossMesh), with the vertex 0, the other
    vertices at Euclidean distance h from 0, the single node 0 and Dirichlet data at the 2n other
    vertices; there (L_h U)(0) = -n (n + 1) U(0)/h^2, so the quadratic (|z|^2 - h^2)/2, with
    Laplacian n, gives n (n + 1)/2 and the consistency error n (n - 1)/2 for every h, while every
    hypothesis of the consistency clause but translation invariance holds with B = 0. The
    consistency theorem under translation invariance (the stencil of the lumped-mass Laplacian at a
    vertex, the pairing of opposite edges, and the second moments from the energy identity of a
    simplex counted over the re-rootings of the star) and the cross-polytope counterexample are
    formulated and proved here, not taken from the sources; Thomee 2006, Ch. 15, is the background
    for the lumped mass method and its relation to finite differences on uniform meshes.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    Not yet reviewed by the author: TimeStepping.maxNormRate and the translation-invariance and
    edge-length clauses of TimeStepping.fdHeat (2026-11-24) are new, and the statements of this
    entry are new or restated from palomar/vonneumann and the earlier forms of this entry (the von
    Neumann and Hilbert-space statements were reviewed by the author in their earlier form).
    Restructured 2026-11-18 as one story (A-stable rational time stepping for C_0-semigroups, with
    the heat equation in the maximum norm as the application that needs Banach spaces; status.scope
    lists what left the entry): the dropped statements came back as instances of the headline, and
    TimeStepping.maxNormHeat is new. Rechecked the same day against its one-page specification: the
    instances for bounded generators became the second clauses of TimeStepping.stable and
    TimeStepping.error, the three convergence theorems the clauses of TimeStepping.converges (the
    Hilbert one restated for the parallelogram law and contraction semigroups, equivalent),
    TimeStepping.backwardEuler now asserts its resolvent, and TimeStepping.fdHeat states its
    derivatives as iterated derivatives (equivalent under its smoothness hypotheses); no conclusion
    was weakened (an independent agent review derived the sixteen former statements from the twelve
    in Lean, a scratch check outside the entry, with Feec's Feec.TimeStepping.norm_exp_le_one for
    the Hilbert clause of TimeStepping.converges and iteratedFDeriv_apply_single_eq_iterate and
    FiniteDifference.iteratedFDeriv_apply_pairs for TimeStepping.fdHeat). TimeStepping.fdHeat was
    restated 2026-11-17 after an independent cold audit found that its earlier form (an arbitrary
    discrete datum v, with the temporal term K k tau tau^m ||Delta_h^(m+1) v||) was advertised as
    O(h^2 + tau^m): it starts from I_h u(0) and bounds the temporal term by the compatible initial
    value. Independent agent editorial reviews checked the Banach statements against Gomilko-Tomilov
    2024, Thm 1.1 (arXiv v2) and audited the earlier entry; an independent agent review of the
    restructured entry (2026-11-18) checked the bibliographic data of Brenner-Thomee,
    Gomilko-Tomilov, Crouzeix-Larsson-Piskarev-Thomee, Palencia, von Neumann, Ciarlet-Raviart and
    Freudenthal against Crossref, and the statements it cites from the first four against their
    abstracts (Gomilko-Tomilov against Thm 1.1 of arXiv v2). These are not author or external
    reviews. Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only) and an independent AI review. No external
    mathematical review.

alignment:
  namespace: "TimeStepping"
  statements:
    - source: "[BrennerThomee1979] (the sqrt(n) stability bound)"
      lean: "TimeStepping.stable"
      module: "Challenge"
      status: "proved"
      note: >-
        Headline. Every A-stable r, bounded strongly continuous semigroups of real or complex
        Banach spaces: the resolvent exists and is unique, Q(R) is invertible,
        ||r(tau A)^n|| <= M (1 + C sqrt(n)); with the same C, the case S(t) = e^(tL) of bounded
        generators L with ||e^(tL)|| <= M, with r(tau L) = p(tau L) q(tau L)^(-1)
        (TimeStepping.norm_rationalApply_pow_le, from Feec.TimeStepping.StableFamily.norm_step_pow_le
        for a one-member family and step_eq).
    - source: "[BrennerThomee1979]; [GomilkoTomilov2024], Thm 1.1(ii), s = m + 1"
      lean: "TimeStepping.error"
      module: "Challenge"
      status: "proved"
      note: >-
        Headline. Every A-stable r of order m: ||r(tau A)^n x - S(n tau) x|| <=
        K M n tau tau^m ||A^(m+1) x||; with the same K, the case S(t) = e^(tL) and the error
        along trajectories with a defect (Duhamel; TimeStepping.norm_rationalApply_pow_sub_le, from
        Feec.TimeStepping.StableFamily.norm_step_pow_sub_exp_le and norm_sub_step_pow_le_of_traj).
    - source: "[Pazy1983], §1.5; [BrennerThomee1979]"
      lean: "TimeStepping.backwardEuler"
      module: "Challenge"
      status: "proved"
      note: >-
        Backward Euler r(z) = 1/(1 - z) under growth M e^(omega t): the resolvent exists and is
        unique, power bounded for omega = 0, explicit first-order error.
        Feec.C0Semigroup.isResolvent_resolvent_ofReal, Feec.TimeStepping.norm_pow_le_of_generator and
        Feec.TimeStepping.RationalScheme.norm_backwardEuler_pow_sub_S_le.
    - source: "[HairerWanner1996], §IV.11; [Pazy1983], §1.4"
      lean: "TimeStepping.contractive"
      module: "Challenge"
      status: "proved"
      note: "The Hilbert counterpart of the headline (M = 1, no sqrt(n)). Real rational r, m-dissipative A on real or complex Hilbert spaces: ||r(tau A)^n|| <= (sup_y |r(iy)|)^n."
    - source: "[Thomee2006], Ch. 7, 9; [Pazy1983], §3.4"
      lean: "TimeStepping.converges"
      module: "Challenge"
      status: "proved"
      note: >-
        Families of discretizations on Banach spaces, convergence for every datum uniformly over
        the time levels: power-bounded schemes consistent of order m >= 1
        (Feec.TimeStepping.BanachFEEC.TimeScheme.converges); backward Euler
        (Feec.TimeStepping.StableFamily.backwardEuler); every A-stable scheme of order m >= 1 on
        Hilbert spaces with contraction semigroups (Feec.TimeStepping.StableFamily.rationalScheme,
        power bounded by Feec.TimeStepping.RationalScheme.norm_apply_le_one in the inner product of
        the parallelogram law, with Feec.TimeStepping.re_inner_le_zero_of_norm_exp_le_one).
    - source: "[CiarletRaviart1973]; [Thomee2006], Ch. 15"
      lean: "TimeStepping.subMarkov"
      module: "Challenge"
      status: "proved"
      note: "Sub-Markov generators: e^(tL) and backward Euler are positive contractions of the maximum norm (M = 1). Feec.ForMathlib.Analysis.SubMarkov."
    - source: "[CiarletRaviart1973]; [Thomee2006], Ch. 15; [BrennerThomee1979]"
      lean: "TimeStepping.maxNormHeat"
      module: "Challenge"
      status: "proved"
      note: >-
        The application. On every non-obtuse mesh and set of nodes, the lumped-mass P1 Laplacian
        is a sub-Markov generator (Feec.FiniteElement.isSubMarkovGenerator_lumpedLaplacianOn),
        backward Euler has a first-order nodal error with a temporal term of the solution
        (Feec.TimeStepping.StableFamily.norm_sub_res_pow_le_of_traj), and for every A-stable
        scheme q(tau L_h) is invertible, ||r(tau L_h)^k|| <= 1 + C sqrt(k), and the nodal error
        bound holds, C and K(m) independent of the mesh (Solution/Lumped.lean identifies the
        definitions with Feec's).
    - source: "original (background: the lumped mass method of [Thomee2006], Ch. 15)"
      lean: "TimeStepping.maxNormRate"
      module: "Challenge"
      status: "proved"
      note: >-
        The rate. Where the mesh is translation invariant at the nodes, second-order nodal
        consistency |Delta u - L_h I_h u| <= n B h^2/12
        (Feec.FiniteElement.abs_lumpedLaplacianOn_sub_laplacian_le: the stencil of the lumped-mass
        Laplacian at a vertex, opposite edges of equal weight, the second moments 2 m(y) I from the
        energy identity of a simplex), substituted in TimeStepping.maxNormHeat: backward Euler
        O(tau + h^2) and every A-stable scheme O(h^2) plus the temporal term of the datum; the
        cross-polytope mesh with consistency error n (n - 1)/2 (Feec.FiniteElement.crossMesh,
        Feec.FiniteElement.abs_lumpedLaplacianOn_crossMesh_sub_laplacian).
    - source: "[Thomee2006], Ch. 15; [BrennerThomee1979]"
      lean: "TimeStepping.fdHeat"
      module: "Challenge"
      status: "proved"
      note: >-
        The witness. Finite differences for the heat equation: the discrete maximum principle on
        every grid (FiniteDifference.isSubMarkovGenerator_laplacian); on a cube, the lumped-mass
        Laplacian of a non-obtuse mesh of the cube, translation invariant at the interior nodes
        (Feec.Mesh.freudenthalMesh, Feec.FiniteElement.isNonobtuse_freudenthalMesh,
        Feec.FiniteElement.isTranslationInvariantAt_freudenthalMesh,
        Feec.Models.Cube.FiniteDifferenceHeat.fdLaplacian_eq), and for any A-stable scheme of
        order m and compatible initial data, started from I_h u(0), maximum-norm error
        k tau (n B h^2/12 + K n^(m+1) B' tau^m)
        (Feec.Models.Cube.FiniteDifferenceHeat.rational_compatible; the derivatives by
        iteratedFDeriv_apply_single_eq_iterate and FiniteDifference.iteratedFDeriv_apply_pairs).
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.backwardEuler_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: backward Euler is A-stable of order 1."
    - source: "[HairerWanner1996], §IV.3"
      lean: "TimeStepping.crankNicolson_isAStable"
      module: "Challenge"
      status: "proved"
      note: "Non-vacuity: Crank-Nicolson is A-stable, |r(infinity)| = 1, of order 2."
    - source: "[Pazy1983], §1.5"
      lean: "TimeStepping.hilleYosida"
      module: "Challenge"
      status: "proved"
      note: "A classical input: the Hille-Yosida estimates at complex z, re z > omega, complex Banach spaces; at z = 1/tau the resolvent that defines r(tau A) and is backward Euler. Feec.C0Semigroup.isResolvent_resolvent and Feec.C0Semigroup.norm_resolvent_pow_le."
    - source: "[VonNeumann1951]"
      lean: "TimeStepping.vonNeumann"
      module: "Challenge"
      status: "proved"
      note: "A classical input: rational functions of contractions with poles outside the closed unit disc, complex Hilbert spaces; behind contractive. ContinuousLinearMap.norm_aeval_mul_inverse_le."

acknowledgements: "Mathlib and the Lean FRO; the sources cited above."
