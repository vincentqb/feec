# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of time stepping for uniformly stable
# semigroup families on Banach spaces (`palomar/timestepping/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Time stepping for uniformly stable semigroup families on Banach spaces"
  description: >-
    To solve an evolution equation u' = A u numerically, a one-step method replaces the exact
    evolution e^(tau A) over a time step tau by a rational function r(tau A) of the step, for
    instance backward Euler r(z) = 1/(1 - z) or Crank-Nicolson r(z) = (2 + z)/(2 - z). The
    method is A-stable if |r(z)| <= 1 on the closed left half-plane. On a Hilbert space and for
    a dissipative A, von Neumann's inequality makes every A-stable scheme a contraction. Most
    discretizations of interest are not Hilbert-contractive, however: the heat equation in the
    maximum norm is the standard example. There, Brenner and Thomee (1979) showed that every
    A-stable scheme is nearly stable, ||r(tau A)^n|| <= M (1 + C sqrt(n)) for any semigroup with
    ||e^(tA)|| <= M on any Banach space, and that its error for smooth data is of the order of the
    scheme, with no sqrt(n) loss. Because the constants depend only on r, the bounds hold
    uniformly over whole families of discretizations, and stability plus consistency then gives
    convergence for every initial datum.
    In Lean 4 over Mathlib: (1) Brenner-Thomee's stability bound for every A-stable real rational
    r (|r(infinity)| = 1 included) and every bounded strongly continuous semigroup of a real or
    complex Banach space, with the resolvent (1 - tau A)^(-1) shown to exist and be unique and
    r(tau A) defined through it; (2) the sharp smooth-data error estimate
    ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x|| for r of order m
    (Gomilko-Tomilov 2024, Thm 1.1(ii)); (3) the Hille-Yosida resolvent estimates and backward
    Euler on Banach spaces with growth M e^(omega t), unconditionally stable with an explicit
    error bound; (4) the same stability and error bounds for bounded generators L with
    ||e^(tL)|| <= M, uniformly in L, with p(tau L) q(tau L)^(-1), plus the error along a
    trajectory with a space-discretization defect; (5) the convergence half of the Lax
    equivalence theorem for families of bounded generators on Banach spaces X_h read in a Banach space E: if the
    semidiscrete solutions converge to S(t) x uniformly on bounded time intervals, the fully
    discrete solutions of every power-bounded time scheme consistent of order p >= 1 converge to
    S(n tau_h) x, uniformly over the time levels, for every datum; backward Euler always
    qualifies; (6) von Neumann's inequality for polynomials of contractions and its rational
    form, and the contractivity ||r(tau A)^n|| <= (sup_y |r(iy)|)^n of A-stable schemes for
    m-dissipative, possibly unbounded, operators on real or complex Hilbert spaces; (7) the
    maximum norm: a sub-Markov generator on R^iota (nonnegative off-diagonal entries,
    nonpositive row sums) generates a positive contraction semigroup and has positive
    contractive backward Euler steps; the classical (2|iota| + 1)-point finite difference
    Laplacian on every finite grid of Z^iota is one; on a cube, against every classical solution
    of the heat equation with bounded fourth derivatives, every A-stable scheme of order m has
    the maximum-norm error ||I_h u(k tau) - r(tau Delta_h)^k v|| <= ||I_h u(0) - v|| +
    k tau n B h^2/12 + K k tau tau^m ||Delta_h^(m+1) v||, K independent of h, tau, the
    dimension and the solution; (8) backward Euler (order 1) and Crank-Nicolson (order 2,
    |r(infinity)| = 1) satisfy the hypotheses. The statements use Mathlib's polynomials, bounded
    operators, LinearPMap, Ring.inverse, NormedSpace.exp, Asymptotics.IsBigO, HasDerivWithinAt,
    fderiv and TendstoUniformlyOn, with twelve small definitions (TimeStepping.IsC0Semigroup,
    generatorGraph, resolventPoly, rationalOfResolvent, rationalApply, IsAStable, HasOrder,
    IsSubMarkovGenerator, fdLaplacian, gridNodes, gridInterp, partialDeriv); the proof is the library Feec of this
    repository (Feec.TimeStepping.StableFamily, Feec.TimeStepping.BanachFEEC,
    Feec.TimeStepping.TimeScheme, Feec.TimeStepping.RationalAStable,
    Feec.TimeStepping.RationalSharp, Feec.TimeStepping.RationalHilleYosida,
    Feec.TimeStepping.RationalHillePhillipsReal, Feec.TimeStepping.Rational,
    Feec.ForMathlib.InnerProductSpace.VonNeumann, Feec.ForMathlib.Analysis.SubMarkov,
    Feec.ForMathlib.Analysis.FiniteDifference, Feec.Models.Cube.MaxNormHeat,
    Feec.Models.Cube.FiniteDifferenceHeat and their imports).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

classification:
  arxiv: ["math.FA", "math.NA"]
  msc2020: ["47D06", "65J08", "65M12", "65M06", "65L20", "47A60"]

sources:
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979) 683-694, Thms 1 and 4"
    relationship: "formalizes"
    note: >-
      The stability bound ||r(tau A)^n|| <= C M sqrt(n) for bounded semigroups and A-stable
      r (Thm 1, as restated in Gomilko-Tomilov 2024, Thm 1.1(i)), formalized as M (1 + C sqrt(n)) with C
      depending on r only (TimeStepping.stable, TimeStepping.stable_of_bounded), on real or
      complex Banach spaces (real ones through the complexification) and for every A-stable r,
      |r(infinity)| = 1 included; the proof is the Hille-Phillips calculus r(tau A) = Phi(mu_r)
      and a Fourier bound on the total variation of mu_r^n (Plancherel and Carlson's inequality
      on a dyadic decomposition; whether this is the paper's proof was not checked). The
      smooth-data estimate ||r(tau A)^n x - S(n tau) x|| <= C M n tau tau^m ||A^(m+1) x|| for r
      of order m (TimeStepping.error, TimeStepping.error_of_bounded), as stated in
      Gomilko-Tomilov 2024, Thm 1.1(ii) with s = m + 1, which attributes it to Thms 1 and 4 and
      the remarks of this paper; the proof (translates of kernels in the Hille-Phillips calculus
      and an L^1 bound O(n) of the error kernel) is not the paper's. The convergence for every
      datum from stability and consistency (TimeStepping.converges), in the form for families of
      discretizations. The paper itself was not consulted beyond its abstract; Thms 1 and 4 were
      checked as restated in Gomilko-Tomilov 2024, Thm 1.1 (arXiv:2403.14411v2).
    author_endorsement: "not-contacted"
  - title: "Rational Approximation of Operator Semigroups via the B-Calculus"
    authors:
      - "Alexander Gomilko"
      - "Yuri Tomilov"
    id: "doi:10.1016/j.jfa.2024.110426"
    type: "article"
    location: "J. Funct. Anal. 287 (2024) 110426, Thm 1.1(ii) (arXiv:2403.14411)"
    relationship: "formalizes"
    note: >-
      Checked against arXiv:2403.14411v2. Thm 1.1 is the Banach-space statement of
      Brenner-Thomee (attributed there to [BT1979, Thms 1, 4 and Remarks]), written for -A the
      generator and r approximating e^(-z): (i) ||r^n(tA/n)|| <= C(r) M n^(1/2)
      (TimeStepping.stable); (ii), case s = q + 1 = m + 1, ||e^(-tA) x - r^n(tA/n) x|| <=
      C M t^(m+1)/n^m ||A^(m+1) x|| = C M n tau tau^m ||A^(m+1) x|| with tau = t/n
      (TimeStepping.error); the paper notes both are optimal in general (shift semigroups on
      L^1). The less smooth cases s < m + 1 and the paper's own Hilbert-space refinements via the
      B-calculus are not formalized.
    author_endorsement: "not-contacted"
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors:
      - "Amnon Pazy"
    id: "doi:10.1007/978-1-4612-5561-1"
    type: "book"
    location: "Appl. Math. Sci. 44, Springer (1983), §1.4, §1.5, §3.4"
    relationship: "formalizes"
    note: >-
      The Hille-Yosida resolvent estimates ||(z - A)^(-m)|| <= M/(re z - omega)^m (§1.5;
      TimeStepping.hilleYosida), the stability of backward Euler that follows
      (TimeStepping.backwardEuler), m-dissipative operators (§1.4; TimeStepping.contractive) and
      the approximation of semigroups by families of discrete spaces (§3.4, background for
      TimeStepping.converges). Section numbers recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Eine Spektraltheorie für allgemeine Operatoren eines unitären Raumes"
    authors:
      - "John von Neumann"
    id: "doi:10.1002/mana.3210040124"
    type: "article"
    location: "Math. Nachr. 4 (1951)"
    relationship: "formalizes"
    note: >-
      Von Neumann's inequality: the closed unit disc is a spectral set of every contraction of a
      Hilbert space (TimeStepping.vonNeumann for polynomials on every complex inner product
      space, TimeStepping.vonNeumann_rational for rational functions with poles outside the
      closed disc on Hilbert spaces). Paper not consulted; the statement as recalled in
      Hairer-Wanner, §IV.11.
    author_endorsement: "n/a"
  - title: "Solving Ordinary Differential Equations II"
    authors:
      - "Ernst Hairer"
      - "Gerhard Wanner"
    id: "doi:10.1007/978-3-642-05221-7"
    type: "book"
    location: "Springer Ser. Comput. Math. 14, 2nd ed. (1996), §IV.3 and §IV.11"
    relationship: "formalizes"
    note: >-
      §IV.3: stability functions, A-stability (|r(z)| <= 1 on the closed left half-plane,
      TimeStepping.IsAStable) and order (r(z) - e^z = O(z^(m+1)), TimeStepping.HasOrder).
      §IV.11 (von Neumann's theorem): ||r(hA)|| <= sup over re z <= 0 of |r(z)| for A with
      logarithmic norm mu(A) <= 0 in an inner product norm, stated there for matrices; here
      (TimeStepping.contractive) for m-dissipative, possibly unbounded, A on real or complex
      Hilbert spaces, with the supremum over the imaginary axis, for all powers. Section numbers
      and wording recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "Galerkin Finite Element Methods for Parabolic Problems"
    authors:
      - "Vidar Thomée"
    id: "doi:10.1007/3-540-33122-0"
    type: "book"
    location: "Springer Ser. Comput. Math. 25, 2nd ed. (2006), Ch. 7, 9, 15"
    relationship: "background"
    note: >-
      Ch. 7 (Single Step Fully Discrete Schemes for the Homogeneous Equation) and Ch. 9 (Single
      Step Methods and Rational Approximations of Semigroups): stability and consistency give
      convergence, the background of TimeStepping.converges and TimeStepping.error_of_bounded;
      Ch. 15 (The Method of Lumped Masses): the discrete maximum principle, background of
      TimeStepping.subMarkov, TimeStepping.isSubMarkovGenerator_fdLaplacian and
      TimeStepping.fdHeat. Chapter titles checked against Crossref; contents not consulted.
    author_endorsement: "not-contacted"
  - title: "Maximum principle and uniform convergence for the finite element method"
    authors:
      - "Philippe G. Ciarlet"
      - "Pierre-Arnaud Raviart"
    id: "doi:10.1016/0045-7825(73)90019-4"
    type: "article"
    location: "Comput. Methods Appl. Mech. Engrg. 2 (1973)"
    relationship: "background"
    note: >-
      The discrete maximum principle for non-obtuse meshes, of which the sub-Markov property is
      the matrix form (nonnegative off-diagonal entries, nonpositive row sums). The library proves
      that the lumped-mass P1 Laplacian of every non-obtuse mesh is a sub-Markov generator and
      derives maximum-norm heat estimates on every family of non-obtuse meshes
      (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat); that corollary is not compared, since its
      statement needs simplicial meshes and P1 spaces (see fidelity). Paper not consulted.
    author_endorsement: "not-contacted"
  - title: "A New Approach to Finite Element Simulations of General Relativity"
    authors:
      - "Vincent Quenneville-Bélair"
    id: "http://hdl.handle.net/11299/175309"
    type: "PhD thesis, University of Minnesota, 2015"
    location: "Ch. 4 (the semidiscrete Hodge wave and heat equations)"
    relationship: "background"
    note: >-
      The semidiscrete finite element exterior calculus discretizations whose time
      discretization motivated this entry; the statements compared here are not taken from the
      thesis. The formalization is by the thesis author.
    author_endorsement: "participated"

