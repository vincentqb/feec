    TimeStepping.backwardEuler_isAStable and TimeStepping.crankNicolson_isAStable.
    Proved in Feec but not compared: the maximum-norm heat estimates on every family of
    non-obtuse simplicial meshes for the lumped-mass P1 method
    (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat) and the equality of the finite difference
    Laplacian with the lumped-mass P1 Laplacian of the Freudenthal mesh of the cube
