status:
  scope: >-
    Formalized and compared (Challenge.lean), in the order of the story: the input
    TimeStepping.hilleYosida and its instance TimeStepping.backwardEuler; the headline on Banach
    spaces, TimeStepping.stable and TimeStepping.error; the Hilbert case,
    TimeStepping.vonNeumann and TimeStepping.contractive; families of space discretizations,
    TimeStepping.stable_of_bounded, TimeStepping.error_of_bounded, TimeStepping.converges and
    TimeStepping.converges_backwardEuler; the heat equation in the maximum norm,
    TimeStepping.subMarkov, TimeStepping.maxNormHeat,
    TimeStepping.isSubMarkovGenerator_fdLaplacian and TimeStepping.fdHeat; the hypotheses on r,
    TimeStepping.backwardEuler_isAStable and TimeStepping.crankNicolson_isAStable. The
    Whitney-element schemes of the Hodge wave equation on the cube that this entry compared until
    2026-11-18 (TimeStepping.inverse_estimate, TimeStepping.crankNicolson_cube,
    TimeStepping.leapfrog_cube, TimeStepping.rowSolution_nonvacuous) leave it: they are finite
    element results of the Hilbert case, and move to palomar/fem as its fully discrete wave
    theorem fem_wave, which subsumes them; they remain proved in Feec
    (Feec.FiniteElement.PolySeq.exists_mul_norm_d_le, Feec.Models.Cube.Inhomogeneous,
    Feec.Models.Cube.InhomogeneousError, Feec.Models.Cube.InhomogeneousLeapfrog,
    Feec.Numerics.PlaneWaveCubeError). Proved in Feec but not compared: von Neumann's inequality
    for polynomials on incomplete inner product spaces; the maximum-norm error of the lumped-mass
    finite element function on the simplices (Feec.FiniteElement.NonobtuseMeshes.maxNormHeat, its
    field fe, and on the cube Feec.Models.Cube.MaxNormHeat.maxNormHeat); backward Euler along C^2
    trajectories with no power of L_h; the Galerkin form of the lumped-mass Laplacian on the
    cube; the Neumann problem in the maximum norm (Feec.Models.Cube.MaxNormNeumann).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

