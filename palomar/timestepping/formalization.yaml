fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q) of real polynomials, not a reduced fraction.
    A-stability (TimeStepping.IsAStable) asks that q have no zero and |p/q| <= 1 on the closed
    left half-plane: for a non-reduced pair this also excludes removable zeros of q there.
    Order m (TimeStepping.HasOrder) is r(z) - e^z = O(z^(m+1)) at 0. Mathlib has no
    C_0-semigroups or functional calculus for unbounded operators: a strongly continuous
    semigroup is a family S with S(0) = 1, the semigroup law and continuous orbits on [0,
    infinity) (TimeStepping.IsC0Semigroup); its generator is given by its graph, (x, y) with
    right derivative y of t -> S(t) x at 0 (TimeStepping.generatorGraph); D(A^(m+1)) and
    A^(m+1) x are chains in that graph; r(tau A) is P(R) Q(R)^(-1) at the resolvent
    R = (1 - tau A)^(-1), P(R) = sum_(k <= N) p_k (R - 1)^k R^(N-k), N = deg q
    (TimeStepping.rationalOfResolvent; that is R^N p(1 - R^(-1)), and 1 - R^(-1) = tau A).
    Mathlib's NormedSpace.exp gives e^(tL) for bounded L, and r(tau L) = p(tau L) q(tau L)^(-1)
    (TimeStepping.rationalApply); the two agree for bounded L (proved in the bridge, not
    compared). Suprema in von Neumann's inequality and in TimeStepping.contractive are in
    [0, infinity] (the extended norm).
    (2) Constants. "C depending on r only" is "exists C, for all spaces": Lean quantifies the
    universe of the spaces outside the statement, so each universe has its own constant; the
    proof gives the same one in every universe. In TimeStepping.error, error_of_bounded and
    fdHeat the constant depends on r and m. In TimeStepping.fdHeat it is moreover independent of
    the dimension n, the cube, the grid and the solution.
    (3) Uniformly stable families. The uniformity of the stability and error bounds over a family
    of discretizations L_h is expressed by the order of quantifiers (the constants come before
    the operator) rather than by a structure of families; TimeStepping.converges states the
    families explicitly (spaces X_h, generators L_h, reading maps iota_h with left inverses pi_h,
    a filter on the index set). Its hypotheses: S is a strongly continuous semigroup with
    ||S(t)|| <= M and ||e^(t L_h)|| <= M with the same M (take the larger), ||iota_h||,
    ||pi_h|| <= C, the scheme power bounded on every horizon by Ms(T) and consistent of order
    p >= 1 with a constant K >= 0, and tau_h -> 0; the semidiscrete convergence is a hypothesis,
    so the theorem is the time-discretization half of a Lax equivalence theorem. For a rational
    A-stable scheme without uniform power bounds (only M (1 + C sqrt(n))) it does not apply, and
    convergence for every datum is not claimed (it fails in general on Banach spaces).
    (4) The maximum norm. TimeStepping.IsSubMarkovGenerator is stated for operators on R^iota
    with the maximum norm: L + c is positive for some c >= 0 and L 1 <= 0, the
    coordinate-free form of a matrix with nonnegative off-diagonal entries and nonpositive row
    sums. TimeStepping.fdHeat: the classical solution is stated by its hypotheses (u(t) of class
    C^4 on all of R^n, two-sided time derivative u_1 = Delta u at the points of the open cube and
    of [0, T] (so u is defined slightly beyond [0, T]; likewise the trajectories of
    TimeStepping.error_of_bounded are differentiable two-sidedly on [0, n tau]), u = 0 on the
    boundary, |d_i^4 u(t)| <= B on the closed cube), only for t in [0, T]; the discrete datum v is
    arbitrary (v = I_h u(0) gives the consistency error); the bound contains ||Delta_h^(m+1) v||,
    which is not bounded uniformly in h by the statement. The general corollary for the
    lumped-mass P1 method on every family of non-obtuse meshes, and the identity of the finite
    difference and lumped P1 Laplacians on the cube, are proved in Feec but not compared: their
    statements need simplicial meshes, non-obtuseness and P1 spaces, which would roughly double
    the challenge.
    TimeStepping.contractive assumes only that q has no zero in the closed left half-plane; its
    bound (sup_y |r(iy)|)^n is <= 1 exactly for A-stable r, and infinite when deg p > deg q (then
    rationalOfResolvent drops the coefficients of p above deg q, harmlessly).
    (5) Relation to palomar/vonneumann, which this entry replaces. Kept, restated with the new
    definitions: von Neumann's inequality and its rational form; the real-coefficient
    contractivity for m-dissipative A (now TimeStepping.contractive, without the unused
    hypothesis deg p <= deg q); the Hille-Yosida estimates; backward Euler on Banach spaces;
    Brenner-Thomee's stability bound (split from its sqrt(n)-lossy error bound, dropped as
    weaker than the sharp estimate) and the sharp error estimate (now for every R with
    R(x - tau A x) = x, the stability theorem giving its existence and uniqueness). Dropped: the
    complex-coefficient forms, the bounded-operator forms on Hilbert spaces (special cases of
    the m-dissipative and bounded-generator forms up to the identification of (1) for bounded
    A), the Cayley transform, the error bounds for m-dissipative and quasi-contractive Hilbert
    generators with the semigroup characterized by strong solutions (for m-dissipative A the
    contraction semigroup case of TimeStepping.error, M = 1, given the Lumer-Phillips
    semigroup), and the two conditional Banach error bounds with stability assumed. All remain
    proved in Feec.
    (6) Stronger than the sources. Real or complex Banach spaces throughout (real ones through
    the complexification); every A-stable r, including |r(infinity)| = 1; von Neumann's
    inequality for polynomials on incomplete inner product spaces; contractivity for unbounded
    m-dissipative A with the supremum over the imaginary axis only. Less smooth data
    (x in D(A^s), s < m + 1, Gomilko-Tomilov) are not covered.

