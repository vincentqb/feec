# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of A-stable rational time stepping for
# C_0-semigroups, applied to the heat equation in the maximum norm (`palomar/timestepping/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "A-stable rational time stepping for C_0-semigroups: Brenner-Thomee on Banach spaces against von Neumann on Hilbert spaces, applied to the heat equation in the maximum norm"
  description: >-
    To solve an evolution equation u' = A u numerically, a one-step method replaces the exact
    evolution e^(tau A) over a time step tau by a rational function r(tau A) of the step, for
    instance backward Euler r(z) = 1/(1 - z) or Crank-Nicolson r(z) = (2 + z)/(2 - z). The
    method is A-stable if |r(z)| <= 1 on the closed left half-plane. The entry is one story:
    whether the powers r(tau A)^n are stable and accurate with constants depending on r alone,
    so that the bounds hold uniformly over whole families of space discretizations with
    uniformly bounded semigroups, and where that is needed. The input is the Hille-Yosida
    theorem: the resolvent (1 - tau A)^(-1) exists, defines r(tau A), and makes backward Euler
    stable on every Banach space (power bounded for bounded semigroups). On a Hilbert space, von
    Neumann's inequality makes every A-stable scheme of an m-dissipative operator a contraction.
    On a Banach space the other A-stable schemes need not be power bounded, but Brenner and
    Thomee (1979) showed that ||r(tau A)^n|| <= M (1 + C sqrt(n)) for every bounded semigroup,
    ||e^(tA)|| <= M, and that the error for smooth data is of the order of the scheme with no
    sqrt(n) loss; this is the headline. The application needs a Banach space: the heat equation
    in the maximum norm. Sub-Markov generators generate contractions of the maximum norm
    (M = 1); the lumped-mass P1 Laplacian of every non-obtuse simplicial mesh is one (the
    discrete maximum principle of Ciarlet and Raviart), so every A-stable scheme is
    (1 + C sqrt(k))-stable in the maximum norm uniformly over all non-obtuse meshes in every
    dimension, with error bounds whose constants are independent of the mesh. On a cube the
    classical finite difference scheme is the lumped-mass method of the Freudenthal mesh, and
    from compatible initial data its maximum-norm error is O(h^2 + tau^m), uniformly in h.
    In Lean 4 over Mathlib: (1) the Hille-Yosida resolvent estimates on complex Banach spaces;
    (2) backward Euler on real or complex Banach spaces under growth M e^(omega t): stable,
    ||R^k|| <= M/(1 - omega tau)^k (power bounded for omega = 0), with an explicit first-order
    error; (3) Brenner-Thomee's stability bound for every A-stable real rational r
    (|r(infinity)| = 1 included) and every bounded strongly continuous semigroup of a real or
    complex Banach space, with the resolvent shown to exist and be unique and r(tau A) defined
    through it; (4) the sharp smooth-data error estimate
    ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x|| for r of order m
    (Gomilko-Tomilov 2024, Thm 1.1(ii)); (5) von Neumann's inequality for rational functions of
    contractions and the contractivity ||r(tau A)^n|| <= (sup_y |r(iy)|)^n of A-stable schemes
    for m-dissipative, possibly unbounded, operators on real or complex Hilbert spaces; (6) the
    bounds (3), (4) for bounded generators L with ||e^(tL)|| <= M, written with
    p(tau L) q(tau L)^(-1), the error also along every trajectory with a consistency defect;
    (7) the convergence half of the Lax equivalence theorem for families of bounded generators
    on Banach spaces X_h read in a Banach space E (power-bounded consistent schemes converge for
    every datum), and its two instances that need no hypothesis on the scheme: backward Euler on
    Banach spaces, and every A-stable scheme of order m >= 1 for dissipative generators on
    Hilbert spaces; (8) sub-Markov generators of R^iota generate positive contractions of the
    maximum norm, and their backward Euler steps are positive contractions; (9) the lumped-mass
    P1 Laplacian of every non-obtuse simplicial mesh, on any injective set of nodes, is a
    sub-Markov generator, backward Euler has nodal error
    ||I_h u(k tau) - (1 - tau L_h)^(-k) v|| <= ||I_h u(0) - v|| + k tau (3/2 tau B + eps) (B a
    bound of the second time derivative of u at the nodes, eps the nodal consistency error), and
    every A-stable scheme has ||r(tau L_h)^k|| <= 1 + C sqrt(k) and nodal error
    ||I_h u(k tau) - r(tau L_h)^k v|| <= ||I_h u(0) - v|| + k tau eps +
    K k tau tau^m ||L_h^(m+1) v||, with C, K depending on r and m only; (10) the finite
    difference Laplacian on every finite grid is a sub-Markov generator, on a cube b + (0, s)^n
    it is the lumped-mass Laplacian of a non-obtuse mesh of the cube, and for every A-stable r of
    order m, every classical solution u with bounded fourth derivatives whose initial value
    satisfies the compatibility conditions of order m (its odd 2s-periodic extension is of class
    C^(2m+2), with the words d^2_(i_1) ... d^2_(i_(m+1)) of its derivatives bounded by B'), the
    scheme started from the nodal interpolant has maximum-norm error
    ||I_h u(k tau) - r(tau Delta_h)^k I_h u(0)|| <= k tau (n B h^2/12 + K n^(m+1) B' tau^m);
    (11) backward Euler (order 1) and Crank-Nicolson (order 2, |r(infinity)| = 1) satisfy the
    hypotheses on r. The statements use Mathlib's polynomials, bounded operators, LinearPMap,
    Ring.inverse, NormedSpace.exp, Asymptotics.IsBigO, HasDerivWithinAt, fderiv, matrices,
    affine simplices, the Lebesgue measure and TendstoUniformlyOn; the definitions of partial
    derivatives and simplicial meshes are those of palomar/fem (shared blocks). The proof is the
    library Feec of this repository (Feec.TimeStepping.*,
    Feec.ForMathlib.InnerProductSpace.VonNeumann, Feec.ForMathlib.Analysis.SubMarkov,
    Feec.FiniteElement.LumpedMass, Feec.FiniteElement.LumpedLaplacian,
    Feec.FiniteElement.NonobtuseHeat, Feec.Models.Cube.MaxNormHeat,
    Feec.Models.Cube.FiniteDifferenceHeat, Feec.ForMathlib.Calculus.DifferenceLaplacian and
    their imports).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

