# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of von Neumann's inequality and A-stable
# time stepping (`palomar/vonneumann/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Von Neumann's inequality and the unconditional stability of A-stable time stepping"
  description: >-
    A contraction is an operator that never lengthens a vector. Von Neumann proved in 1951 that
    applying a polynomial to a contraction on a Hilbert space never produces an operator larger
    than the largest value the polynomial takes on the unit circle: the circle controls every
    contraction at once. Numerical time stepping is where this pays off. To solve u' = A u, a
    one-step method replaces the exact evolution e^(tau A) by a rational function r(tau A) of the
    step; if r is bounded by 1 on the imaginary axis (A-stability) and A is dissipative (energy
    never grows), then von Neumann's inequality, transported to the half-plane by the Cayley
    transform, shows r(tau A) is itself a contraction for every step size tau: the scheme cannot
    blow up however large the step.
    In Lean 4 over Mathlib, with suprema in [0, infinity]: (1) for a contraction T of a complex
    inner product space, not necessarily complete, and a complex polynomial p, ||p(T)|| <= sup
    over the unit circle of |p|; (2) on a complex Hilbert space, for polynomials p, q with q free
    of zeros in the closed unit disc, q(T) is invertible and ||p(T) q(T)^(-1)|| <= sup over the
    unit circle of |p/q|; (3) for a complex rational function r = p/q without poles in the closed
    left half-plane, every bounded dissipative operator A (re <Ax, x> <= 0) of a complex Hilbert
    space, every step tau >= 0 and every n, q(tau A) is invertible and
    ||r(tau A)^n|| <= (sup_y |r(iy)|)^n; (4) the same for m-dissipative, possibly unbounded, A,
    tau > 0 and r bounded at infinity (deg p <= deg q), with r(tau A) = P(S) Q(S)^(-1) through the resolvent S = (1 - tau A)^(-1), the unique
    bounded operator mapping x - tau A x to x, where P(s) = s^N p(1 - 1/s) and
    Q(s) = s^N q(1 - 1/s), N = deg q, are written out as sums; (5) the real forms of (3) and (4):
    real r on real or complex Hilbert spaces (Runge-Kutta stability functions on real spaces);
    (6) the Cayley transform of an m-dissipative A is the unique bounded operator mapping
    x - tau A x to x + tau A x, and a contraction; (7) the Brenner-Thomee error bound: for an
    A-stable r of order m (r(z) - e^z = O(z^(m+1)) at 0) there is K, depending on r only, with
    ||r(tau A)^n x - e^(n tau A) x|| <= K n tau tau^m ||A^(m+1) x|| for every bounded dissipative
    A, tau >= 0, n and x: complex r on every complex Hilbert space, real r on every real or
    complex Hilbert space; (8) the same Brenner-Thomee bound, with the same K, for every
    m-dissipative, possibly unbounded, A, tau > 0 and x in the domain of A^(m+1), with r(tau A)
    through the resolvent as in (4) and e^(t A) the contraction semigroup generated by A: the
    family S of bounded operators with S(0) = 1 whose orbits t -> S(t) x from x in the domain of
    A are the strong solutions of u' = A u, and the only ones; x in the domain of A^(m+1) is a
    chain x = u_0, ..., u_(m+1) = A^(m+1) x in the graph of A. So A-stable schemes are
    contractions, with all their powers, for every step size and every m-dissipative A, and
    converge at the order of the scheme for smooth data. The
    statements use Mathlib's polynomials (Polynomial.aeval), bounded operators, partially defined
    linear maps (LinearPMap), Ring.inverse, NormedSpace.exp, Asymptotics.IsBigO, HasDerivWithinAt
    and the extended norm only (one definition, VonNeumann.IsStrongSolution); the proof is the
    library Feec of this repository (Feec.ForMathlib.InnerProductSpace.VonNeumann,
    Feec.TimeStepping.Rational, Feec.TimeStepping.Theta, Feec.TimeStepping.RationalSemigroup,
    Feec.Semigroup.LumerPhillips).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

