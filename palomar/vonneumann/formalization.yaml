sources:
  - title: "Eine Spektraltheorie für allgemeine Operatoren eines unitären Raumes"
    authors:
      - "John von Neumann"
    id: "doi:10.1002/mana.3210040124"
    type: "article"
    location: "Math. Nachr. 4 (1951)"
    relationship: "formalizes"
    note: >-
      Von Neumann's inequality: the closed unit disc is a spectral set of every contraction of a
      Hilbert space (here: for polynomials on every complex inner product space, and for
      rational functions with poles outside the closed disc on Hilbert spaces). Paper not
      consulted; the statement as recalled in [HairerWanner1996], §IV.11.
    author_endorsement: "n/a"
  - title: "Solving Ordinary Differential Equations II"
    authors:
      - "Ernst Hairer"
      - "Gerhard Wanner"
    id: "doi:10.1007/978-3-642-05221-7"
    type: "book"
    location: "Springer Ser. Comput. Math. 14, 2nd ed. (1996), §IV.3 and §IV.11"
    relationship: "formalizes"
    note: >-
      §IV.3: stability functions and A-stability (|r(z)| <= 1 on the closed left half-plane).
      §IV.11 (Contractivity for linear problems, von Neumann's theorem): ||r(hA)|| <= sup over
      re z <= 0 of |r(z)| for a rational r bounded on re z <= 0 and A with logarithmic norm
      mu(A) <= 0 in an inner product norm (A dissipative), stated there for matrices; here on
      every complex Hilbert space, for bounded and for m-dissipative A, with the supremum over
      the imaginary axis only, and for real r also on real Hilbert spaces. Section numbers and
      the precise wording recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "The stability of rational approximations of analytic semigroups"
    authors:
      - "Michel Crouzeix"
      - "Stig Larsson"
      - "Sergei Piskarev"
      - "Vidar Thomée"
    id: "doi:10.1007/BF01990345"
    type: "article"
    location: "BIT 33 (1993)"
    relationship: "background"
    note: >-
      Stability of rational approximations r(tau A)^n of analytic semigroups in Banach spaces;
      context for the stability question, not the source of the statements formalized here.
    author_endorsement: "not-contacted"
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979)"
    relationship: "formalizes"
    note: >-
      Convergence of rational approximations: for r stable and of order m,
      ||r(tau A)^n x - e^(n tau A) x|| <= C t tau^m ||A^(m+1) x||, t = n tau, for generators A
      of semigroups with x in the domain of A^(m+1). Formalized for Hilbert spaces (complex r on
      complex spaces, real r on real or complex spaces), where A-stability gives the stability ||r(tau A)^n|| <= 1: for bounded dissipative A and for
      m-dissipative, possibly unbounded, A (the generators of contraction semigroups), with C
      uniform in A, the space, tau and n; for quasi-contractive semigroups on Hilbert spaces
      (A - omega m-dissipative), with the growth e^(kappa omega n tau) and omega tau <= c_0; and
      on Banach spaces with the stability of r(tau A)^n and the boundedness of the remainder
      rho(tau A) as hypotheses, and, for semigroups with ||S(t)|| <= M e^(omega t) and
      omega tau <= c, with the invertibility of Q(R) and the remainder bound derived from the
      Hille-Yosida resolvent estimates (stability still a hypothesis), and for backward Euler
      with no stability hypothesis; and for bounded semigroups ||S(t)|| <= M of real or complex
      Banach spaces (real ones through the complexification) and every A-stable r
      (|r(infinity)| = 1 included), through the Hille-Phillips functional calculus, with Q(R)
      invertible, ||rho(tau A)|| bounded, the stability
      ||r(tau A)^n|| <= M (1 + C sqrt(n)) (the paper's stability bound, ||r^n(hA)|| <= C n^(1/2)
      for t bounded and A-acceptable r, per its abstract, checked via Crossref) and an error bound
      that carries this sqrt(n) loss, all proved (VonNeumann.error_bound_banach_sqrt). That error
      bound is stability times consistency, of order m - 1/2 at fixed t = n tau. The paper's
      smooth-data estimate has no sqrt(n) loss: for A-stable r of order q and s = q + 1,
      ||e^(-tA) x - r^n(tA/n) x|| <= C M t^(q+1)/n^q ||A^(q+1) x|| (-A the generator), i.e.
      C M n tau tau^q ||A^(q+1) x||, as stated in Gomilko-Tomilov, J. Funct. Anal. 287 (2024)
      110426 (doi:10.1016/j.jfa.2024.110426; arXiv:2403.14411, Thm 1.1(ii), which attributes it to
      Thms 1 and 4 and the remarks of this paper). Formalized and compared, for every A-stable r,
      |r(infinity)| = 1 included, on real or complex Banach spaces (real ones through the
      complexification; VonNeumann.error_bound_banach_sharp):
      the Hille-Phillips calculus on translates of kernels (Phi(f(. - s)) = Phi(f) S(s)) gives
      r(tau A)^n - S(n tau) = tau^(m+1) Phi(k_n) A^(m+1) on D(A^(m+1)), with k_n = sum over j < n of
      delta_(n-1-j) mu^j h, h the consistency kernel (z^(m+1) h^ = r(z) - e^z), and ||k_n||_1 <= C n
      by Carlson's inequality and Plancherel on the geometric sum k_n(. + n)^ = e^(-z) h^ sum_j
      (e^(-z) r(z))^j. The proof is not the paper's (local Carlson estimates on a partition of
      unity, per Gomilko-Tomilov). Not formalized: the estimates for less smooth data, x in the
      domain of A^s with s < m + 1 (Gomilko-Tomilov Thm 1.1(ii): error t^s/n^(s m/(m+1)) for s in
      ((m+1)/2, m+1], t^s log(n+1)/n^(m/2) at s = (m+1)/2, t^s/n^(s-1/2) for s in
      (0, (m+1)/2); the case s = m + 1, t^(m+1)/n^m = n tau tau^m, is the one formalized). Paper
      itself not consulted beyond its abstract; the statement is as quoted by Gomilko-Tomilov.
    author_endorsement: "not-contacted"
  - title: "High-Accuracy Stable Difference Schemes for Well-Posed Initial-Value Problems"
    authors:
      - "Reuben Hersh"
      - "Tosio Kato"
    id: "doi:10.1137/0716050"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979)"
    relationship: "background"
    note: >-
      Per its abstract (checked via Crossref): for |r(z)| <= 1 on re z <= 0, order q and
      u(0) in D(A^(q+2)), the error of v(t + h) = r(hA) v(t) is O(h^q), with no sqrt(n) loss.
      Not formalized as such; the formalized smooth-data bound
      (VonNeumann.error_bound_banach_sharp, O(n tau tau^m) for x in D(A^(m+1))) asks for one
      power of A less and gives the same rate tau^m at fixed t = n tau; the sqrt(n)-lossy bound
      (VonNeumann.error_bound_banach_sqrt) is weaker. Paper not consulted beyond its abstract.
    author_endorsement: "not-contacted"
  - title: "Functional Analysis and Semi-Groups"
    authors:
      - "Einar Hille"
      - "Ralph S. Phillips"
    id: "doi:10.1090/coll/031"
    type: "book"
    location: "Amer. Math. Soc. Colloq. Publ. 31 (1957)"
    relationship: "background"
    note: >-
      The operational calculus of a semigroup, a + integral of g(t) S(t) dt for measures
      a delta_0 + g dt on [0, infinity), through which r(tau A) is bounded on Banach spaces.
      Formalized as an algebra homomorphism from the convolution algebra of the half-line
      (Feec.C0Semigroup.hillePhillips). Book not consulted, so no chapter is cited.
    author_endorsement: "not-contacted"
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors:
      - "Amnon Pazy"
    id: "doi:10.1007/978-1-4612-5561-1"
    type: "book"
    location: "Appl. Math. Sci. 44, Springer (1983), §1.3, §1.4, §1.5, §3.1"
    relationship: "background"
    note: >-
      m-dissipative operators (dissipative with mu - A onto for some mu > 0), the Lumer-Phillips
      semigroup they generate (§1.4) and the Yosida approximation (§1.3), through which the
      error bounds for m-dissipative A and complex r are proved; quasi-contractive semigroups e^(omega t)
      S(t) (§1.5) and bounded perturbations (§3.1).
    author_endorsement: "not-contacted"

  - title: "Galerkin Finite Element Methods for Parabolic Problems"
    authors:
      - "Vidar Thomée"
    id: "doi:10.1007/3-540-33122-0"
    type: "book"
    location: "Springer Ser. Comput. Math. 25, 2nd ed. (2006), Ch. 7, 9"
    relationship: "background"
    note: >-
      Single step methods: stability and consistency give convergence (the Lax-Richtmyer form
      used for the Banach-space bound, Ch. 9, "Single Step Methods and Rational Approximations
      of Semigroups"). Chapter titles checked against Crossref; contents not consulted.
    author_endorsement: "not-contacted"

