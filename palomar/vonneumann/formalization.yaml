sources:
  - title: "Eine Spektraltheorie für allgemeine Operatoren eines unitären Raumes"
    authors:
      - "John von Neumann"
    id: "doi:10.1002/mana.3210040124"
    type: "article"
    location: "Math. Nachr. 4 (1951)"
    relationship: "formalizes"
    note: >-
      Von Neumann's inequality: the closed unit disc is a spectral set of every contraction of a
      Hilbert space (here: for polynomials on every complex inner product space, and for
      rational functions with poles outside the closed disc on Hilbert spaces). Paper not
      consulted; the statement as recalled in [HairerWanner1996], §IV.11.
    author_endorsement: "n/a"
  - title: "Solving Ordinary Differential Equations II"
    authors:
      - "Ernst Hairer"
      - "Gerhard Wanner"
    id: "doi:10.1007/978-3-642-05221-7"
    type: "book"
    location: "Springer Ser. Comput. Math. 14, 2nd ed. (1996), §IV.3 and §IV.11"
    relationship: "formalizes"
    note: >-
      §IV.3: stability functions and A-stability (|r(z)| <= 1 on the closed left half-plane).
      §IV.11 (Contractivity for linear problems, von Neumann's theorem): ||r(hA)|| <= sup over
      re z <= 0 of |r(z)| for a rational r bounded on re z <= 0 and A with logarithmic norm
      mu(A) <= 0 in an inner product norm (A dissipative), stated there for matrices; here on
      every complex Hilbert space, for bounded and for m-dissipative A, with the supremum over
      the imaginary axis only, and for real r also on real Hilbert spaces. Section numbers and
      the precise wording recalled, not checked against the printed book.
    author_endorsement: "not-contacted"
  - title: "The stability of rational approximations of analytic semigroups"
    authors:
      - "Michel Crouzeix"
      - "Stig Larsson"
      - "Sergei Piskarev"
      - "Vidar Thomée"
    id: "doi:10.1007/BF01990345"
    type: "article"
    location: "BIT 33 (1993)"
    relationship: "background"
    note: >-
      Stability of rational approximations r(tau A)^n of analytic semigroups in Banach spaces;
      context for the stability question, not the source of the statements formalized here.
    author_endorsement: "not-contacted"
  - title: "On Rational Approximations of Semigroups"
    authors:
      - "Philip Brenner"
      - "Vidar Thomée"
    id: "doi:10.1137/0716051"
    type: "article"
    location: "SIAM J. Numer. Anal. 16 (1979)"
    relationship: "formalizes"
    note: >-
      Convergence of rational approximations: for r stable and of order m,
      ||r(tau A)^n x - e^(n tau A) x|| <= C t tau^m ||A^(m+1) x||, t = n tau, for generators A
      of semigroups with x in the domain of A^(m+1) (Thms 1 and 3 as recalled). Formalized for
      Hilbert spaces (complex r on complex spaces, real r on real or complex spaces), where
      A-stability gives the stability ||r(tau A)^n|| <= 1: for bounded dissipative A and for
      m-dissipative, possibly unbounded, A (the generators of contraction semigroups), with C
      uniform in A, the space, tau and n. Not compared: Banach spaces and generators of
      semigroups that are not contractive (where stability may only hold with a growing bound
      on ||r(tau A)^n||), and the estimates for less smooth data (x in the domain of a lower
      power of A, with a lower rate). Paper not consulted; statement, theorem numbers and scope
      as recalled.
    author_endorsement: "not-contacted"
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors:
      - "Amnon Pazy"
    id: "doi:10.1007/978-1-4612-5561-1"
    type: "book"
    location: "Appl. Math. Sci. 44, Springer (1983), §1.3, §1.4"
    relationship: "background"
    note: >-
      m-dissipative operators (dissipative with mu - A onto for some mu > 0), the Lumer-Phillips
      semigroup they generate (§1.4) and the Yosida approximation (§1.3), through which the
      error bounds for m-dissipative A are proved.
    author_endorsement: "not-contacted"

