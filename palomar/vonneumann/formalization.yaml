# formalization.yaml v0.4 for the Palomar submission of von Neumann's inequality and A-stable
# time stepping (`palomar/vonneumann/`).
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Von Neumann's inequality and the unconditional stability of A-stable time stepping"
  description: >-
    A contraction is an operator that never lengthens a vector. Von Neumann proved in 1951 that
    applying a polynomial to a contraction on a Hilbert space never produces an operator larger
    than the largest value the polynomial takes on the unit circle: the circle controls every
    contraction at once. Numerical time stepping is where this pays off. To solve u' = A u, a
    one-step method replaces the exact evolution e^(tau A) by a rational function r(tau A) of the
    step; if r is bounded by 1 on the left half-plane (A-stability) and A is dissipative (energy
    never grows), then von Neumann's inequality, transported to the half-plane by the Cayley
    transform, shows r(tau A) is itself a contraction for every step size tau: the scheme cannot
    blow up however large the step. The formalization proves the polynomial inequality without
    completeness, the rational form on Hilbert spaces, and the half-plane form for real and
    complex Hilbert spaces through complexification.
    A Lean 4 formalization of von Neumann's inequality and of its consequence for one-step time
    discretizations. (1) For a contraction T of a complex inner product space, not necessarily
    complete, and a complex polynomial p, ||p(T)|| <= sup over the unit circle of |p|.
    (2) On a complex Hilbert space, for polynomials p, q with q free of zeros in the closed unit
    disc, q(T) is invertible and ||p(T) q(T)^(-1)|| <= sup over the unit circle of |p/q|.
    (3) For a real rational function r = p/q without poles in the closed left half-plane and
    bounded there by C, every bounded dissipative operator A (re <Ax, x> <= 0) of a real or
    complex Hilbert space and every step tau >= 0: q(tau A) is invertible and
    ||r(tau A)|| <= C. For C = 1 (A-stability) the one-step scheme u -> r(tau A) u is a
    contraction for every step size: A-stable schemes are unconditionally stable. The statements
    use Mathlib's polynomials (Polynomial.aeval), bounded operators and Ring.inverse only; the
    proof is the library Feec of this repository (Feec.ForMathlib.InnerProductSpace.VonNeumann,
    Feec.TimeStepping.Rational).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

