fidelity:
  divergences: >-
    (1) The supremum is expressed by a bound C: if |p| <= C on the unit circle then
    ||p(T)|| <= C (equivalent to ||p(T)|| <= sup; by the maximum principle the circle and the
    closed disc give the same supremum, and the circle is the weaker hypothesis).
    (2) Von Neumann's inequality in its classical generality is for Hilbert spaces; the
    polynomial form here holds on every complex inner product space, and the rational form
    needs completeness (for the invertibility of q(T)).
    (3) The half-plane statement is for bounded dissipative A. For m-dissipative,
    possibly unbounded, A the challenge states the Cayley contraction (4) instead of a bound on
    r(tau A): Mathlib has no functional calculus r(tau A) for unbounded A, and defining it in the
    challenge (as r~(C_tau) with r~(w) = r((w - 1)/(w + 1)), Feec.TimeStepping.RationalScheme.step)
    would add custom definitions; the bound then follows from (2) applied to C_tau and r~ (over
    the complex numbers; over the reals through complexification), proved in Feec
    (Feec.TimeStepping.RationalScheme.norm_step_le) but not compared. The hypothesis of (3) is
    the bound on the imaginary axis, weaker than on the closed left half-plane (equivalent to it
    by the maximum principle, given no poles there), so (3) is the stronger form.
    (4) The rational function in the dissipative form has real coefficients (as stability
    functions of Runge-Kutta methods do), so that it acts over 𝕜 = ℝ as well as ℂ; complex
    coefficients are not covered by (3). r is the pair (p, q), not a reduced fraction; its
    poles are the zeros of q, assumed outside the closed left half-plane. No consistency with
    e^z is assumed: (3) holds for every such r, schemes or not.
    (5) Unconditional stability is the bound ||r(tau A)|| <= 1; the bound for powers,
    ||r(tau A)^n|| <= 1, follows by submultiplicativity and is not stated.

