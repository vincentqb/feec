fidelity:
  divergences: >-
    (1) The supremum is expressed by a bound C: if |p| <= C on the unit circle then
    ||p(T)|| <= C (equivalent to ||p(T)|| <= sup; by the maximum principle the circle and the
    closed disc give the same supremum, and the circle is the weaker hypothesis).
    (2) Von Neumann's inequality in its classical generality is for Hilbert spaces; the
    polynomial form here holds on every complex inner product space, and the rational form
    needs completeness (for the invertibility of q(T)).
    (3) The dissipative form is stated for bounded dissipative A; the m-dissipative, unbounded
    case is proved in Feec (Feec.TimeStepping.RationalScheme.norm_step_le) but needs the
    functional calculus r(tau A) through the Cayley transform, which Mathlib does not provide,
    and is not in the statement.
    (4) The rational function in the dissipative form has real coefficients (as stability
    functions of Runge-Kutta methods do), so that it acts over 𝕜 = ℝ as well as ℂ; complex
    coefficients are not covered by (3). r is the pair (p, q), not a reduced fraction; its
    poles are the zeros of q, assumed outside the closed left half-plane.
    (5) Unconditional stability is the bound ||r(tau A)|| <= 1; the bound for powers,
    ||r(tau A)^n|| <= 1, follows by submultiplicativity and is not stated.

