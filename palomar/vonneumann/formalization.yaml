fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q), not a reduced fraction; its poles are the zeros
    of q, assumed outside the closed left half-plane (outside the closed unit disc in the
    rational form of von Neumann's inequality). The suprema are taken in [0, infinity] with the
    extended norm, so they are the suprema of the sources, infinite when r is unbounded on the
    imaginary axis (then the bounds are vacuous). For m-dissipative A, r(tau A) is defined in the
    statement as P(S) Q(S)^(-1) at the resolvent S = (1 - tau A)^(-1), with
    P(S) = sum_(k <= N) p_k (S - 1)^k S^(N-k) (that is s^N p(1 - 1/s) at s = S, and
    1 - 1/s = tau A there); Mathlib has no functional calculus for unbounded operators. That this
    is p(tau A) q(tau A)^(-1) for bounded A is proved in Feec, not compared. The resolvent at
    1/tau, with mu - A onto for one mu > 0, is the m-dissipativity of Pazy, §1.4.
    (2) Stronger than the sources. The polynomial form of von Neumann's inequality holds on
    every complex inner product space; the rational form needs completeness, as in the source
    (q(T) need not be invertible on an incomplete space: the right shift on finitely supported
    sequences and q = 2 - X). The half-plane forms take the supremum over the imaginary axis,
    not over the closed left half-plane (Hairer-Wanner); the two agree by the maximum principle
    given no poles there, and the axis is the smaller set. They hold on every Hilbert space and
    for unbounded m-dissipative A, not only for matrices; for real r also on real Hilbert
    spaces; and they bound all powers r(tau A)^n.
    (3) Brenner-Thomee: the error bound is stated for bounded dissipative A only, with the
    constant uniform in A, the space, tau and n. For an unbounded generator A, e^(t A) is a
    C_0-semigroup, absent from Mathlib, and x in D(A^(m+1)) needs powers of unbounded
    operators; stating it would need a custom semigroup definition in the challenge, and
    proving it the consistency estimate for unbounded A through the resolvent calculus, which
    Feec does not have (estimated 600 to 1000 lines). The error bound is stated for real
    coefficients only (all Runge-Kutta and Pade stability functions are real); the complex form
    would duplicate the consistency theory of Feec.TimeStepping.RationalScheme (remainder
    scheme, consistency, Lax-type error sum) for complex coefficients, estimated 200 lines, for
    no scheme in use. Order m is the asymptotic condition r(z) - e^z = O(z^(m+1)) at 0 of
    Hairer-Wanner, §IV.3; stability is A-stability, the Hilbert-space form of the stability
    hypothesis ||r(tau A)^n|| <= C of Brenner-Thomee.

