    bounded one for the Yosida approximations A_k, whose powers satisfy
    ||A_k^(m+1) x|| <= ||A^(m+1) x||, in the limit k -> infinity: exp(t A_k) -> S(t) strongly
    (the construction of S) and r(tau A_k) -> r(tau A) strongly (resolvent convergence, and
    inverses bounded uniformly by von Neumann's inequality). The quasi-contractive and Banach
    bounds come from Feec.TimeStepping.RationalScheme.exists_norm_step_pow_sub_le and
    Feec.TimeStepping.RationalScheme.norm_resolventStep_pow_sub_S_le: Lax-Richtmyer
    (Feec.C0Semigroup.norm_pow_apply_sub_S_le) with consistency from Taylor's formula for the
    semigroup and the expansion r(tau A) x = T_m(tau A) x + (tau A)^(m+1) rho(tau A) x on
    D(A^(m+1)) in the resolvent form; for A - omega m-dissipative, r(tau A) = r_c(tau(A - omega))
    for the shifted scheme r_c(z) = r(z + c), c = omega tau, so von Neumann's inequality gives
    ||r(tau A)|| <= sup_y |r(iy + c)| <= 1 + K_1 c and bounds the remainder. On Banach spaces
    (Feec.Semigroup.HilleYosida) the resolvent of the generator at z, re z > omega, is the
    Laplace transform, and ||(z - A)^(-m)|| <= M/(re z - omega)^m comes from the weighted bound
    ||S(s) int_0^inf e^(-zt) S(t) w dt|| <= (K/(re z - omega)) e^(omega s) whenever
    ||S(s) w|| <= K e^(omega s), iterated; complex z by the complex rescaling e^(-zt) S(t). Q(R)
    factors over the roots zeta of q into (1 - zeta) R - 1 with the inverse
    -1 - (1 - zeta)(zeta - tau A)^(-1), bounded by 1 + |1 - zeta| M/(re zeta - omega tau);
    for real spaces on the complexification with the Taylor norm (an operator is invertible
    when its complexification is, Feec.ForMathlib.Analysis.Complexification). The
    remainder bound is ||P_rho(R)|| ||Q(R)^(-1)|| with ||R|| <= M/(1 - omega tau)
    (Feec.TimeStepping.RationalScheme.exists_norm_remainder_resolventStep_le).


fidelity:
  divergences: >-
    (1) Encodings. r = p/q is the pair (p, q), not a reduced fraction; its poles are the zeros
    of q, assumed outside the closed left half-plane (outside the closed unit disc in the
    rational form of von Neumann's inequality). The suprema are taken in [0, infinity] with the
    extended norm, so they are the suprema of the sources, infinite when r is unbounded on the
    imaginary axis (then the bounds are vacuous). For m-dissipative A, r(tau A) is defined in the
    statement as P(S) Q(S)^(-1) at the resolvent S = (1 - tau A)^(-1), with
    P(S) = sum_(k <= N) p_k (S - 1)^k S^(N-k), N = deg q (that is s^N p(1 - 1/s) at s = S, and
    1 - 1/s = tau A there); Mathlib has no functional calculus for unbounded operators. These
    statements assume deg p <= deg q: then P(S) carries every coefficient of p, and r(tau A) is
    bounded, as it must be for unbounded A (deg p > deg q makes r unbounded on the axis, so this
    loses only vacuous cases). That P(S) Q(S)^(-1) is p(tau A) q(tau A)^(-1) for bounded A is
    proved in Feec, not compared. In the error bounds, "K depending on r only" is stated as
    "exists K, for all spaces E": Lean quantifies the universe of E outside the statement, so
    each universe has its own K; the proof gives the same K in every universe,
    sup_y |rho(iy)/q(iy)| + 1/(m+1)! for the remainder rho = (p - q T_m)/X^(m+1). The resolvent at
    1/tau, with mu - A onto for one mu > 0, is the m-dissipativity of Pazy, §1.4.
    (2) Stronger than the sources. The polynomial form of von Neumann's inequality holds on
    every complex inner product space; the rational form needs completeness, as in the source
    (q(T) need not be invertible on an incomplete space: the right shift on finitely supported
    sequences and q = 2 - X). The half-plane forms take the supremum over the imaginary axis,
    not over the closed left half-plane (Hairer-Wanner); the two agree by the maximum principle
    given no poles there, and the axis is the smaller set. They hold on every Hilbert space and
    for unbounded m-dissipative A, not only for matrices; for real r also on real Hilbert
    spaces; and they bound all powers r(tau A)^n.
    (3) Brenner-Thomee: the error bound is stated for bounded dissipative A
    (VonNeumann.error_bound, error_bound_real) and for m-dissipative A
    (VonNeumann.error_bound_mdissipative, error_bound_mdissipative_real), with the constant
    uniform in A, the space, tau and n. Mathlib has no C_0-semigroups: for m-dissipative A,
    e^(t A) is the existential family S characterized by S(0) = 1 and its orbits from D(A),
    the strong solutions of u' = A u (existence and uniqueness both stated, so S(t) is
    determined on D(A), which contains every x of the bound); D(A^(m+1)) and A^(m+1) x are
    stated through chains in the graph of A; the step is tau > 0 (r(tau A) through the
    resolvent), and tau = 0 is trivial. Quasi-contractive semigroups
    (VonNeumann.error_bound_quasi_real, real r only): A - omega m-dissipative is stated as
    re <A x, x> <= omega ||x||^2 with mu - A onto for some mu > omega; the semigroup S is stated
    with ||S(t)|| <= e^(omega t) and characterized by its strong solutions as above; c_0, K,
    kappa depend on r only (per universe, as K above). Banach spaces
    (VonNeumann.error_bound_banach_real, real r): the semigroup is given (S(0) = 1, the semigroup
    law and strong continuity for t >= 0) and its generator is stated through right
    derivatives at 0; the resolvent is any injective R with R(x - tau A x) = x on D(A) (unique
    when it exists); stability ||r(tau A)^k|| <= M_s, the remainder bound ||rho(tau A)|| <= K_0
    and invertibility of Q(R) are hypotheses, since off Hilbert spaces von Neumann's inequality
    fails. For A-stable r the last two follow from resolvent estimates alone (Q(R) is a product
    of factors R (tau A - zeta) over the poles zeta of r, and the partial fractions of rho bound
    ||rho(tau A)|| through the Hille-Yosida bounds ||(lambda - A)^(-m)|| <= M/(re lambda -
    omega)^m), formalized below; in VonNeumann.error_bound_banach_real and
    VonNeumann.error_bound_banach_real_hille_yosida stability is a genuine hypothesis, and
    Brenner-Thomee's sufficient condition ||r(tau A)^n|| <= C sqrt(n) for bounded semigroups
    (through the Hille-Phillips functional calculus) is proved in
    VonNeumann.error_bound_banach_sqrt (below) for real or complex spaces and every A-stable r.
    Hille-Yosida
    (VonNeumann.resolvent_estimates_banach, complex spaces;
    VonNeumann.error_bound_backward_euler_banach and
    VonNeumann.error_bound_banach_real_hille_yosida, real r, real or complex spaces): the
    semigroup is given as above with the growth bound ||S(t)|| <= M e^(omega t) for all t >= 0,
    omega >= 0 in the error bounds (every strongly continuous semigroup has one,
    Feec.C0Semigroup.exists_norm_S_le_exp, not compared); R is any R with R(x - tau A x) = x on
    D(A) (it is then the resolvent and injective, Feec.TimeStepping.eq_inv_smul_resolvent_of_generator).
    In VonNeumann.error_bound_banach_real_hille_yosida the invertibility of Q(R) and
    ||rho(tau A)|| <= K_0 are conclusions, for omega tau <= c, with c and K_0 existential (per
    universe, as K above; K_0 depends on M). It does not supersede
    VonNeumann.error_bound_banach_real, which holds for every tau >= 0 with Q(R) invertible,
    any K_0 >= ||rho(tau A)|| (e.g. its exact value) and ||S(t)|| <= M only on [0, n tau]; both
    are compared. The explicit bounds, ||Q(R)^(-1)|| <= |q_N|^(-1) prod_zeta (1 + |1 - zeta|
    M/(re zeta - omega tau)) over the roots zeta of q, are in Feec
    (Feec.TimeStepping.isUnit_resolventEval_of_generator,
    Feec.TimeStepping.RationalScheme.norm_resolventStep_le_of_generator), not compared. For
    backward Euler the stability follows from the Hille-Yosida estimates, so its error bound has
    no stability hypothesis. Bounded semigroups of Banach spaces over K = R or C
    (VonNeumann.error_bound_banach_sqrt; generalized from complex to real or complex spaces and
    to every A-stable r; neither form reviewed by the author): the three hypotheses are proved
    for every A-stable r, |r(infinity)| = 1 included: the resolvent is the unique R with
    R(x - tau A x) = x on D(A) (existence and uniqueness stated), Q(R) is invertible,
    ||r(tau A)^n|| <= M (1 + C sqrt(n)) and the error is K M^3 (1 + C sqrt(n)) n tau tau^m
    ||A^(m+1) x||, with C, K depending on r only (per universe); the proof is the Hille-Phillips
    calculus r(tau A) = Phi(mu_r) and a Fourier bound on the total variation of mu_r^n
    (Plancherel and Carlson's inequality, applied to the pieces of a dyadic decomposition of
    mu_r^n by the exponential measures c e^(-ct) dt, c = 2^j, so that |r(infinity)| = 1 is
    covered: Feec.HalfLineAlgebra.variation_pow_le, Feec.TimeStepping.RationalScheme.exists_decay;
    whether this is the paper's proof was not checked), on real spaces applied to the
    complexification E_C = E x E with the Taylor norm (||T_C|| = ||T||, R_C the resolvent of the
    complexified semigroup, r(tau A)_C = r(tau A_C) since r has real coefficients;
    Feec.TimeStepping.RationalHillePhillipsReal).
    This error bound keeps the sqrt(n) loss of the stability bound (order m - 1/2 at fixed n tau).
    Without that loss (VonNeumann.error_bound_banach_sharp; generalized from complex to real or
    complex Banach spaces, neither form reviewed by the author): for every A-stable r of order m,
    |r(infinity)| = 1 included, on Banach spaces over K = R or C, the resolvent and Q(R) as above
    and ||r(tau A)^n x - S(n tau) x|| <= K M n tau tau^m ||A^(m+1) x||, K depending on r and m only
    (per universe); the stability bound is not needed (the error operator is the calculus of one
    kernel, of L^1 norm O(n)); on real spaces applied to x + i 0 in the complexification, as
    above.
    Less smooth data (x in D(A^s), s < m + 1) are not covered.
    Order m is the asymptotic condition r(z) - e^z = O(z^(m+1)) at 0 of
    Hairer-Wanner, §IV.3; stability is A-stability, the Hilbert-space form of the stability
    hypothesis ||r(tau A)^n|| <= C of Brenner-Thomee.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The author reviewed the Challenge statements except VonNeumann.IsStrongSolution,
    VonNeumann.error_bound_mdissipative, VonNeumann.error_bound_mdissipative_real,
    VonNeumann.error_bound_quasi_real, VonNeumann.error_bound_banach_real,
    VonNeumann.resolvent_estimates_banach, VonNeumann.error_bound_backward_euler_banach,
    VonNeumann.error_bound_banach_real_hille_yosida, VonNeumann.error_bound_banach_sqrt and
    VonNeumann.error_bound_banach_sharp, added after that review and not yet reviewed by the
    author (VonNeumann.error_bound_banach_sqrt was since generalized to every A-stable r, dropping
    |r(infinity)| < 1, and from complex to real or complex Banach spaces, and
    VonNeumann.error_bound_banach_sharp from complex to real or complex Banach spaces; the changed
    statements are also not yet reviewed).
    Every merge of the library was gated by a full build (zero warnings), an axiom audit
    (propext, Classical.choice, Quot.sound only) and an independent AI review. No external
    mathematical review.

