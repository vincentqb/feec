# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of the finite element methods for the
# Hodge wave and Maxwell equations (`palomar/waves/`).
version: "v0.4"

project:
  name: "Finite element methods for the Hodge wave and Maxwell equations"
  description: >-
    Do finite element methods for the Hodge wave equation U' = (d - d*) U converge, fully
    discrete (under what time-step condition?) and, for Maxwell's equations, semi-discrete?
    Stated over Mathlib, on the finite element de Rham complexes of the Palomar entry
    palomar/fem (same notions, through the shared blocks of palomar/shared/vocabulary.lean.txt):
    fully discrete, Crank-Nicolson converges for every time step, leapfrog under the CFL
    condition 2 C_0 Delta t <= c h_N, c < 1, with C_0 the constant of the inverse estimate, and
    both errors (for leapfrog, times 1 - c) are at most the starting errors plus
    C (1 + T) L (h_N^(s+1) + Delta t^2), uniformly in the mesh; a standing wave on the cube meets the hypotheses on the exact
    solution. On the cube, with inhomogeneous Dirichlet data (the boundary degrees of freedom of
    the exact solution, the runs of the author's thesis, Ch. 7), both Whitney schemes converge at
    O(h + Delta t^2). Semi-discrete: Maxwell's equations in vector proxies are the Hodge wave
    equation of the window [0, 3) in R^3, and their Galerkin solutions converge. Seven compared
    theorems.
    FEEC.inverse_estimate: for every shape-regular quasi-uniform family of meshes of an open Omega
    whose open simplices lie in Omega, every admissible sequence and every degree k, the forms of
    S_k(M_N) lie in H Lambda^k(Omega) and h_N ||dv|| <= C ||v||, C independent of N; so the
    discrete wave operator has norm at most 2 C / h_N.
    FEEC.fem_wave (the headline: the fully discrete Hodge wave equation, homogeneous boundary
    conditions): let Omega in R^n be a bounded open domain star-shaped with respect to a ball
    (polyhedral, its closure being meshed),
    M_N shape-regular quasi-uniform simplicial meshes of Omega with h_N -> 0 and S an admissible
    sequence (the setting of palomar/fem), H Lambda(Omega) (natural boundary conditions) or
    H°Lambda(Omega) (vanishing traces) is a Hilbert complex H, and on every window [a, a + m) of
    degrees, with the finite element forms X_h of the window: some C_0 has
    h_N ||d x|| <= C_0 ||x|| on X_h (the inverse estimate); and for every s such that S
    reproduces P_s Lambda in the degrees a, ..., a + m (PolyOrderAt in every degree of the
    window), some C bounds, for every solution U of the Hodge wave equation U' = (d - d*) U on
    [0, T] (in the domain of the wave operator: the boundary conditions of the complex), C^3 in
    time with ||U'''|| <= L on [0, T], whose values and time increments are C^(s+2) forms with
    the bounds L and L |t' - t| (their (s+1)-st derivatives and those of their exterior
    derivatives; for H°Lambda vanishing outside Omega), every N, time step Delta t > 0 and
    K Delta t <= T:
    Crank-Nicolson iterates u_k in X_h (every time step, from any u_0 in X_h) have
    ||u_K - U(K Delta t)|| <= ||u_0 - U(0)|| + C (1 + T) L (h_N^(s+1) + Delta t^2), and leapfrog
    iterates (under the CFL condition 2 C_0 Delta t <= c h_N, c < 1, for every constant C_0 >= 0
    of the inverse estimate, from any u_0, u_1 in X_h) have
    (1 - c) ||u_K - U(K Delta t)|| <= ||u_0 - U(0)|| + ||u_1 - U(Delta t)|| +
    C (1 + T) L (h_N^(s+1) + Delta t^2); C is independent of N, Delta t, T, L, U, c, C_0 and the
    starting values. For U = 0 these are the stability bounds ||u_K|| <= ||u_0|| and
    (1 - c) ||u_K|| <= ||u_0|| + ||u_1||.
    FEEC.fem_wave_nonvacuous: the cube (0, 1/2)^n is star-shaped with respect to a ball and has
    a shape-regular quasi-uniform mesh family, and on the window [0, 2) of its H Lambda the
    standing wave U(t) = (cos 2 pi t cos 2 pi x_0, -sin 2 pi t sin 2 pi x_0 dx_0) (a solution of
    sigma' = -d* E, E' = d sigma with E . n = 0 on the boundary) meets the hypotheses of
    FEEC.fem_wave on the exact solution at all times, for every s, with some bound L, and is
    nonzero and moving (U(t) != 0, U'(t) != 0) at every time.
    FEEC.crankNicolson_cube and FEEC.leapfrog_cube, the runs of the thesis' Ch. 7 with the
    boundary degrees of freedom of the exact solution (inhomogeneous data, which FEEC.fem_wave
    does not cover): on the Freudenthal meshes of Q = (0, 1/2)^3, for the Hilbert complex
    H Lambda(Q), the Whitney spaces V_h (the sequence topSeq: P_1 Lambda^0, P_1^- Lambda^1,
    P_1^- Lambda^2) of the window [0, 3) with test space the fields of vanishing boundary traces:
    continuous form fields have
    exactly one Whitney interpolant on every window [0, m) (face integrals as degrees of
    freedom); the Crank-Nicolson and leapfrog steps with the boundary degrees of freedom of any
    g in V_h are uniquely solvable for every time step; V_h^1 with vanishing traces is nonzero; some C_0
    has h_N ||d v|| <= C_0 ||v|| on V_h; for every classical solution U of the Hodge wave
    equation on R x R^3 with bound L on [0, T] x cl Q (RowSolution: C^2 in space and C^3 in time
    on R x R^3, with bounds on [0, T] x cl Q of the first derivatives of U and dU, Lipschitz in
    time, and of the third time derivative), the
    Crank-Nicolson iterates from Pi_h U(0) with the boundary degrees of freedom of Pi_h U(t_n)
    have ||u_M - U(t_M)|| <= C L (1 + T) (h_N + Delta t^2), and, for every constant C_0 >= 0 of
    the inverse estimate under 2 C_0 Delta t <= c h_N, c < 1, leapfrog iterates with vanishing
    boundary data from u_0, u_1 have sqrt(1 - c) ||u_(m+1)|| <= sqrt((1 + c)(||u_0||^2 +
    ||u_1||^2)) and the leapfrog iterates from Pi_h U(0), Pi_h U(Delta t) with the boundary
    degrees of freedom of Pi_h U(t_n) have ||u_M - U(t_M)|| <= C L (1 + T) (h_N + Delta t^2) /
    (1 - c), C independent of C_0, N, Delta t, c, T, L, U. FEEC.rowSolution_nonvacuous: for every
    T a row solution (row 0 of the thesis' plane wave) has, at every time, a point of Q where the
    electric field and its time derivative are nonzero.
    FEEC.maxwell: the window [0, 3) of H Lambda(Omega) for n = 3 read in vector proxies, on the
    domains and meshes of FEEC.fem_wave: the vector proxies V_N^0, V_N^1, V_N^2 of S_0(M_N),
    S_1(M_N), S_2(M_N) (scalar fields, vector fields v_j = omega_j, vector fields
    (omega_12, -omega_02, omega_01); for S = P_1^- the Lagrange, Nedelec edge and Raviart-Thomas
    face elements) lie in the domains of the weak gradient, curl and divergence (each defined as
    the adjoint of the closure of its formal adjoint on test fields), and they discretize
    Maxwell's equations sigma' = -grad* E, E' = grad sigma - curl* B, B' = curl E (the Hodge wave
    equation of the window H^1 -> H(curl) -> L^2(Omega; R^3), the electric field E in degree 1;
    with H = -B and sigma = 0, E' = curl H, H' = -curl E with perfect-magnetic-conductor walls)
    in space only: every datum in V_N^0 x V_N^1 x V_N^2 has a unique semi-discrete Galerkin
    solution on [0, T] (continuous in time), and for data in the domain of the Maxwell operator
    and every T there is a unique strong solution on [0, T], it conserves the energy, satisfies
    the Gauss laws sigma = 0, grad* E = 0, div B = 0
    for all t if the data do, and is the uniform limit on [0, T] of every family of Galerkin
    solutions in V_N^0 x V_N^1 x V_N^2 whose initial data converge to the data; such families
    exist (no rate; the fully discrete schemes of this window, in forms, are those of
    FEEC.fem_wave for n = 3).
    The proof is the library Feec of this repository (Feec.FiniteElement,
    Feec.FiniteElement.GlobalInverseEstimate, Feec.Models.StarShaped, Feec.Models.Cube.Inhomogeneous,
    Feec.Models.Cube.InhomogeneousError, Feec.Models.Cube.InhomogeneousLeapfrog,
    Feec.Numerics.PlaneWaveCubeError, Feec.Instances.Maxwell); FEEC.fem_wave is proved from the
    uniform stability of palomar/fem (FEEC.fem), restated and proved in the solution, and from
    FEEC.inverse_estimate.
  authors:
    - "Vincent Quenneville-Bélair"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

