        each change gated by a full build with zero errors and warnings, an axiom audit, naming,
        layering and citation checks and an independent agent review before merging.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine and API"
      prompting_notes: >-
        The author set the mathematical goals (the thesis and the FEEC literature), the
        statement design and the review standard; agents proposed and proved lemmas.
    - method: "manual"
      models: []
      framework: "n/a"
      tool_setup: "Statement design and direction."
      cost:
        wall_time: "not tracked"
        spend_usd: "n/a"
        hardware: "local machine"
      prompting_notes: "n/a"
  spend_usd: "not tracked"
  notes: >-
    Human-directed, AI-written development. The Challenge statement and its definitions were
    written by AI agents under the author's direction; the Solution
    identifies them with the definitions of the library Feec (Solution/Forms.lean, Poly.lean,
    Mesh.lean, Trace.lean, Spaces.lean, Regularity.lean, Maxwell.lean, Whitney.lean) and applies
    its theorems. FEEC.fem_wave is proved from the uniform stability of
    palomar/fem (femFamily, Solution/Fem.lean, the part of FEEC.fem it uses, on the subcomplex
    families of palomar/fem restated proof-side in Solution/Family.lean) and from
    FEEC.inverse_estimate (Solution/Wave.lean: the windows of the finite element subcomplexes as
    Feec discrete states, the abstract Crank-Nicolson and leapfrog estimates of
    Feec.Models.Cube.Inhomogeneous with the projections of the exact solution as comparison
    fields).

fidelity:
  divergences: >-
    (1) Coordinates: points of R^n are Fin n -> R (sup norm), forms are given by their
    coefficients on dx_s, s an increasing k-subset of Fin n, and L^2(Omega; Lambda^k) is the
    l^2 sum of copies of L^2(Omega); a window [a, a + m) is the l^2 sum Total of its degrees;
    the standard coordinate model, not Mathlib's differential forms. The total differential of a
    window in the schemes is a total function (HilbertComplex.dApply, 0 off its domain), only
    applied to finite element forms, which lie in its domain.
    (2) The finite element spaces, meshes, admissible sequences, domains and regularity classes
    are those of palomar/fem (the canonical blocks of palomar/shared/vocabulary.lean.txt,
    checked byte for byte by the gate; the Hilbert complexes and windows are those of
    palomar/feec), with the same scope: domains star-shaped with respect to a ball,
    quasi-uniform meshes, admissible sequences with r_k >= 1.
    (3) FEEC.fem_wave. Homogeneous boundary conditions only: the trial and test spaces are the
    finite element forms of the window (with vanishing boundary traces for b = true), the
    boundary data of the steps vanish, the load is zero, and the exact solution lies in the
    domain of the wave operator of the complex (natural, resp. essential, boundary conditions);
    inhomogeneous data are the cube theorems (4) only. The exact solution is stated by its
    hypotheses at the L^2 level: U, U_1, U_2, U_3 with two-sided derivatives at every real time
    (U is defined on all of R, as solutions of the wave equation are), (U(t), U_1(t)) in the
    graph of d - d* and ||U_3(t)|| <= L on [0, T], and the values and time increments in the
    C^(s+2) classes IsCsForm, resp. IsCsFormMin, with the bounds L and L |t' - t| (a Lipschitz
    condition in the class; one derivative more than the order requires, with sup instead of
    H^(s+1) norms, and for b = true derivatives vanishing on the boundary up to order s + 2).
    The polynomial order is asked in every degree of the window through PolyOrderAt, which
    also asks P_s Lambda^(a+m) in S_(a+m), one degree beyond the window (the classes and the
    Jackson estimates are those of palomar/fem): for a full space P_r Lambda in the last degree
    of the window, s <= r - 1 is asked although that degree alone would allow s = r.
    Non-vacuity: U = 0 satisfies the hypotheses and gives the stability bounds;
    FEEC.fem_wave_nonvacuous exhibits a nonzero solution moving at every time for b = false (a
    standing wave on the window [0, 2) of H Lambda of the cube (0, 1/2)^n, every n and s). For
    b = true no witness is compared, and the class is narrow for evolution problems: the
    derivatives up to order s + 2 must vanish on the boundary at every t in [0, T], which the
    solutions that do not reach the boundary before T meet (compactly supported data, finite
    speed of propagation) and the waves reflected there in general do not (in one dimension, on
    the window [0, 2) of an interval of length l, d'Alembert's formula shows that only U = 0 is
    in the class on [0, T] once T >= l; argued, not formalized). The rate is the spatial order
    h^(s+1) of the projections
    and the temporal order Delta t^2 of both schemes, uniformly in N; the error is in L^2 at
    t_K = K Delta t, from arbitrary starting values in X_h (with the starting errors added), not
    in the energy norm. Crank-Nicolson is the only implicit scheme of the statement (every
    A-stable rational scheme, with a temporal error in the discrete datum, is the wave clause of
    FEEC.evolutionFEEC of palomar/feec); leapfrog is a two-step scheme, stable under the CFL
    condition, the factor 1 - c from the energy argument; the constant C_0 of the inverse
    estimate is asserted (from a norm equivalence on the reference simplex, by compactness, so
    it has no explicit value), and the CFL condition is stated for every constant C_0 >= 0 of
    the estimate. Its inverse estimate is that of the window, with the global mesh size. The
    Hilbert complex H with the differentials dMax, resp. dMin, is asserted (it is unique, and it
    is the complex of palomar/fem), as in FEEC.crankNicolson_cube and FEEC.leapfrog_cube for
    H Lambda(Q).
    (4) FEEC.crankNicolson_cube and FEEC.leapfrog_cube (the runs of the thesis' Ch. 7): one row
    of the thesis' three-row Einstein-Bianchi scheme (the rows decouple); the exact solution is
    a classical solution on R x R^3 with the stated bounds on [0, T] (RowSolution), and no
    boundary condition is imposed on it: the boundary degrees of freedom of the scheme are those
    of the Whitney interpolant of the exact solution at every step for all three fields (any g_n
    with g_n - Pi_h U(t_n) in the fields with vanishing traces), the initial value is the
    interpolant of U(0), the load is zero. This is an interior error estimate with exact
    Dirichlet data everywhere, not the natural boundary conditions of a well-posed
    initial-boundary value problem. With vanishing boundary data (g_n = 0) the schemes on the
    fields with vanishing traces are those of FEEC.fem_wave (b = true, S = topSeq); the
    hypotheses on the exact solution differ (there the flat class IsCsFormMin, vanishing to
    second order on the boundary, and the domain of the wave operator of H°Lambda(Q); here
    RowSolution, with no boundary condition), so neither statement contains the other. The
    error is in L^2 at t_M = M Delta t; rates for finite Sobolev
    regularity and the constraint monitors are not stated. Everything is on one domain,
    (0, 1/2)^3, and one mesh family. Leapfrog: the three-level scheme with the same boundary data
    and the two starting values u_0 = Pi_h U(0), u_1 = Pi_h U(Delta t) (interpolants of the
    exact solution; no one-step starting procedure); the stability clause is for vanishing
    boundary degrees of freedom; the time step need not satisfy the CFL condition for
    well-posedness (the step is explicit); sharpness of the CFL condition is not stated. With
    vanishing boundary data a Crank-Nicolson step is r(Delta t A_h) on the fields with vanishing
    traces, r(z) = (2 + z)/(2 - z), A_h skew-adjoint for the L^2 product (explained, not
    compared). Non-vacuity of RowSolution is FEEC.rowSolution_nonvacuous (constant fields
    inhabit it too; the witness is a plane wave with nonzero time derivative). The schemes are
    stated with the same step notions as FEEC.fem_wave (HilbertComplex.IsCNStep,
    IsLeapfrogStep on the window [0, 3), the trial space V_h, the test space of vanishing
    traces), the rows as the window Total, the interpolant and the representatives of U(t) on
    windows (IsWhitneyInterp, IsRepr).
    (5) FEEC.inverse_estimate: the hypothesis that the open simplices lie in Omega (true when
    Omega is the interior of its closure, e.g. for star-shaped or convex Omega; it makes the
    L^2(Omega) norm the sum of the norms on whole simplices) replaces regularity of Omega; the
    global estimate is stated with the mesh size h_N, not elementwise; C depends on n, S, k and
    the shape-regularity and quasi-uniformity constants of the family.
    (6) FEEC.maxwell: the window is that of H Lambda(Omega), so the boundary conditions are
    natural (perfect magnetic conductor in the (sigma, E, B) form, B the 2-form proxy and
    H = -B the magnetic field): E . n = 0 and B x n = 0 (H x n = 0) enter through the adjoints
    grad* and curl*, the physical PMC walls; the perfect electric conductor (the minimal
    complex) is not compared in vector proxies. Scalar fields are L^2 fields with one component
    (Fin 1), and the state is the triple (sigma, E, B) with the scalar potential sigma of the
    Hodge wave equation (sigma = 0 is one of the Gauss laws). Data lie in the domain of the
    Maxwell operator; the statement is semidiscrete and has no rate (the fully discrete rates of
    the window [0, 3) in forms are those of FEEC.fem_wave; in vector proxies they are not
    compared). The Galerkin solutions are differentiable in L^2 on [0, T] with values in V_N;
    their derivatives are not required to lie in V_N (they do when T > 0, V_N being
    finite-dimensional). Most of FEEC.maxwell is the transport of the window of H Lambda(Omega)
    to vector proxies.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude (Anthropic) agents: independent review of each merge"
  notes: >-
    No human has reviewed the Challenge statements and definitions yet; the author directed
    their design. Every change merged into the repository was reviewed by an independent AI
    agent (Claude, Anthropic) that had not written it, checking the statements against the cited
    sources and the docstrings against the Lean, and its findings were addressed before merging.
    Each merge was also gated by a full build with zero errors and warnings, an axiom audit
    (propext, Classical.choice and Quot.sound only), the repository's naming, layering and
    citation checks, and lake comparator on the entries whose solutions import a changed
    module. No external mathematical review.

alignment:
  namespace: "FEEC"
  statements:
    - source: "[QuennevilleBelair2015] Ch. 4, 7; [Joly2003]; [Thomee2006] Ch. 1, 7; [Arnold2018] Ch. 8"
      lean: "FEEC.fem_wave"
      module: "Challenge"
      status: "proved"
      note: >-
        From the uniform stability of palomar/fem (femFamily, Solution/Fem.lean: the proof of
        FEEC.fem without its graph-norm clauses) and FEEC.inverse_estimate (Solution.lean): H is
        the complex of femFamily; the comparison fields are
        the componentwise L^2 projections of the exact solution, whose errors (quasi-optimality
        of a bounded projection with the Jackson estimate) and differentials (Jackson.ProjRate,
        through HilbertComplex.norm_totalD_le) are O(L h^(s+1)); HilbertComplex.wave_error
        (Solution/Wave.lean: the window of a subcomplex as Feec discrete states, the steps as
        Feec Dirichlet steps with V0 = V, the weak form from the formal adjoint) applies
        Feec.Models.Cube.Inhomogeneous.norm_cn_error_le and norm_leapfrog_error_le_of_sub_mem
        (from any starting values), the CFL condition from the inverse estimate on the window.
    - source: "[AFW2010] §4 (the L^2 de Rham complex; natural boundary conditions)"
      lean: "FEEC.fem_wave_nonvacuous"
      module: "Challenge"
      status: "proved"
      note: >-
        Solution/StandingWave.lean: sigma_0 = cos 2 pi x_0 lies in H Lambda^0 with
        d sigma_0 = -2 pi E_0 (Feec.Domain.extDerivOp_smooth_mem_maximal_domain); E_0 =
        sin 2 pi x_0 dx_0, with vanishing normal trace, lies in the domain of the adjoint of d
        with value -2 pi sigma_0 (Feec.Models.Cube.DeRhamIdent.mem_closure_formalAdj_single1,
        Feec.Domain.ConstCoeffOp.adjoint_maximal); so the wave operator of the window [0, 2)
        rotates (sigma_0, 0) and (0, -E_0), and U(t) = cos 2 pi t (sigma_0, 0) +
        sin 2 pi t (0, -E_0) solves the equation; the bounds of the classes by compactness of the
        closed cube; the cube and its mesh family as in palomar/fem (CubeWitness).
    - source: "[Ciarlet2002] §3.2; [BrennerScott2008] §4.5"
      lean: "FEEC.inverse_estimate"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.FiniteElement.PolySeq.exists_mul_norm_d_le on the Feec meshes M.toFeec Omega (shape
        regularity from the inscribed balls, isShapeRegular_toFeec), whose spaces are the
        challenge's (mem_V_iff).
    - source: "[QuennevilleBelair2015] Ch. 7; [Arnold2018] Ch. 7; [Monk2003]; [Thomee2006]"
      lean: "FEEC.crankNicolson_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.Models.Cube.Inhomogeneous.RowSolution.whitney_cn_error_le_row on the Freudenthal
        meshes (cubeMesh), with whitney_existsUnique_cnStep, whitneyMin_one_ne_bot and the
        unisolvence of the face integrals (isWhitneyInterpAt_cube_iff), through
        Solution/Whitney.lean (the Whitney spaces of topSeq are Feec's whitney and whitneyMin, the
        challenge's interpolant in every degree is the glued global interpolant, the steps are
        Feec's IsDirichletCNStep).
    - source: "[Joly2003]; [QuennevilleBelair2015] Ch. 7"
      lean: "FEEC.leapfrog_cube"
      module: "Challenge"
      status: "proved"
      note: >-
        Feec.Models.Cube.Inhomogeneous.exists_mul_norm_discreteD_whitneyRow_le (the inverse
        estimate on the Whitney row), Feec.TimeStepping.existsUnique_isDirichletLeapfrogStep,
        whitney_leapfrog_stable and RowSolution.whitney_leapfrog_error_le_row (for every constant
        of the inverse estimate), through Solution/Whitney.lean.
    - source: "[QuennevilleBelair2015] Ch. 7 (the plane wave)"
      lean: "FEEC.rowSolution_nonvacuous"
      module: "Challenge"
      status: "proved"
      note: >-
        Row 0 of Feec.Numerics.PlaneWaveCube.planeWaveRows (Solution/Whitney.lean,
        exists_rowSolution: E_(dx_0)(t, y) = -sin (y_2 - t)).
    - source: "[QuennevilleBelair2015] Ch. 4, Prop. 4.16; [AFW2010] §4; [Monk2003]"
      lean: "FEEC.maxwell"
      module: "Challenge"
      status: "proved"
      note: >-
        From Feec.Instances.Maxwell.maxwellFEEC for the vector proxies of
        Feec.Models.StarShaped.MeshFamily.polyFamily (Solution/Maxwell.lean: the weak operators
        are maximal realizations, weakOp_eq; the vector-proxy complex is the unitary transport of
