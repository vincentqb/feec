status:
  scope: >-
    Formalized and compared: FEEC.inverse_estimate on every open domain whose open mesh simplices
    lie in it, every shape-regular quasi-uniform mesh family, every admissible sequence and
    degree; FEEC.fem_wave for every bounded open domain star-shaped with respect to a ball, every
    shape-regular quasi-uniform family of conforming simplicial meshes of it with h_N -> 0, every
    admissible sequence, both boundary conditions, every window [a, a + m) and every s;
    FEEC.fem_wave_nonvacuous on (0, 1/2)^n, every n >= 1 and s, natural boundary conditions;
    FEEC.crankNicolson_cube, FEEC.leapfrog_cube and FEEC.rowSolution_nonvacuous on
    (0, 1/2)^3 with its Freudenthal meshes and the Whitney sequence; FEEC.maxwell for n = 3 on
    the same domains and meshes as FEEC.fem_wave.
    Not restated: the uniform stability of the finite element complexes (FEEC.fem of
    palomar/fem, used by the proof of FEEC.fem_wave and restated proof-side, Solution/Fem.lean);
    the semidiscrete Hodge wave equation and the A-stable rational schemes for abstract
    families with the rates of the Jackson estimates (the wave clause of FEEC.evolutionFEEC of
    palomar/feec, which applies to the families of palomar/fem); constraint propagation
    (palomar/constraints; FEEC.maxwell restates that of the Gauss laws).
    Not compared (proved in Feec, outside the statement): the three-row Einstein-Bianchi
    scheme of the thesis' Ch. 7 and its constraint monitors (palomar/einsteinbianchi compares
    the weak-symmetry method), the semi-discrete perfect-electric-conductor Maxwell
    discretization in vector proxies (in forms, the fully discrete schemes of its window [0, 3)
    are FEEC.fem_wave with b = true), the Whitney forms as a separate family (they are the
    sequence topSeq).
    Not formalized: the fully discrete wave equation with inhomogeneous boundary data on general
    domains and meshes (fidelity (3), (4)); rates for finite Sobolev regularity in time-dependent
    problems; one-step starting procedures for leapfrog; the sharpness of the CFL condition.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

