fidelity:
  divergences: >-
    (1) Coordinates and definitions of forms, meshes and finite element spaces as in palomar/fem
    (divergences (1)-(5), (8) there); W~^k = L^2(Omega; Lambda^k) ⊗ R^3 is the l^2 sum of three
    copies (L2Vec).
    (2) The multiplier lambda is assumed in L^2 = W^1 (the thesis allows a multiplier in a dual
    space); the rates require ||lambda|| <= L and, in the abstract theorem, a bound Lambda on
    d^1* S^1 u.
    (3) The abstract hypotheses use one constant C for the Poincaré inequalities, the Hodge and
    regular decompositions, ||S||, the bounds of the projections and the consistency; K depends
    only on C.
    (4) Consistency (cf. Prop 5.9) is a hypothesis of the abstract theorem stated on V~_h^0 and
    on regular potentials of the fields of V~_h^1 (a potential w with d~w = d~v,
    ||w|| <= C ||d~v||, on which pi~^1 and S^1_h are accurate to order h), not on all of
    V~_h^1; it is proved for the cube discretizations.
    (5) The cube discretizations are asserted existentially: their spaces are named (Table 5.1
    with vanishing boundary traces on the Freudenthal meshes), their projections are not (Feec
    uses the smoothed projections of one smoother for both rows, bounded uniformly). The method
    (5.6) depends on pi through S_h = pi S, so the statement covers the method for one admissible
    choice of projections, not for a canonical one such as the canonical interpolants.
    (6) Regularity: the static and wave rates are stated for exact solutions C^2 up to the
    boundary with vanishing tangential traces (IsTangentialC2: values and first derivatives of w
    and dw bounded by L on the closed cube), not for the Sobolev classes of the thesis; the
    Sobolev-data rates proved in Feec are not compared.
    (7) The wave problem: classical solutions are paths in the operator domains with continuous
    right derivatives in L^2 (and of d~phi, d~u); the wave rate asserts some semi-discrete
    solution (in Feec, the one starting from the elliptic projection (6.4) of the exact data)
    with the rate, and uniqueness of semi-discrete solutions given (sigma_h, u_h, M_h, rho_h)(0)
    is a separate clause; existence for arbitrary discrete data is not stated.
    (8) Only the boundary conditions of the minimal complex in both rows (the thesis' choice on
    the cube) are compared; the mirror boundary conditions are not.
    (9) The discrete complex with S_h is not a subcomplex of the continuous one (a variational
    crime), so the window verdicts of palomar/feec and palomar/fem do not apply to it; the
    analysis is that of the abstract theorem.

