# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar submission of finite element exterior calculus for the
# complex with weak symmetry (`palomar/weaksymmetry/`), built on the BGG construction of
# `palomar/bgg/` and the finite element spaces of `palomar/fem/`.
# Open items before submitting (user decisions): the root licence file and `project.license`
# (Palomar requires exactly one root LICENSE whose SPDX identifier equals `project.license`),
# a public GitHub repository and the 40-character commit to submit.
version: "v0.4"

project:
  name: "Finite element exterior calculus for the complex with weak symmetry: mixed elasticity and linearized gravity"
  description: >-
    The mixed finite element method for the complex with weak symmetry obtained from the
    Bernstein-Gelfand-Gelfand construction (Arnold-Hu 2021) by eliminating the bottom space
    Ṽ^0 against V^1 weakly with a Lagrange multiplier, the mechanism of the mixed methods for
    linear elasticity with weakly imposed symmetry (Arnold-Falk-Winther 2007), and, on the cube
    in R^3, of the linearized Einstein (Einstein-Bianchi) equations of the thesis
    (Quenneville-Bélair 2015, Ch. 5-6). Stated over Mathlib with the definitions of differential
    forms, polynomial forms, simplicial meshes and finite element spaces of the Palomar entry
    palomar/fem copied verbatim. Three compared theorems. FEEC.weakSymmetry (thesis Prop 5.4
    and Thm 5.5): BGG data are two segments W^0 -> W^1 -> W^2 and W~^0 -> W~^1 -> W~^2 of
    complexes of densely defined operators between real Hilbert spaces (Mathlib's LinearPMap),
    with bounded connecting maps S^0 : W~^0 -> W^1, S^1 : W~^1 -> W^2, d^1 S^0 = -S^1 d~^0. The
    mixed problem (5.3): find sigma in V^0, phi in V~^0, u in V~^1 and a multiplier lambda in
    W^1 with <sigma, tau> - <u, d~psi> - <lambda, d tau - S^0 psi> = 0,
    <d~phi, v> + <S^1 u, S^1 v> + <d~u, d~v> = F(v), d sigma = S^0 phi. A discretization is a
    pair of finite-dimensional subcomplexes of both rows with bounded cochain projections pi
    (idempotent onto the spaces, commuting with d on the domains); the method (5.6) replaces S
    by S_h = pi S. For every constant C there is K such that for all BGG data with Poincaré
    inequalities on V^0 and V~^0, exactness of the top row at V^1, the Hodge decomposition with
    bound on V~^1, the regular decomposition d^1 V^1 = d^1 S^0 V~^0 with
    ||d~phi|| <= C ||d^1 x||, and ||S^0||, ||S^1|| <= C, and every discretization with
    projections bounded by C satisfying the compatibility condition (5.4)
    pi^1 S^0 pi~^0 = pi^1 S^0: the discrete problem (5.6) has exactly one solution for every
    datum; and if S_h is consistent at the order h with constant C (on V~_h^0, and on regular
    potentials of the discrete fields of V~_h^1), the squared error of the solution of (5.6) in
    the graph norms is at most K times the squared projection error of the exact solution plus
    h^2 (Lambda^2 + ||S^1 u||^2) plus ||(S^1 - S^1_h) u||^2, where ||lambda|| <= Lambda and
    S^1 u lies in the domain of the adjoint of d^1 with ||d^1* S^1 u|| <= Lambda.
    FEEC.weakSymmetry_cube (thesis §5.3, Table 5.1, Thm 5.5, §6.3, Table 6.1, Prop 6.2): on the
    cube Q = (0, 1/2)^3 with the minimal exterior derivative in both rows (vanishing boundary
    traces), S^0 v = S^1 v = sum_a dx_a ∧ v_a (in vector proxies S^0 = I, S^1 = 2 vskw), the
    Freudenthal meshes (named by their vertices) and the elements of Table 5.1 with vanishing
    boundary traces (top row P_1 Lambda^0 -> P_1^- Lambda^1 -> P_1^- Lambda^2, bottom row
    P_2 Lambda^0 -> P_2^- Lambda^1 -> P_1 Lambda^2 in each of the three components), there are
    discretizations with these spaces and one constant C for which all hypotheses of
    FEEC.weakSymmetry hold; the static error is at most (K L h_N)^2 for exact solutions whose
    sigma, phi_a, u_a are C^2 up to the boundary with vanishing tangential traces and bound L
    and whose multiplier has ||lambda|| <= L; solutions of the semi-discrete wave problem (6.5)
    are determined by (sigma_h, u_h, M_h, rho_h)(0); and for every classical solution of the
    wave problem (6.2) whose states and time derivatives are of that class with bound L and
    whose multiplier and its derivative are bounded by L, some solution of (6.5) is within
    K L (1 + t) h_N of it in (||sigma||^2 + ||u||^2 + ||M||^2 + ||rho||^2)^(1/2) on [0, T].
    FEEC.weakSymmetry_cube_nonvacuous: the static rate applies to a solution with sigma, phi,
    u, lambda all nonzero, and for every T > 0 the wave rate applies to a classical solution of
    (6.2) with u(t) != 0 for all t and sigma(t), phi(t) != 0 for t in (0, T]. The proof is the
    library Feec of this repository (Feec.HilbertComplex.BGG.WeakSymmetry, Discrete,
    WeakConsistency, DiscreteWave, EllipticProjection, Feec.Models.Cube.WeakSymmetry*).
  authors:
    - "Vincent Quenneville-Bélair"
  # TBD-BY-USER: replace with the SPDX identifier of the root LICENSE file once added.
  license: "TBD-BY-USER"
  responsible_maintainers:
    - "Vincent Quenneville-Bélair"

